<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>GST Billing — Invoicing &amp; Accounts</title>
<meta name="theme-color" content="#132A46" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GST Billing" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root{
    --navy:#132A46; --navy-light:#1D3A5F; --paper:#FAF7F0; --line:#E5DFCF;
    --ink:#20242B; --green:#1F7A5C; --green-bg:#E9F3EE; --rust:#BE5030; --rust-bg:#F7E9E2;
    --amber:#B8860B; --amber-bg:#FBF1DD; --slate:#6B7280; --indigo:#4C4FE0; --indigo-bg:#ECEBFC;
    --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overscroll-behavior-y:none;}
  #app{min-height:100%;padding-bottom:calc(70px + var(--safe-bottom));}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  .mono{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);
    padding:calc(14px + var(--safe-top)) 16px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .topbar .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:2px;}
  .topbar h1{font-size:19px;margin:0;font-weight:400;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .fab-inline{background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 14px;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;}

  .content{padding:14px 16px 24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .empty{text-align:center;padding:36px 16px;color:var(--slate);font-size:13px;
    border:1px dashed var(--line);border-radius:14px;background:#fff;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;}
  .stat-card.tint-green{background:var(--green-bg);border-color:#cfe6db;}
  .stat-card.tint-rust{background:var(--rust-bg);border-color:#eeccb9;}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);margin-bottom:6px;
    display:flex;align-items:center;justify-content:space-between;}
  .stat-value{font-size:18px;font-family:Georgia,serif;}

  .section-title{font-size:12px;font-weight:600;color:var(--ink);margin:18px 0 8px;
    display:flex;align-items:center;justify-content:space-between;}
  .section-title a{font-size:12px;color:var(--green);text-decoration:none;font-weight:600;}

  .list-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .row-title{font-size:14px;font-weight:600;}
  .row-sub{font-size:11.5px;color:var(--slate);margin-top:1px;}
  .row-amt{font-size:14px;}

  .avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;}

  .pill{font-size:9.5px;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;white-space:nowrap;}
  .pill.paid{background:var(--green-bg);color:var(--green);}
  .pill.partial{background:var(--amber-bg);color:var(--amber);}
  .pill.unpaid{background:var(--rust-bg);color:var(--rust);}
  .pill.na{background:#EEE;color:var(--slate);}
  .tag{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--indigo-bg);color:var(--indigo);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

  .search{position:relative;margin-bottom:12px;}
  .search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff;}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);
    display:flex;padding-bottom:var(--safe-bottom);border-top:1px solid rgba(255,255,255,.08);}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;
    color:rgba(255,255,255,.5);background:none;border:none;font-size:10px;font-family:inherit;}
  .navbtn.active{color:#fff;}
  .navbtn .dot{width:4px;height:4px;border-radius:99px;background:var(--green);margin-top:1px;opacity:0;}
  .navbtn.active .dot{opacity:1;}

  label.field{display:block;margin-bottom:12px;}
  .field-label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--slate);margin-bottom:5px;}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:inherit;}
  textarea{min-height:60px;resize:vertical;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;
    font-weight:600;font-size:14px;padding:11px 16px;border:none;width:100%;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.accent{background:var(--green);color:#fff;}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:#fff;color:var(--rust);border:1px solid var(--rust);}
  .btn:disabled{opacity:.4;}
  .btn-row{display:flex;gap:8px;margin-top:14px;}
  .btn-row .btn{flex:1;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;}
  .seg button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .sheet-overlay{position:fixed;inset:0;background:rgba(19,42,70,.5);z-index:50;display:flex;align-items:flex-end;}
  .sheet{background:var(--paper);width:100%;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;
    padding:8px 18px calc(20px + var(--safe-bottom));animation:slideup .22s ease-out;}
  .sheet.full{max-height:96vh;}
  @keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 14px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h3{font-size:17px;margin:0;font-weight:400;}
  .sheet-close{width:30px;height:30px;border-radius:99px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .paper-bill{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .bill-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
  .bill-to{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:10px;}
  .bill-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .bill-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);
    font-size:16px;font-family:Georgia,serif;}
  .bill-table{width:100%;font-size:11.5px;border-collapse:collapse;margin-bottom:8px;}
  .bill-table th{text-align:right;color:var(--slate);font-weight:600;padding:4px 3px;border-bottom:1px solid var(--line);}
  .bill-table th:first-child,.bill-table td:first-child{text-align:center;color:var(--slate);}
  .bill-table th:nth-child(2),.bill-table td:nth-child(2){text-align:left;}
  .bill-table td{padding:5px 3px;border-bottom:1px solid #F1EEE4;text-align:right;}

  .item-line{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:9px;margin-bottom:7px;}
  .item-line .name{flex:1;font-size:13px;min-width:0;}
  .item-line .name .hsn{font-size:10px;color:var(--slate);display:block;}
  .item-line input{padding:6px 6px;font-size:12.5px;text-align:right;}
  .item-line .qty{width:44px;}
  .item-line .rate{width:60px;}
  .item-line .disc{width:44px;}

  .picker-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .picker-row:last-child{border-bottom:none;}
  .qtybadge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;}
  .add-btn{border:1.5px solid var(--indigo);color:var(--indigo);background:#fff;border-radius:8px;
    padding:6px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .add-btn.has{background:var(--indigo);color:#fff;}

  .type-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:6px;}
  .type-tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;text-align:center;}
  .type-tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .type-tile span{font-size:10.5px;color:var(--ink);line-height:1.2;}

  .more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .more-tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;
    display:flex;flex-direction:column;gap:8px;text-align:left;}
  .more-tile .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}

  .toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  .tabs2{display:flex;border-bottom:1px solid var(--line);margin:-1px -16px 10px;padding:0 16px;}
  .tabs2 button{flex:1;padding:10px 0;font-size:13px;font-weight:600;background:none;border:none;
    color:var(--slate);border-bottom:2px solid transparent;}
  .tabs2 button.active{color:var(--navy);border-color:var(--navy);}

  .ledger-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);}
  .ledger-item:last-child{border-bottom:none;}

  @media print{
    body > *:not(#print-area){ display:none !important; }
    #print-area{ display:block !important; }
    #print-area .paper-bill{ page-break-after:always; box-shadow:none; }
    #print-area .paper-bill:last-child{ page-break-after:auto; }
    #print-area .bill-table{ min-width:0 !important; }
    #print-area div[style*="overflow-x"]{ overflow:visible !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="scanner-root"></div>
<div id="toast" class="toast"></div>
<div id="print-area" style="display:none;"></div>

<script>
// ---------------- utilities ----------------
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = (n) => "₹" + Math.round(Number(n||0)).toLocaleString("en-IN");
const fmtN = (n) => { const v=Number(n||0); const isWhole = Math.round(v*100)%100===0; return v.toLocaleString("en-IN", isWhole?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2}); };
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthLabel = (iso) => new Date(iso).toLocaleString("en-IN", { month: "short", year: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysAgo = (iso) => (Date.now() - new Date(iso).getTime()) / 86400000;
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function setDueDatePreset(val){
  const d = ensureDraft();
  if(!val){ d.dueDate=""; render(); return; }
  if(val==="custom") return; // leave existing date field as-is
  const dt = new Date(d.date||todayISO());
  dt.setDate(dt.getDate()+Number(val));
  d.dueDate = dt.toISOString().slice(0,10);
  render();
}

function numberToWords(num){
  num = Math.round(Number(num||0));
  if(num===0) return "Zero Rupees";
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(n){ if(n<20) return a[n]; return b[Math.floor(n/10)] + (n%10? " "+a[n%10]:""); }
  function three(n){ if(n>99) return a[Math.floor(n/100)]+" Hundred"+(n%100? " "+two(n%100):""); return two(n); }
  const crore = Math.floor(num/10000000); num%=10000000;
  const lakh = Math.floor(num/100000); num%=100000;
  const thousand = Math.floor(num/1000); num%=1000;
  const rest = num;
  let out=[];
  if(crore) out.push(three(crore)+" Crore");
  if(lakh) out.push(three(lakh)+" Lakh");
  if(thousand) out.push(three(thousand)+" Thousand");
  if(rest) out.push(three(rest));
  return out.join(" ")+" Rupees";
}

function hexToRgba(hex, a){
  const h = (hex||"#132A46").replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r||19},${g||42},${b||70},${a})`;
}
// Original, generated-in-app decorative pattern for garment/textile businesses — tinted to match
// whatever theme color is selected, so no external image or licensing is ever needed.
function floralPatternDataUri(color){
  const petal = hexToRgba(color, 0.13);
  const petalLight = hexToRgba(color, 0.07);
  const stem = hexToRgba(color, 0.09);
  const flower = (cx,cy,scale)=>`
    <g transform="translate(${cx} ${cy}) scale(${scale})">
      <ellipse cx="0" cy="-7" rx="4" ry="7" fill="${petal}"/>
      <ellipse cx="0" cy="7" rx="4" ry="7" fill="${petal}"/>
      <ellipse cx="-7" cy="0" rx="7" ry="4" fill="${petal}"/>
      <ellipse cx="7" cy="0" rx="7" ry="4" fill="${petal}"/>
      <ellipse cx="-5" cy="-5" rx="5" ry="3" transform="rotate(45 -5 -5)" fill="${petalLight}"/>
      <ellipse cx="5" cy="5" rx="5" ry="3" transform="rotate(45 5 5)" fill="${petalLight}"/>
      <ellipse cx="-5" cy="5" rx="5" ry="3" transform="rotate(-45 -5 5)" fill="${petalLight}"/>
      <ellipse cx="5" cy="-5" rx="5" ry="3" transform="rotate(-45 5 -5)" fill="${petalLight}"/>
      <circle cx="0" cy="0" r="3.5" fill="${petal}"/>
    </g>`;
  const leafSprig = (cx,cy,rot,scale)=>`
    <g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${scale})">
      <path d="M0 0 Q3 -14 0 -28" stroke="${stem}" stroke-width="1.4" fill="none"/>
      <ellipse cx="-4" cy="-9" rx="5" ry="2.5" transform="rotate(-35 -4 -9)" fill="${petalLight}"/>
      <ellipse cx="4" cy="-16" rx="5" ry="2.5" transform="rotate(35 4 -16)" fill="${petalLight}"/>
      <ellipse cx="-3" cy="-23" rx="4" ry="2" transform="rotate(-30 -3 -23)" fill="${petalLight}"/>
    </g>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
    ${flower(30,35,1)}${leafSprig(30,35,20,0.8)}
    ${flower(170,60,0.8)}${leafSprig(170,60,-30,0.7)}
    ${flower(90,120,1.1)}${leafSprig(90,120,60,0.9)}
    ${flower(180,170,0.9)}${leafSprig(180,170,-10,0.8)}
    ${flower(20,180,0.7)}${leafSprig(20,180,100,0.6)}
    ${flower(120,20,0.6)}
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
// Draped fabric folds — soft flowing wave lines, evokes hanging cloth/drapery.
function fabricWavesPatternDataUri(color){
  const line1 = hexToRgba(color, 0.14);
  const line2 = hexToRgba(color, 0.08);
  const row = (y,c,w)=>`<path d="M-10 ${y} Q20 ${y-16} 50 ${y} T110 ${y} T170 ${y}" stroke="${c}" stroke-width="${w}" fill="none"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
    ${row(10,line1,2)}${row(10,line2,1)}
    ${row(38,line2,1.4)}
    ${row(66,line1,2)}${row(66,line2,1)}
    ${row(94,line2,1.4)}
    ${row(122,line1,2)}${row(122,line2,1)}
    ${row(150,line2,1.4)}
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
// Rolled fabric bolts — small cloth-roll motifs, like bolts of fabric on a shelf.
function fabricBoltsPatternDataUri(color){
  const body = hexToRgba(color, 0.12);
  const line = hexToRgba(color, 0.20);
  const bolt = (x,y,rot,scale)=>`
    <g transform="translate(${x} ${y}) rotate(${rot}) scale(${scale})">
      <rect x="-22" y="-9" width="44" height="18" rx="9" fill="${body}"/>
      <ellipse cx="-22" cy="0" rx="6" ry="9" fill="${line}"/>
      <line x1="-9" y1="-9" x2="-9" y2="9" stroke="${line}" stroke-width="1"/>
      <line x1="3" y1="-9" x2="3" y2="9" stroke="${line}" stroke-width="1"/>
      <line x1="15" y1="-9" x2="15" y2="9" stroke="${line}" stroke-width="1"/>
    </g>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
    ${bolt(45,30,15,1)}
    ${bolt(150,55,-20,0.85)}
    ${bolt(90,110,25,1.1)}
    ${bolt(20,150,-10,0.8)}
    ${bolt(170,160,10,0.9)}
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const DEFAULT_THEME = { style:"simple", color:"#132A46" };
const THEME_COLORS = ["#1A1A1A","#1F7A5C","#1E7F8C","#7C3AED","#C1502E","#4C4FE0","#B8860B"];

const EXPENSE_CATEGORIES = ["Purchase","Rent","Salary","Utilities","Transport","Marketing","Other"];
const INDIAN_STATES = ["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana",
  "Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram",
  "Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand",
  "West Bengal","Andaman and Nicobar Islands","Chandigarh","Dadra and Nagar Haveli and Daman and Diu","Delhi",
  "Jammu and Kashmir","Ladakh","Lakshadweep","Puducherry"];

// GSTIN structure: 2-digit state code + 10-char PAN + 1-digit entity number + 'Z' + 1 checksum char.
// The state code and PAN are read directly off the number — no lookup service needed for these two fields.
const GST_STATE_CODES = {
  "01":"Jammu and Kashmir","02":"Himachal Pradesh","03":"Punjab","04":"Chandigarh","05":"Uttarakhand",
  "06":"Haryana","07":"Delhi","08":"Rajasthan","09":"Uttar Pradesh","10":"Bihar","11":"Sikkim",
  "12":"Arunachal Pradesh","13":"Nagaland","14":"Manipur","15":"Mizoram","16":"Tripura","17":"Meghalaya",
  "18":"Assam","19":"West Bengal","20":"Jharkhand","21":"Odisha","22":"Chhattisgarh","23":"Madhya Pradesh",
  "24":"Gujarat","25":"Dadra and Nagar Haveli and Daman and Diu","26":"Dadra and Nagar Haveli and Daman and Diu",
  "27":"Maharashtra","28":"Andhra Pradesh","29":"Karnataka","30":"Goa","31":"Lakshadweep","32":"Kerala",
  "33":"Tamil Nadu","34":"Puducherry","35":"Andaman and Nicobar Islands","36":"Telangana","37":"Andhra Pradesh",
  "38":"Ladakh"
};
const GSTIN_FORMAT = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
function parseGSTIN(raw){
  const gstin = (raw||"").trim().toUpperCase();
  if(gstin.length!==15) return {ready:false};
  const stateCode = gstin.slice(0,2);
  const state = GST_STATE_CODES[stateCode] || null;
  const formatOk = GSTIN_FORMAT.test(gstin);
  return { ready:true, valid: formatOk && !!state, state, pan: gstin.slice(2,12), stateCode };
}

const GSTIN_ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const GST_STATE_CODE_MAP = {
  "01":"Jammu and Kashmir","02":"Himachal Pradesh","03":"Punjab","04":"Chandigarh","05":"Uttarakhand",
  "06":"Haryana","07":"Delhi","08":"Rajasthan","09":"Uttar Pradesh","10":"Bihar","11":"Sikkim",
  "12":"Arunachal Pradesh","13":"Nagaland","14":"Manipur","15":"Mizoram","16":"Tripura","17":"Meghalaya",
  "18":"Assam","19":"West Bengal","20":"Jharkhand","21":"Odisha","22":"Chhattisgarh","23":"Madhya Pradesh",
  "24":"Gujarat","25":"Dadra and Nagar Haveli and Daman and Diu","26":"Dadra and Nagar Haveli and Daman and Diu",
  "27":"Maharashtra","28":"Andhra Pradesh","29":"Karnataka","30":"Goa","31":"Lakshadweep","32":"Kerala",
  "33":"Tamil Nadu","34":"Puducherry","35":"Andaman and Nicobar Islands","36":"Telangana","37":"Andhra Pradesh",
  "38":"Ladakh"
};
const GST_STATE_NAME_TO_CODE = Object.fromEntries(Object.entries(GST_STATE_CODE_MAP).map(([k,v])=>[v,k]));
function stateCodeFor(stateName){ return GST_STATE_NAME_TO_CODE[stateName] || ""; }
function gstinCheckDigit(first14){
  let sum = 0, factor = 2;
  for(let i = first14.length-1; i>=0; i--){
    const cp = GSTIN_ALPHABET.indexOf(first14[i]);
    if(cp<0) return null;
    let addend = cp*factor;
    factor = factor===2 ? 1 : 2;
    addend = Math.floor(addend/36) + (addend%36);
    sum += addend;
  }
  const rem = sum % 36;
  return GSTIN_ALPHABET[(36-rem)%36];
}
function decodeGSTIN(raw){
  const g = (raw||"").toUpperCase().trim();
  const re = /^([0-9]{2})([A-Z]{5}[0-9]{4}[A-Z])([1-9A-Z])([A-Z0-9])([A-Z0-9])$/;
  const m = g.match(re);
  if(g.length!==15 || !m) return { formatOk:false };
  const stateCode = m[1], pan = m[2];
  const stateName = GST_STATE_CODE_MAP[stateCode] || null;
  const checkOk = gstinCheckDigit(g.slice(0,14)) === g[14];
  return { formatOk:true, stateCode, stateName, pan, checkOk };
}
function gstinHintInfo(h){
  if(!h) return null;
  if(!h.formatOk) return {color:"var(--rust)", text:"Doesn't match the standard 15-character GSTIN format."};
  if(!h.stateName) return {color:"var(--amber)", text:"Format looks right, but that state code isn't recognized."};
  if(!h.checkOk) return {color:"var(--amber)", text:"⚠ Check digit doesn't match — double-check this GSTIN for typos."};
  return {color:"var(--green)", text:"✓ Valid GSTIN · "+h.stateName+" · PAN "+h.pan+" — filled in below."};
}

// ---------------- computed ----------------
function computeDocTotals(doc){
  const meta = DOC_META[doc.docType] || DOC_META.invoice;
  const party = state.data.parties.find(p=>p.id===doc.partyId);
  const bState = state.data.profile?.state;
  const sameState = !party?.state || !bState || party.state === bState;
  let subtotal=0, discTotal=0, taxableTotal=0, taxTotal=0, cessTotal=0;
  const lines = (doc.items||[]).map(l=>{
    const base = l.qty*l.price;
    const discAmt = base*((l.discPercent||0)/100);
    const taxable = base-discAmt;
    const taxAmt = taxable*((l.taxRate||0)/100);
    const cessAmt = taxable*((l.cessRate||0)/100);
    subtotal+=base; discTotal+=discAmt; taxableTotal+=taxable; taxTotal+=taxAmt; cessTotal+=cessAmt;
    return {...l, base, discAmt, taxable, taxAmt, cessAmt, lineTotal:taxable+taxAmt+cessAmt};
  });
  const cgst = sameState ? taxTotal/2 : 0;
  const sgst = sameState ? taxTotal/2 : 0;
  const igst = sameState ? 0 : taxTotal;
  const delivery = Number(doc.deliveryCharge||0);
  const extraDisc = Number(doc.extraDiscount||0);
  const beforeRound = taxableTotal+taxTotal+cessTotal+delivery-extraDisc;
  const total = Math.max(0, Math.ceil(beforeRound));
  const roundOff = total-beforeRound;
  const due = meta.financial ? Math.max(0,total-(doc.paidAmount||0)) : 0;
  let status = "na";
  if(meta.financial){ status = due>0 && doc.paidAmount>0 ? "partial" : due>0 ? "unpaid" : "paid"; }
  return { lines, subtotal, discTotal, taxableTotal, taxTotal, cessTotal, cgst, sgst, igst, delivery, extraDisc,
    total, roundOff, due, status, sameState, meta };
}

function partyBalance(partyId){
  let bal=0;
  state.data.docs.forEach(doc=>{
    if(doc.partyId!==partyId) return;
    const meta = DOC_META[doc.docType]; if(!meta || !meta.financial) return;
    const t = computeDocTotals(doc);
    bal += meta.ledgerSign*(t.total-(doc.paidAmount||0));
  });
  state.data.payments.forEach(p=>{ if(p.partyId===partyId) bal -= Number(p.unallocated!=null ? p.unallocated : p.amount||0); });
  return bal;
}
// Applies a payment against a party's oldest outstanding documents first (so invoices actually get
// marked paid), keeping any leftover as an unallocated credit that still reduces their balance.
function applyPaymentToParty(partyId, amount, date, mode, note){
  let remaining = Number(amount);
  const docs = state.data.docs.filter(d=>d.partyId===partyId && DOC_META[d.docType] && DOC_META[d.docType].financial)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  for(const doc of docs){
    if(remaining<=0.004) break;
    const t = computeDocTotals(doc);
    if(t.due<=0.004) continue;
    const applied = Math.min(remaining, t.due);
    doc.paidAmount = Number(doc.paidAmount||0) + applied;
    remaining -= applied;
  }
  state.data.payments.push({ id:genId(), partyId, amount:Number(amount), unallocated: Math.max(0,remaining), date, mode, note });
}

function computed(){
  const docs = state.data.docs.map(d=>({...d, ...computeDocTotals(d)}));
  const customers = state.data.parties.filter(p=>p.type==="customer");
  const suppliers = state.data.parties.filter(p=>p.type==="supplier");
  const toCollect = customers.reduce((s,p)=>s+Math.max(0,partyBalance(p.id)),0);
  const toPay = suppliers.reduce((s,p)=>s+Math.max(0,partyBalance(p.id)),0);
  const stockValue = state.data.items.reduce((s,it)=>s+Number(it.stock||0)*Number(it.purchasePrice||0),0);
  const weekSales = docs.filter(d=>DOC_META[d.docType].group==="sales" && d.meta.financial && daysAgo(d.date)<=7)
    .reduce((s,d)=>s+d.total,0);
  const totalExpenses = state.data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const lowStock = state.data.items.filter(it=>it.itemType!=="service" && it.lowStockAlertOn!==false && Number(it.stock)<=Number(it.lowStockAlert||0));
  const totalSales = docs.filter(d=>DOC_META[d.docType].group==="sales" && d.meta.financial).reduce((s,d)=>s+d.total,0);
  const totalPurchases = docs.filter(d=>DOC_META[d.docType].group==="purchase" && d.meta.financial).reduce((s,d)=>s+d.total,0);
  return { docs, customers, suppliers, toCollect, toPay, stockValue, weekSales, totalExpenses, lowStock, totalSales, totalPurchases };
}
function partyName(id){ if(!id) return "Cash Sale"; return state.data.parties.find(p=>p.id===id)?.name || "Walk-in"; }
function party(id){ return state.data.parties.find(p=>p.id===id); }
function effectivePrice(item, partyId){
  if(partyId && item.partyPrices && item.partyPrices[partyId]!=null && item.partyPrices[partyId]!=="") return Number(item.partyPrices[partyId]);
  return Number(item.sellingPrice||0);
}

    case "reports": return viewReports();
    default: return viewDashboard();
  }
}
function topbar(eyebrow, title, actionHtml){
  return `<div class="topbar"><div><div class="eyebrow">${esc(eyebrow)}</div><h1 class="serif">${esc(title)}</h1></div>${actionHtml||""}</div>`;
}
function backTopbar(title, right){
  return `<div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;">

function viewPartyLedger(partyId){
  const p = party(partyId);
  if(!p) return backTopbar("Party")+`<div class="content"><div class="empty">Party not found.</div></div>`;
  const bal = partyBalance(partyId);
  const items = [
    ...state.data.docs.filter(d=>d.partyId===partyId).map(d=>({...d,...computeDocTotals(d),kind:"doc"})),
    ...state.data.payments.filter(pay=>pay.partyId===partyId).map(pay=>({...pay,kind:"payment"})),
  ].sort((a,b)=>a.date<b.date?-1:1);
  let running=0;
  const rows = items.map(it=>{
    if(it.kind==="doc"){ running += DOC_META[it.docType].ledgerSign*(it.total-(it.paidAmount||0)); }
    else { running -= Number(it.amount||0); }
    return {...it, running};
  }).reverse();
  return `
  ${backTopbar(p.name, `<button class="icon-btn" data-action="open-modal" data-modal="party" data-id="${p.id}">${ICONS.edit}</button>`)}
  <div class="content">
    <div class="card">
      <div style="font-size:11.5px;color:var(--slate);line-height:1.6;">
        ${p.phone?`${esc(p.phone)}<br/>`:""}
        ${p.gstin?`GSTIN ${esc(p.gstin)}${p.panNumber?' · PAN '+esc(p.panNumber):''}<br/>`:(p.panNumber?`PAN ${esc(p.panNumber)}<br/>`:"")}
        ${(p.addrStreet||p.addrCity||p.state)?`${esc([p.addrStreet,p.addrCity,p.state,p.addrPincode].filter(Boolean).join(', '))}`:""}
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <div class="field-label">Current balance</div>
      <div class="stat-value" style="font-size:24px;color:${bal===0?'var(--ink)':bal>0?'var(--rust)':'var(--green)'};">${fmt0(Math.abs(bal))}</div>
      <div style="font-size:11.5px;color:var(--slate);">${bal===0?'Settled up':bal>0?(p.type==='supplier'?'You owe':'They owe you'):'Advance / overpaid'}</div>
      ${p.creditLimit && bal>Number(p.creditLimit) ? `<div style="margin-top:8px;font-size:11.5px;color:var(--rust);display:flex;align-items:center;justify-content:center;gap:5px;">${ICONS.alert} Over credit limit of ${fmt0(p.creditLimit)}</div>`:""}
      <div class="btn-row">
        <button class="btn ${p.type==='customer'?'accent':'ghost'}" data-action="open-modal" data-modal="payment" data-ptype="in" data-id="${p.id}">Received Payment</button>
        <button class="btn ${p.type==='supplier'?'accent':'ghost'}" data-action="open-modal" data-modal="payment" data-ptype="out" data-id="${p.id}">Payment Out</button>
      </div>
    </div>
    <div class="section-title">Statement</div>
    ${rows.length===0 ? `<div class="empty">No transactions with this party yet.</div>` :
      `<div class="card">${rows.map(r=>{
        if(r.kind==="payment"){
          return `<div class="ledger-item"><div><div class="row-title" style="font-weight:600;">Payment ${r.mode?('· '+esc(r.mode)):''}</div><div class="row-sub">${r.date}${r.note?' · '+esc(r.note):''}</div></div>
            <div style="text-align:right;"><div class="mono" style="color:var(--green);">-${fmt0(r.amount)}</div><div class="row-sub mono">${fmt0(r.running)}</div></div></div>`;
        }
        const meta = DOC_META[r.docType];
        return `<div class="ledger-item" data-action="open-doc" data-id="${r.id}"><div><div class="row-title"><span class="tag">${esc(meta.label)}</span></div><div class="row-sub">${esc(r.number)} · ${r.date}</div></div>
          <div style="text-align:right;"><div class="mono">${fmt0(r.total)}</div><div class="row-sub mono">${fmt0(r.running)}</div></div></div>`;
      }).join("")}</div>`}
  </div>`;
}

// ---------------- reports ----------------
function viewReports(){
  const {docs,totalSales,totalPurchases,totalExpenses,stockValue} = computed();
  const monthlyMap={};
  docs.filter(d=>DOC_META[d.docType].group==="sales"&&d.meta.financial).forEach(d=>{const l=monthLabel(d.date);monthlyMap[l]=(monthlyMap[l]||0)+d.total;});
  const monthly = Object.entries(monthlyMap);
  const maxM = Math.max(1,...monthly.map(m=>m[1]));
  const itemQty={};
  docs.filter(d=>DOC_META[d.docType].group==="sales"&&d.meta.financial).forEach(d=>d.items.forEach(l=>{itemQty[l.name]=(itemQty[l.name]||0)+Number(l.qty);}));
  const topItems = Object.entries(itemQty).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const expByCat={};
  state.data.expenses.forEach(e=>{expByCat[e.category]=(expByCat[e.category]||0)+Number(e.amount);});
  const expEntries = Object.entries(expByCat);
  const maxE = Math.max(1,...expEntries.map(e=>e[1]));
  const catColors = ["#1F7A5C","#BE5030","#B8860B","#1D3A5F","#8A6E4B","#6B7280","#7C6FB0"];
  const gstCollected = docs.filter(d=>DOC_META[d.docType].group==="sales"&&d.meta.financial).reduce((s,d)=>s+d.taxTotal+d.cessTotal,0);
  const gstPaid = docs.filter(d=>DOC_META[d.docType].group==="purchase"&&d.meta.financial).reduce((s,d)=>s+d.taxTotal+d.cessTotal,0);

  return `
  ${backTopbar("Reports")}
  <div class="content">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Sales</div><div class="stat-value" style="color:var(--green)">${fmt0(totalSales)}</div></div>
      <div class="stat-card"><div class="stat-label">Purchases</div><div class="stat-value" style="color:var(--rust)">${fmt0(totalPurchases)}</div></div>
      <div class="stat-card"><div class="stat-label">Expenses</div><div class="stat-value">${fmt0(totalExpenses)}</div></div>
      <div class="stat-card"><div class="stat-label">Stock value</div><div class="stat-value">${fmt0(stockValue)}</div></div>
    </div>

    <div class="section-title">GST summary</div>
    <div class="card">
      <div class="bill-line"><span>Tax collected on sales</span><span class="mono">${fmt0(gstCollected)}</span></div>
      <div class="bill-line"><span>Tax paid on purchases</span><span class="mono">${fmt0(gstPaid)}</span></div>
      <div class="bill-total" style="font-size:14px;"><span>Net GST payable</span><span class="mono">${fmt0(Math.max(0,gstCollected-gstPaid))}</span></div>
    </div>

    <div class="section-title">Sales by month</div>
    <div class="card">
      ${monthly.length===0 ? `<div style="text-align:center;color:var(--slate);font-size:13px;padding:20px 0;">No sales yet</div>` :
        monthly.map(([m,v])=>`
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${esc(m)}</span><span class="mono">${fmt0(v)}</span></div>
          <div style="background:var(--line);border-radius:6px;height:8px;overflow:hidden;"><div style="width:${(v/maxM*100).toFixed(1)}%;background:var(--green);height:100%;"></div></div>
        </div>`).join("")}
    </div>

    <div class="section-title">Top selling items</div>
    <div class="card">
      ${topItems.length===0 ? `<div style="text-align:center;color:var(--slate);font-size:13px;padding:14px 0;">No sales yet</div>` :
        topItems.map(([n,q])=>`<div class="list-row"><div class="row-title" style="font-weight:400;flex:1;">${esc(n)}</div><div class="mono">${q}</div></div>`).join("")}
    </div>

    <div class="section-title">Expenses by category</div>
    <div class="card">
      ${expEntries.length===0 ? `<div style="text-align:center;color:var(--slate);font-size:13px;padding:14px 0;">No expenses yet</div>` :
        expEntries.map(([n,v],i)=>`
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${esc(n)}</span><span class="mono">${fmt0(v)}</span></div>
          <div style="background:var(--line);border-radius:6px;height:8px;overflow:hidden;"><div style="width:${(v/maxE*100).toFixed(1)}%;background:${catColors[i%catColors.length]};height:100%;"></div></div>
        </div>`).join("")}
    </div>

    <div class="section-title">Party statements</div>
    <div class="card">
      ${state.data.parties.length===0 ? `<div style="text-align:center;color:var(--slate);font-size:13px;padding:14px 0;">No parties yet</div>` :
        state.data.parties.map(p=>`<div class="list-row" data-action="open-ledger" data-id="${p.id}"><div class="row-title" style="font-weight:400;flex:1;">${esc(p.name)}</div><div>${ICONS.back}</div></div>`.replace(ICONS.back, `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`)).join("")}
    </div>
  </div>`;
}

// ---------------- document form ----------------
function nextDocNumber(docType){
  const meta = DOC_META[docType];
  const prefix = {invoice:"INV",quotation:"QUO",challan:"DC",proforma:"PI",sales_return:"SR",credit_note:"CN",purchase:"PUR",purchase_return:"PR",debit_note:"DN"}[docType]||"DOC";
  const n = state.data.docs.filter(d=>d.docType===docType).length+1;
  return `${prefix}-${String(n).padStart(4,"0")}`;
}
function ensureDraft(docType){
  if(!state.docDraft || (docType && state.docDraft.docType!==docType)){
    const dt = docType || "invoice";
    state.docDraft = {
      docType: dt, number: nextDocNumber(dt), date: todayISO(), dueDate:"", partyId:"",
      items:[], extraDiscount:0, deliveryCharge:0, paidAmount:0, notes:"", itemQ:"",
      agent:"", ewayBillNo:"", transportName:"", lrNumber:"", lrDate:"", parcels:""
    };
  }
  return state.docDraft;
}
function startEditDoc(docId){
  const doc = state.data.docs.find(d=>d.id===docId);
  if(!doc) return;
  state.docDraft = {
    _editingId: doc.id,
    docType: doc.docType, number: doc.number, date: doc.date, dueDate: doc.dueDate||"",
    partyId: doc.partyId||"", items: doc.items.map(l=>({...l})),
    extraDiscount: doc.extraDiscount||0, deliveryCharge: doc.deliveryCharge||0,
    paidAmount: doc.paidAmount||0, notes: doc.notes||"", itemQ:"",
    agent: doc.agent||"", ewayBillNo: doc.ewayBillNo||"", transportName: doc.transportName||"",
    lrNumber: doc.lrNumber||"", lrDate: doc.lrDate||"", parcels: doc.parcels||""
  };
  state.view = {name:"docNew"};
  render(); mountNav(); window.scrollTo(0,0);
}

function renderModal(){
  const root = document.getElementById("modal-root");
  if(!state.modal){ root.innerHTML=""; return; }
  const {type,id} = state.modal;
  let inner="", full=false;
  if(type==="item"){ inner = modalItem(id); full = true; }
  if(type==="party"){ inner = modalParty(id); full = true; }
  if(type==="expense") inner = modalExpense(id);
  if(type==="profile") inner = modalProfile();
  if(type==="backup") inner = modalBackup();
  if(type==="theme"){ inner = modalTheme(); full = true; }
  if(type==="tx-picker") inner = modalTxPicker();
  if(type==="payment") inner = modalPayment(state.modal.ptype, id);
  if(type==="party-picker"){ inner = modalPartyPicker(); full=true; }
  if(type==="barcode") inner = modalBarcode();
  if(type==="confirm-delete-party") inner = modalConfirmDeleteParty();
  root.innerHTML = `<div class="sheet-overlay" data-action="close-modal">
    <div class="sheet ${full?'full':''}">${inner}</div></div>`;
  if(type==="barcode"){
    requestAnimationFrame(()=>{
      const canvas = document.getElementById("barcode-canvas");
      const code = state.itemDraft?.itemCode||"";
      if(canvas && /^\d{13}$/.test(code)) drawBarcodeOnCanvas(canvas, code);
    });
  }
}

function genBarcodeInto(inputId){
  const el = document.getElementById(inputId);
  let base = "";
  for(let i=0;i<12;i++) base += Math.floor(Math.random()*10);
  const code = base + ean13CheckDigit(base);
  if(el) el.value = code;
  if(state.itemDraft) state.itemDraft.itemCode = code;
}

// ---------------- EAN-13 barcode: valid checksum + real rendering ----------------
const EAN_L = {0:"0001101",1:"0011001",2:"0010011",3:"0111101",4:"0100011",5:"0110001",6:"0101111",7:"0111011",8:"0110111",9:"0001011"};
const EAN_G = {0:"0100111",1:"0110011",2:"0011011",3:"0100001",4:"0011101",5:"0111001",6:"0000101",7:"0010001",8:"0001001",9:"0010111"};
const EAN_R = {0:"1110010",1:"1100110",2:"1101100",3:"1000010",4:"1011100",5:"1001110",6:"1010000",7:"1000100",8:"1001000",9:"1110100"};
const EAN_PARITY = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function ean13CheckDigit(base12){
  let sum = 0;
  for(let i=0;i<12;i++){ const d=Number(base12[i]); sum += (i%2===0) ? d : d*3; }
  return (10-(sum%10))%10;
}
function ean13Bits(code13){
  const parity = EAN_PARITY[Number(code13[0])];
  let bits = "101";
  for(let i=1;i<=6;i++){ const d=Number(code13[i]); bits += (parity[i-1]==="L" ? EAN_L[d] : EAN_G[d]); }
  bits += "01010";
  for(let i=7;i<=12;i++){ bits += EAN_R[Number(code13[i])]; }
  bits += "101";
  return bits;
}
function drawBarcodeOnCanvas(canvas, code13){
  const bits = ean13Bits(code13);
  const barW=3, barH=100, marginX=20, textH=26;
  canvas.width = bits.length*barW + marginX*2;
  canvas.height = barH+textH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#000";
  let x=marginX;
  for(const b of bits){ if(b==="1") ctx.fillRect(x,8,barW,barH); x+=barW; }
  ctx.font="16px monospace";
  ctx.textAlign="center";
  ctx.fillText(code13, canvas.width/2, barH+22);
}

// ---------------- barcode camera scanner ----------------
let _scannerStream = null;
let _scannerTimer = null;

function openScanner(targetInputId){
  syncItemDraftFromDOM();
  state.scannerTarget = targetInputId;
  state.scannerOpen = true;
  state.scannerError = null;
  render();
  requestAnimationFrame(startScannerCamera);
}

async function startScannerCamera(){
  const video = document.getElementById("scanner-video");
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.scannerError = "unsupported"; render(); return;
  }
  try{
    _scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = _scannerStream;
    await video.play();
  }catch(e){
    state.scannerError = "denied"; render(); return;
  }
  if("BarcodeDetector" in window){
    let detector;
    try{ detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"] }); }
    catch(e){ state.scannerError = "unsupported"; render(); return; }
    _scannerTimer = setInterval(async ()=>{
      if(!video.videoWidth) return;
      try{
        const codes = await detector.detect(video);
        if(codes && codes.length>0) onScanDetected(codes[0].rawValue);
      }catch(e){ /* transient detection error, keep trying */ }
    }, 350);
  } else {
    state.scannerError = "unsupported";
    render();
  }
}

function onScanDetected(value){
  const targetId = state.scannerTarget;
  closeScanner();
  if(targetId==="f-itemcode" && state.itemDraft) state.itemDraft.itemCode = value;
  render(); mountNav();
  toast("Scanned: "+value);
}

function submitManualScan(){
  const el = document.getElementById("scanner-manual");
  const v = (el?.value||"").trim();
  if(!v){ toast("Type a code first"); return; }
  onScanDetected(v);
}

function closeScanner(){
  if(_scannerTimer){ clearInterval(_scannerTimer); _scannerTimer=null; }
  if(_scannerStream){ _scannerStream.getTracks().forEach(tr=>tr.stop()); _scannerStream=null; }
  state.scannerOpen = false;
  state.scannerError = null;
  render();
}

function renderScanner(){
  const root = document.getElementById("scanner-root");
  if(!root) return;
  if(!state.scannerOpen){ root.innerHTML=""; return; }
  root.innerHTML = `
  <div style="position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--safe-top)) 16px 12px;flex-shrink:0;">
      <span style="color:#fff;font-size:14px;font-weight:600;">Scan barcode</span>
      <button onclick="closeScanner()" style="width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:15px;">✕</button>
    </div>
    <div style="flex:1;position:relative;overflow:hidden;background:#111;">
      <video id="scanner-video" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;display:block;"></video>
      ${!state.scannerError ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
        <div style="width:76%;max-width:320px;aspect-ratio:2/1;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 1000px rgba(0,0,0,0.4);"></div>
      </div>
      <div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:12px;">Point the camera at a barcode</div>` : ""}
      ${state.scannerError==="denied"?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff;font-size:13px;background:rgba(0,0,0,.75);">Camera access was denied. Allow the camera permission for this site in your browser settings, or type the code below.</div>`:""}
      ${state.scannerError==="unsupported"?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff;font-size:13px;background:rgba(0,0,0,.75);">In-app barcode scanning needs Chrome on Android. Type the code below instead — it works everywhere.</div>`:""}
    </div>
    <div style="padding:16px;padding-bottom:calc(16px + var(--safe-bottom));background:#111;flex-shrink:0;">
      <div style="display:flex;gap:8px;">
        <input id="scanner-manual" placeholder="Or type the code manually" style="flex:1;" onkeydown="if(event.key==='Enter')submitManualScan()"/>

      </div>
    </div>
  </div>`;
}

function buildBillHTMLForDoc(docId, copyLabel){
  const doc = state.data.docs.find(d=>d.id===docId);
  if(!doc) return "";
  const t = computeDocTotals(doc);
  const p = party(doc.partyId);
  const biz = state.data.profile;
  const theme = biz?.invoiceTheme || DEFAULT_THEME;
  return billCardHTML(theme, biz, p, t.meta, doc.number, doc.date, t, doc, copyLabel);
}
function printDocTriplicate(docId){
  const doc = state.data.docs.find(d=>d.id===docId);
  if(!doc) return;
  const area = document.getElementById("print-area");
  const meta = DOC_META[doc.docType];
  // Only sales-facing financial docs need the Original/Duplicate/Triplicate copy convention;
  // everything else (purchases, quotations, etc.) just prints once.
  const labels = (meta.financial && meta.group==="sales")
    ? ["ORIGINAL FOR RECIPIENT","DUPLICATE FOR TRANSPORTER","TRIPLICATE FOR SUPPLIER"]
    : [null];
  area.innerHTML = labels.map(l=>buildBillHTMLForDoc(docId, l)).join("");
  area.style.display = "block";
  const cleanup = () => { area.style.display = "none"; area.innerHTML = ""; window.removeEventListener("afterprint", cleanup); };
  window.addEventListener("afterprint", cleanup);
  setTimeout(()=>{ window.print(); }, 80);
}
function ensureScript(src, checkFn){
  return new Promise((resolve,reject)=>{
    if(checkFn()) return resolve();
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){ existing.addEventListener("load",()=>resolve()); existing.addEventListener("error",()=>reject(new Error("load failed"))); return; }
    const s = document.createElement("script");
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error("Failed to load "+src));
    document.head.appendChild(s);
  });
}
async function renderDocToCanvas(docId){
  const area = document.getElementById("print-area");
  area.innerHTML = buildBillHTMLForDoc(docId, "ORIGINAL FOR RECIPIENT");
  area.style.cssText = "position:fixed;left:-9999px;top:0;display:block;background:#fff;width:420px;";
  await ensureScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", ()=>window.html2canvas);
  const el = area.querySelector(".paper-bill");
  const canvas = await window.html2canvas(el, {scale:2, backgroundColor:"#ffffff"});
  area.style.cssText = "display:none;";
  area.innerHTML = "";
  return canvas;
}
async function downloadDocPDF(docId){
  const doc = state.data.docs.find(d=>d.id===docId);
  toast("Preparing PDF…");
  try{
    const canvas = await renderDocToCanvas(docId);
    await ensureScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", ()=>window.jspdf);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:"px", format:[canvas.width, canvas.height] });
    pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, canvas.width, canvas.height);
    pdf.save((doc?.number||"invoice")+".pdf");
    toast("Downloaded");
  }catch(e){
    toast("Couldn't generate a PDF here — try Print instead and choose \"Save as PDF\"");
  }
}
async function shareDoc(docId){
  const doc = state.data.docs.find(d=>d.id===docId);
  try{
    const canvas = await renderDocToCanvas(docId);
    canvas.toBlob(async (blob)=>{
      const file = new File([blob], (doc?.number||"invoice")+".png", {type:"image/png"});
      try{
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:doc?.number||"Invoice"});
        } else if(navigator.share){
          await navigator.share({title:doc?.number||"Invoice", text:(doc?.number||"Invoice")+" — "+fmt0(computeDocTotals(doc).total)});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a"); a.href=url; a.download=(doc?.number||"invoice")+".png"; a.click();
          toast("Sharing isn't supported here — image downloaded instead");
        }
      }catch(shareErr){ /* user cancelled the share sheet — not an error */ }
    }, "image/png");
  }catch(e){
    toast("Couldn't prepare the invoice for sharing");
  }
}
function downloadBackup(){
  const payload = { ...state.data, exportedAt: new Date().toISOString(), app: "gst-billing", version: 2 };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `gst-billing-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function handleThemeBgUpload(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 900;
      let w = img.width, h = img.height;
      if(w>h && w>maxSide){ h = Math.round(h*maxSide/w); w = maxSide; }
      else if(h>=w && h>maxSide){ w = Math.round(w*maxSide/h); h = maxSide; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      if(!state.themeDraft) state.themeDraft = {...(state.data.profile?.invoiceTheme||DEFAULT_THEME)};
      state.themeDraft.backgroundUrl = canvas.toDataURL("image/jpeg", 0.85);
      state.themeDraft.backgroundMode = "photo";
      render();
      toast("Background ready — tap Save to keep it");
    };
    img.onerror = () => toast("Couldn't read that image");
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  inputEl.value = "";
}
function handleLogoUpload(inputEl){

      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;

function handleSignatureUpload(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 220, maxH = 100;
      let w = img.width, h = img.height;
      const ratio = Math.min(maxW/w, maxH/h, 1);
      w = Math.round(w*ratio); h = Math.round(h*ratio);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/png");

function handleImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== "object") throw new Error("bad file");
      state.data = {
        profile: parsed.profile ?? null,
        items: Array.isArray(parsed.items) ? parsed.items : [],
        parties: Array.isArray(parsed.parties) ? parsed.parties : [],
        docs: Array.isArray(parsed.docs) ? parsed.docs : [],
        payments: Array.isArray(parsed.payments) ? parsed.payments : [],
        expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [],
      };
      saveData(); state.modal = null; render(); mountNav();
      toast("Backup restored");
    }catch(err){ toast("Couldn't read that file — is it a valid backup?"); }
    inputEl.value = "";
  };
  reader.readAsText(file);
}

function refocusById(id){ requestAnimationFrame(()=>{ const el=document.getElementById(id); if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; } }); }
function draftSet(key,val){ const d=ensureDraft(); d[key]=val; render(); mountNav();

  else if(key==="agent") refocusById('f-agent');
  else if(key==="ewayBillNo") refocusById('f-ewaybill');
  else if(key==="transportName") refocusById('f-transport');
  else if(key==="lrNumber") refocusById('f-lrnum');
  else if(key==="parcels") refocusById('f-parcels');
}
function lineSet(idx,key,val){ const d=ensureDraft(); d.items[idx][key]=Number(val||0); render(); mountNav(); refocusById('line-'+key+'-'+idx); }
function switchDocType(newType){
  const d = ensureDraft();
  d.docType = newType; d.number = nextDocNumber(newType); d.partyId="";
  render(); mountNav();
}

document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if(action==="close-modal" && t.classList.contains("sheet-overlay") && e.target.closest(".sheet")) return;

  if(action==="goto-tab"){ state.tab=t.dataset.tab; state.view=null; state.modal=null; render(); mountNav(); window.scrollTo(0,0); }
  else if(action==="back"){ state.view=null; state.docDraft=null; render(); mountNav(); }
  else if(action==="party-filter"){ state.partyFilter = state.partyFilter===t.dataset.filter ? null : t.dataset.filter; render(); mountNav(); }
  else if(action==="tx-subtab"){ state.txSubTab=t.dataset.sub; render(); mountNav(); }
  else if(action==="open-doc"){ state.view={name:"docDetail", id}; render(); mountNav(); window.scrollTo(0,0); }
  else if(action==="open-ledger"){ state.modal=null; state.view={name:"partyLedger", id}; render(); mountNav(); window.scrollTo(0,0); }
  else if(action==="start-doc"){ state.docDraft=null; ensureDraft(t.dataset.type); state.modal=null; state.view={name:"docNew"}; render(); mountNav(); }
  else if(action==="edit-doc"){ startEditDoc(id); }

  else if(action==="add-line"){
    const item = state.data.items.find(i=>i.id===id);
    const d = ensureDraft();
    const existing = d.items.find(l=>l.itemId===item.id);
    if(existing) existing.qty += 1;
    else d.items.push({itemId:item.id, name:item.name, hsn:item.hsn||"", size:item.size||"", unit:item.unit||"", qty:1, price:effectivePrice(item,d.partyId), discPercent:Number(item.discountPercent||0), taxRate:Number(item.taxRate||0), cessRate:0});
    render(); mountNav();
  }
  else if(action==="remove-line"){ const d=ensureDraft(); d.items.splice(Number(t.dataset.idx),1); render(); mountNav(); }

  else if(action==="pick-party"){ const d=ensureDraft(); d.partyId=id; state.modal=null; render(); mountNav(); }

  else if(action==="save-doc"){
    const d = ensureDraft();
    const meta = DOC_META[d.docType];
    // Cash sale / cash purchase (no party selected) is settled on the spot — mark it fully paid automatically.
    const autoPaid = meta.financial ? (d.partyId ? Number(d.paidAmount||0) : computeDocTotals(d).total) : 0;
    if(d._editingId){
      const existing = state.data.docs.find(x=>x.id===d._editingId);
      if(existing){
        const oldMeta = DOC_META[existing.docType];
        existing.items.forEach(line=>{
          const it = state.data.items.find(x=>x.id===line.itemId);
          if(it && it.itemType!=="service") it.stock = Number(it.stock) - oldMeta.stockSign*Number(line.qty);
        });
        existing.docType=d.docType; existing.number=d.number; existing.date=d.date; existing.dueDate=d.dueDate||"";
        existing.partyId=d.partyId; existing.items=d.items;
        existing.extraDiscount=Number(d.extraDiscount||0); existing.deliveryCharge=Number(d.deliveryCharge||0);
        existing.paidAmount = autoPaid; existing.notes=d.notes||"";
        existing.agent=d.agent||""; existing.ewayBillNo=d.ewayBillNo||""; existing.transportName=d.transportName||"";
        existing.lrNumber=d.lrNumber||""; existing.lrDate=d.lrDate||""; existing.parcels=d.parcels||"";
        existing.items.forEach(line=>{
          const it = state.data.items.find(x=>x.id===line.itemId);
          if(it && it.itemType!=="service") it.stock = Number(it.stock) + meta.stockSign*Number(line.qty);
        });
      }
      if(saveData()){
        state.docDraft=null; state.view=null; state.tab="transactions"; state.txSubTab=meta.group;
        render(); mountNav(); toast(meta.label+" updated");
      }
      return;
    }
    const doc = {
      id: genId(), docType:d.docType, number:d.number, date:d.date, dueDate:d.dueDate||"", partyId:d.partyId, items:d.items,
      extraDiscount:Number(d.extraDiscount||0), deliveryCharge:Number(d.deliveryCharge||0),
      paidAmount: autoPaid, notes:d.notes||"",
      agent:d.agent||"", ewayBillNo:d.ewayBillNo||"", transportName:d.transportName||"",
      lrNumber:d.lrNumber||"", lrDate:d.lrDate||"", parcels:d.parcels||""
    };
    state.data.docs.push(doc);
    doc.items.forEach(line=>{
      const it = state.data.items.find(x=>x.id===line.itemId);
      if(it && it.itemType!=="service") it.stock = Number(it.stock) + meta.stockSign*Number(line.qty);
    });
    if(saveData()){
      state.docDraft=null; state.view=null; state.tab="transactions"; state.txSubTab=meta.group;
      render(); mountNav(); toast(meta.label+" saved");
    }
  }
  else if(action==="pay-doc"){
    const amtEl = document.getElementById("pay-amt");
    const amt = Number(amtEl?.value||0);
    if(amt>0){
      const doc = state.data.docs.find(x=>x.id===id);
      doc.paidAmount = Number(doc.paidAmount||0)+amt;
      if(doc.partyId){
        state.data.payments.push({ id:genId(), partyId:doc.partyId, amount:amt, unallocated:0, date:todayISO(), mode:"", note:"Against "+doc.number });
      }
      if(saveData()){ render(); mountNav(); toast("Payment recorded"); }
    }
  }
  else if(action==="delete-doc"){
    const doc = state.data.docs.find(x=>x.id===id);
    if(doc){
      const meta = DOC_META[doc.docType];
      doc.items.forEach(line=>{
        const it = state.data.items.find(x=>x.id===line.itemId);
        if(it && it.itemType!=="service") it.stock = Number(it.stock) - meta.stockSign*Number(line.qty);
      });
      state.data.docs = state.data.docs.filter(x=>x.id!==id);
      if(saveData()){ state.view=null; render(); mountNav(); toast("Deleted"); }
    }
  }
  else if(action==="print-doc"){ printDocTriplicate(id); }
  else if(action==="download-doc"){ downloadDocPDF(id); }
  else if(action==="share-doc"){ shareDoc(id); }

  else if(action==="open-modal"){ state.modal={type:t.dataset.modal, id:t.dataset.id||null, ptype:t.dataset.ptype}; state.modalCtx=t.dataset.ctx||null; render(); }
  else if(action==="close-modal"){ state.modal=null; state.themeDraft=null; state.itemDraft=null; state.partyDraft=null; render(); }
  else if(action==="set-party-type"){ syncPartyDraftFromDOM(); state.partyDraft.type=t.dataset.t; render(); }
  else if(action==="party-tab"){ switchPartyTab(t.dataset.tab); }
  else if(action==="item-tab"){ switchItemTab(t.dataset.tab); }
  else if(action==="set-item-type"){ syncItemDraftFromDOM(); state.itemDraft.itemType=t.dataset.t; render(); }

  else if(action==="save-item"){
    syncItemDraftFromDOM();
    const d = state.itemDraft;
    const name = (d.name||"").trim();
    if(!name){ toast("Item name is required"); return; }
    const taxRate = Number(d.taxRate||0);
    const priceExGst = (val,mode) => { const n=Number(val||0); return mode==="with" ? Math.round((n/(1+taxRate/100))*100)/100 : n; };
    const f = {
      name, hsn:(d.hsn||"").trim(), itemType:d.itemType||"product", unit:d.unit||"pcs", taxRate,
      purchasePrice: priceExGst(d.purchasePrice, d.purchasePriceMode),
      sellingPrice: priceExGst(d.sellingPrice, d.sellingPriceMode),
      discountPercent: Number(d.discountPercent||0),
      stock: d.itemType==="service" ? 0 : Number(d.stock||0),
      itemCode: (d.itemCode||"").trim(),
      lowStockAlertOn: !!d.lowStockAlertOn,
      lowStockAlert: Number(d.lowStockAlert||0),
      category: (d.category||"").trim(), size: (d.size||"").trim(), description: (d.description||"").trim(),
      partyPrices: {...(d.partyPrices||{})},
    };
    let newItemId = id;
    if(id){ state.data.items = state.data.items.map(it=>it.id===id?{...it,...f}:it); }
    else { newItemId = genId(); state.data.items.push({...f, id:newItemId}); }
    if(saveData()){
      state.modal=null; state.itemDraft=null;
      if(!id && state.modalCtx==="docpicker" && state.docDraft){
        const newItem = state.data.items.find(it=>it.id===newItemId);
        const dd = state.docDraft;
        dd.items.push({itemId:newItem.id, name:newItem.name, hsn:newItem.hsn||"", size:newItem.size||"", qty:1, price:effectivePrice(newItem,dd.partyId), discPercent:Number(newItem.discountPercent||0), taxRate:Number(newItem.taxRate||0), cessRate:0});
        toast("Item created and added");
      } else { toast("Item saved"); }
      state.modalCtx=null;
      render(); mountNav();
    }
  }
  else if(action==="delete-item"){ state.data.items = state.data.items.filter(it=>it.id!==id); saveData(); render(); mountNav(); }

  else if(action==="save-party"){
    syncPartyDraftFromDOM();
    const d = state.partyDraft;
    const name = (d.name||"").trim();
    if(!name){ toast("Party name is required"); return; }
    const f = {
      name, type:d.type||"customer", phone:(d.phone||"").trim(),
      gstin:(d.gstin||"").trim(), panNumber:(d.panNumber||"").trim(),
      addrStreet:(d.addrStreet||"").trim(), state:d.addrState||"", addrPincode:(d.addrPincode||"").trim(), addrCity:(d.addrCity||"").trim(),
      creditLimit: d.creditLimit===""||d.creditLimit==null ? null : Number(d.creditLimit),
      notes:(d.notes||"").trim(),
    };
    if(id){ state.data.parties = state.data.parties.map(p=>p.id===id?{...p,...f}:p); }
    else { state.data.parties.push({...f, id:genId()}); }
    if(saveData()){ state.modal=null; state.partyDraft=null; render(); mountNav(); toast("Party saved"); }
  }
  else if(action==="delete-party"){
    const p = party(id);
    if(!p) return;
    const hasHistory = state.data.docs.some(d=>d.partyId===id) || state.data.payments.some(pay=>pay.partyId===id);
    state.modal = { type:"confirm-delete-party", id, hasHistory };
    render();
  }
  else if(action==="do-delete-party"){
    state.data.parties = state.data.parties.filter(x=>x.id!==id);
    saveData(); state.modal=null; render(); mountNav(); toast("Party deleted");
  }

  else if(action==="save-expense"){
    const f = {
      id: id||undefined,
      date: document.getElementById("f-date").value,
      category: document.getElementById("f-cat").value,
      amount: Number(document.getElementById("f-amt").value||0),
      note: document.getElementById("f-note").value.trim(),
    };
    if(!f.amount){ toast("Amount is required"); return; }
    if(id){ state.data.expenses = state.data.expenses.map(e=>e.id===id?{...e,...f}:e); }
    else { state.data.expenses.push({...f, id:genId()}); }
    if(saveData()){ state.modal=null; render(); mountNav(); toast("Expense saved"); }
  }
  else if(action==="delete-expense"){ state.data.expenses = state.data.expenses.filter(e=>e.id!==id); saveData(); render(); mountNav(); }

  else if(action==="save-payment"){
    const ptype = t.dataset.ptype;
    const f = {
      id: genId(), partyId: document.getElementById("f-party").value,
      amount: Number(document.getElementById("f-pamt").value||0),
      date: document.getElementById("f-pdate").value,
      mode: document.getElementById("f-pmode").value,
      note: document.getElementById("f-pnote").value.trim(),
    };
    if(!f.partyId){ toast("Select a party"); return; }
    if(!f.amount){ toast("Enter an amount"); return; }
    applyPaymentToParty(f.partyId, f.amount, f.date, f.mode, f.note);
    if(saveData()){ state.modal=null; render(); mountNav(); toast(ptype==="in"?"Payment received":"Payment recorded"); }
  }

  else if(action==="save-profile"){
    const nameEl = document.getElementById("f-bname");
    const f = {
      businessName: nameEl.value.trim(),
      logoDataUrl: document.getElementById("f-logo-data").value,
      signatureDataUrl: document.getElementById("f-sig-data").value,
      jurisdiction: document.getElementById("f-jurisdiction").value.trim(),
      phone: document.getElementById("f-bphone").value.trim(),
      email: document.getElementById("f-bemail").value.trim(),
      address: document.getElementById("f-baddr").value.trim(),
      gstin: document.getElementById("f-bgstin").value.trim(),
      panNumber: document.getElementById("f-bpan").value.trim(),
      state: document.getElementById("f-bstate").value,
      industryType: document.getElementById("f-industry").value,
      businessType: document.getElementById("f-btype").value,
      bankName: document.getElementById("f-bank").value.trim(),
      bankAccountNo: document.getElementById("f-bankacc").value.trim(),
      bankIFSC: document.getElementById("f-bankifsc").value.trim(),
      udyamNumber: document.getElementById("f-udyam").value.trim(),
      termsAndConditions: document.getElementById("f-terms").value,
    };
    if(!f.businessName){ nameEl.style.borderColor="var(--rust)"; nameEl.focus(); toast("Please enter a business name"); return; }
    state.data.profile = {...(state.data.profile||{}), ...f};
    if(saveData()){ state.modal=null; render(); mountNav(); toast("Business details saved"); }
  }

  else if(action==="set-theme-style"){ state.themeDraft = {...(state.themeDraft||DEFAULT_THEME), style:t.dataset.style}; render(); }
  else if(action==="set-theme-color"){ state.themeDraft = {...(state.themeDraft||DEFAULT_THEME), color:t.dataset.color}; render(); }
  else if(action==="save-theme"){
    state.data.profile = {...(state.data.profile||{}), invoiceTheme: state.themeDraft||DEFAULT_THEME};
    if(saveData()){ state.modal=null; state.themeDraft=null; render(); mountNav(); toast("Theme saved"); }
  }

  else if(action==="export-data"){ downloadBackup(); toast("Backup downloaded"); }
  else if(action==="trigger-import"){ document.getElementById("import-file")?.click(); }
  else if(action==="install"){ if(window.__deferredPrompt){ window.__deferredPrompt.prompt(); } }
  else if(action==="dismiss-install"){ localStorage.setItem("install-dismissed","1"); render(); }
});

window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); window.__deferredPrompt=e; window.__canInstall=true; render(); });
window.addEventListener("appinstalled", ()=>{ window.__canInstall=false; render(); });
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("service-worker.js").catch(()=>{}); }); }
window.addEventListener("afterprint", ()=>{ const a=document.getElementById("print-area"); if(a) a.innerHTML=""; });

render();
mountNav();
if(!state.data.profile){ state.modal={type:"profile"}; render(); }
</script>
</body>
</html>
