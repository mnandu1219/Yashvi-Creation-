<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>GST Billing — Invoicing &amp; Accounts</title>
<meta name="theme-color" content="#132A46" />
<meta name="color-scheme" content="only light" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GST Billing" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root{
    color-scheme: only light;
    --navy:#132A46; --navy-light:#1D3A5F; --paper:#FAF7F0; --line:#E5DFCF;
    --ink:#20242B; --green:#1F7A5C; --green-bg:#E9F3EE; --rust:#BE5030; --rust-bg:#F7E9E2;
    --amber:#B8860B; --amber-bg:#FBF1DD; --slate:#6B7280; --indigo:#4C4FE0; --indigo-bg:#ECEBFC;
    --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overscroll-behavior-y:none;}
  #app{min-height:100%;padding-bottom:calc(70px + var(--safe-bottom));}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  .mono{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);
    padding:calc(14px + var(--safe-top)) 16px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .topbar .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:2px;}
  .topbar h1{font-size:19px;margin:0;font-weight:400;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .fab-inline{background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 14px;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;}

  .content{padding:14px 16px 24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .empty{text-align:center;padding:36px 16px;color:var(--slate);font-size:13px;
    border:1px dashed var(--line);border-radius:14px;background:#fff;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;}
  .stat-card.tint-green{background:var(--green-bg);border-color:#cfe6db;}
  .stat-card.tint-rust{background:var(--rust-bg);border-color:#eeccb9;}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);margin-bottom:6px;
    display:flex;align-items:center;justify-content:space-between;}
  .stat-value{font-size:18px;font-family:Georgia,serif;}

  .section-title{font-size:12px;font-weight:600;color:var(--ink);margin:18px 0 8px;
    display:flex;align-items:center;justify-content:space-between;}
  .section-title a{font-size:12px;color:var(--green);text-decoration:none;font-weight:600;}

  .list-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .row-title{font-size:14px;font-weight:600;}
  .row-sub{font-size:11.5px;color:var(--slate);margin-top:1px;}
  .row-amt{font-size:14px;}

  .avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;}

  .pill{font-size:9.5px;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;white-space:nowrap;}
  .pill.paid{background:var(--green-bg);color:var(--green);}
  .pill.partial{background:var(--amber-bg);color:var(--amber);}
  .pill.unpaid{background:var(--rust-bg);color:var(--rust);}
  .pill.na{background:#EEE;color:var(--slate);}
  .tag{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--indigo-bg);color:var(--indigo);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

  .search{position:relative;margin-bottom:12px;}
  .search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff;}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);
    display:flex;padding-bottom:var(--safe-bottom);border-top:1px solid rgba(255,255,255,.08);}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;
    color:rgba(255,255,255,.5);background:none;border:none;font-size:10px;font-family:inherit;}
  .navbtn.active{color:#fff;}
  .navbtn .dot{width:4px;height:4px;border-radius:99px;background:var(--green);margin-top:1px;opacity:0;}
  .navbtn.active .dot{opacity:1;}

  label.field{display:block;margin-bottom:12px;}
  .field-label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--slate);margin-bottom:5px;}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:inherit;}
  textarea{min-height:60px;resize:vertical;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;
    font-weight:600;font-size:14px;padding:11px 16px;border:none;width:100%;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.accent{background:var(--green);color:#fff;}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:#fff;color:var(--rust);border:1px solid var(--rust);}
  .btn:disabled{opacity:.4;}
  .btn-row{display:flex;gap:8px;margin-top:14px;}
  .btn-row .btn{flex:1;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;}
  .seg button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .sheet-overlay{position:fixed;inset:0;background:rgba(19,42,70,.5);z-index:50;display:flex;align-items:flex-end;}
  .sheet{background:var(--paper);width:100%;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;
    padding:8px 18px calc(20px + var(--safe-bottom));animation:slideup .22s ease-out;}
  .sheet.full{max-height:96vh;}
  @keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 14px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h3{font-size:17px;margin:0;font-weight:400;}
  .sheet-close{width:30px;height:30px;border-radius:99px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .paper-bill{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .bill-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
  .bill-to{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:10px;}
  .bill-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .bill-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);
    font-size:16px;font-family:Georgia,serif;}
  .bill-table{width:100%;font-size:11.5px;border-collapse:collapse;margin-bottom:8px;}
  .bill-table th{text-align:right;color:var(--slate);font-weight:600;padding:4px 3px;border-bottom:1px solid var(--line);}
  .bill-table th:first-child,.bill-table td:first-child{text-align:center;color:var(--slate);}
  .bill-table th:nth-child(2),.bill-table td:nth-child(2){text-align:left;}
  .bill-table td{padding:5px 3px;border-bottom:1px solid #F1EEE4;text-align:right;}

  .item-line{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:9px;margin-bottom:7px;}
  .item-line .name{flex:1;font-size:13px;min-width:0;}
  .item-line .name .hsn{font-size:10px;color:var(--slate);display:block;}
  .item-line input{padding:6px 6px;font-size:12.5px;text-align:right;}
  .item-line .qty{width:44px;}
  .item-line .rate{width:60px;}
  .item-line .disc{width:44px;}

  .picker-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .picker-row:last-child{border-bottom:none;}
  .qtybadge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;}
  .add-btn{border:1.5px solid var(--indigo);color:var(--indigo);background:#fff;border-radius:8px;
    padding:6px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .add-btn.has{background:var(--indigo);color:#fff;}

  .type-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:6px;}
  .type-tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;text-align:center;}
  .type-tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .type-tile span{font-size:10.5px;color:var(--ink);line-height:1.2;}

  .more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .more-tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;
    display:flex;flex-direction:column;gap:8px;text-align:left;}
  .more-tile .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}

  .toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  .tabs2{display:flex;border-bottom:1px solid var(--line);margin:-1px -16px 10px;padding:0 16px;}
  .tabs2 button{flex:1;padding:10px 0;font-size:13px;font-weight:600;background:none;border:none;
    color:var(--slate);border-bottom:2px solid transparent;}
  .tabs2 button.active{color:var(--navy);border-color:var(--navy);}

  .ledger-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);}
  .ledger-item:last-child{border-bottom:none;}

  /* Invoice documents always use dark, print-safe text — the same in every template. */
  .paper-bill{ --ink:#161616; --slate:#3D3D3D; --line:#CFC7B6; color:#161616; }
  .paper-bill .bill-table th{ color:#161616; }
  /* Grid lines: a vertical line between every column (Sr / Item / HSN / Size / Qty / Rate / Tax /
     Amount) and a horizontal line between every row, with a box around the whole table. */
  .paper-bill{ --grid:#5E574B; }
  .paper-bill .bill-table{ border-collapse:collapse; border:none; }
  .paper-bill .bill-table tr.rep-head th{ background:rgba(0,0,0,.05); }
  .tpl-boxed .bill-table tr.rep-head th{ background:rgba(0,0,0,.06); }
  .paper-bill .bill-table th, .paper-bill .bill-table td{ border:1px solid var(--grid); padding:6px 7px; }
  .paper-bill .bill-table thead th{ background:rgba(0,0,0,.05); }
  .paper-bill .bill-table tfoot td{ background:rgba(0,0,0,.035); }
  .paper-bill .bill-table tr.grid-filler td{ border-top:none; border-bottom:none; padding:0; }
  .paper-bill div[style*="overflow-x"]{ overflow:visible !important; }
  .tpl-boxed{ font-size:10.5px; line-height:1.3; }
  .tpl-boxed table.bx{ width:100%; border-collapse:collapse; }
  .tpl-boxed table.bx > tbody > tr > td, .tpl-boxed table.bx > tr > td{ border:1px solid var(--grid); padding:6px 8px; vertical-align:top; }
  .a4-page .tpl-boxed table.bx > tbody > tr > td{ padding:4px 7px; }
  .a4-page .tpl-boxed .bx-items td{ padding:3.5px 6px !important; }
  .a4-page .tpl-boxed .bx-items th{ padding:4px 5px !important; }
  .tpl-boxed table.bx-inner{ height:calc(100% + 2px); width:calc(100% + 2px); margin:-1px; }
  .tpl-boxed > table + table, .tpl-boxed > .bill-spacer + table{ margin-top:-1px; }
  .tpl-boxed .bx-items th{ vertical-align:middle; }
  .tpl-boxed table.bx-inner td{ border:1px solid var(--grid); padding:3px 7px; font-size:10px; }
  .tpl-boxed table.bx-tax td{ text-align:right; font-size:10px; padding:3px 5px; }
  .tpl-boxed .bx-h{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--tc); margin-bottom:2px; }
  .tpl-boxed .bx-k{ color:#444; }
  .tpl-boxed .bx-sum{ display:flex; justify-content:space-between; gap:8px; padding:1.5px 0; }
  .tpl-boxed .bill-table{ margin:0 !important; font-size:11px; table-layout:fixed !important; }
  .tpl-boxed .bill-table th{ background:rgba(0,0,0,.06); font-size:10.5px; text-align:center; }
  .tpl-boxed .bill-spacer{ min-height:0 !important; }
  .a4-page .paper-bill.tpl-boxed{ padding:22px 24px !important; }
  .paper-bill .bill-table{ min-width:0 !important; table-layout:auto; }
  .paper-bill .bill-table th, .paper-bill .bill-table td{ word-break:break-word; }
  .paper-bill .bill-table td:first-child{ color:#161616; }

  /* A4 page used for PDF / print output: 794 x 1123 CSS px = 210 x 297 mm, full bleed, no card frame. */
  .a4-page{ position:relative; width:794px; background:#fff; overflow:hidden; }
  .a4-page .a4-bg, .a4-page .a4-wash{ position:absolute; left:0; width:794px; z-index:0; }
  .a4-page .paper-bill{ position:relative; z-index:2; margin:0 !important; border:none !important; border-radius:0 !important;
    background:transparent !important; box-shadow:none !important; box-sizing:border-box; display:flex; flex-direction:column;
    padding:38px 42px !important; font-size:12.5px; }
  .a4-page .paper-bill.tpl-luxury{ margin:16px !important; border:3px double var(--tc) !important; padding:30px 34px !important; }
  .a4-page .paper-bill.tpl-stylish{ padding:0 !important; }
  .a4-page .tpl-stylish .stylish-head{ margin:0 0 14px !important; padding:30px 42px !important; border-radius:0 !important; }
  .a4-page .tpl-stylish .stylish-body{ padding:0 42px 38px !important; flex:1; display:flex; flex-direction:column; }
  .a4-page .bill-inner{ flex:1; display:flex; flex-direction:column; }
  .a4-page .bill-spacer{ flex:1; min-height:14px; }
  .a4-page div[style*="overflow-x"]{ overflow:visible !important; }
  .a4-page .bill-table{ min-width:0 !important; font-size:12px; }

  #print-area{ display:none; }
  @media print{
    @page{ size: A4; margin: 0; }
    html, body{ margin:0 !important; padding:0 !important; background:#fff !important; height:auto !important; }
    body > *:not(#print-area){ display:none !important; }
    #print-area{ display:block !important; position:static !important; left:auto !important; }
    #print-area .print-page{ display:block; width:210mm; height:296.5mm; margin:0; page-break-after:always; break-after:page; }
    #print-area .print-page:last-child{ page-break-after:auto; break-after:auto; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="scanner-root"></div>
<div id="toast" class="toast"></div>
<div id="print-area"></div>

<script>
// ---------------- utilities ----------------
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = (n) => "₹" + Math.round(Number(n||0)).toLocaleString("en-IN");
const fmtN = (n) => { const v=Number(n||0); const isWhole = Math.round(v*100)%100===0; return v.toLocaleString("en-IN", isWhole?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2}); };
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const monthLabel = (iso) => new Date(iso).toLocaleString("en-IN", { month: "short", year: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysAgo = (iso) => (Date.now() - new Date(iso).getTime()) / 86400000;
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function setDueDatePreset(val){
  const d = ensureDraft();
  if(!val){ d.dueDate=""; render(); return; }
  if(val==="custom") return; // leave existing date field as-is
  const [y,m,dd] = (d.date||todayISO()).split("-").map(Number);
  d.dueDate = new Date(Date.UTC(y,m-1,dd+Number(val))).toISOString().slice(0,10);
  render();
}

function numberToWords(num){
  num = Math.round(Number(num||0));
  if(num===0) return "Zero Rupees";
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(n){ if(n<20) return a[n]; return b[Math.floor(n/10)] + (n%10? " "+a[n%10]:""); }
  function three(n){ if(n>99) return a[Math.floor(n/100)]+" Hundred"+(n%100? " "+two(n%100):""); return two(n); }
  const crore = Math.floor(num/10000000); num%=10000000;
  const lakh = Math.floor(num/100000); num%=100000;
  const thousand = Math.floor(num/1000); num%=1000;
  const rest = num;
  let out=[];
  if(crore) out.push(three(crore)+" Crore");
  if(lakh) out.push(three(lakh)+" Lakh");
  if(thousand) out.push(three(thousand)+" Thousand");
  if(rest) out.push(three(rest));
  return out.join(" ")+" Rupees";
}

function hexToRgba(hex, a){
  const h = (hex||"#132A46").replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r||19},${g||42},${b||70},${a})`;
}
// Original, generated-in-app decorative pattern for garment/textile businesses — tinted to match
// whatever theme color is selected, so no external image or licensing is ever needed.
function floralPatternDataUri(color){
  const petal = hexToRgba(color, 0.13);
  const petalLight = hexToRgba(color, 0.07);
  const stem = hexToRgba(color, 0.09);
  const flower = (cx,cy,scale)=>`
    <g transform="translate(${cx} ${cy}) scale(${scale})">
      <ellipse cx="0" cy="-7" rx="4" ry="7" fill="${petal}"/>
      <ellipse cx="0" cy="7" rx="4" ry="7" fill="${petal}"/>
      <ellipse cx="-7" cy="0" rx="7" ry="4" fill="${petal}"/>
      <ellipse cx="7" cy="0" rx="7" ry="4" fill="${petal}"/>
      <ellipse cx="-5" cy="-5" rx="5" ry="3" transform="rotate(45 -5 -5)" fill="${petalLight}"/>
      <ellipse cx="5" cy="5" rx="5" ry="3" transform="rotate(45 5 5)" fill="${petalLight}"/>
      <ellipse cx="-5" cy="5" rx="5" ry="3" transform="rotate(-45 -5 5)" fill="${petalLight}"/>
      <ellipse cx="5" cy="-5" rx="5" ry="3" transform="rotate(-45 5 -5)" fill="${petalLight}"/>
      <circle cx="0" cy="0" r="3.5" fill="${petal}"/>
    </g>`;
  const leafSprig = (cx,cy,rot,scale)=>`
    <g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${scale})">
      <path d="M0 0 Q3 -14 0 -28" stroke="${stem}" stroke-width="1.4" fill="none"/>
      <ellipse cx="-4" cy="-9" rx="5" ry="2.5" transform="rotate(-35 -4 -9)" fill="${petalLight}"/>
      <ellipse cx="4" cy="-16" rx="5" ry="2.5" transform="rotate(35 4 -16)" fill="${petalLight}"/>
      <ellipse cx="-3" cy="-23" rx="4" ry="2" transform="rotate(-30 -3 -23)" fill="${petalLight}"/>
    </g>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
    ${flower(30,35,1)}${leafSprig(30,35,20,0.8)}
    ${flower(170,60,0.8)}${leafSprig(170,60,-30,0.7)}
    ${flower(90,120,1.1)}${leafSprig(90,120,60,0.9)}
    ${flower(180,170,0.9)}${leafSprig(180,170,-10,0.8)}
    ${flower(20,180,0.7)}${leafSprig(20,180,100,0.6)}
    ${flower(120,20,0.6)}
  </svg>`;

const STORAGE_KEY = "ledger-billbook-data";
function loadData(){
  let d = { profile:null, items:[], parties:[], docs:[], payments:[], expenses:[] };
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      d = { ...d, ...parsed };
      // migrate old "invoices" shape -> docs
      if(Array.isArray(parsed.invoices) && !parsed.docs){
        d.docs = parsed.invoices.map(inv => ({
          id: inv.id, docType: "invoice", number: inv.number, date: inv.date, partyId: inv.partyId,
          items: inv.items.map(l => ({...l, hsn:"", discPercent:0, taxRate: inv.taxPercent||0, cessRate:0})),
          extraDiscount: inv.discount||0, deliveryCharge:0, paidAmount: inv.paidAmount||0, notes:""
        }));
      }
    }
  }catch(e){}
  // v27: one-time replacement of saved terms with the business's standard terms
  if(d.profile && !d.profile._termsV27){ const old=(d.profile.termsAndConditions||"").trim(); if(!old || old.startsWith("1. Payment due within 30 days")) d.profile.termsAndConditions = DEFAULT_TERMS; d.profile._termsV27 = true; try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){} }
  if(!Array.isArray(d.docs)) d.docs=[];
  if(!Array.isArray(d.payments)) d.payments=[];
  ["items","parties","expenses"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  d.docs = d.docs.filter(x=>x && typeof x==="object").map(x=>({...x, docType: DOC_META[x.docType]?x.docType:"invoice", items: Array.isArray(x.items)?x.items:[]}));
  if(!(d.schema>=29)){ // keep totals of invoices saved before v29 exactly as they were printed
    d.docs.forEach(x=>{ if(Number(x.extraDiscount||0)>0 && x.legacyExtraDisc===undefined) x.legacyExtraDisc = true; });
    d.schema = 29;
  }
  return d;
}

// ---------------- computed ----------------
function computeDocTotals(doc){
  const meta = DOC_META[doc.docType] || DOC_META.invoice;
  const party = state.data.parties.find(p=>p.id===doc.partyId);
  const bState = state.data.profile?.state;
  const sameState = !party?.state || !bState || party.state === bState;
  let subtotal=0, discTotal=0, taxableTotal=0, taxTotal=0, cessTotal=0, itemsTotal=0;
  const extraDisc = Number(doc.extraDiscount||0) || 0;
  // Invoice-level discount reduces the taxable value (GST is charged after it). Invoices saved before
  // v29 took it off after tax; they are flagged legacyExtraDisc so their printed totals never change.
  const discBeforeTax = extraDisc>0 && !doc.legacyExtraDisc;
  const grossOf = l => { const base=(Number(l.qty)||0)*(Number(l.price)||0); return base - base*((Number(l.discPercent)||0)/100); };
  const grossSum = (doc.items||[]).reduce((s,l)=>s+grossOf(l),0);
  const share = discBeforeTax && grossSum>0 ? Math.min(extraDisc, grossSum)/grossSum : 0;
  const lines = (doc.items||[]).map(l=>{
    const qty = Number(l.qty)||0, price = Number(l.price)||0;
    const base = qty*price;
    const discAmt = base*((Number(l.discPercent)||0)/100);
    const gross = base-discAmt;
    const taxable = gross*(1-share);
    const taxAmt = taxable*((Number(l.taxRate)||0)/100);
    const cessAmt = taxable*((Number(l.cessRate)||0)/100);
    subtotal+=base; discTotal+=discAmt; itemsTotal+=gross; taxableTotal+=taxable; taxTotal+=taxAmt; cessTotal+=cessAmt;
    return {...l, qty, price, base, discAmt, gross, taxable, taxAmt, cessAmt, lineTotal:taxable+taxAmt+cessAmt};
  });
  const cgst = sameState ? taxTotal/2 : 0;
  const sgst = sameState ? taxTotal/2 : 0;
  const igst = sameState ? 0 : taxTotal;
  const delivery = Number(doc.deliveryCharge||0);
  const beforeRound = Math.round((taxableTotal+taxTotal+cessTotal+delivery-(discBeforeTax?0:extraDisc))*100)/100;
  const total = Math.max(0, Math.ceil(beforeRound));
  const roundOff = total-beforeRound;
  const due = meta.financial ? Math.max(0,total-(doc.paidAmount||0)) : 0;
  let status = "na";
  if(meta.financial){ status = due>0 && doc.paidAmount>0 ? "partial" : due>0 ? "unpaid" : "paid"; }
  return { lines, subtotal, discTotal, taxableTotal, taxTotal, cessTotal, cgst, sgst, igst, delivery, extraDisc,
    total, roundOff, due, status, sameState, meta, itemsTotal, discBeforeTax };
}

function partyBalance(partyId){
  let bal=0;
  state.data.docs.forEach(doc=>{
    if(doc.partyId!==partyId) return;
    const meta = DOC_META[doc.docType]; if(!meta || !meta.financial) return;
    const t = computeDocTotals(doc);
    bal += meta.ledgerSign*(t.total-(doc.paidAmount||0));
  });
  state.data.payments.forEach(p=>{ if(p.partyId===partyId) bal -= (p.dir===-1?-1:1)*Number(p.unallocated!=null ? p.unallocated : p.amount||0); });
  return bal;
}
// Balance of a party from everything dated before this document (plus earlier entries on the same date),
// so reprinting an old invoice shows the balance as it was then, not today's.
function partyBalanceBefore(doc){
  let bal=0; const idx = state.data.docs.findIndex(x=>x.id===doc.id);
  state.data.docs.forEach((d,i)=>{
    if(d.partyId!==doc.partyId || d.id===doc.id) return;
    const m = DOC_META[d.docType]; if(!m || !m.financial) return;
    if(d.date < doc.date || (d.date===doc.date && idx>=0 && i<idx)){ const t=computeDocTotals(d); bal += m.ledgerSign*(t.total-(d.paidAmount||0)); }
  });
  state.data.payments.forEach(p=>{ if(p.partyId===doc.partyId && p.date < doc.date) bal -= (p.dir===-1?-1:1)*Number(p.unallocated!=null ? p.unallocated : p.amount||0); });
  return bal;
}
// Applies a payment against a party's oldest outstanding documents first (so invoices actually get
// marked paid), keeping any leftover as an unallocated credit that still reduces their balance.
// dir = 1 for the normal direction (customer pays us / we pay a supplier); -1 for a refund the other way,
// which raises the balance and is never adjusted against documents.
function applyPaymentToParty(partyId, amount, date, mode, note, dir){
  dir = dir===-1 ? -1 : 1;
  let remaining = Number(amount);
  const alloc = [];
  const docs = dir===-1 ? [] : state.data.docs.filter(d=>d.partyId===partyId && DOC_META[d.docType] && DOC_META[d.docType].financial && DOC_META[d.docType].ledgerSign>0)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  for(const doc of docs){
    if(remaining<=0.004) break;
    const t = computeDocTotals(doc);
    if(t.due<=0.004) continue;
    const applied = Math.min(remaining, t.due);
    doc.paidAmount = Number(doc.paidAmount||0) + applied;
    alloc.push({docId:doc.id, amt:applied});
    remaining -= applied;
  }
  state.data.payments.push({ id:genId(), partyId, amount:Number(amount), unallocated: Math.max(0,remaining), date, mode, note, dir, alloc });
}
// Undo a payment: take back whatever it had marked as paid on documents.
function removePayment(payId){
  const pay = state.data.payments.find(p=>p.id===payId); if(!pay) return;
  let give = Number(pay.amount||0) - Number(pay.unallocated||0);
  if(Array.isArray(pay.alloc)){
    for(const a of pay.alloc){ const d = state.data.docs.find(x=>x.id===a.docId); if(!d) { give -= a.amt; continue; }
      const back = Math.min(Number(d.paidAmount||0), a.amt); d.paidAmount = Number(d.paidAmount||0) - back; give -= a.amt; }
  }
  if(give > 0.004){ // older payments without an allocation record: undo from the newest paid documents
    const docs = state.data.docs.filter(d=>d.partyId===pay.partyId && DOC_META[d.docType]?.financial && DOC_META[d.docType].ledgerSign>0 && Number(d.paidAmount||0)>0)
      .sort((a,b)=> a.date<b.date ? 1 : -1);
    for(const d of docs){ if(give<=0.004) break; const back=Math.min(give, Number(d.paidAmount||0)); d.paidAmount-=back; give-=back; }
  }
  state.data.payments = state.data.payments.filter(p=>p.id!==payId);
}
// When a document is deleted, money that had been adjusted against it goes back to the payments as advance.
function releaseDocPayments(doc){
  const start = Number(doc.paidAmount||0);
  let give = start;
  const pays = state.data.payments.filter(p=>p.partyId===doc.partyId && p.dir!==-1).reverse();
  for(const p of pays){
    if(give<=0.004) break;
    let fromThis = 0;
    if(Array.isArray(p.alloc)){ const a=p.alloc.find(x=>x.docId===doc.id); if(a){ fromThis=Math.min(a.amt, give); p.alloc=p.alloc.filter(x=>x!==a); } }
    else { fromThis = Math.min(give, Number(p.amount||0)-Number(p.unallocated||0)); }
    if(fromThis>0){ p.unallocated = Number(p.unallocated||0)+fromThis; give -= fromThis; }
  }
  return start - give; // amount that came from recorded payments
}

function computed(){
  const docs = state.data.docs.map(d=>({...d, ...computeDocTotals(d)}));
  const customers = state.data.parties.filter(p=>p.type==="customer");
  const suppliers = state.data.parties.filter(p=>p.type==="supplier");
  const toCollect = customers.reduce((s,p)=>s+Math.max(0,partyBalance(p.id)),0);
  const toPay = suppliers.reduce((s,p)=>s+Math.max(0,partyBalance(p.id)),0);
  const stockValue = state.data.items.reduce((s,it)=>s+Number(it.stock||0)*Number(it.purchasePrice||0),0);
  const weekSales = docs.filter(d=>DOC_META[d.docType].group==="sales" && d.meta.financial && daysAgo(d.date)<=7)
    .reduce((s,d)=>s+d.meta.ledgerSign*d.total,0);
  const totalExpenses = state.data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const lowStock = state.data.items.filter(it=>it.itemType!=="service" && it.lowStockAlertOn!==false && Number(it.stock)<=Number(it.lowStockAlert||0));
  const totalSales = docs.filter(d=>DOC_META[d.docType].group==="sales" && d.meta.financial).reduce((s,d)=>s+d.meta.ledgerSign*d.total,0);
  const totalPurchases = docs.filter(d=>DOC_META[d.docType].group==="purchase" && d.meta.financial).reduce((s,d)=>s+d.meta.ledgerSign*d.total,0);
  return { docs, customers, suppliers, toCollect, toPay, stockValue, weekSales, totalExpenses, lowStock, totalSales, totalPurchases };
}
function partyName(id){ if(!id) return "Cash Sale"; return state.data.parties.find(p=>p.id===id)?.name || "Walk-in"; }
function party(id){ return state.data.parties.find(p=>p.id===id); }
function effectivePrice(item, partyId){
  if(partyId && item.partyPrices && item.partyPrices[partyId]!=null && item.partyPrices[partyId]!=="") return Number(item.partyPrices[partyId]);
  return Number(item.sellingPrice||0);
}

// Two-finger pinch zoom + pan + double-tap for invoice previews (custom, so the rest of the app keeps a fixed zoom).
function attachPinchZoom(box){
  if(box._pz) return; const content = box.querySelector('.pz-content'); if(!content) return;
  const full = box.dataset.pz==="full", MAX = 6;
  const st = box._pz = { s:1, x:0, y:0 };
  const cw = () => box.clientWidth, ch = () => box.clientHeight;
  const natH = () => content.offsetHeight;
  function clamp(){
    const W = cw()*st.s, H = natH()*st.s, bw = cw(), bh = full ? ch() : natH();
    st.x = W<=bw ? (bw-W)/2 : Math.min(0, Math.max(bw-W, st.x));
    st.y = H<=bh ? (full?(bh-H)/2:0) : Math.min(0, Math.max(bh-H, st.y));
  }
  function apply(anim){
    clamp();
    content.style.transition = anim ? "transform .2s ease" : "none";
    content.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.s})`;
    if(!full) box.style.touchAction = st.s>1.01 ? "none" : "pan-y";
  }
  function zoomAt(ns, px, py, anim){
    const minS = 1; ns = Math.max(minS, Math.min(MAX, ns));
    st.x = px - (px - st.x) * (ns/st.s); st.y = py - (py - st.y) * (ns/st.s); st.s = ns; apply(anim);
  }
  box._pzSet = (ns) => zoomAt(ns, cw()/2, full?ch()/2:Math.min(natH(), window.innerHeight)/2, true);
  const pts = new Map(); let pinch=null, pan=null, lastTap=0, moved=false;
  const local = e => { const r = box.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  box.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, local(e)); moved=false;
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={ d:Math.hypot(a.x-b.x,a.y-b.y)||1, s:st.s, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, x:st.x, y:st.y }; pan=null; }
    else if(pts.size===1 && (full || st.s>1.01)){ const p=local(e); pan={ px:p.x, py:p.y, x:st.x, y:st.y }; }
  });
  box.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, local(e));
    if(pinch && pts.size>=2){
      const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1; const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const ns = Math.max(1, Math.min(MAX, pinch.s*d/pinch.d));
      st.x = mx - (pinch.mx - pinch.x) * (ns/pinch.s); st.y = my - (pinch.my - pinch.y) * (ns/pinch.s); st.s = ns; apply(false); moved=true;
    } else if(pan){
      const p=local(e); const dx=p.x-pan.px, dy=p.y-pan.py; if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
      st.x = pan.x+dx; st.y = pan.y+dy; apply(false);
    }
  });
  const end = e => {
    const wasSingle = pts.size===1 && !pinch;
    pts.delete(e.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===1 && (full || st.s>1.01)){ const p=[...pts.values()][0]; pan={px:p.x,py:p.y,x:st.x,y:st.y}; } else if(pts.size===0) pan=null;
    if(e.type==="pointerup" && wasSingle && !moved){
      const now=Date.now(), p=local(e);
      if(now-lastTap<320){ lastTap=0; if(st.s>1.05) { st.s=1; st.x=0; st.y=0; apply(true); } else zoomAt(2.5, p.x, p.y, true); }
      else lastTap=now;
    }
  };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  // Pinch via touch needs preventDefault so Chrome doesn't try its own gesture.
  box.addEventListener('touchmove', e => { if(e.touches.length>1 || st.s>1.01 || full) e.preventDefault(); }, {passive:false});
  box.addEventListener('wheel', e => { if(!(full || e.ctrlKey)) return; e.preventDefault(); const p=local(e); zoomAt(st.s*Math.exp(-e.deltaY*0.0022), p.x, p.y, false); }, {passive:false});
  const init = Number(box.dataset.initScale||1);
  if(init>1) requestAnimationFrame(()=>{ st.s=init; st.x=-(cw()*init-cw())/2; st.y=0; apply(false); });
  else apply(false);
}
function renderTab(){
  if(state.view?.name==="docNew") return viewDocForm();
  if(state.view?.name==="docDetail") return viewDocDetail(state.view.id);
  if(state.view?.name==="partyLedger") return viewPartyLedger(state.view.id);
  switch(state.tab){
    case "dashboard": return viewDashboard();
    case "transactions": return viewTransactions();
    case "items": return viewItems();
    case "parties": return viewParties();
    case "more": return viewMore();
    case "expenses": return viewExpenses();
    case "reports": return viewReports();
    default: return viewDashboard();
  }
}
function topbar(eyebrow, title, actionHtml){
  return `<div class="topbar"><div><div class="eyebrow">${esc(eyebrow)}</div><h1 class="serif">${esc(title)}</h1></div>${actionHtml||""}</div>`;
}

    </div>${right||""}</div>`;
}

function docRow(d){
  const meta = DOC_META[d.docType];
  const av = avatarFor(partyName(d.partyId));
  return `<div class="list-row" data-action="open-doc" data-id="${d.id}">
    <div class="avatar" style="background:${av.bg};color:${av.fg};">${esc(partyName(d.partyId).slice(0,1).toUpperCase())}</div>
    <div style="flex:1;min-width:0;">
      <div class="row-title" style="display:flex;align-items:center;gap:6px;">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(partyName(d.partyId))}</span>
      </div>
      <div class="row-sub"><span class="tag">${esc(meta.label)}</span> ${esc(d.number)} · ${esc(d.date)}</div>
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <div class="row-amt mono">${fmt0(d.total)}</div>
      ${meta.financial ? `<span class="pill ${d.status}">${d.status}</span>` : `<span class="pill na">${meta.group}</span>`}
    </div>
  </div>`;
}
function installBanner(){
  if(!window.__canInstall || localStorage.getItem("install-dismissed")) return "";
  return `<div class="card" style="background:var(--navy);color:#fff;border:none;display:flex;align-items:center;gap:10px;">
    <span style="flex:1;font-size:12.5px;">Install this app on your home screen for one-tap access.</span>

    <button data-action="dismiss-install" style="background:none;border:none;color:rgba(255,255,255,.6);font-size:16px;">✕</button>

}

  const {docs} = computed();
  const sub = state.txSubTab;
  const q = (state.search.tx||"").toLowerCase();
  const list = docs.filter(d=>DOC_META[d.docType].group===sub)
    .filter(d=>(d.number+partyName(d.partyId)).toLowerCase().includes(q))
    .sort((a,b)=>a.date<b.date?1:-1);
  return `
  ${topbar("Billing","Transactions", `<button class="fab-inline" data-action="open-modal" data-modal="tx-picker">${ICONS.plus}New</button>`)}

    <div class="tabs2" style="margin-top:14px;">
      <button class="${sub==='sales'?'active':''}" data-action="tx-subtab" data-sub="sales">Sales</button>

}

function viewPartyLedger(partyId){
  const p = party(partyId);
  if(!p) return backTopbar("Party")+`<div class="content"><div class="empty">Party not found.</div></div>`;
  const bal = partyBalance(partyId);
  const items = [
    ...state.data.docs.filter(d=>d.partyId===partyId && DOC_META[d.docType]?.financial).map(d=>({...d,...computeDocTotals(d),kind:"doc"})),
    ...state.data.payments.filter(pay=>pay.partyId===partyId).map(pay=>({...pay,kind:"payment"})),
  ].sort((a,b)=>a.date<b.date?-1:1);
  let running=0;
  const rows = items.map(it=>{
    if(it.kind==="doc"){ running += DOC_META[it.docType].ledgerSign*(it.total-(it.paidAmount||0)); }
    else { running -= (it.dir===-1?-1:1)*Number(it.unallocated!=null ? it.unallocated : it.amount||0); }
    return {...it, running};
  }).reverse();
  return `
  ${backTopbar(p.name, `<button class="icon-btn" data-action="open-modal" data-modal="party" data-id="${p.id}">${ICONS.edit}</button>`)}
  <div class="content">
    <div class="card">
      <div style="font-size:11.5px;color:var(--slate);line-height:1.6;">
        ${p.phone?`${esc(p.phone)}<br/>`:""}
        ${p.gstin?`GSTIN ${esc(p.gstin)}${p.panNumber?' · PAN '+esc(p.panNumber):''}<br/>`:(p.panNumber?`PAN ${esc(p.panNumber)}<br/>`:"")}
        ${(p.addrStreet||p.addrCity||p.state)?`${esc([p.addrStreet,p.addrCity,p.state,p.addrPincode].filter(Boolean).join(', '))}`:""}
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <div class="field-label">Current balance</div>
      <div class="stat-value" style="font-size:24px;color:${bal===0?'var(--ink)':bal>0?'var(--rust)':'var(--green)'};">${fmt0(Math.abs(bal))}</div>
      <div style="font-size:11.5px;color:var(--slate);">${bal===0?'Settled up':bal>0?(p.type==='supplier'?'You owe':'They owe you'):'Advance / overpaid'}</div>
      ${p.creditLimit && bal>Number(p.creditLimit) ? `<div style="margin-top:8px;font-size:11.5px;color:var(--rust);display:flex;align-items:center;justify-content:center;gap:5px;">${ICONS.alert} Over credit limit of ${fmt0(p.creditLimit)}</div>`:""}
      <div class="btn-row">
        <button class="btn ${p.type==='customer'?'accent':'ghost'}" data-action="open-modal" data-modal="payment" data-ptype="in" data-id="${p.id}">Received Payment</button>
        <button class="btn ${p.type==='supplier'?'accent':'ghost'}" data-action="open-modal" data-modal="payment" data-ptype="out" data-id="${p.id}">Payment Out</button>
      </div>
    </div>
    <div class="section-title">Statement</div>
    ${rows.length===0 ? `<div class="empty">No transactions with this party yet.</div>` :
      `<div class="card">${rows.map(r=>{
        if(r.kind==="payment"){
          const rev = r.dir===-1, adj = Number(r.amount||0)-Number(r.unallocated??r.amount??0);
          return `<div class="ledger-item"><div><div class="row-title" style="font-weight:600;">${rev?'Refund':'Payment'} ${r.mode?('· '+esc(r.mode)):''}</div><div class="row-sub">${esc(formatDateDMY(r.date))}${r.note?' · '+esc(r.note):''}${adj>0.004?` · ${fmt0(adj)} adjusted in bills`:''}</div></div>
            <div style="display:flex;align-items:center;gap:8px;"><div style="text-align:right;"><div class="mono" style="color:${rev?'var(--rust)':'var(--green)'};">${rev?'+':'-'}${fmt0(r.amount)}</div><div class="row-sub mono">${fmt0(r.running)}</div></div>
            <button class="icon-btn" style="width:28px;height:28px;" data-action="delete-payment" data-id="${r.id}" aria-label="Delete payment">${ICONS.trash}</button></div></div>`;
        }
        const meta = DOC_META[r.docType];
        return `<div class="ledger-item" data-action="open-doc" data-id="${r.id}"><div><div class="row-title"><span class="tag">${esc(meta.label)}</span></div><div class="row-sub">${esc(r.number)} · ${esc(formatDateDMY(r.date))}${Number(r.paidAmount||0)>0.004?` · paid ${fmt0(r.paidAmount)}`:''}</div></div>
          <div style="text-align:right;"><div class="mono">${meta.ledgerSign<0?'-':''}${fmt0(r.total)}</div><div class="row-sub mono">${fmt0(r.running)}</div></div></div>`;
      }).join("")}</div>`}
  </div>`;
}

// ---------------- document form ----------------
function nextDocNumber(docType){
  const meta = DOC_META[docType];
  const prefix = {invoice:"INV",quotation:"QUO",challan:"DC",proforma:"PI",sales_return:"SR",credit_note:"CN",purchase:"PUR",purchase_return:"PR",debit_note:"DN"}[docType]||"DOC";
  const re = new RegExp("^"+prefix+"-(\\d+)$");
  const n = state.data.docs.filter(d=>d.docType===docType)
    .reduce((m,d)=>{ const x=re.exec(String(d.number||"").trim()); return x ? Math.max(m, Number(x[1])) : m; }, 0) + 1;
  return `${prefix}-${String(n).padStart(4,"0")}`;
}
function ensureDraft(docType){
  if(!state.docDraft || (docType && state.docDraft.docType!==docType)){
    const dt = docType || "invoice";
    state.docDraft = {
      docType: dt, number: nextDocNumber(dt), date: todayISO(), dueDate:"", partyId:"",
      items:[], extraDiscount:0, deliveryCharge:0, paidAmount:0, notes:"", itemQ:"",
      agent:"", ewayBillNo:"", transportName:"", lrNumber:"", lrDate:"", parcels:""
    };
  }
  return state.docDraft;
}
function startEditDoc(docId){
  const doc = state.data.docs.find(d=>d.id===docId);
  if(!doc) return;
  state.docDraft = {
    _editingId: doc.id, legacyExtraDisc: doc.legacyExtraDisc,
    docType: doc.docType, number: doc.number, date: doc.date, dueDate: doc.dueDate||"",
    partyId: doc.partyId||"", items: doc.items.map(l=>({...l})),
    extraDiscount: doc.extraDiscount||0, deliveryCharge: doc.deliveryCharge||0,
    paidAmount: doc.paidAmount||0, notes: doc.notes||"", itemQ:"",
    agent: doc.agent||"", ewayBillNo: doc.ewayBillNo||"", transportName: doc.transportName||"",
    lrNumber: doc.lrNumber||"", lrDate: doc.lrDate||"", parcels: doc.parcels||""
  };
  state.view = {name:"docNew"};
  render(); mountNav(); window.scrollTo(0,0);
}

// Renders the theme's background (pattern or uploaded photo) as its own absolutely-positioned
// layer behind the content, rather than fighting the card's own background/border styling.
// Used identically by every template style so background visibility can never depend on which
// style is active.
function backgroundLayerHTML(theme){
  if(!theme.backgroundUrl) return "";
  const style = backgroundStyleString(theme);
  return `<div style="position:absolute;inset:0;${style};pointer-events:none;border-radius:inherit;z-index:0;"></div>`;
}
// Returns just the background-* CSS declarations for a theme, so callers can either drop them
// straight onto an element (formal template) or wrap them in a
// separate absolutely-positioned overlay div (simple/luxury/stylish, layered under the content).
// How much white is laid over a photo background so text stays readable (0 = photo at full
// strength, 0.9 = barely visible). Set from the "Background strength" slider in Theme & Color.
function bgWashFor(theme){ const v = Number(theme && theme.bgWash); return isFinite(v) && theme.bgWash!==undefined && theme.bgWash!==null ? Math.min(0.9, Math.max(0, v)) : 0.35; }
function safeCssUrl(u){ u=String(u||""); if(!/^(data:image\/|https?:|blob:)/i.test(u)) return ""; return u.replace(/["'()\\<>\s]/g, c=>encodeURIComponent(c)); }
function backgroundStyleString(theme){
  if(!theme.backgroundUrl) return "";
  theme = {...theme, backgroundUrl: safeCssUrl(theme.backgroundUrl)};
  if(!theme.backgroundUrl) return "";
  if(theme.backgroundMode==="pattern"){
    return `background-image:url('${theme.backgroundUrl}');background-repeat:repeat;background-size:200px 200px;`;
  }
  // Photos: a lighter wash than before (was 0.86, then 0.68) so the image actually reads —
  // if it still looks faint, the photo itself may already be pre-lightened before upload.
  const w = bgWashFor(theme);
  return `background-image:linear-gradient(rgba(255,255,255,${w}),rgba(255,255,255,${w})),url('${theme.backgroundUrl}');background-size:cover;background-position:center;`;
}

// Self-contained encoder (no network libraries) used for the UPI payment QR on invoices.
const QR = (() => {

  const dataCodewords = v => Math.floor(rawModules(v)/8) - ECC_PER_BLOCK[v]*NUM_BLOCKS[v];
  const gfMul = (x,y) => { let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z & 0xFF; };
  const rsDivisor = deg => { const r=new Array(deg).fill(0); r[deg-1]=1; let root=1;
    for(let i=0;i<deg;i++){ for(let j=0;j<r.length;j++){ r[j]=gfMul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; } root=gfMul(root,0x02); } return r; };
  const rsRemainder = (data, div) => { const r=div.map(()=>0);
    for(const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>{ r[i]^=gfMul(c,f); }); } return r; };
  const alignPos = v => { if(v===1) return []; const n=Math.floor(v/7)+2; const step=(v===32)?26:Math.ceil((v*4+4)/(n*2-2))*2;
    const r=[6]; for(let p=v*4+10; r.length<n; p-=step) r.splice(1,0,p); return r; };

  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for(; ver<=40; ver++){ const cc = ver<=9?8:16; if(4+cc+bytes.length*8 <= dataCodewords(ver)*8) break; }

    const bits=[]; const put=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length, ver<=9?8:16); bytes.forEach(b=>put(b,8));

    const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }
    // --- error correction + interleave
    const nb=NUM_BLOCKS[ver], ecl=ECC_PER_BLOCK[ver], raw=Math.floor(rawModules(ver)/8);
    const nShort = nb - raw%nb, shortLen = Math.floor(raw/nb), div = rsDivisor(ecl);
    const blocks=[]; for(let i=0,k=0;i<nb;i++){ const dat=data.slice(k, k+shortLen-ecl+(i<nShort?0:1)); k+=dat.length;
      const ecc=rsRemainder(dat, div); if(i<nShort) dat.push(0); blocks.push(dat.concat(ecc)); }
    const cw=[]; for(let i=0;i<blocks[0].length;i++) for(let j=0;j<blocks.length;j++) if(i!==shortLen-ecl || j>=nShort) cw.push(blocks[j][i]);
    // --- matrix
    const mod=[...Array(size)].map(()=>Array(size).fill(false)), fn=[...Array(size)].map(()=>Array(size).fill(false));
    const setF=(x,y,d)=>{ mod[y][x]=d; fn[y][x]=true; };
    for(let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)); const x=cx+dx,y=cy+dy;
      if(x>=0&&x<size&&y>=0&&y<size) setF(x,y,d!==2&&d!==4); } };

    const ap=alignPos(ver);
    ap.forEach((a,i)=>ap.forEach((b,j)=>{ if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0)) return;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) setF(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); }));

      const b=((d<<10)|r)^0x5412; const g=i=>((b>>>i)&1)!==0;

      for(let i=0;i<8;i++) setF(size-1-i,8,g(i)); for(let i=8;i<15;i++) setF(8,size-15+i,g(i)); setF(8,size-8,true); };
    drawFormat(0);
    if(ver>=7){ let r=ver; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); const b=(ver<<12)|r;
      for(let i=0;i<18;i++){ const bit=((b>>>i)&1)!==0, a=size-11+i%3, c=Math.floor(i/3); setF(a,c,bit); setF(c,a,bit); } }

    for(let right=size-1; right>=1; right-=2){ if(right===6) right=5;
      for(let v=0; v<size; v++) for(let j=0;j<2;j++){ const x=right-j, up=((right+1)&2)===0, y=up?size-1-v:v;
        if(!fn[y][x] && bi<cw.length*8){ mod[y][x]=((cw[bi>>>3]>>>(7-(bi&7)))&1)!==0; bi++; } } }
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{ for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!fn[y][x] && maskFn[m](x,y)) mod[y][x]=!mod[y][x]; };
    const penalty=()=>{ let p=0;
      for(let y=0;y<size;y++){ let run=1; for(let x=1;x<=size;x++){ if(x<size && mod[y][x]===mod[y][x-1]) run++; else { if(run>=5) p+=run-2; run=1; } } }
      for(let x=0;x<size;x++){ let run=1; for(let y=1;y<=size;y++){ if(y<size && mod[y][x]===mod[y-1][x]) run++; else { if(run>=5) p+=run-2; run=1; } } }
      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=mod[y][x]; if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1]) p+=3; }
      let dark=0; mod.forEach(r=>r.forEach(c=>{ if(c) dark++; })); p += Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
      return p; };
    let best=0, bestP=Infinity;
    for(let m=0;m<8;m++){ applyMask(m); drawFormat(m); const p=penalty(); if(p<bestP){ bestP=p; best=m; } applyMask(m); }
    applyMask(best); drawFormat(best);

})();

// UPI payment QR for an invoice: generated from the UPI ID in Business settings with the amount due
// filled in (customer just scans and pays), or the bank's own QR image if one was uploaded instead.
const _qrCache = {};
function paymentQrFor(biz, doc, t){
  if(!biz || !doc) return null;
  const meta = DOC_META[doc.docType] || DOC_META.invoice;
  if(meta.group!=="sales" || meta.ledgerSign<0) return null;
  const upi = String(biz.upiId||"").trim();
  if(upi && /^[\w.\-]{2,}@[\w.\-]{2,}$/.test(upi)){
    const amt = meta.financial ? (t.due>0.004 ? t.due : t.total) : t.total;
    const e = encodeURIComponent;
    const link = `upi://pay?pa=${e(upi)}&pn=${e(biz.businessName||"")}&am=${Number(amt).toFixed(2)}&cu=INR&tn=${e(doc.number||"")}`;
    if(!_qrCache[link]){ try{ _qrCache[link] = QR.toDataURL(link, 8); }catch(err){ return null; } }
    return {src:_qrCache[link], label:"Scan & pay via UPI", sub: upi, amount: amt};
  }
  if(biz.bankQrDataUrl) return {src: biz.bankQrDataUrl, label:"Scan to pay", sub: biz.upiId||"", amount:null};
  return null;
}

        ${qrBlockHTML(q, 72, v=>fmt(v))}</div>`; })()}

function renderModal(){
  const root = document.getElementById("modal-root");
  if(!state.modal){ root.innerHTML=""; return; }
  const {type,id} = state.modal;
  if(type==="zoom"){
    const doc = state.data.docs.find(d=>d.id===id);
    const pagesArr = doc && _previewCache[docPreviewKey(doc)] || [];
    const z = state.modal.scale || 2;
    root.innerHTML = `<div style="position:fixed;inset:0;z-index:70;background:#2b2b2b;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--safe-top)) 12px 10px;color:#fff;flex-shrink:0;">
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" style="width:auto;padding:7px 14px;" data-action="zoom-set" data-scale="1">Fit</button>
          <button class="btn ghost" style="width:auto;padding:7px 14px;" data-action="zoom-set" data-scale="2">2×</button>
          <button class="btn ghost" style="width:auto;padding:7px 14px;" data-action="zoom-set" data-scale="3">3×</button>
        </div>
        <button class="sheet-close" data-action="close-modal">✕</button>
      </div>
      <div class="pz" data-pz="full" data-init-scale="${z}" style="flex:1;position:relative;overflow:hidden;touch-action:none;margin:0 10px 12px;">
        <div class="pz-content" style="transform-origin:0 0;will-change:transform;">
        ${pagesArr.map(src=>`<img src="${src}" alt="" draggable="false" style="display:block;width:100%;height:auto;background:#fff;margin:0 0 10px;-webkit-user-drag:none;user-select:none;"/>`).join("")}
        </div></div>
      <div style="text-align:center;color:#bbb;font-size:11px;padding:0 0 calc(10px + env(safe-area-inset-bottom));">Pinch to zoom · drag to move · double-tap to zoom in/out</div></div>`;
    setTimeout(()=>{ const el=root.querySelector('.pz'); if(el) attachPinchZoom(el); }, 0);
    return;
  }
  let inner="", full=false;
  if(type==="item"){ inner = modalItem(id); full = true; }
  if(type==="party"){ inner = modalParty(id); full = true; }
  if(type==="expense") inner = modalExpense(id);
  if(type==="profile") inner = modalProfile();
  if(type==="backup") inner = modalBackup();
  if(type==="theme"){ inner = modalTheme(); full = true; }
  if(type==="doc-output") inner = modalDocOutput();
  if(type==="tx-picker") inner = modalTxPicker();
  if(type==="payment") inner = modalPayment(state.modal.ptype, id);
  if(type==="party-picker"){ inner = modalPartyPicker(); full=true; }
  if(type==="barcode") inner = modalBarcode();
  if(type==="confirm-delete-party") inner = modalConfirmDeleteParty();
  root.innerHTML = `<div class="sheet-overlay" data-action="close-modal">
    <div class="sheet ${full?'full':''}">${inner}</div></div>`;
  if(type==="barcode"){
    requestAnimationFrame(()=>{
      const canvas = document.getElementById("barcode-canvas");
      const code = state.itemDraft?.itemCode||"";
      if(canvas && /^\d{13}$/.test(code)) drawBarcodeOnCanvas(canvas, code);
    });
  }
}

    const item = id ? state.data.items.find(i=>i.id===id) : null;
    state.itemDraft = item ? {..._structuredCloneItem(item), _id:id, partyPrices: {...(item.partyPrices||{})} } : {
      _id:"_new", name:"", hsn:"", itemType:"product", unit:"pcs", taxRate:5,

// ---------------- EAN-13 barcode: valid checksum + real rendering ----------------
const EAN_L = {0:"0001101",1:"0011001",2:"0010011",3:"0111101",4:"0100011",5:"0110001",6:"0101111",7:"0111011",8:"0110111",9:"0001011"};
const EAN_G = {0:"0100111",1:"0110011",2:"0011011",3:"0100001",4:"0011101",5:"0111001",6:"0000101",7:"0010001",8:"0001001",9:"0010111"};
const EAN_R = {0:"1110010",1:"1100110",2:"1101100",3:"1000010",4:"1011100",5:"1001110",6:"1010000",7:"1000100",8:"1001000",9:"1110100"};
const EAN_PARITY = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function ean13CheckDigit(base12){
  let sum = 0;
  for(let i=0;i<12;i++){ const d=Number(base12[i]); sum += (i%2===0) ? d : d*3; }
  return (10-(sum%10))%10;
}
function ean13Bits(code13){
  const parity = EAN_PARITY[Number(code13[0])];
  let bits = "101";
  for(let i=1;i<=6;i++){ const d=Number(code13[i]); bits += (parity[i-1]==="L" ? EAN_L[d] : EAN_G[d]); }
  bits += "01010";
  for(let i=7;i<=12;i++){ bits += EAN_R[Number(code13[i])]; }
  bits += "101";
  return bits;
}
function drawBarcodeOnCanvas(canvas, code13){
  const bits = ean13Bits(code13);
  const barW=3, barH=100, marginX=20, textH=26;
  canvas.width = bits.length*barW + marginX*2;
  canvas.height = barH+textH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#000";
  let x=marginX;
  for(const b of bits){ if(b==="1") ctx.fillRect(x,8,barW,barH); x+=barW; }
  ctx.font="16px monospace";
  ctx.textAlign="center";
  ctx.fillText(code13, canvas.width/2, barH+22);
}

// ---------------- barcode camera scanner ----------------
let _scannerStream = null;
let _scannerTimer = null;

function openScanner(targetInputId){
  syncItemDraftFromDOM();
  state.scannerTarget = targetInputId;
  state.scannerOpen = true;
  state.scannerError = null;
  render();
  requestAnimationFrame(startScannerCamera);
}

async function startScannerCamera(){
  const video = document.getElementById("scanner-video");
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.scannerError = "unsupported"; render(); return;
  }
  try{
    _scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = _scannerStream;
    await video.play();
  }catch(e){
    state.scannerError = "denied"; render(); return;
  }
  if("BarcodeDetector" in window){
    let detector;
    try{ detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"] }); }
    catch(e){ state.scannerError = "unsupported"; render(); return; }
    _scannerTimer = setInterval(async ()=>{
      if(!video.videoWidth) return;
      try{
        const codes = await detector.detect(video);
        if(codes && codes.length>0) onScanDetected(codes[0].rawValue);
      }catch(e){ /* transient detection error, keep trying */ }
    }, 350);
  } else {
    state.scannerError = "unsupported";
    render();
  }
}

function onScanDetected(value){
  const targetId = state.scannerTarget;
  closeScanner();
  if(targetId==="f-itemcode" && state.itemDraft) state.itemDraft.itemCode = value;
  render(); mountNav();
  toast("Scanned: "+value);
}

function submitManualScan(){
  const el = document.getElementById("scanner-manual");
  const v = (el?.value||"").trim();
  if(!v){ toast("Type a code first"); return; }
  onScanDetected(v);
}

function closeScanner(){
  if(_scannerTimer){ clearInterval(_scannerTimer); _scannerTimer=null; }
  if(_scannerStream){ _scannerStream.getTracks().forEach(tr=>tr.stop()); _scannerStream=null; }
  state.scannerOpen = false;
  state.scannerError = null;
  render();
}

function renderScanner(){
  const root = document.getElementById("scanner-root");
  if(!root) return;
  if(!state.scannerOpen){ root.innerHTML=""; return; }
  root.innerHTML = `
  <div style="position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--safe-top)) 16px 12px;flex-shrink:0;">
      <span style="color:#fff;font-size:14px;font-weight:600;">Scan barcode</span>
      <button onclick="closeScanner()" style="width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:15px;">✕</button>
    </div>
    <div style="flex:1;position:relative;overflow:hidden;background:#111;">
      <video id="scanner-video" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;display:block;"></video>
      ${!state.scannerError ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
        <div style="width:76%;max-width:320px;aspect-ratio:2/1;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 1000px rgba(0,0,0,0.4);"></div>
      </div>
      <div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:12px;">Point the camera at a barcode</div>` : ""}
      ${state.scannerError==="denied"?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff;font-size:13px;background:rgba(0,0,0,.75);">Camera access was denied. Allow the camera permission for this site in your browser settings, or type the code below.</div>`:""}
      ${state.scannerError==="unsupported"?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff;font-size:13px;background:rgba(0,0,0,.75);">In-app barcode scanning needs Chrome on Android. Type the code below instead — it works everywhere.</div>`:""}
    </div>
    <div style="padding:16px;padding-bottom:calc(16px + var(--safe-bottom));background:#111;flex-shrink:0;">
      <div style="display:flex;gap:8px;">
        <input id="scanner-manual" placeholder="Or type the code manually" style="flex:1;" onkeydown="if(event.key==='Enter')submitManualScan()"/>

      </div>
    </div>
  </div>`;
}

// ---------------------------------------------------------------------------------------------
// Invoice output: every Print / Download / Share goes through ONE pipeline, with no external
// libraries (nothing to fail to load from a CDN, works offline):
//   1. build each copy as a real A4 page (794 x 1123 CSS px = 210 x 297 mm), full bleed,
//      background covering the whole page, totals pinned to the bottom;
//   2. rasterise that page at high resolution (SVG foreignObject -> canvas), so the logo and
//      text stay sharp;
//   3. wrap the page images in a small hand-written PDF (A4 pages) — or, for Print, place the
//      same images into the print area so the phone's print dialog gets exactly the PDF look.
// ---------------------------------------------------------------------------------------------
const A4_W = 794, A4_H = 1123, RENDER_SCALE = 2.6;
const COPY_LABELS = {
  ORIGINAL:"ORIGINAL FOR RECIPIENT",
  DUPLICATE:"DUPLICATE FOR TRANSPORTER",
  TRIPLICATE:"TRIPLICATE FOR SUPPLIER",
};
function docNeedsCopies(doc){ const m = doc && DOC_META[doc.docType]; return !!(m && m.financial && m.group==="sales"); }
function copyLabelsFor(doc, choice){
  if(!docNeedsCopies(doc)) return [null];
  if(choice==="ALL") return [COPY_LABELS.ORIGINAL, COPY_LABELS.DUPLICATE, COPY_LABELS.TRIPLICATE];
  return [COPY_LABELS[choice] || COPY_LABELS.ORIGINAL];
}
function buildBillHTMLForDoc(docId, copyLabel, opts){
  const doc = state.data.docs.find(d=>d.id===docId);
  if(!doc) return "";
  const t = computeDocTotals(doc);
  const p = party(doc.partyId);
  const biz = state.data.profile;
  let theme = biz?.invoiceTheme || DEFAULT_THEME;
  if(opts && opts.noBackground) theme = {...theme, backgroundUrl:null};
  return billCardHTML(theme, biz, p, t.meta, doc.number, doc.date, t, doc, copyLabel, opts && opts.pg);
}
function waitForImages(root){
  const imgs = Array.from(root.querySelectorAll("img"));
  return Promise.all(imgs.map(img => img.complete && img.naturalWidth ? Promise.resolve()
    : new Promise(res => { img.onload = res; img.onerror = res; })));
}
// Lays one copy out as an A4 page inside the (off-screen) print area and returns its element.
// Boxed (Textile) invoices longer than one page: every page is a complete invoice sheet — full
// company / party / invoice header at the top and the terms, bank, declaration and signature at the
// bottom. Item rows are split across the pages with "Carried Forward" / "Brought Forward" totals, and
// the tax summary and Grand Total appear only on the last page so no page shows a misleading total.
async function layoutBoxedPages(docId, copyLabel, doc, theme){
  const t = computeDocTotals(doc);
  const all = t.lines;
  const host = layoutHost();
  const stack = document.createElement("div");
  stack.className = "a4-stack";
  stack.style.cssText = "position:relative;width:"+A4_W+"px;";
  host.appendChild(stack);
  const mkPage = async (pg) => {
    const el = document.createElement("div");
    el.className = "a4-page";
    el.style.height = A4_H+"px"; el.style.background = "transparent";
    el.innerHTML = buildBillHTMLForDoc(docId, copyLabel, {noBackground:true, pg});
    stack.appendChild(el);
    await waitForImages(el);
    const bill = el.querySelector(".paper-bill");
    bill.style.minHeight = "0px";
    return {el, bill};
  };
  const sums = (arr) => arr.reduce((a,l)=>({qty:a.qty+Number(l.qty||0), amt:a.amt+Number(l.gross||0)}), {qty:0, amt:0});
  const plan = [];
  let start = 0, bf = null, guard = 0;
  while(start < all.length && guard++ < 200){
    const rest = all.slice(start);
    // Does everything that is left fit on this page as the final page?
    const lastTry = await mkPage({lines:rest, start, pageNo:plan.length+1, pageCount:plan.length+1, isLast:true, bf, cf:null});
    const fitsLast = lastTry.bill.offsetHeight <= A4_H;
    lastTry.el.remove();
    if(fitsLast){ plan.push({lines:rest, start, bf, isLast:true}); start = all.length; break; }
    // Otherwise fill this page with as many rows as fit, followed by "Carried Forward".
    // Always leave at least one row for the final page (the page that carries the Grand Total).
    let k = Math.max(1, rest.length-1);
    if(rest.length===1){ plan.push({lines:rest, start, bf, isLast:true}); start = all.length; break; }
    const probe = await mkPage({lines:rest.slice(0,k), start, pageNo:plan.length+1, pageCount:plan.length+2, isLast:false, bf, cf:sums(all.slice(0,start+k))});
    const rows = [...probe.bill.querySelectorAll(".bx-items tbody tr:not(.bf-row)")];
    let over = probe.bill.offsetHeight - A4_H;
    while(k>1 && over>0){ k--; over -= rows[k].getBoundingClientRect().height; }
    probe.el.remove();
    // Confirm (row heights can shift slightly) and step back if needed.
    for(;;){
      const chk = await mkPage({lines:rest.slice(0,k), start, pageNo:plan.length+1, pageCount:plan.length+2, isLast:false, bf, cf:sums(all.slice(0,start+k))});
      const ok = chk.bill.offsetHeight <= A4_H; chk.el.remove();
      if(ok || k<=1) break; k--;
    }
    plan.push({lines:rest.slice(0,k), start, bf, isLast:false});
    start += k;
    bf = sums(all.slice(0,start));
  }
  if(plan.length===0 || !plan[plan.length-1].isLast) plan.push({lines:[], start:all.length, bf:all.length?sums(all):null, isLast:true});
  const pageCount = plan.length;
  for(let i=0;i<pageCount;i++){
    const pl = plan[i];
    const {el, bill} = await mkPage({...pl, pageNo:i+1, pageCount, cf: sums(all.slice(0, pl.start+pl.lines.length))});
    bill.style.minHeight = A4_H+"px";
    // stretch the item columns down to the footer block
    const spacer = bill.querySelector(".bill-spacer"), tbody = bill.querySelector(".bx-items tbody"), head = bill.querySelector(".bx-items thead tr");
    if(spacer && tbody && head){
      const room = spacer.getBoundingClientRect().height;
      if(room > 6){
        const cols = [...head.children].reduce((n,c)=>n+(c.colSpan||1),0);
        const f = document.createElement("tr"); f.className = "grid-filler";
        f.innerHTML = Array.from({length:cols}, ()=>`<td style="height:${Math.floor(room)}px;"></td>`).join("");
        tbody.appendChild(f);
      }
    }
    if(pageCount>1){
      const lab = document.createElement("div");
      lab.style.cssText = "position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:9.5px;color:#555;font-family:Arial,Helvetica,sans-serif;z-index:3;";
      lab.textContent = `Page ${i+1} of ${pageCount}`;
      el.appendChild(lab);
    }
  }
  await waitForImages(stack);
  return {page: stack, pages: pageCount, doc, theme};
}
async function layoutA4Page(docId, copyLabel){
  const doc = state.data.docs.find(d=>d.id===docId);
  const theme = state.data.profile?.invoiceTheme || DEFAULT_THEME;
  if(theme.style==="boxed" && doc) return layoutBoxedPages(docId, copyLabel, doc, theme);
  const area = layoutHost();
  const page = document.createElement("div");
  page.className = "a4-page";
  page.innerHTML = buildBillHTMLForDoc(docId, copyLabel, {noBackground:true});
  area.appendChild(page);
  await waitForImages(page);
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const bill = page.querySelector(".paper-bill");
  const frame = theme.style==="luxury" ? 32 : 0;          // luxury keeps a 16px inset double border
  bill.style.minHeight = (A4_H - frame) + "px";
  // Long invoices: an item row is never cut across two A4 pages. At each page break the item grid is
  // closed off with its columns running to the bottom margin, and the next page starts with a
  // "continued" line and the column headings repeated.
  const M = 26;                                   // top/bottom margin kept free at every page break
  const pageTop = page.getBoundingClientRect().top;
  const main = bill.querySelector(".bill-table");
  const headRow = main ? main.querySelector("thead tr") : null;
  const cols = headRow ? [...headRow.children].reduce((n,c)=>n+(c.colSpan||1),0) : 1;
  const numLabel = doc ? `${esc(doc.number||"")}` : "";
  const fillerRow = (h, closeBottom) => {
    const tr = document.createElement("tr"); tr.className = "grid-filler";
    tr.innerHTML = Array.from({length:cols}, ()=>`<td style="height:${Math.max(0,Math.floor(h))}px;${closeBottom?'border-bottom:1px solid var(--grid);':''}"></td>`).join("");
    return tr;
  };
  // Compact company + invoice header repeated at the top of every continuation page.
  const biz = state.data.profile || {};
  const meta_ = DOC_META[doc?.docType] || DOC_META.invoice;
  const pty = doc ? party(doc.partyId) : null;
  const tcol = theme.color || "#1A1A1A";
  const contHeader = () => `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:1px solid var(--grid);padding:7px 9px;margin-bottom:-1px;text-align:left;color:#161616;font-size:10px;line-height:1.35;font-family:Arial,Helvetica,sans-serif;">
      <div style="display:flex;gap:9px;align-items:flex-start;min-width:0;">
        ${biz.logoDataUrl?`<img src="${esc(biz.logoDataUrl)}" style="max-width:110px;height:42px;width:auto;object-fit:contain;flex-shrink:0;"/>`:""}
        <div style="min-width:0;">
          <div style="font-size:15px;font-weight:800;color:${tcol};line-height:1.15;">${esc(biz.businessName||"")}</div>
          ${biz.address?`<div>${esc(String(biz.address).replace(/\s*\n\s*/g,", "))}</div>`:""}
          <div>${biz.gstin?`GSTIN : <b>${esc(biz.gstin)}</b>`:""}${biz.phone?` &nbsp;·&nbsp; Contact : ${esc(biz.phone)}`:""}${biz.udyamNumber?` &nbsp;·&nbsp; MSME : <b>${esc(biz.udyamNumber)}</b>`:""}</div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:12px;font-weight:700;letter-spacing:.06em;color:${tcol};">${esc(meta_.printTitle||"TAX INVOICE")}</div>
        <div>No. : <b>${esc(doc?.number||"")}</b> &nbsp; Date : <b>${esc(formatDateDMY(doc?.date||""))}</b></div>
        ${pty?`<div>Party : <b>${esc(pty.name)}</b></div>`:""}
        <div style="font-size:9px;color:#555;">(continued)</div>
      </div>
    </div>`;
  const breakRows = () => {
    const gap = document.createElement("tr"); gap.className = "page-gap";
    gap.innerHTML = `<td colspan="${cols}" style="padding:0 !important;border:none !important;background:transparent !important;vertical-align:top;text-align:left;"><div style="height:${2*M}px;"></div>${contHeader()}</td>`;
    const rh = document.createElement("tr"); rh.className = "rep-head";
    rh.innerHTML = headRow ? headRow.innerHTML : "";
    return [gap, rh];
  };

      else { f.querySelectorAll("td").forEach(td=>{ td.style.height = Math.floor(E - M - top)+"px"; td.style.borderBottom="1px solid var(--grid)"; }); const [gap, rh] = breakRows(); tbody.append(gap, rh); }
      const np = Math.max(1, Math.ceil((bill.offsetHeight + frame) / A4_H - 0.001));

  bill.style.minHeight = (pages*A4_H - frame) + "px";

      const lab = document.createElement("div");
      lab.style.cssText = `position:absolute;left:0;right:0;top:${(k+1)*A4_H - 20}px;text-align:center;font-size:9.5px;color:#555;font-family:Arial,Helvetica,sans-serif;`;

      page.appendChild(lab);

// Paints the laid-out invoice DOM onto a canvas with the plain canvas drawing API: each box's

// laid it out. Colours come from the styles as written, so a phone's "dark mode for websites"
// (which recolours what the browser paints) can never turn the invoice grey/black.
function paintDom(ctx, root, bandTop, bandBottom){
  const origin = root.getBoundingClientRect();
  const range = document.createRange();
  const descentCache = {};
  const descentFor = (font, size) => {
    if(descentCache[font]===undefined){
      ctx.font = font;
      const m = ctx.measureText("Hgjy");

    }

    const shared = cs.borderCollapse==="collapse" && /^table/.test(cs.display);

      const w = parseFloat(cs["border"+side+"Width"])||0;
      const style = cs["border"+side+"Style"];
      if(!w || style==="none" || style==="hidden") continue;
      ctx.fillStyle = cs["border"+side+"Color"];
      const draw = (inset, thick) => {
        if(shared){
          if(side==="Top") ctx.fillRect(r.left-thick/2, r.top-thick/2, r.width+thick, thick);
          if(side==="Bottom") ctx.fillRect(r.left-thick/2, r.bottom-thick/2, r.width+thick, thick);
          if(side==="Left") ctx.fillRect(r.left-thick/2, r.top-thick/2, thick, r.height+thick);
          if(side==="Right") ctx.fillRect(r.right-thick/2, r.top-thick/2, thick, r.height+thick);

        if(side==="Bottom") ctx.fillRect(r.left, r.bottom-inset-thick, r.width, thick);
        if(side==="Left") ctx.fillRect(r.left+inset, r.top, thick, r.height);
        if(side==="Right") ctx.fillRect(r.right-inset-thick, r.top, thick, r.height);

    }
  };

    const descent = descentFor(font, size);
    ctx.font = font;
    ctx.fillStyle = cs.color;
    ctx.globalAlpha = a;
    ctx.textBaseline = "alphabetic";
    if("letterSpacing" in ctx) ctx.letterSpacing = (cs.letterSpacing && cs.letterSpacing!=="normal") ? cs.letterSpacing : "0px";

      const rects = range.getClientRects();
      if(!rects.length) continue;
      const r = rel(rects[0]);
      if(!visible(r.top, r.bottom)) continue;
      const word = upper ? m[0].toUpperCase() : m[0];
      const baseline = r.bottom - descent;
      ctx.fillText(word, r.left, baseline);
      if(underline) ctx.fillRect(r.left, baseline + Math.max(1, size*0.1), r.width + (m.index+m[0].length<text.length && /\s/.test(text[m.index+m[0].length]) ? size*0.28 : 0), Math.max(0.8, size*0.06));
    }
  };
  walk(root, 1);
  ctx.globalAlpha = 1;
  if("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}

// Returns one canvas per A4 page, for every requested copy, in order.
async function renderDocPagesNow(docId, choice, S){
  const doc = state.data.docs.find(d=>d.id===docId);
  const area = layoutHost();
  area.innerHTML = "";

  try{
    for(const label of copyLabelsFor(doc, choice)){
      const {page, pages, theme} = await layoutA4Page(docId, label);
      for(let i=0;i<pages;i++){
        const top = i*A4_H;

// Minimal PDF writer: one full-bleed JPEG per A4 page.
async function pagesToPdfBlob(canvases){
  const enc = new TextEncoder();

  const push = d => { const u = typeof d==="string" ? enc.encode(d) : d; chunks.push(u); length += u.length; };
  const startObj = n => { offsets[n] = length; push(`${n} 0 obj\n`); };

  for(let i=0;i<n;i++) kids.push(`${3+i*3} 0 R`);
  startObj(1); push("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  startObj(2); push(`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${n} >>\nendobj\n`);
  for(let i=0;i<n;i++){
    const pageNo = 3+i*3, imgNo = pageNo+1, contentNo = pageNo+2;
    const jpeg = await canvasToJpegBytes(canvases[i]);
    startObj(pageNo);
    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${imgNo} 0 R >> >> /Contents ${contentNo} 0 R >>\nendobj\n`);
    startObj(imgNo);
    push(`<< /Type /XObject /Subtype /Image /Width ${canvases[i].width} /Height ${canvases[i].height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
    push(jpeg);
    push("\nendstream\nendobj\n");
    const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    startObj(contentNo);
    push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);

  for(let i=1;i<=total;i++) xref += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  push(xref);
  push(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xrefAt}\n%%EOF\n`);

}

    return fallback(`${browserName()} doesn't let web apps open the share menu, so the PDF was saved to your Downloads instead. Open it from Downloads (or the Files app) and tap Share → WhatsApp. For one-tap sharing, open this app in Google Chrome.`);
  }
  if(navigator.canShare && !navigator.canShare({files:[file]})){
    return fallback(`${browserName()} can share links but not files from web apps, so the PDF was saved to your Downloads instead. Open it from Downloads and tap Share. For one-tap sharing, open this app in Google Chrome.`);
  }
  navigator.share({files:[file]}).catch(err=>{
    if(err && err.name==="AbortError") return;            // user closed the share menu
    fallback(`Sharing was blocked (${err && err.name || "error"}), so the PDF was saved to your Downloads instead. Open it from Downloads and tap Share.`);
  });
}
function downloadBackup(){
  const payload = { ...state.data, exportedAt: new Date().toISOString(), app: "gst-billing", version: 2 };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `gst-billing-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function handleThemeBgUpload(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxSide = 1600;
      let w = img.width, h = img.height;
      if(w>h && w>maxSide){ h = Math.round(h*maxSide/w); w = maxSide; }
      else if(h>=w && h>maxSide){ w = Math.round(w*maxSide/h); h = maxSide; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      if(!state.themeDraft) state.themeDraft = {...(state.data.profile?.invoiceTheme||DEFAULT_THEME)};
      state.themeDraft.backgroundUrl = canvas.toDataURL("image/jpeg", 0.88);
      state.themeDraft.backgroundMode = "photo";
      render();
      toast("Background ready — tap Save to keep it");
    };
    img.onerror = () => toast("Couldn't read that image");
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  inputEl.value = "";
}
function handleLogoUpload(inputEl){
