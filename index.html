function handleImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("bad file");
      const looksLikeBackup = parsed.app==="gst-billing" || Array.isArray(parsed.docs) || Array.isArray(parsed.invoices) || Array.isArray(parsed.items) || Array.isArray(parsed.parties);
      if(!looksLikeBackup) throw new Error("bad file");
      const nDocs = (parsed.docs||parsed.invoices||[]).length, nParties=(parsed.parties||[]).length, nItems=(parsed.items||[]).length;
      if(!confirm(`Replace ALL current data with this backup?\n\n${nDocs} transactions · ${nParties} parties · ${nItems} items${parsed.exportedAt?`\nBackup taken: ${String(parsed.exportedAt).slice(0,10)}`:""}`)){ inputEl.value=""; return; }
      const clean = {
        profile: parsed.profile && typeof parsed.profile==="object" ? parsed.profile : null,
        items: Array.isArray(parsed.items) ? parsed.items.filter(x=>x&&typeof x==="object") : [],
        parties: Array.isArray(parsed.parties) ? parsed.parties.filter(x=>x&&typeof x==="object") : [],
        payments: Array.isArray(parsed.payments) ? parsed.payments.filter(x=>x&&typeof x==="object") : [],
        expenses: Array.isArray(parsed.expenses) ? parsed.expenses.filter(x=>x&&typeof x==="object") : [],
      };
      if(Array.isArray(parsed.docs)) clean.docs = parsed.docs; else if(Array.isArray(parsed.invoices)) clean.invoices = parsed.invoices; else clean.docs = [];
      if(parsed.schema) clean.schema = parsed.schema;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
      state.data = loadData(); // runs the same clean-up / migrations as app start
      saveData(); state.modal = null; render(); mountNav();
      toast("Backup restored");
    }catch(err){ toast("Couldn't read that file — is it a valid backup?"); }
    inputEl.value = "";
  };
  reader.readAsText(file);
}

document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if(action==="close-modal" && t.classList.contains("sheet-overlay") && e.target.closest(".sheet")) return;

  if(action==="goto-tab"){ state.tab=t.dataset.tab; state.view=null; state.modal=null; render(); mountNav(); window.scrollTo(0,0); }
  else if(action==="back"){ state.view=null; state.docDraft=null; render(); mountNav(); }
  else if(action==="party-filter"){ state.partyFilter = state.partyFilter===t.dataset.filter ? null : t.dataset.filter; render(); mountNav(); }
  else if(action==="tx-subtab"){ state.txSubTab=t.dataset.sub; render(); mountNav(); }
  else if(action==="open-doc"){ state.view={name:"docDetail", id}; render(); mountNav(); window.scrollTo(0,0); }
  else if(action==="open-ledger"){ state.modal=null; state.view={name:"partyLedger", id}; render(); mountNav(); window.scrollTo(0,0); }
  else if(action==="start-doc"){ state.docDraft=null; ensureDraft(t.dataset.type); state.modal=null; state.view={name:"docNew"}; render(); mountNav(); }
  else if(action==="edit-doc"){ startEditDoc(id); }

  else if(action==="add-line"){
    const item = state.data.items.find(i=>i.id===id);
    const d = ensureDraft();
    const existing = d.items.find(l=>l.itemId===item.id);
    if(existing) existing.qty += 1;
    else d.items.push({itemId:item.id, name:item.name, hsn:item.hsn||"", size:item.size||"", unit:item.unit||"", qty:1, price:effectivePrice(item,d.partyId), discPercent:Number(item.discountPercent||0), taxRate:Number(item.taxRate||0), cessRate:0});
    render(); mountNav();
  }
  else if(action==="copy-line"){ const d=ensureDraft(); const i=Number(t.dataset.idx); if(d.items[i]){ d.items.splice(i+1,0,JSON.parse(JSON.stringify(d.items[i]))); toast("Line copied — edit it, then save the invoice"); render(); mountNav(); } }
  else if(action==="remove-line"){ const d=ensureDraft(); d.items.splice(Number(t.dataset.idx),1); render(); mountNav(); }

  else if(action==="pick-party"){ const d=ensureDraft(); d.partyId=id; state.modal=null; render(); mountNav(); }

  else if(action==="save-doc"){
    const d = ensureDraft();
    const meta = DOC_META[d.docType];
    // Cash sale / cash purchase (no party selected) is settled on the spot — mark it fully paid automatically.
    let autoPaid = meta.financial ? (d.partyId ? Number(d.paidAmount||0) : computeDocTotals(d).total) : 0;
    if(!String(d.number||"").trim()){ toast("Enter a document number"); return; }
    const clash = state.data.docs.find(x=>x.id!==d._editingId && x.docType===d.docType && String(x.number).trim().toLowerCase()===String(d.number).trim().toLowerCase());
    if(clash && !confirm(`${d.number} is already used by another ${meta.label}. Save anyway?`)) return;
    if(d._editingId){
      const existing = state.data.docs.find(x=>x.id===d._editingId);
      if(existing){
        const oldMeta = DOC_META[existing.docType] || meta;
        // Party changed (or became a cash sale): money from the old party's payments goes back to them as advance.
        if(existing.partyId && existing.partyId!==d.partyId && oldMeta.financial){
          const released = releaseDocPayments(existing);
          if(d.partyId) autoPaid = Math.max(0, autoPaid - released);
        }
        existing.items.forEach(line=>{
          const it = state.data.items.find(x=>x.id===line.itemId);
          if(it && it.itemType!=="service") it.stock = Number(it.stock) - oldMeta.stockSign*Number(line.qty);
        });
        existing.docType=d.docType; existing.number=d.number; existing.date=d.date; existing.dueDate=d.dueDate||"";
        existing.partyId=d.partyId; existing.items=d.items;
        existing.extraDiscount=Number(d.extraDiscount||0); existing.deliveryCharge=Number(d.deliveryCharge||0);
        existing.paidAmount = autoPaid; existing.notes=d.notes||"";
        existing.agent=d.agent||""; existing.ewayBillNo=d.ewayBillNo||""; existing.transportName=d.transportName||"";
        existing.lrNumber=d.lrNumber||""; existing.lrDate=d.lrDate||""; existing.parcels=d.parcels||"";
        existing.items.forEach(line=>{
          const it = state.data.items.find(x=>x.id===line.itemId);
          if(it && it.itemType!=="service") it.stock = Number(it.stock) + meta.stockSign*Number(line.qty);
        });
      }
      if(saveData()){
        state.docDraft=null; state.view=null; state.tab="transactions"; state.txSubTab=meta.group;
        render(); mountNav(); toast(meta.label+" updated");
      }
      return;
    }
    const doc = {
      id: genId(), docType:d.docType, number:d.number, date:d.date, dueDate:d.dueDate||"", partyId:d.partyId, items:d.items,
      extraDiscount:Number(d.extraDiscount||0), deliveryCharge:Number(d.deliveryCharge||0),
      paidAmount: autoPaid, notes:d.notes||"",
      agent:d.agent||"", ewayBillNo:d.ewayBillNo||"", transportName:d.transportName||"",
      lrNumber:d.lrNumber||"", lrDate:d.lrDate||"", parcels:d.parcels||""
    };
    state.data.docs.push(doc);
    doc.items.forEach(line=>{
      const it = state.data.items.find(x=>x.id===line.itemId);
      if(it && it.itemType!=="service") it.stock = Number(it.stock) + meta.stockSign*Number(line.qty);
    });
    if(saveData()){
      state.docDraft=null; state.view=null; state.tab="transactions"; state.txSubTab=meta.group;
      render(); mountNav(); toast(meta.label+" saved");
    }
  }
  else if(action==="pay-doc"){
    const amtEl = document.getElementById("pay-amt");
    const amt = Number(amtEl?.value||0);
    if(amt>0){
      const doc = state.data.docs.find(x=>x.id===id);
      doc.paidAmount = Number(doc.paidAmount||0)+amt;
      if(doc.partyId){
        state.data.payments.push({ id:genId(), partyId:doc.partyId, amount:amt, unallocated:0, date:todayISO(), mode:"", note:"Against "+doc.number });
      }
      if(saveData()){ render(); mountNav(); toast("Payment recorded"); }
    }
  }
  else if(action==="delete-doc"){
    const doc = state.data.docs.find(x=>x.id===id);
    if(doc && confirm(`Delete ${doc.number||"this document"}? This can't be undone.`)){
      const meta = DOC_META[doc.docType] || DOC_META.invoice;
      if(meta.financial && doc.partyId) releaseDocPayments(doc);
      doc.items.forEach(line=>{
        const it = state.data.items.find(x=>x.id===line.itemId);
        if(it && it.itemType!=="service") it.stock = Number(it.stock) - meta.stockSign*Number(line.qty);
      });
      state.data.docs = state.data.docs.filter(x=>x.id!==id);
      if(saveData()){ state.view=null; render(); mountNav(); toast("Deleted"); }
    }
  }
  else if(action==="print-doc"){ openDocOutput(id, "print"); }
  else if(action==="zoom-preview"){ const v=state.view; if(v&&v.name==="docDetail"){ state.modal={type:"zoom", id:v.id, scale:1}; render(); } }
  else if(action==="zoom-set"){ const el=document.querySelector('#modal-root .pz'); const sc=Number(t.dataset.scale)||1; if(el&&el._pzSet){ state.modal.scale=sc; el._pzSet(sc); } }
  else if(action==="download-doc" || action==="share-doc"){ openDocOutput(id, "pdf"); }
  else if(action==="doc-output-pick"){
    if(!state.modal) return;
    state.modal.choice = t.dataset.choice; state.modal.stage = "working";
    render(); startDocOutput();
  }
  else if(action==="doc-output-retry"){ if(state.modal){ state.modal.stage="working"; render(); startDocOutput(); } }
  else if(action==="doc-share-ready"){ shareReadyPdf(); }
  else if(action==="doc-download-ready"){ const o=state.output; if(o&&o.blob){ downloadBlob(o.blob, o.name); toast("PDF downloaded"); } }
  else if(action==="doc-print-now"){ window.print(); }

  else if(action==="open-modal"){ state.modal={type:t.dataset.modal, id:t.dataset.id||null, ptype:t.dataset.ptype}; state.modalCtx=t.dataset.ctx||null; render(); }
  else if(action==="close-modal"){ state.modal=null; state.themeDraft=null; state.itemDraft=null; state.partyDraft=null; state.output=null; const pa=document.getElementById("print-area"); if(pa){ pa.innerHTML=""; pa.removeAttribute("style"); } render(); }
  else if(action==="set-party-type"){ syncPartyDraftFromDOM(); state.partyDraft.type=t.dataset.t; render(); }
  else if(action==="party-tab"){ switchPartyTab(t.dataset.tab); }
  else if(action==="item-tab"){ switchItemTab(t.dataset.tab); }
  else if(action==="set-item-type"){ syncItemDraftFromDOM(); state.itemDraft.itemType=t.dataset.t; render(); }

  else if(action==="save-item"){
    syncItemDraftFromDOM();
    const d = state.itemDraft;
    const name = (d.name||"").trim();
    if(!name){ toast("Item name is required"); return; }
    const taxRate = Number(d.taxRate||0);
    const priceExGst = (val,mode) => { const n=Number(val||0); return mode==="with" ? Math.round((n/(1+taxRate/100))*100)/100 : n; };
    const f = {
      name, hsn:(d.hsn||"").trim(), itemType:d.itemType||"product", unit:d.unit||"pcs", taxRate,
      purchasePrice: priceExGst(d.purchasePrice, d.purchasePriceMode),
      sellingPrice: priceExGst(d.sellingPrice, d.sellingPriceMode),
      discountPercent: Number(d.discountPercent||0),
      stock: d.itemType==="service" ? 0 : Number(d.stock||0),
      itemCode: (d.itemCode||"").trim(),
      lowStockAlertOn: !!d.lowStockAlertOn,
      lowStockAlert: Number(d.lowStockAlert||0),
      category: (d.category||"").trim(), size: (d.size||"").trim(), description: (d.description||"").trim(),
      partyPrices: {...(d.partyPrices||{})},
    };
    let newItemId = id;
    if(id){ state.data.items = state.data.items.map(it=>it.id===id?{...it,...f}:it); }
    else { newItemId = genId(); state.data.items.push({...f, id:newItemId}); }
    if(saveData()){
      state.modal=null; state.itemDraft=null;
      if(!id && state.modalCtx==="docpicker" && state.docDraft){
        const newItem = state.data.items.find(it=>it.id===newItemId);
        const dd = state.docDraft;
        dd.items.push({itemId:newItem.id, name:newItem.name, hsn:newItem.hsn||"", size:newItem.size||"", qty:1, price:effectivePrice(newItem,dd.partyId), discPercent:Number(newItem.discountPercent||0), taxRate:Number(newItem.taxRate||0), cessRate:0});
        toast("Item created and added");
      } else { toast("Item saved"); }
      state.modalCtx=null;
      render(); mountNav();
    }
  }
  else if(action==="copy-item"){
    const src = state.data.items.find(it=>it.id===id); if(!src) return;
    const c = _structuredCloneItem(src); delete c.id;
    state.itemDraft = { purchasePriceMode:"without", sellingPriceMode:"without", asOfDate: todayISO(), ...c,
      partyPrices:{...(src.partyPrices||{})}, name: (src.name||"")+" (Copy)", _id:"_new", _copyOf:src.id, _tab:"pricing" };
    state.modal = {type:"item", id:null}; state.modalCtx=null; render();
    setTimeout(()=>{ const el=document.getElementById("f-name"); if(el){ el.focus(); el.select(); } }, 60);
  }
  else if(action==="delete-item"){ const it=state.data.items.find(x=>x.id===id); if(!it || !confirm(`Delete item "${it.name}"?`)) return; state.data.items = state.data.items.filter(it=>it.id!==id); saveData(); render(); mountNav(); }

  else if(action==="save-party"){
    syncPartyDraftFromDOM();
    const d = state.partyDraft;
    const name = (d.name||"").trim();
    if(!name){ toast("Party name is required"); return; }
    const f = {
      name, type:d.type||"customer", phone:(d.phone||"").trim(),
      gstin:(d.gstin||"").trim(), panNumber:(d.panNumber||"").trim(),
      addrStreet:(d.addrStreet||"").trim(), state:d.addrState||"", addrPincode:(d.addrPincode||"").trim(), addrCity:(d.addrCity||"").trim(),
      creditLimit: d.creditLimit===""||d.creditLimit==null ? null : Number(d.creditLimit),
      notes:(d.notes||"").trim(),
    };
    if(id){ state.data.parties = state.data.parties.map(p=>p.id===id?{...p,...f}:p); }
    else { state.data.parties.push({...f, id:genId()}); }
    if(saveData()){ state.modal=null; state.partyDraft=null; render(); mountNav(); toast("Party saved"); }
  }
  else if(action==="delete-party"){
    const p = party(id);
    if(!p) return;
    const hasHistory = state.data.docs.some(d=>d.partyId===id) || state.data.payments.some(pay=>pay.partyId===id);
    state.modal = { type:"confirm-delete-party", id, hasHistory };
    render();
  }
  else if(action==="do-delete-party"){
    state.data.parties = state.data.parties.filter(x=>x.id!==id);
    saveData(); state.modal=null; render(); mountNav(); toast("Party deleted");
  }

  else if(action==="save-expense"){
    const f = {
      id: id||undefined,
      date: document.getElementById("f-date").value,
      category: document.getElementById("f-cat").value,
      amount: Number(document.getElementById("f-amt").value||0),
      note: document.getElementById("f-note").value.trim(),
    };
    if(!f.amount){ toast("Amount is required"); return; }
    if(id){ state.data.expenses = state.data.expenses.map(e=>e.id===id?{...e,...f}:e); }
    else { state.data.expenses.push({...f, id:genId()}); }
    if(saveData()){ state.modal=null; render(); mountNav(); toast("Expense saved"); }
  }
  else if(action==="delete-payment"){ const pay=state.data.payments.find(x=>x.id===id); if(!pay || !confirm(`Delete this payment of ${fmt0(pay.amount)}?`)) return; removePayment(id); if(saveData()){ render(); mountNav(); toast("Payment deleted"); } }
  else if(action==="delete-expense"){ if(!confirm("Delete this expense?")) return; state.data.expenses = state.data.expenses.filter(e=>e.id!==id); saveData(); render(); mountNav(); }

  else if(action==="save-payment"){
    const ptype = t.dataset.ptype;
    const f = {
      id: genId(), partyId: document.getElementById("f-party").value,
      amount: Number(document.getElementById("f-pamt").value||0),
      date: document.getElementById("f-pdate").value,
      mode: document.getElementById("f-pmode").value,
      note: document.getElementById("f-pnote").value.trim(),
    };
    if(!f.partyId){ toast("Select a party"); return; }
    if(!f.amount){ toast("Enter an amount"); return; }
    if(!(f.amount>0)){ toast("Amount must be more than 0"); return; }
    const pp = party(f.partyId);
    const dir = ((ptype==="in") === (pp?.type!=="supplier")) ? 1 : -1;
    applyPaymentToParty(f.partyId, f.amount, f.date||todayISO(), f.mode, f.note, dir);
    if(saveData()){ state.modal=null; render(); mountNav(); toast(ptype==="in"?"Payment received":"Payment recorded"); }
  }

  else if(action==="save-profile"){
    const nameEl = document.getElementById("f-bname");
    const f = {
      businessName: nameEl.value.trim(),
      logoDataUrl: document.getElementById("f-logo-data").value,
      signatureDataUrl: document.getElementById("f-sig-data").value,
      jurisdiction: document.getElementById("f-jurisdiction").value.trim(),
      phone: document.getElementById("f-bphone").value.trim(),
      email: document.getElementById("f-bemail").value.trim(),
      address: document.getElementById("f-baddr").value.trim(),
      gstin: document.getElementById("f-bgstin").value.trim(),
      panNumber: document.getElementById("f-bpan").value.trim(),
      state: document.getElementById("f-bstate").value,
      industryType: document.getElementById("f-industry").value,
      businessType: document.getElementById("f-btype").value,
      bankName: document.getElementById("f-bank").value.trim(),
      bankAccountNo: document.getElementById("f-bankacc").value.trim(),
      bankIFSC: document.getElementById("f-bankifsc").value.trim(),
      upiId: document.getElementById("f-upi").value.trim().replace(/\s+/g,""),
      bankQrDataUrl: document.getElementById("f-qr-data").value,
      udyamNumber: document.getElementById("f-udyam").value.trim(),
      termsAndConditions: document.getElementById("f-terms").value,
    };
    if(!f.businessName){ nameEl.style.borderColor="var(--rust)"; nameEl.focus(); toast("Please enter a business name"); return; }
    if(f.upiId && !/^[\w.\-]{2,}@[\w.\-]{2,}$/.test(f.upiId)){ const u=document.getElementById("f-upi"); u.style.borderColor="var(--rust)"; u.focus(); toast("UPI ID looks wrong — it should be like name@bank"); return; }
    state.data.profile = {...(state.data.profile||{}), ...f};
    if(saveData()){ state.modal=null; render(); mountNav(); toast("Business details saved"); }
  }

  else if(action==="set-theme-style"){ state.themeDraft = {...(state.themeDraft||DEFAULT_THEME), style:t.dataset.style}; render(); }
  else if(action==="set-theme-color"){ state.themeDraft = {...(state.themeDraft||DEFAULT_THEME), color:t.dataset.color}; render(); }
  else if(action==="save-theme"){
    state.data.profile = {...(state.data.profile||{}), invoiceTheme: state.themeDraft||DEFAULT_THEME};
    if(saveData()){ state.modal=null; state.themeDraft=null; render(); mountNav(); toast("Theme saved"); }
  }

  else if(action==="export-data"){ downloadBackup(); toast("Backup downloaded"); }
  else if(action==="trigger-import"){ document.getElementById("import-file")?.click(); }
  else if(action==="install"){ if(window.__deferredPrompt){ window.__deferredPrompt.prompt(); } }
  else if(action==="dismiss-install"){ localStorage.setItem("install-dismissed","1"); render(); }
});

window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); window.__deferredPrompt=e; window.__canInstall=true; render(); });
window.addEventListener("appinstalled", ()=>{ window.__canInstall=false; render(); });
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("service-worker.js").catch(()=>{}); }); }


render();
mountNav();
if(!state.data.profile){ state.modal={type:"profile"}; render(); }
</script>
</body>
</html>
