// ---------------- GST reports (GSTR-1, GSTR-3B, HSN, registers) ----------------
// Everything is worked out from the saved invoices / bills for the chosen period. Section layouts and
// CSV column names follow the GST Offline Tool templates so the files can be imported there.
const r2 = v => Math.round((Number(v)||0)*100)/100;
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function gstDate(iso){ const [y,m,d]=String(iso||"").split("-"); return (y&&m&&d) ? `${d}-${MON3[Number(m)-1]}-${y}` : ""; }
function posLabel(stateName){ const c = stateCodeFor(stateName); return c ? `${c}-${stateName}` : (stateName||""); }
const UQC_MAP = { pcs:"PCS-PIECES", nos:"NOS-NUMBERS", kg:"KGS-KILOGRAMS", g:"GMS-GRAMMES", ltr:"LTR-LITRES", ml:"MLT-MILILITRE",
  box:"BOX-BOX", set:"SET-SETS", mtr:"MTR-METERS", m:"MTR-METERS", pair:"PRS-PAIRS", dozen:"DOZ-DOZENS", hr:"OTH-OTHERS" };
function uqcFor(unit){ return UQC_MAP[String(unit||"pcs").toLowerCase()] || "OTH-OTHERS"; }
function validGstin(g){ const d = decodeGSTIN(g); return !!(d.formatOk && d.stateName); }

function gstPeriodOptions(){
  const out = []; const now = new Date();
  for(let i=0;i<18;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const y = d.getFullYear(), m = d.getMonth();
    const from = `${y}-${String(m+1).padStart(2,"0")}-01`;
    const to = new Date(Date.UTC(y, m+1, 0)).toISOString().slice(0,10);
    out.push({key:`m:${from}`, label:`${MON3[m]} ${y}`, from, to});
  }
  // quarters (Apr-Jun = Q1 of the financial year)
  const fyStart = now.getMonth()>=3 ? now.getFullYear() : now.getFullYear()-1;
  const cq = Math.floor(((now.getMonth()+9)%12)/3);
  for(let k=0;k<6;k++){
    const qi = cq - k, fy = fyStart + Math.floor(qi/4), q = ((qi%4)+4)%4;
    const mm = (3 + q*3) % 12, y = fy + (q===3 ? 1 : 0);
    const from = `${y}-${String(mm+1).padStart(2,"0")}-01`;
    const to = new Date(Date.UTC(y, mm+3, 0)).toISOString().slice(0,10);
    out.push({key:`q:${from}`, label:`Q${q+1} FY ${fy}-${String((fy+1)%100).padStart(2,"0")} (${MON3[mm]}–${MON3[(mm+2)%12]} ${y})`, from, to});
  }
  for(let k=0;k<3;k++){
    const y = fyStart-k;
    out.push({key:`fy:${y}`, label:`FY ${y}-${String((y+1)%100).padStart(2,"0")} (full year)`, from:`${y}-04-01`, to:`${y+1}-03-31`});
  }
  return out;
}
function gstPeriod(){
  const opts = gstPeriodOptions();
  const g = state.gstRep || (state.gstRep = { key: opts[0].key, from: opts[0].from, to: opts[0].to, sec:"gstr1" });
  if(g.key==="custom") return {key:"custom", label:`${formatDateDMY(g.from)} – ${formatDateDMY(g.to)}`, from:g.from, to:g.to};
  return opts.find(o=>o.key===g.key) || opts[0];
}

// Core data: one row per document-line with its tax split, for the period.
function gstLines(from, to){
  const biz = state.data.profile || {};
  const bizState = biz.state || "";
  const rows = [], docs = [];
  for(const doc of state.data.docs){
    const meta = DOC_META[doc.docType]; if(!meta || !meta.financial || doc.cancelled) continue;
    if(!doc.date || doc.date < from || doc.date > to) continue;
    const t = computeDocTotals(doc);
    const p = party(doc.partyId);
    const pos = doc.pos || (p && p.state) || bizState;
    const gstin = p && validGstin(p.gstin) ? String(p.gstin).toUpperCase() : "";
    const sign = meta.ledgerSign; // +1 invoice/purchase, -1 returns/notes
    const d = { doc, meta, t, p, pos, gstin, sign, inter: !t.sameState };
    docs.push(d);
    for(const l of t.lines){
      const tax = l.taxAmt;
      rows.push({ d, hsn: String(l.hsn||"").trim(), name: l.name, unit: l.unit||"pcs", qty: Number(l.qty)||0, rate: Number(l.taxRate)||0,
        taxable: l.taxable, igst: d.inter ? tax : 0, cgst: d.inter ? 0 : tax/2, sgst: d.inter ? 0 : tax/2, cess: l.cessAmt,
        value: l.taxable + tax + l.cessAmt });
    }
  }
  return {rows, docs, bizState};
}
function groupBy(arr, keyFn, init, add){
  const m = new Map();
  for(const x of arr){ const k = keyFn(x); if(!m.has(k)) m.set(k, init(x)); add(m.get(k), x); }
  return [...m.values()];
}

function buildGstr1(from, to){
  const {rows, docs} = gstLines(from, to);
  const sales = rows.filter(r=>r.d.meta.group==="sales");
  const inv = sales.filter(r=>r.d.sign>0), cn = sales.filter(r=>r.d.sign<0);
  const B2CL_LIMIT = 100000;
  const isB2CL = d => !d.gstin && d.inter && d.t.total > B2CL_LIMIT;
  const perDocRate = (list) => groupBy(list, r=>r.d.doc.id+"|"+r.rate,
    r=>({d:r.d, rate:r.rate, taxable:0, cess:0, igst:0, cgst:0, sgst:0}),
    (a,r)=>{ a.taxable+=r.taxable; a.cess+=r.cess; a.igst+=r.igst; a.cgst+=r.cgst; a.sgst+=r.sgst; });
  const b2b  = perDocRate(inv.filter(r=>r.d.gstin));
  const b2cl = perDocRate(inv.filter(r=>isB2CL(r.d)));
  const cdnr = perDocRate(cn.filter(r=>r.d.gstin));
  const cdnur= perDocRate(cn.filter(r=>!r.d.gstin && r.d.inter && r.d.t.total > B2CL_LIMIT));
  const b2csRows = sales.filter(r=>!r.d.gstin && !(r.d.sign>0 && isB2CL(r.d)) && !(r.d.sign<0 && r.d.inter && r.d.t.total > B2CL_LIMIT));
  const b2cs = groupBy(b2csRows, r=>r.d.pos+"|"+r.rate,
    r=>({pos:r.d.pos, rate:r.rate, taxable:0, cess:0, igst:0, cgst:0, sgst:0}),
    (a,r)=>{ const s=r.d.sign; a.taxable+=s*r.taxable; a.cess+=s*r.cess; a.igst+=s*r.igst; a.cgst+=s*r.cgst; a.sgst+=s*r.sgst; })
    .filter(x=>Math.abs(x.taxable)>0.004 || Math.abs(x.cess)>0.004);
  const hsnOf = (list) => groupBy(list, r=>(r.hsn||"—")+"|"+uqcFor(r.unit)+"|"+r.rate,
    r=>({hsn:r.hsn, desc:r.name, uqc:uqcFor(r.unit), rate:r.rate, qty:0, value:0, taxable:0, igst:0, cgst:0, sgst:0, cess:0}),
    (a,r)=>{ const s=r.d.sign; a.qty+=s*r.qty; a.value+=s*r.value; a.taxable+=s*r.taxable; a.igst+=s*r.igst; a.cgst+=s*r.cgst; a.sgst+=s*r.sgst; a.cess+=s*r.cess; })
    .sort((a,b)=>String(a.hsn).localeCompare(String(b.hsn)) || a.rate-b.rate);
  const hsnB2B = hsnOf(sales.filter(r=>r.d.gstin));
  const hsnB2C = hsnOf(sales.filter(r=>!r.d.gstin));
  // Documents issued: number range per series
  const series = {};
  for(const d of docs.filter(x=>x.meta.group==="sales")){
    const nature = d.sign>0 ? "Invoices for outward supply" : "Credit Note";
    const num = String(d.doc.number||""); const m = num.match(/^(.*?)(\d+)$/);
    const pre = m ? m[1] : num; const k = nature+"|"+pre;
    const s = series[k] || (series[k] = {nature, pre, list:[]}); s.list.push({num, n: m?Number(m[2]):0});
  }
  // cancelled invoices / notes of the period are part of the number range and counted as cancelled
  for(const cd of state.data.docs){
    const cm = DOC_META[cd.docType]; if(!cd.cancelled || !cm || !cm.financial || cm.group!=="sales" || !cd.date || cd.date<from || cd.date>to) continue;
    const nature = cm.ledgerSign>0 ? "Invoices for outward supply" : "Credit Note";
    const num = String(cd.number||""); const m = num.match(/^(.*?)(\d+)$/);
    const pre = m ? m[1] : num; const k = nature+"|"+pre;
    const s = series[k] || (series[k] = {nature, pre, list:[]}); s.list.push({num, n: m?Number(m[2]):0, cancelled:true});
  }
  const docsIssued = Object.values(series).map(s=>{ s.list.sort((a,b)=>a.n-b.n); return {nature:s.nature, from:s.list[0].num, to:s.list[s.list.length-1].num, total:s.list.length, cancelled:s.list.filter(x=>x.cancelled).length}; });
  // Warnings that would make the return wrong
  const warn = [];
  const noHsn = sales.filter(r=>!r.hsn).length; if(noHsn) warn.push(`${noHsn} sales line(s) have no HSN code — add HSN on the item so the HSN summary is complete.`);
  const badG = new Set(docs.filter(d=>d.meta.group==="sales" && d.p && d.p.gstin && !d.gstin).map(d=>d.p.name));
  if(badG.size) warn.push(`GSTIN looks invalid for: ${[...badG].join(", ")} — their bills are treated as B2C.`);
  const noState = new Set(docs.filter(d=>d.p && !d.p.state).map(d=>d.p.name));
  if(noState.size) warn.push(`No state set for: ${[...noState].join(", ")} — place of supply assumed to be your state.`);
  const tot = (list, s=1) => list.reduce((a,r)=>({taxable:a.taxable+s*r.taxable, igst:a.igst+s*r.igst, cgst:a.cgst+s*r.cgst, sgst:a.sgst+s*r.sgst, cess:a.cess+s*r.cess}), {taxable:0,igst:0,cgst:0,sgst:0,cess:0});
  return { b2b, b2cl, b2cs, cdnr, cdnur, hsnB2B, hsnB2C, docsIssued, warn,
    totals: { b2b: tot(b2b), b2cl: tot(b2cl), b2cs: tot(b2cs), cdnr: tot(cdnr), cdnur: tot(cdnur),
      invCount: new Set(inv.map(r=>r.d.doc.id)).size, cnCount: new Set(cn.map(r=>r.d.doc.id)).size } };
}

function buildGstr3b(from, to){
  const {rows} = gstLines(from, to);
  const sales = rows.filter(r=>r.d.meta.group==="sales"), purch = rows.filter(r=>r.d.meta.group==="purchase");
  const sum = (list, pred) => list.filter(pred).reduce((a,r)=>{ const s=r.d.sign; a.taxable+=s*r.taxable; a.igst+=s*r.igst; a.cgst+=s*r.cgst; a.sgst+=s*r.sgst; a.cess+=s*r.cess; return a; }, {taxable:0,igst:0,cgst:0,sgst:0,cess:0});
  const out31a = sum(sales, r=>r.rate>0);
  const out31c = sum(sales, r=>r.rate===0);
  const itc = sum(purch, ()=>true);
  const unreg = groupBy(sales.filter(r=>!r.d.gstin && r.d.inter), r=>r.d.pos, r=>({pos:r.d.pos, taxable:0, igst:0}),
    (a,r)=>{ a.taxable+=r.d.sign*r.taxable; a.igst+=r.d.sign*r.igst; }).filter(x=>Math.abs(x.taxable)>0.004);
  // Set-off of ITC against output tax (IGST credit first, then CGST, then SGST — Sec 49 / Rule 88A)
  const pay = {i:Math.max(0,out31a.igst), c:Math.max(0,out31a.cgst), s:Math.max(0,out31a.sgst)};
  const cr  = {i:Math.max(0,itc.igst), c:Math.max(0,itc.cgst), s:Math.max(0,itc.sgst)};
  const used = {ii:0, ic:0, is:0, cc:0, ci:0, ss:0, si:0};
  const take = (from_, to_, k) => { const x = Math.min(cr[from_], pay[to_]); cr[from_]-=x; pay[to_]-=x; used[k]+=x; };
  take("i","i","ii"); take("i","c","ic"); take("i","s","is");
  take("c","c","cc"); take("c","i","ci");
  take("s","s","ss"); take("s","i","si");
  const cessPay = Math.max(0, out31a.cess - Math.max(0,itc.cess));
  return { out31a, out31c, itc, unreg, used, cash: {igst:pay.i, cgst:pay.c, sgst:pay.s, cess:cessPay},
    carry: {igst:cr.i, cgst:cr.c, sgst:cr.s, cess: Math.max(0, itc.cess - out31a.cess)} };
}

function registerRows(group, from, to){
  const {docs} = gstLines(from, to);
  return docs.filter(d=>d.meta.group===group).sort((a,b)=>a.doc.date<b.doc.date?-1:a.doc.date>b.doc.date?1:0).map(d=>{
    const s = d.sign, t = d.t;
    return { date:d.doc.date, number:d.doc.number, type:d.meta.label, party: d.p ? d.p.name : (group==="sales"?"Cash Sale":"Cash Purchase"),
      gstin: d.gstin, pos: d.pos, taxable: s*t.taxableTotal, igst: s*t.igst, cgst: s*t.cgst, sgst: s*t.sgst, cess: s*t.cessTotal, total: s*t.total };
  });
}

// ---- CSV / ZIP export
function csvOf(header, rows){
  const q = v => { const x = (typeof v==="number") ? String(r2(v)) : String(v??""); return /[",\n]/.test(x) ? `"${x.replace(/"/g,'""')}"` : x; };
  return [header, ...rows].map(r=>r.map(q).join(",")).join("\r\n") + "\r\n";
}

    g.cdnr.map(x=>[x.d.gstin, x.d.p?.name||"", x.d.doc.number, gstDate(x.d.doc.date), "C", posLabel(x.d.pos), "N", "Regular B2B", x.d.t.total, "", x.rate, x.taxable, x.cess]));
  files["cdnur.csv"] = csvOf(["UR Type","Note Number","Note Date","Note Type","Place Of Supply","Note Value","Applicable % of Tax Rate","Rate","Taxable Value","Cess Amount"],

  const hsnHead = ["HSN","Description","UQC","Total Quantity","Total Value","Rate","Taxable Value","Integrated Tax Amount","Central Tax Amount","State/UT Tax Amount","Cess Amount"];
  const hsnRow = x=>[x.hsn, x.desc, x.uqc, x.qty, x.value, x.rate, x.taxable, x.igst, x.cgst, x.sgst, x.cess];

  return files;

function registerCsv(list){

function gstr3bCsv(b){
  const R = (k,o)=>[k, o.taxable??"", o.igst, o.cgst, o.sgst, o.cess];
  const rows = [
    ["3.1 Details of outward supplies","Taxable Value","Integrated Tax","Central Tax","State/UT Tax","Cess"],
    R("(a) Outward taxable supplies (other than zero rated, nil rated and exempted)", b.out31a),
    R("(c) Other outward supplies (nil rated, exempted)", b.out31c),

    ...b.unreg.map(u=>["", posLabel(u.pos), u.taxable, u.igst]),
    [], ["4. Eligible ITC","","Integrated Tax","Central Tax","State/UT Tax","Cess"],
    ["(A)(5) All other ITC (from purchase bills, net of returns)","", b.itc.igst, b.itc.cgst, b.itc.sgst, b.itc.cess],
    [], ["6.1 Payment of tax","","Integrated Tax","Central Tax","State/UT Tax","Cess"],
    ["Tax payable","", b.out31a.igst, b.out31a.cgst, b.out31a.sgst, b.out31a.cess],

const _crcTable = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(bytes){ let c=0xFFFFFFFF; for(let i=0;i<bytes.length;i++) c = _crcTable[(c^bytes[i])&0xFF] ^ (c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipBlob(files){ // store-only ZIP (no compression) — opens everywhere
  const enc = new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  const u16 = v=>[v&255,(v>>>8)&255], u32 = v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const [name, text] of Object.entries(files)){
    const data = enc.encode("﻿"+text), nm = enc.encode(name), crc = crc32(data);
    const local = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0)]);
    parts.push(local, nm, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), nm);
    offset += local.length + nm.length + data.length;
  }
  const cdSize = central.reduce((s,p)=>s+p.length,0), n = Object.keys(files).length;
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(n), ...u16(n), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...parts, ...central, end], {type:"application/zip"});
}
function gstFileTag(){ const p = gstPeriod(); return (state.data.profile?.gstin||"GST") + "_" + p.from.replace(/-/g,"") + "-" + p.to.replace(/-/g,""); }
function downloadText(name, text, type){ downloadBlob(new Blob(["﻿"+text], {type: type||"text/csv;charset=utf-8"}), name); }

function rptRangeOptions(){

  const lm = new Date(Date.UTC(y, m-2, 1)), lmS = lm.toISOString().slice(0,10), lmE = new Date(Date.UTC(y, m-1, 0)).toISOString().slice(0,10);
  const fy = m>=4 ? y : y-1;
  const wk = new Date(Date.UTC(y, m-1, Number(t.slice(8,10))-6)).toISOString().slice(0,10);
  return [
    {key:"today", label:"Today", from:t, to:t},
    {key:"week", label:"Last 7 days", from:wk, to:t},
    {key:"month", label:"This month", from:mStart, to:t},
    {key:"lastmonth", label:"Last month", from:lmS, to:lmE},

    {key:"lastfy", label:`Last FY (${fy-1}-${String(fy%100).padStart(2,"0")})`, from:`${fy-1}-04-01`, to:`${fy}-03-31`},
    {key:"all", label:"All time", from:"1900-01-01", to:"2999-12-31"},

}
function rptState(){

    state.rpt = {id:null, key: custom || rptRangeOptions().some(o=>o.key===k) ? k : "month", ptype:_prefs.rptPtype||undefined, ttype:_prefs.rptTtype||undefined};
    if(custom){ state.rpt.from = _prefs.rptFrom; state.rpt.to = _prefs.rptTo; } }

const inRng = (d, r) => d && d >= r.from && d <= r.to;

// ---- cost basis for profit: item purchase price, else average rate on your purchase bills
function avgPurchaseRate(itemId){
  let q=0, v=0;
  for(const d of liveDocs()){ if(d.docType!=="purchase") continue; const t = computeDocTotals(d);
    t.lines.forEach(l=>{ if(l.itemId===itemId && l.qty>0){ q+=l.qty; v+=l.taxable; } }); }
  return q>0 ? v/q : 0;
}
const _costCache = {v:null};
function unitCostFor(itemId){
  if(!itemId) return 0;
  if(!_costCache.v) _costCache.v = {};
  if(_costCache.v[itemId]!=null) return _costCache.v[itemId];
  const it = state.data.items.find(x=>x.id===itemId);
  const c = it && Number(it.purchasePrice)>0 ? Number(it.purchasePrice) : avgPurchaseRate(itemId);
  return (_costCache.v[itemId] = c);
}
function docCost(t){ let c=0, unknown=0; t.lines.forEach(l=>{ const u = unitCostFor(l.itemId); if(u>0) c += u*l.qty; else unknown++; }); return {cost:c, unknown}; }

// ---- money actually received / paid when the bill was made (not through a payment entry)
function directPaidMap(){
  const map = {}; // docId -> amount paid at billing
  const allocByDoc = {}, noteByDoc = {}, legacy = {};
  for(const p of state.data.payments){
    if(Array.isArray(p.alloc)) p.alloc.forEach(a=>{ allocByDoc[a.docId]=(allocByDoc[a.docId]||0)+Number(a.amt||0); });   // both directions (v54)
    else if(p.dir!==-1) legacy[p.partyId] = (legacy[p.partyId]||0) + Math.max(0, Number(p.amount||0) - Number(p.unallocated||0));
  }
  for(const n of liveDocs()) (n.adjust||[]).forEach(a=>{ noteByDoc[a.docId]=(noteByDoc[a.docId]||0)+Number(a.amt||0); });
  const docs = liveDocs().filter(d=>DOC_META[d.docType]?.financial).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  for(const d of docs){
    let v = Number(d.paidAmount||0) - (allocByDoc[d.id]||0) - (noteByDoc[d.id]||0) - (isNoteType(d.docType) ? adjSum(d.adjust) : 0);
    if(v>0 && legacy[d.partyId]>0 && DOC_META[d.docType].ledgerSign>0){ const x = Math.min(v, legacy[d.partyId]); v -= x; legacy[d.partyId] -= x; }
    map[d.id] = Math.max(0, v);
  }
  return map;
}
// All money movements (for cash & bank, day book, balance sheet)
function moneyMoves(){
  const out = [], direct = directPaidMap();
  for(const d of liveDocs()){
    const meta = DOC_META[d.docType]; if(!meta?.financial) continue;
    const amt = direct[d.id]||0; if(amt<=0.004) continue;
    // sales invoice / purchase return = money in; purchase bill / sales return refund = money out
    const inFlow = (meta.group==="sales") === (meta.ledgerSign>0);
    out.push({date:d.date, kind:"At billing", mode: d.partyId ? "At billing" : "Cash", ref:d.number, party: partyName(d.partyId), inAmt: inFlow?amt:0, outAmt: inFlow?0:amt, docId:d.id});
  }
  for(const p of state.data.payments){
    const pt = party(p.partyId)?.type || "customer";
    const inFlow = (pt==="customer") === (p.dir!==-1);
    const orphan = p.partyId && !party(p.partyId);
    const bk = bankById(p.bankId);
    out.push({date:p.date, kind: inFlow ? "Payment in" : "Payment out", mode:(p.mode||"Cash")+(bk?" · "+bankLabel(bk):""), ref:p.note||"", party: orphan ? "(deleted party)" : partyName(p.partyId), inAmt: inFlow?Number(p.amount||0):0, outAmt: inFlow?0:Number(p.amount||0), payId:p.id, orphan});
  }
  for(const e of state.data.expenses) out.push({date:e.date, kind:"Expense", mode:e.mode||"Cash", ref:e.category+(e.note?" · "+e.note:""), party:"", inAmt:0, outAmt:Number(e.amount||0), expId:e.id});
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function cashBankBalance(uptoISO){
  const open = Number(state.data.profile?.openingCash||0);
  return open + moneyMoves().filter(m=>!uptoISO || m.date<=uptoISO).reduce((s,m)=>s+m.inAmt-m.outAmt,0);
}

// ---- report builders: each returns {title, cols:[{h, num?}], rows:[[...]], totals?:[...], note?, extra?}
function R_billprofit(r){
  const rows=[]; let S=0,C=0,unk=0;
  liveDocs().filter(d=>DOC_META[d.docType]?.group==="sales" && DOC_META[d.docType].financial && inRng(d.date,r))
    .sort((a,b)=>a.date<b.date?-1:1).forEach(d=>{
      const m = DOC_META[d.docType], t = computeDocTotals(d), s = m.ledgerSign, {cost, unknown} = docCost(t);
      const sale = s*(t.total - t.taxTotal - t.cessTotal), c = m.stockSign ? -m.stockSign*cost : 0; S+=sale; C+=c; if(m.stockSign) unk+=unknown;
      rows.push([formatDateDMY(d.date), d.number+(s<0?" (return)":""), partyName(d.partyId), sale, c, sale-c, sale? ((sale-c)/Math.abs(sale)*100).toFixed(1)+"%":"—"]);
    });
  return {cols:[{h:"Date"},{h:"Invoice"},{h:"Party"},{h:"Sale (ex-GST)",num:1},{h:"Cost",num:1},{h:"Profit",num:1},{h:"Margin"}], rows,
    totals:["","Total","",S,C,S-C, S?((S-C)/Math.abs(S)*100).toFixed(1)+"%":"—"],
    note: (unk ? `${unk} line(s) have no cost (no purchase price on the item and no purchase bill) — their cost is counted as 0, so profit looks higher. ` : "Cost = item purchase price (or average rate from your purchase bills) × quantity. ") + "Sale = bill total without GST (charges and round-off included); credit notes lower the sale but not the cost."};
}
function R_salessum(r){
  const byMonth = (Date.parse(r.to)-Date.parse(r.from))/86400000 > 62;
  const g = {};
  liveDocs().filter(d=>DOC_META[d.docType]?.group==="sales" && DOC_META[d.docType].financial && inRng(d.date,r)).forEach(d=>{
    const t = computeDocTotals(d), s = DOC_META[d.docType].ledgerSign, k = byMonth ? d.date.slice(0,7) : d.date;
    const x = g[k] || (g[k] = {n:0, tv:0, tax:0, tot:0, rec:0, due:0});
    x.n += s>0?1:0; x.tv += s*t.taxableTotal; x.tax += s*(t.taxTotal+t.cessTotal); x.tot += s*t.total; x.rec += s*Number(d.paidAmount||0); x.due += s*t.due;
  });
  const keys = Object.keys(g).sort();
  const T = keys.reduce((a,k)=>{ const x=g[k]; return {n:a.n+x.n, tv:a.tv+x.tv, tax:a.tax+x.tax, tot:a.tot+x.tot, rec:a.rec+x.rec, due:a.due+x.due}; }, {n:0,tv:0,tax:0,tot:0,rec:0,due:0});
  const lab = k => byMonth ? (MON3[Number(k.slice(5,7))-1]+" "+k.slice(0,4)) : formatDateDMY(k);
  return {cols:[{h:byMonth?"Month":"Date"},{h:"Invoices",num:1},{h:"Taxable",num:1},{h:"GST",num:1},{h:"Total",num:1},{h:"Received",num:1},{h:"Due",num:1}],
    rows: keys.map(k=>{ const x=g[k]; return [lab(k), x.n, x.tv, x.tax, x.tot, x.rec, x.due]; }),
    totals:["Total", T.n, T.tv, T.tax, T.tot, T.rec, T.due], note:"Sales returns and credit notes are subtracted."};
}
function R_daybook(r){
  const rows = [];

  moneyMoves().filter(x=>inRng(x.date,r) && x.kind==="At billing").forEach(x=>rows.push({date:x.date, k:2, v:[formatDateDMY(x.date), (x.inAmt?"Received":"Paid")+" at billing", x.ref, x.party, "", x.inAmt||"", x.outAmt||""]}));
  rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.k-b.k);
  const tin = rows.reduce((s,x)=>s+(Number(x.v[5])||0),0), tout = rows.reduce((s,x)=>s+(Number(x.v[6])||0),0);
  return {cols:[{h:"Date"},{h:"Type"},{h:"No. / Note"},{h:"Party"},{h:"Bill amount",num:1},{h:"Money in",num:1},{h:"Money out",num:1}], rows: rows.map(x=>x.v),
    totals:["","Total","","","",tin,tout]};
}
function pnlData(r){
  let sales=0, cogs=0, purch=0, unk=0;
  for(const d of liveDocs()){
    const m = DOC_META[d.docType]; if(!m?.financial || !inRng(d.date,r)) continue;
    const t = computeDocTotals(d);
    const net = t.total - t.taxTotal - t.cessTotal;          // bill value without GST: items, charges, freight, round-off
    if(m.group==="sales"){ sales += m.ledgerSign*net; if(m.stockSign){ const c = docCost(t); cogs += -m.stockSign*c.cost; unk += c.unknown; } }
    else purch += m.ledgerSign*net;
  }
  const exp = {}; state.data.expenses.filter(e=>inRng(e.date,r)).forEach(e=>{ exp[e.category]=(exp[e.category]||0)+Number(e.amount||0); });
  const expTot = Object.values(exp).reduce((a,b)=>a+b,0);
  let discGiven = 0, discRecv = 0;
  for(const x of state.data.payments){ const dv = Number(x.discount||0); if(!(dv>0) || !inRng(x.date,r)) continue; if(payInflow(x)) discGiven += dv; else discRecv += dv; }
  return {sales, cogs, gross: sales-cogs, exp, expTot, discGiven, discRecv, net: sales-cogs-expTot-discGiven+discRecv, purch, unk};
}
function R_pnl(r){
  const p = pnlData(r);
  const rows = [["Sales (net of returns, ex-GST)", p.sales], ["Less: cost of goods sold", -p.cogs], ["Gross profit", p.gross],
    ...Object.entries(p.exp).map(([k,v])=>["Less: "+k+" expense", -v]),
    ...(p.discGiven>0.004 ? [["Less: discount given on payments received", -p.discGiven]] : []),
    ...(p.discRecv>0.004 ? [["Add: discount received on payments made", p.discRecv]] : []),
    ["Net profit", p.net], ["", ""], ["Purchases in this period (for reference)", p.purch]];
  return {cols:[{h:"Particulars"},{h:"Amount",num:1}], rows, bold:[2, rows.findIndex(x=>x[0]==="Net profit")],
    note: (p.unk?`${p.unk} sold line(s) have no cost — add purchase prices on items for an exact profit. `:"")+"Cost of goods sold = quantity sold × item cost. GST is not income or expense, so it's left out."};
}
function ledgerRows(partyId, r){
  const p = party(partyId); if(!p) return {rows:[], open:0, close:0};
  const direct = directPaidMap(); const ev = [];
  for(const d of liveDocs()){ if(d.partyId!==partyId) continue; const m = DOC_META[d.docType]; if(!m?.financial) continue;

function stockMoves(){
  const mv = {}; // itemId -> [{date, q}]
  for(const d of liveDocs()){ const m = DOC_META[d.docType]; if(!m || !m.stockSign) continue;
    (d.items||[]).forEach(l=>{ if(!l.itemId) return; (mv[l.itemId] = mv[l.itemId] || []).push({date:d.date, q: m.stockSign*Number(l.qty||0)}); }); }
  for(const a of (state.data.stockAdj||[])) (mv[a.itemId] = mv[a.itemId] || []).push({date:a.date, q:Number(a.qty)||0});
  return mv;
}
function R_stock(r){
  const mv = stockMoves(); const rows = []; let V=0;
  state.data.items.filter(it=>it.itemType!=="service").forEach(it=>{
    const list = mv[it.id]||[], cur = Number(it.stock||0);
    const after = list.filter(x=>x.date > r.to).reduce((s,x)=>s+x.q,0);
    const within = list.filter(x=>inRng(x.date,r));
    const inQ = within.filter(x=>x.q>0).reduce((s,x)=>s+x.q,0), outQ = -within.filter(x=>x.q<0).reduce((s,x)=>s+x.q,0);
    const close = cur - after, open = close - inQ + outQ, cost = itemUnitCost(it), val = close*cost; V += val;

  });

    totals:["Total","","","","","","",V], note:"In = purchases & sales returns; out = sales, challans & purchase returns. Negative closing stock means more was sold than entered — add opening stock or purchase bills."};
}
function bsData(){
  const goods = state.data.items.filter(it=>it.itemType!=="service");
  const stock = goods.reduce((s,it)=>s+itemStockValue(it),0);
  let recv=0, pay=0;
  const B = allPartyBalances();
  state.data.parties.forEach(p=>{ const b = B[p.id]||0; if(p.type==="supplier"){ if(b>0) pay+=b; else recv+=-b; } else { if(b>0) recv+=b; else pay+=-b; } });
  // walk-in credit sales (no party) are always paid in full, so nothing to add there
  const cash = cashBankBalance();
  const g = buildGstr3b("1900-01-01","2999-12-31");
  const gstPayable = Math.max(0, (g.cash.igst+g.cash.cgst+g.cash.sgst+g.cash.cess));
  const gstCredit = g.carry.igst+g.carry.cgst+g.carry.sgst+g.carry.cess;
  const assets = stock + recv + cash + gstCredit, liab = pay + gstPayable;

}

// ---- document numbering (Invoice settings): prefix + serial number, per document type
const DEFAULT_PREFIX = {invoice:"INV-",quotation:"QUO-",challan:"DC-",proforma:"PI-",sales_return:"SR-",credit_note:"CN-",purchase:"PUR-",purchase_return:"PR-",debit_note:"DN-"};
function fyToken(iso){ const [y,m] = String(iso||todayISO()).split("-").map(Number); const fy = m>=4 ? y : y-1; return `${String(fy%100).padStart(2,"0")}-${String((fy+1)%100).padStart(2,"0")}`; }
// Digits of the serial number: 0 = as it is (…/66), 1–8 = zeros in front up to that many digits (…/0066)
function numDigits(v, dflt){ if(v===undefined || v===null || v==="") return dflt===undefined ? 4 : dflt;
  const n = Math.floor(Number(v)); return Number.isFinite(n) ? Math.min(8, Math.max(0, n)) : (dflt===undefined ? 4 : dflt); }
function numberingFor(docType){
  const all = state.data.profile?.numbering || {};
  const n = all[docType] || {};
  return { prefix: n.prefix ?? DEFAULT_PREFIX[docType] ?? "DOC-", start: Math.max(1, Number(n.start)||1), digits: numDigits(n.digits ?? all._digits, 4) };
}
function escRe(x){ return String(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function nextDocNumber(docType, dateISO){
  const cfg = numberingFor(docType);
  const prefix = cfg.prefix.replace(/\{FY\}/gi, fyToken(dateISO));
  const re = new RegExp("^"+escRe(prefix)+"(\\d+)$", "i");
  const highest = state.data.docs.filter(d=>d.docType===docType)
    .reduce((m,d)=>{ const x=re.exec(String(d.number||"").trim()); return x ? Math.max(m, Number(x[1])) : m; }, 0);
  const n = Math.max(cfg.start, highest + 1);
  return prefix + String(n).padStart(cfg.digits, "0");
}
function numberingSettingsHTML(){
  const types = [...SALES_TYPES, ...PURCHASE_TYPES];
  const nd = state.numDraft || (state.numDraft = Object.fromEntries(types.map(t=>[t, {...numberingFor(t)}])));
  const preview = t => { const c = nd[t]; const pre = String(c.prefix||"").replace(/\{FY\}/gi, fyToken());
    const re = new RegExp("^"+escRe(pre)+"(\\d+)$", "i");
    const hi = state.data.docs.filter(d=>d.docType===t).reduce((m,d)=>{ const x=re.exec(String(d.number||"").trim()); return x?Math.max(m,Number(x[1])):m; },0);
    const n = Math.max(Math.max(1,Number(c.start)||1), hi+1); return {txt: pre + String(n).padStart(numDigits(c.digits),"0"), bumped: hi+1 > (Number(c.start)||1)}; };
  return `<div style="font-size:12px;color:var(--slate);margin-bottom:12px;line-height:1.5;">Set the prefix and the starting serial number for each type of document. Use <b>{FY}</b> in a prefix for the financial year — e.g. <b>YC/{FY}/</b> gives YC/${esc(fyToken())}/0001.</div>
    ${types.map(t=>{ const c = nd[t], pv = preview(t); return `<div class="card" style="padding:10px 12px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px;">${esc(DOC_META[t].label)}</div>
      <div style="display:flex;gap:8px;">
        <label class="field" style="flex:1.4;margin:0;"><span class="field-label">Prefix</span><input value="${esc(c.prefix)}" oninput="numSet('${t}','prefix',this.value)" autocapitalize="characters" spellcheck="false"/></label>
        <label class="field" style="flex:1;margin:0;"><span class="field-label">Start from</span><input type="number" inputmode="numeric" min="1" value="${esc(c.start)}" oninput="numSet('${t}','start',this.value)"/></label>
        <label class="field" style="flex:.8;margin:0;"><span class="field-label">Digits</span><select onchange="numSet('${t}','digits',this.value)">${[0,1,2,3,4,5,6].map(d=>`<option value="${d}" ${numDigits(c.digits)===d?"selected":""}>${d}</option>`).join("")}</select></label>
      </div>
      <div id="num-pv-${t}" style="font-size:11.5px;margin-top:6px;color:var(--slate);">Next number: <b class="mono" style="color:var(--ink);">${esc(pv.txt)}</b>${pv.bumped?" (continues after your last one)":""}</div>
    </div>`; }).join("")}`;
}

  const cfd = state.cfDraft || (state.cfDraft = (state.data.profile?.customFields||[]).map(f=>({...f})));

function ensureDraft(docType){
  if(!state.docDraft || (docType && state.docDraft.docType!==docType)){

    state.docDraft = {
      docType: dt, number: nextDocNumber(dt, todayISO()), date: todayISO(), dueDate:"", partyId:"",

      agent:"", ewayBillNo:"", transportName:"", lrNumber:"", lrDate:"", parcels:""
    };
  }

function noteAdjustCardHTML(d, t){
  const meta = DOC_META[d.docType];
  const targets = noteTargets(d.partyId, meta.group, d._editingId);
  d.adjust = (d.adjust||[]).filter(a=>targets.some(x=>x.id===a.docId));
  const prevOf = id => adjSum((d._prevAdjust||[]).filter(a=>a.docId===id));
  const open = targets.map(inv=>({inv, avail: computeDocTotals(inv).due + prevOf(inv.id)})).filter(x=>x.avail>0.004 || (d.adjust||[]).some(a=>a.docId===x.inv.id));
  const cur = id => (d.adjust||[]).find(a=>a.docId===id)?.amt ?? "";
  const used = adjSum(d.adjust);
  const left = Math.max(0, t.total - used - Number(d.paidAmount||0));

  return `<div class="card" style="margin-top:12px;" id="adj-card">

      <div style="display:flex;gap:6px;">

        <button type="button" class="btn ghost" style="width:auto;padding:5px 10px;font-size:11.5px;" onclick="adjClear()">Clear</button>
      </div>
    </div>
    ${open.length===0 ? `<div style="font-size:12px;color:var(--slate);padding:6px 0;">No unpaid ${what} for this party — the full amount stays as credit in their balance.</div>` :
      open.map(({inv, avail})=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);">
        <div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">${esc(inv.number)}</div><div style="font-size:11px;color:var(--slate);">${esc(formatDateDMY(inv.date))} · balance ${fmt(avail)}</div></div>
        <input type="number" inputmode="decimal" id="adj-${inv.id}" value="${cur(inv.id)}" placeholder="0" oninput="adjSet('${inv.id}', this.value, ${avail})" style="width:100px;padding:6px 8px;text-align:right;"/>
      </div>`).join("")}
    <div id="adj-summary" style="font-size:12px;margin-top:8px;color:var(--slate);">${adjSummaryText(t.total, used, left)}</div>
  </div>`;
}
function adjSummaryText(total, used, left){
  return `Adjusted <b class="mono" style="color:var(--ink);">${fmt(used)}</b> of ${fmt(total)}${left>0.004?` · <span>${fmt(left)} stays as credit in the party's balance</span>`:""}`;
}
function adjSet(docId, val, avail){
  const d = ensureDraft(); d._adjFollow = null; d.adjust = (d.adjust||[]).filter(a=>a.docId!==docId);
  let v = Number(val)||0; if(v>avail+0.004){ v = avail; const el=document.getElementById("adj-"+docId); if(el) el.value = String(Math.round(v*100)/100); toast("Can't adjust more than the invoice balance"); }
  if(v>0) d.adjust.push({docId, amt:v});
  const t = computeDocTotals(d); const used = adjSum(d.adjust);
  const el = document.getElementById("adj-summary"); if(el) el.innerHTML = adjSummaryText(t.total, used, Math.max(0, t.total-used-Number(d.paidAmount||0)));
}
function adjAuto(){
  const d = ensureDraft(); d._adjFollow = null; const meta = DOC_META[d.docType]; const t = computeDocTotals(d);
  const prevOf = id => adjSum((d._prevAdjust||[]).filter(a=>a.docId===id));
  let left = Math.max(0, t.total - Number(d.paidAmount||0)); d.adjust = [];
  for(const inv of noteTargets(d.partyId, meta.group, d._editingId)){
    if(left<=0.004) break; const avail = computeDocTotals(inv).due + prevOf(inv.id); if(avail<=0.004) continue;
    const a = Math.min(left, avail); d.adjust.push({docId:inv.id, amt: Math.round(a*100)/100}); left -= a;
  }
  render();
}
function adjClear(){ const d = ensureDraft(); d._adjFollow = null; d.adjust = []; render(); }

// Round off, as in the reference app: ⊗ takes it off, − / + round the total down / up to the rupee (a new

function roundSignOf(d, t){
  const m = t.roundMode;

// Renders the theme's background (pattern or uploaded photo) as its own absolutely-positioned
// layer behind the content, rather than fighting the card's own background/border styling.
// Used identically by every template style so background visibility can never depend on which
// style is active.
function backgroundLayerHTML(theme){
  if(!theme.backgroundUrl) return "";
  const style = backgroundStyleString(theme);
  return `<div style="position:absolute;inset:0;${style};pointer-events:none;border-radius:inherit;z-index:0;"></div>`;
}
// Returns just the background-* CSS declarations for a theme, so callers can either drop them
// straight onto an element (formal template) or wrap them in a
// separate absolutely-positioned overlay div (simple/luxury/stylish, layered under the content).
// How much white is laid over a photo background so text stays readable (0 = photo at full
// strength, 0.9 = barely visible). Set from the "Background strength" slider in Theme & Color.
function bgWashFor(theme){ const v = Number(theme && theme.bgWash); return isFinite(v) && theme.bgWash!==undefined && theme.bgWash!==null ? Math.min(0.9, Math.max(0, v)) : 0.35; }
function safeCssUrl(u){ u=String(u||""); if(!/^(data:image\/|https?:|blob:)/i.test(u)) return ""; return u.replace(/["'()\\<>\s]/g, c=>encodeURIComponent(c)); }
function backgroundStyleString(theme){
  if(!theme.backgroundUrl) return "";
  theme = {...theme, backgroundUrl: safeCssUrl(theme.backgroundUrl)};
  if(!theme.backgroundUrl) return "";
  if(theme.backgroundMode==="pattern"){
    return `background-image:url('${theme.backgroundUrl}');background-repeat:repeat;background-size:200px 200px;`;
  }
  // Photos: a lighter wash than before (was 0.86, then 0.68) so the image actually reads —
  // if it still looks faint, the photo itself may already be pre-lightened before upload.
  const w = bgWashFor(theme);
  return `background-image:linear-gradient(rgba(255,255,255,${w}),rgba(255,255,255,${w})),url('${theme.backgroundUrl}');background-size:cover;background-position:center;`;
}

// Self-contained encoder (no network libraries) used for the UPI payment QR on invoices.
const QR = (() => {

    for(const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>{ r[i]^=gfMul(c,f); }); } return r; };

    const r=[6]; for(let p=v*4+10; r.length<n; p-=step) r.splice(1,0,p); return r; };

    const bytes = Array.from(new TextEncoder().encode(text));

    for(; ver<=40; ver++){ const cc = ver<=9?8:16; if(4+cc+bytes.length*8 <= dataCodewords(ver)*8) break; }

    const nb=NUM_BLOCKS[ver], ecl=ECC_PER_BLOCK[ver], raw=Math.floor(rawModules(ver)/8);
    const nShort = nb - raw%nb, shortLen = Math.floor(raw/nb), div = rsDivisor(ecl);
    const blocks=[]; for(let i=0,k=0;i<nb;i++){ const dat=data.slice(k, k+shortLen-ecl+(i<nShort?0:1)); k+=dat.length;
      const ecc=rsRemainder(dat, div); if(i<nShort) dat.push(0); blocks.push(dat.concat(ecc)); }

    const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)); const x=cx+dx,y=cy+dy;

    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{ for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!fn[y][x] && maskFn[m](x,y)) mod[y][x]=!mod[y][x]; };
    const penalty=()=>{ let p=0;
      for(let y=0;y<size;y++){ let run=1; for(let x=1;x<=size;x++){ if(x<size && mod[y][x]===mod[y][x-1]) run++; else { if(run>=5) p+=run-2; run=1; } } }
      for(let x=0;x<size;x++){ let run=1; for(let y=1;y<=size;y++){ if(y<size && mod[y][x]===mod[y-1][x]) run++; else { if(run>=5) p+=run-2; run=1; } } }
      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=mod[y][x]; if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1]) p+=3; }
      let dark=0; mod.forEach(r=>r.forEach(c=>{ if(c) dark++; })); p += Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
      return p; };
    let best=0, bestP=Infinity;
    for(let m=0;m<8;m++){ applyMask(m); drawFormat(m); const p=penalty(); if(p<bestP){ bestP=p; best=m; } applyMask(m); }
    applyMask(best); drawFormat(best);

})();

// UPI payment QR for an invoice: generated from the UPI ID in Business settings with the amount due
// filled in (customer just scans and pays), or the bank's own QR image if one was uploaded instead.
const _qrCache = {};
function paymentQrFor(biz, doc, t){
  if(!biz || !doc || doc.cancelled) return null;
  const meta = DOC_META[doc.docType] || DOC_META.invoice;
  if(meta.group!=="sales" || meta.ledgerSign<0 || doc.docType==="challan") return null;
  if(meta.financial && !(t.due>0.004)) return null;                // fully paid: nothing to pay
  const upi = String(biz.upiId||"").trim();
  if(upi && /^[\w.\-]{2,}@[\w.\-]{2,}$/.test(upi)){
    const amt = meta.financial ? t.due : t.total;
    const e = encodeURIComponent;
    const link = `upi://pay?pa=${e(upi)}&pn=${e(biz.businessName||"")}&am=${Number(amt).toFixed(2)}&cu=INR&tn=${e(doc.number||"")}`;
    if(!_qrCache[link]){ try{ _qrCache[link] = QR.toDataURL(link, 8); }catch(err){ return null; } }
    return {src:_qrCache[link], label:"Scan & pay via UPI", sub: upi, amount: amt};
  }
  if(biz.bankQrDataUrl) return {src: biz.bankQrDataUrl, label:"Scan to pay", sub: biz.upiId||"", amount:null};
  return null;
}

function phoneDigits(ph){ let d = String(ph||"").replace(/\D/g,""); if(d.length>10 && d.startsWith("91")) d = d.slice(2); if(d.length===11 && d.startsWith("0")) d = d.slice(1); return d; }

function renderModal(){
  const root = document.getElementById("modal-root");
  if(!state.modal){
    if(root.firstChild && !root._closing){
      const sh = root.querySelector(".sheet:not(.full)"), ov = root.querySelector(".sheet-overlay");
      if(sh && ov && sh.animate && !reducedMotion() && !state.discardAsk){
        root._closing = true; ov.style.pointerEvents = "none";
        const from = getComputedStyle(sh).transform;
        const a = sh.animate([{transform: from && from!=="none" ? from : "translateY(0)"}, {transform:"translateY(100%)"}], {duration:210, easing:"cubic-bezier(.4,0,.9,.6)", fill:"forwards"});
        ov.animate([{backgroundColor: getComputedStyle(ov).backgroundColor}, {backgroundColor:"rgba(19,42,70,0)"}], {duration:210, fill:"forwards"});
        const fin = ()=>{ if(root._closing){ root._closing = false; root.innerHTML = ""; } };
        a.onfinish = fin; setTimeout(fin, 400);
      } else root.innerHTML = "";
    }
    return;
  }
  if(root._closing){ root._closing = false; root.innerHTML = ""; }
  if(state.modal.type==="doc-output" || state.modal.type==="copy-ready"){ state.modal = null; root.innerHTML = ""; return; }   // old sheets (before v52 / v57) in the back history
  const {type,id} = state.modal;
  if(type==="zoom"){
    const doc = state.data.docs.find(d=>d.id===id);
    const pagesArr = doc && previewUrls(doc, state.modal.choice) || [];
    const z = state.modal.scale || 2;
    root.innerHTML = `<div data-morph="replace" style="position:fixed;inset:0;z-index:70;background:#2b2b2b;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--safe-top)) 12px 10px;color:#fff;flex-shrink:0;">
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" style="width:auto;padding:7px 14px;" data-action="zoom-set" data-scale="1">Fit</button>
          <button class="btn ghost" style="width:auto;padding:7px 14px;" data-action="zoom-set" data-scale="2">2×</button>
          <button class="btn ghost" style="width:auto;padding:7px 14px;" data-action="zoom-set" data-scale="3">3×</button>
        </div>
        <button class="sheet-close" data-action="close-modal">✕</button>
      </div>
      <div class="pz" data-pz="full" data-init-scale="${z}" style="flex:1;position:relative;overflow:hidden;touch-action:none;margin:0 10px 12px;">
        <div class="pz-content" style="transform-origin:0 0;will-change:transform;">
        ${pagesArr.map(src=>`<img src="${src}" alt="" draggable="false" style="display:block;width:100%;height:auto;background:#fff;margin:0 0 10px;-webkit-user-drag:none;user-select:none;"/>`).join("")}
        </div></div>
      <div style="text-align:center;color:#bbb;font-size:11px;padding:0 0 calc(10px + env(safe-area-inset-bottom));">Pinch to zoom · drag to move · double-tap to zoom in/out</div></div>`;
    setTimeout(()=>{ const el=root.querySelector('.pz'); if(el) attachPinchZoom(el); }, 0);
    return;
  }
  let inner="", full=false, tall=false;
  if(type==="item"){ inner = modalItem(id); full = true; }
  if(type==="party"){ inner = modalParty(id); full = true; }
  if(type==="expense") inner = modalExpense(id);
  if(type==="profile") inner = modalProfile();
  if(type==="backup") inner = modalBackup();
  if(type==="numbering" || type==="theme" || type==="invoice-settings"){ inner = modalInvoiceSettings(); full = true; }
  if(type==="stock-adjust") inner = modalStockAdjust(id);
  if(type==="import-data"){ inner = modalImportData(); full = true; }
  if(type==="share-ready") inner = modalShareReady();
  if(type==="item-picker"){ inner = modalItemPicker(); full = true; }
  if(type==="line-edit") inner = modalLineEdit();
  if(type==="doc-numdate") inner = modalDocNumDate();
  if(type==="share-as") inner = modalShareAs();
  if(type==="cancel-doc") inner = modalCancelDoc();
  if(type==="delete-doc-ask") inner = modalDeleteDocAsk();
  if(type==="pay-history") inner = modalPayHistory();
  if(type==="tx-picker") inner = modalTxPicker();
  if(type==="record-pay") inner = modalRecordPay(id);
  if(type==="pay-del") inner = modalPayDelAsk();
  if(type==="period-pick") inner = modalPeriodPick();
  if(type==="sort-pick") inner = modalSortPick();
  if(type==="list-filter") inner = modalListFilter();
  if(type==="stmt-output") inner = modalStatementOutput();
  if(type==="payment") inner = modalPayment(state.modal.ptype, id);
  if(type==="scan-purchase"){ inner = modalScanPurchase(); full = true; }
  if(type==="scan-review"){ inner = modalScanReview(); full = true; }
  if(type==="party-picker"){ inner = modalPartyPicker(); full=true; }
  if(type==="pay-numdate") inner = modalPayNumDate();
  if(type==="bank-pick"){ inner = modalBankPick(); tall = true; }
  if(type==="bank-add") inner = modalBankAdd();
  if(type==="pi-disc") inner = modalPiDisc();
  if(type==="barcode") inner = modalBarcode();
  if(type==="confirm-delete-party") inner = modalConfirmDeleteParty();
  morphInto(root, `<div class="sheet-overlay" data-action="close-modal">
    <div class="sheet ${full?'full':''}${tall?' tall':''}${type==="share-as"?' shr-sheet':''}"${KEEP_SHEETS.has(type)?' data-keep="1"':''}>${inner}</div></div>${state.discardAsk?discardHTML():""}`);
  if(type==="party-picker") rotatePlaceholder("pp-q", ["Search by Party Name","Search by Mobile Number"]);
  else if(type==="item-picker") rotatePlaceholder("ip-q", ["Search by Item Name","Search by HSN","Search by Item Code","Search by Category"]);
  if(type==="barcode"){
    requestAnimationFrame(()=>{
      const canvas = document.getElementById("barcode-canvas");
      const code = state.itemDraft?.itemCode||"";
      if(canvas && /^\d{13}$/.test(code)) drawBarcodeOnCanvas(canvas, code);
    });
  }
}

  <button class="sheet-close" data-action="close-modal">✕</button></div>`;
}


function ensureItemDraft(id){
  if(!state.itemDraft || state.itemDraft._id!==(id||"_new")){
    const item = id ? state.data.items.find(i=>i.id===id) : null;
    state.itemDraft = item ? {..._structuredCloneItem(item), stock: item.openingStock ?? item.stock ?? "", _id:id, partyPrices: {...(item.partyPrices||{})} } : {
      _id:"_new", name:"", hsn:"", itemType:"product", unit:"pcs", taxRate:5,
      purchasePrice:"", purchasePriceMode:"without", sellingPrice:"", sellingPriceMode:"without", discountPercent:"",
      stock:"", asOfDate: todayISO(), itemCode:"", lowStockAlertOn:false, lowStockAlert:"5",
      category:"", size:"", description:"", partyPrices:{}, _tab:"pricing"
    };
    if(!state.itemDraft._tab) state.itemDraft._tab="pricing";
    state.itemDraft._orig = draftSnap(state.itemDraft);
  }
  return state.itemDraft;
}
function _structuredCloneItem(it){ return JSON.parse(JSON.stringify(it)); }
function syncItemDraftFromDOM(){
  const d = state.itemDraft; if(!d) return;
  const g = (id) => document.getElementById(id);
  if(g("f-name")) d.name = g("f-name").value;
  if(g("f-hsn")) d.hsn = g("f-hsn").value;
  if(d._tab==="pricing"){
    if(g("f-unit")) d.unit = g("f-unit").value;
    if(g("f-pp")) d.purchasePrice = g("f-pp").value;
    if(g("f-sp")) d.sellingPrice = g("f-sp").value;
    if(g("f-disc")) d.discountPercent = g("f-disc").value;
  }
  if(d._tab==="stock"){
    if(g("f-stock")) d.stock = g("f-stock").value;
    if(g("f-itemcode")) d.itemCode = g("f-itemcode").value;
    if(g("f-low")) d.lowStockAlert = g("f-low").value;
  }
  if(d._tab==="other"){
    if(g("f-category")) d.category = g("f-category").value;
    if(g("f-size")) d.size = g("f-size").value;
    if(g("f-desc")) d.description = g("f-desc").value;
  }
  if(d._tab==="partyprices"){
    state.data.parties.filter(p=>p.type==="customer").forEach(p=>{
      const el = g("f-pp-"+p.id);
      if(el){ const v = el.value.trim(); if(v==="") delete d.partyPrices[p.id]; else d.partyPrices[p.id] = Number(v); }
    });
  }
}
function switchItemTab(tab){ syncItemDraftFromDOM(); state.itemDraft._tab = tab; render(); }
function itemDraftSet(key,val){ syncItemDraftFromDOM(); state.itemDraft[key]=val; render(); }
function genBarcodeInto(inputId){
  const el = document.getElementById(inputId);
  let base = "";
  for(let i=0;i<12;i++) base += Math.floor(Math.random()*10);
  const code = base + ean13CheckDigit(base);
  if(el) el.value = code;
  if(state.itemDraft) state.itemDraft.itemCode = code;
}

// ---------------- EAN-13 barcode: valid checksum + real rendering ----------------
const EAN_L = {0:"0001101",1:"0011001",2:"0010011",3:"0111101",4:"0100011",5:"0110001",6:"0101111",7:"0111011",8:"0110111",9:"0001011"};
const EAN_G = {0:"0100111",1:"0110011",2:"0011011",3:"0100001",4:"0011101",5:"0111001",6:"0000101",7:"0010001",8:"0001001",9:"0010111"};
const EAN_R = {0:"1110010",1:"1100110",2:"1101100",3:"1000010",4:"1011100",5:"1001110",6:"1010000",7:"1000100",8:"1001000",9:"1110100"};
const EAN_PARITY = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function ean13CheckDigit(base12){
  let sum = 0;
  for(let i=0;i<12;i++){ const d=Number(base12[i]); sum += (i%2===0) ? d : d*3; }
  return (10-(sum%10))%10;
}
function ean13Bits(code13){
  const parity = EAN_PARITY[Number(code13[0])];
  let bits = "101";
  for(let i=1;i<=6;i++){ const d=Number(code13[i]); bits += (parity[i-1]==="L" ? EAN_L[d] : EAN_G[d]); }
  bits += "01010";
  for(let i=7;i<=12;i++){ bits += EAN_R[Number(code13[i])]; }
  bits += "101";
  return bits;
}
function drawBarcodeOnCanvas(canvas, code13){
  const bits = ean13Bits(code13);
  const barW=3, barH=100, marginX=20, textH=26;
  canvas.width = bits.length*barW + marginX*2;
  canvas.height = barH+textH;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#000";
  let x=marginX;
  for(const b of bits){ if(b==="1") ctx.fillRect(x,8,barW,barH); x+=barW; }
  ctx.font="16px monospace";
  ctx.textAlign="center";
  ctx.fillText(code13, canvas.width/2, barH+22);
}

// ---------------- Scan a purchase bill → purchase entry ----------------
// Reads a photo (or PDF) of a supplier's bill: first looks for the e-invoice QR (signed by the GST
// portal — exact GSTIN, bill no., date and value), then reads the printed text (OCR runs in the
// phone's browser; the text reader is downloaded once from jsDelivr, ~10 MB). The result is shown for
// review and becomes a purchase entry only after you check it and tap Save.
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const PDFJS_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
const GST_SLABS = [0, 0.25, 3, 5, 12, 18, 28, 40];

function loadScript(src){
  return new Promise((res, rej)=>{
    if(document.querySelector(`script[src="${src}"]`) && window.Tesseract) return res();
    const s = document.createElement("script"); s.src = src; s.async = true;
    s.onload = ()=>res(); s.onerror = ()=>rej(new Error("Couldn't download the text reader — check your internet connection."));
    document.head.appendChild(s);
  });
}
function scanProgress(msg, pct){
  state.scan = {...(state.scan||{}), busy:true, msg, pct: pct==null ? state.scan?.pct : pct};
  const el = document.getElementById("scan-progress");
  if(el){ el.querySelector(".msg").textContent = msg; const bar = el.querySelector(".bar"); if(bar && pct!=null) bar.style.width = Math.round(pct*100)+"%"; }
}
async function fileToCanvas(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await loadImage(url);
    const maxSide = 2400, r = Math.min(1, maxSide/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*r); c.height = Math.round(img.naturalHeight*r);
    const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
// Grayscale + contrast stretch helps OCR on phone photos.
function prepForOcr(src){
  const c = document.createElement("canvas"); c.width = src.width; c.height = src.height;
  const g = c.getContext("2d"); g.drawImage(src, 0, 0);
  const im = g.getImageData(0,0,c.width,c.height), d = im.data;
  let lo=255, hi=0; const lum = new Uint8ClampedArray(d.length/4);
  for(let i=0,j=0;i<d.length;i+=4,j++){ const v = (d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000; lum[j]=v; if(v<lo) lo=v; if(v>hi) hi=v; }
  const span = Math.max(40, hi-lo);
  for(let i=0,j=0;i<d.length;i+=4,j++){ const v = Math.max(0, Math.min(255, (lum[j]-lo)*255/span)); d[i]=d[i+1]=d[i+2]=v; }
  g.putImageData(im, 0, 0); return c;
}
async function detectEinvoiceQr(canvas){
  if(!("BarcodeDetector" in window)) return null;
  try{
    const det = new BarcodeDetector({formats:["qr_code"]});
    const codes = await det.detect(canvas);
    for(const c of codes){ const p = parseEinvoiceQr(c.rawValue); if(p) return p; }
  }catch(e){}
  return null;
}
// The e-invoice QR is a signed JWT; its payload "data" holds the invoice summary.
function parseEinvoiceQr(raw){
  try{
    const parts = String(raw||"").trim().split(".");
    if(parts.length<2) return null;
    const b64 = parts[1].replace(/-/g,"+").replace(/_/g,"/"); const pad = b64 + "===".slice((b64.length+3)%4);
    const json = JSON.parse(decodeURIComponent(escape(atob(pad))));
    const data = typeof json.data==="string" ? JSON.parse(json.data) : (json.data || json);
    if(!data.SellerGstin) return null;
    const dt = String(data.DocDt||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return { sellerGstin: String(data.SellerGstin).toUpperCase(), buyerGstin: String(data.BuyerGstin||"").toUpperCase(),
      number: String(data.DocNo||""), date: dt ? `${dt[3]}-${dt[2].padStart(2,"0")}-${dt[1].padStart(2,"0")}` : "",
      total: Number(data.TotInvVal)||0, itemCount: Number(data.ItemCnt)||0, hsn: String(data.MainHsnCode||""), irn: String(data.Irn||""), docType: data.DocTyp||"INV" };
  }catch(e){ return null; }
}
async function pdfToTextAndCanvas(file){
  scanProgress("Opening PDF…", 0.05);
  const pdfjs = await import(PDFJS_URL);
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let text = "";
  for(let i=1;i<=Math.min(pdf.numPages, 5);i++){
    const pg = await pdf.getPage(i); const tc = await pg.getTextContent();
    // rebuild lines from text positions
    const rows = new Map();
    for(const it of tc.items){ const y = Math.round(it.transform[5]/3); const r = rows.get(y) || []; r.push({x: it.transform[4], s: it.str}); rows.set(y, r); }
    text += [...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,r])=>r.sort((a,b)=>a.x-b.x).map(x=>x.s).join(" ")).join("\n") + "\n";
  }
  const pg1 = await pdf.getPage(1); const vp = pg1.getViewport({scale: 2.2});
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
  await pg1.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
  return {text, canvas: c};
}
async function runOcr(canvas){
  scanProgress("Downloading text reader (first time only)…", 0.1);
  await loadScript(TESSERACT_URL);
  const worker = await Tesseract.createWorker("eng", 1, { logger: m => {
    if(m.status==="recognizing text") scanProgress("Reading the bill… "+Math.round((m.progress||0)*100)+"%", 0.3 + 0.7*(m.progress||0));
    else if(m.status) scanProgress(m.status.replace(/^./, c=>c.toUpperCase())+"…", null);
  }});
  try{ const r = await worker.recognize(prepForOcr(canvas)); return r.data.text || ""; }
  finally { try{ await worker.terminate(); }catch(e){} }
}

// ---- turning bill text into fields
function parseAmount(s){ const v = Number(String(s).replace(/[,\s₹]/g,"").replace(/[^\d.\-]/g,"")); return isFinite(v) ? v : NaN; }
const NUM_RE = /(?<![\w\/])-?\d{1,3}(?:,\d{2,3})*(?:\.\d{1,3})?(?![\w\/])|(?<![\w\/])-?\d+(?:\.\d{1,3})?(?![\w\/])/g;
function numbersIn(line){ return (line.match(NUM_RE)||[]).map(parseAmount).filter(v=>!isNaN(v)); }
function fixGstinOcr(tok){ // common OCR mix-ups in the digit / letter positions of a GSTIN
  if(tok.length!==15) return tok;
  const D = {O:"0",Q:"0",D:"0",I:"1",L:"1",Z:"2",S:"5",B:"8",G:"6"}, A = {"0":"O","1":"I","2":"Z","5":"S","8":"B","6":"G"};
  const pat = "DDAAAAADDDDA?Z?"; let out="";
  for(let i=0;i<15;i++){ const ch = tok[i]; const p = pat[i];
    if(p==="D") out += D[ch]||ch; else if(p==="A") out += A[ch]||ch; else if(p==="Z") out += (ch==="2"?"Z":ch); else out += ch; }
  return out;
}
function findGstins(text){
  const up = text.toUpperCase().replace(/[^A-Z0-9\n ]/g," ");
  const found = [];
  for(const m of up.matchAll(/\b[0-9OQDILZSBG]{2}[A-Z0-9]{5}[0-9OQDILZSBG]{4}[A-Z0-9][1-9A-Z][Z2][0-9A-Z]\b/g)){
    const g = fixGstinOcr(m[0]); const d = decodeGSTIN(g);
    if(d.formatOk && d.stateName && !found.includes(g)) found.push(g);
  }
  return found;
}
function findDate(text){
  const months = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  const lines = text.split(/\n/);
  const tryLine = (l) => {
    let m = l.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
    if(m){ let y = Number(m[3]); if(y<100) y += 2000; const mo=Number(m[2]), d=Number(m[1]); if(mo>=1&&mo<=12&&d>=1&&d<=31) return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
    m = l.toUpperCase().match(/\b(\d{1,2})[\s\-\/.]*(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[\s\-\/.,]*(\d{2,4})\b/);
    if(m){ let y = Number(m[3]); if(y<100) y += 2000; return `${y}-${String(months[m[2]]).padStart(2,"0")}-${String(Number(m[1])).padStart(2,"0")}`; }
    return "";
  };
  for(const l of lines) if(/DATE|DATED|DT\b/i.test(l)){ const d = tryLine(l); if(d) return d; }
  for(const l of lines){ const d = tryLine(l); if(d) return d; }
  return "";
}
function findInvoiceNo(text){
  const m = text.match(/(?:INVOICE|INV|BILL|MEMO)\s*(?:NO|NUMBER|NUM|#)\b[\s.:\-#]*([A-Z0-9][A-Z0-9\/\-]{0,19})/i);
  return m ? m[1].replace(/[.,:]+$/,"") : "";
}
function lastAmountOn(text, re){
  let best = NaN;
  for(const l of text.split(/\n/)) if(re.test(l)){ const n = numbersIn(l).filter(v=>Math.abs(v)>=1 && !(Number.isInteger(v) && v<=100 && /%/.test(l) && numbersIn(l).length===1)); if(n.length) best = n[n.length-1]; }
  return best;
}
function nearestSlab(r){ let b = 0; for(const s of GST_SLABS) if(Math.abs(s-r) < Math.abs(b-r)) b = s; return b; }
function parseBillText(text, ownGstin){
  const gstins = findGstins(text).filter(g=>g!==String(ownGstin||"").toUpperCase());
  const number = findInvoiceNo(text), date = findDate(text);
  const total = lastAmountOn(text, /GRAND\s*TOTAL|NET\s*(?:AMOUNT|PAYABLE|TOTAL)|TOTAL\s*(?:INVOICE\s*)?(?:AMOUNT|VALUE)|INVOICE\s*(?:VALUE|TOTAL)|AMOUNT\s*PAYABLE|BILL\s*AMOUNT/i);
  const taxable = lastAmountOn(text, /TAXABLE/i);
  const cgst = lastAmountOn(text, /CGST|CENTRAL\s*TAX/i), sgst = lastAmountOn(text, /SGST|UTGST|STATE\s*TAX/i), igst = lastAmountOn(text, /IGST|INTEGRATED/i);
  // Item rows: a line with an HSN-like code and qty × rate ≈ amount
  const lines = [];
  for(const raw of text.split(/\n/)){
    const l = raw.replace(/\s+/g," ").trim(); if(l.length<6) continue;
    if(/TOTAL|TAXABLE|CGST|SGST|IGST|ROUND|GSTIN|BANK|IFSC|A\/C/i.test(l)) continue;
    const nums = numbersIn(l); if(nums.length<3) continue;
    let hit = null;
    for(let i=0;i<nums.length && !hit;i++) for(let j=i+1;j<nums.length && !hit;j++) for(let k=j+1;k<nums.length && !hit;k++){
      const q=nums[i], r=nums[j], a=nums[k];
      if(q>0 && r>0 && a>0 && q<100000 && Math.abs(q*r-a) <= Math.max(1, a*0.012)) hit = {q, r, a};
    }
    if(!hit) continue;
    const hsnM = l.match(/\b([1-9]\d{3}(?:\d{2}){0,2})\b/); const hsn = hsnM && !String(hit.q).startsWith(hsnM[1]) ? hsnM[1] : "";
    const pct = l.match(/(\d{1,2}(?:\.\d{1,2})?)\s*%/);
    let name = l.split(/\s\d/)[0].replace(/^\d+[\s.)-]*/,"").replace(/[|]/g," ").trim();
    if(!name || name.length<2) name = hsn ? "HSN "+hsn : "Item";
    lines.push({ name: name.slice(0,60), hsn, qty: hit.q, price: hit.r, taxRate: pct ? nearestSlab(Number(pct[1])) : null, amount: hit.a });
  }
  const taxSum = (isNaN(cgst)?0:cgst) + (isNaN(sgst)?0:sgst) + (isNaN(igst)?0:igst);
  const base = !isNaN(taxable) ? taxable : lines.reduce((s,l)=>s+l.amount,0);
  const overallRate = base>0 && taxSum>0 ? nearestSlab(taxSum/base*100) : null;
  lines.forEach(l=>{ if(l.taxRate==null) l.taxRate = overallRate ?? 5; });
  return { supplierGstin: gstins[0] || "", number, date, total: isNaN(total)?null:total, taxable: isNaN(taxable)?null:taxable,
    cgst: isNaN(cgst)?null:cgst, sgst: isNaN(sgst)?null:sgst, igst: isNaN(igst)?null:igst, overallRate, lines };
}

async function handleScanFile(inputEl){
  const file = inputEl.files && inputEl.files[0]; inputEl.value = "";
  if(!file) return;
  state.scan = {busy:true, msg:"Preparing…", pct:0.02}; render();
  try{
    let text = "", canvas = null;
    const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
    if(isPdf){ const r = await pdfToTextAndCanvas(file); text = r.text; canvas = r.canvas; }
    else canvas = await fileToCanvas(file);
    scanProgress("Looking for the e-invoice QR…", 0.08);
    const qr = await detectEinvoiceQr(canvas);
    if(!text || text.replace(/\s/g,"").length < 40) text = await runOcr(canvas);
    const own = state.data.profile?.gstin;
    const parsed = parseBillText(text, own);
    if(qr){ // the signed QR is exact — prefer it
      if(qr.sellerGstin && qr.sellerGstin!==String(own||"").toUpperCase()) parsed.supplierGstin = qr.sellerGstin;
      if(qr.number) parsed.number = qr.number; if(qr.date) parsed.date = qr.date; if(qr.total) parsed.total = qr.total;
      parsed.irn = qr.irn; parsed.qrHsn = qr.hsn; parsed.qrItems = qr.itemCount;
    }

// How the supplier's bill was rounded — so the purchase entry comes to the same total as the bill.
function scanRound(x, billTotal){

    for(const [mode, v] of [["near", Math.round(x)], ["down", Math.floor(x)], ["up", Math.ceil(x)], ["none", x]]) if(Math.abs(v - bt) < 0.005) return {mode, total:v};

}

// ---------------- Import parties / items from myBillBook (or any Excel / CSV list) ----------------
// Reads .xlsx (built-in reader — no internet needed) or .csv, guesses which column is which from the
// headings, lets you correct that, previews the rows, then adds the parties (with their balances as
// opening balance) or items (with current stock).
async function unzipEntries(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for(let i=u8.length-22; i>=Math.max(0,u8.length-65557); i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("Not an .xlsx file");
  const n = dv.getUint16(eocd+10,true); let off = dv.getUint32(eocd+16,true);
  const files = {}, dec = new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method = dv.getUint16(off+10,true), csize = dv.getUint32(off+20,true), nlen = dv.getUint16(off+28,true), xlen = dv.getUint16(off+30,true), clen = dv.getUint16(off+32,true), lho = dv.getUint32(off+42,true);
    const name = dec.decode(u8.subarray(off+46, off+46+nlen));
    const lnl = dv.getUint16(lho+26,true), lxl = dv.getUint16(lho+28,true), start = lho+30+lnl+lxl;
    files[name] = {method, data: u8.subarray(start, start+csize)};
    off += 46+nlen+xlen+clen;
  }
  const read = async (name) => {
    const f = files[name]; if(!f) return null;
    if(f.method===0) return dec.decode(f.data);
    if(f.method!==8) throw new Error("Unsupported compression");
    if(typeof DecompressionStream==="undefined") throw new Error("This browser can't open .xlsx — save the file as CSV and import that");
    const ds = new DecompressionStream("deflate-raw");
    const out = await new Response(new Blob([f.data]).stream().pipeThrough(ds)).arrayBuffer();
    return dec.decode(out);
  };
  return {names: Object.keys(files), read};
}
function colIndex(ref){ const m = /^([A-Z]+)/.exec(ref||""); if(!m) return 0; let n=0; for(const ch of m[1]) n = n*26 + (ch.charCodeAt(0)-64); return n-1; }

  const wb = P(await z.read("xl/workbook.xml") || "<x/>");

  const rels = {}; if(relsXml) [...P(relsXml).getElementsByTagName("Relationship")].forEach(r=>{ rels[r.getAttribute("Id")] = r.getAttribute("Target"); });

  const targets = sheetEls.length ? sheetEls.map(el=>{ const rid = el.getAttribute("r:id") || el.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"); let t = rels[rid] || ""; t = t.replace(/^\/?xl\//,""); return {name: el.getAttribute("name"), path: "xl/"+t}; })
    : z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).map((p,i)=>({name:"Sheet"+(i+1), path:p}));

        const t = c.getAttribute("t"), idx = colIndex(c.getAttribute("r"));
        let v = "";

        else { const ve = c.getElementsByTagName("v")[0]; v = ve ? ve.textContent : ""; if(t==="s") v = shared[Number(v)] ?? ""; else if(t==="b") v = v==="1"?"TRUE":"FALSE"; }
        row[idx] = v;

}
function parseCsv(text){
  const rows = []; let row = [], cur = "", q = false;
  text = String(text||"").replace(/^﻿/,"");
  const delim = (text.split("\n")[0].match(/;/g)||[]).length > (text.split("\n")[0].match(/,/g)||[]).length ? ";" : (text.split("\n")[0].includes("\t") && !text.split("\n")[0].includes(",") ? "\t" : ",");
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur.replace(/\r$/,"")); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

async function handleImportData(inputEl){

function impParty(o){
  const I = state.imp;
  const tt = o.type.toLowerCase();
  const typeInFile = /supp|vendor|creditor|seller|cust|buyer|debtor|client/.test(tt);
  const type = /supp|vendor|creditor|seller/.test(tt) ? "supplier" : /cust|buyer|debtor|client/.test(tt) ? "customer" : I.defaultType;

  else if(/pay|\bcr\b|credit|give/.test(bt)) owesMe = false;
  else if(I.positive==="receive") owesMe = bal>=0;
  else if(I.positive==="pay") owesMe = bal<0;

  const st = stateFromText(o.state) || (dg&&dg.stateName) || stateFromText(o.street);

    addrStreet:o.street, addrCity:o.city, state: st, addrPincode: (o.pincode.match(/\d{6}/)||(o.street.match(/\b\d{6}\b/)||[""]))[0],
    openingBalance: Math.abs(bal), openingType: owesMe ? "receive" : "pay", creditDays: Math.max(0, Math.floor(numVal(o.creditDays)||0)), creditLimit: numVal(o.creditLimit)>0 ? numVal(o.creditLimit) : null,
    shipSame: !o.shipping || o.shipping===o.street, ship: o.shipping && o.shipping!==o.street ? {name:"", street:o.shipping, city:"", state:stateFromText(o.shipping)||st, pincode:(o.shipping.match(/\b\d{6}\b/)||[""])[0], phone:""} : null };
}
function impItem(o){
  const gst = numVal(String(o.gst).replace(/gst\s*@?/i,""));
  const st = numVal(o.stock);
  const unitRaw = o.unit.toLowerCase().replace(/[^a-z]/g,"");
  const unit = ({pcs:"pcs",pc:"pcs",piece:"pcs",pieces:"pcs",nos:"pcs",no:"pcs",mtr:"mtr",mtrs:"mtr",meter:"mtr",meters:"mtr",metre:"mtr",m:"mtr",kg:"kg",kgs:"kg",g:"g",gm:"g",ltr:"ltr",l:"ltr",ml:"ml",box:"box",set:"set",sets:"set",hr:"hr"})[unitRaw] || (unitRaw||"pcs");

function impRun(){
  const I = state.imp; const recs = impRecords(); let added=0, updated=0, skipped=0;

      const ex = state.data.parties.find(p=>(x.gstin && String(p.gstin||"").toUpperCase()===x.gstin) || p.name.trim().toLowerCase()===x.name.toLowerCase());

      if(it){ if(I.dupes==="skip"){ skipped++; continue; } Object.assign(it, Object.fromEntries(Object.entries(x).filter(([k,v])=>v!=="" && v!=null && !(typeof v==="number" && v===0 && it[k]) && !(k==="unit" && !(I.map.unit>=0))))); updated++; }

// ---------------- barcode camera scanner ----------------
let _scannerStream = null;
let _scannerTimer = null;

function openScanner(targetInputId){
  syncItemDraftFromDOM();
  state.scannerTarget = targetInputId;
  state.scannerOpen = true;
  state.scannerError = null;
  render();
  requestAnimationFrame(startScannerCamera);
}

async function startScannerCamera(){
  const video = document.getElementById("scanner-video");
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.scannerError = "unsupported"; render(); return;
  }
  try{
    _scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = _scannerStream;
    await video.play();
  }catch(e){
    state.scannerError = "denied"; render(); return;
  }
  if("BarcodeDetector" in window){
    let detector;
    try{ detector = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"] }); }
    catch(e){ state.scannerError = "unsupported"; render(); return; }
    _scannerTimer = setInterval(async ()=>{
      if(!video.videoWidth) return;
      try{
        const codes = await detector.detect(video);
        if(codes && codes.length>0) onScanDetected(codes[0].rawValue);
      }catch(e){ /* transient detection error, keep trying */ }
    }, 350);
  } else {
    state.scannerError = "unsupported";
    render();
  }
}

function onScanDetected(value){
  const targetId = state.scannerTarget;
  closeScanner();
  if(targetId==="__einv"){
    const q = parseEinvoiceQr(value);
    if(!q){ toast("That isn't an e-invoice QR — try the photo option"); state.modal={type:"scan-purchase"}; render(); return; }
    const own = String(state.data.profile?.gstin||"").toUpperCase();
    startScanReview({ supplierGstin: q.sellerGstin!==own ? q.sellerGstin : "", number:q.number, date:q.date, total:q.total, taxable:null,
      cgst:null, sgst:null, igst:null, overallRate:null, lines:[], irn:q.irn, qrHsn:q.hsn }, {qr:true, preview:""});
    return;
  }
  if(targetId==="__itempick"){
    const v = String(value||"").trim();
    const it = state.data.items.find(i=>String(i.itemCode||"").trim()===v) || state.data.items.find(i=>i.name.trim().toLowerCase()===v.toLowerCase());
    if(it){ ipAdd(it.id); toast(it.name+" added"); } else { state.search.itemPick = v; render(); toast("No item with code "+v); }
    return;
  }
  if(targetId==="f-itemcode" && state.itemDraft) state.itemDraft.itemCode = value;
  render(); mountNav();
  toast("Scanned: "+value);
}

function submitManualScan(){
  const el = document.getElementById("scanner-manual");
  const v = (el?.value||"").trim();
  if(!v){ toast("Type a code first"); return; }
  onScanDetected(v);
}

function closeScanner(){
  if(_scannerTimer){ clearInterval(_scannerTimer); _scannerTimer=null; }
  if(_scannerStream){ _scannerStream.getTracks().forEach(tr=>tr.stop()); _scannerStream=null; }
  state.scannerOpen = false;
  state.scannerError = null;
  render();
}

function renderScanner(){
  const root = document.getElementById("scanner-root");
  if(!root) return;
  if(!state.scannerOpen){ root.innerHTML=""; return; }
  root.innerHTML = `
  <div style="position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--safe-top)) 16px 12px;flex-shrink:0;">
      <span style="color:#fff;font-size:14px;font-weight:600;">Scan barcode</span>
      <button onclick="closeScanner()" style="width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:15px;">✕</button>
    </div>
    <div style="flex:1;position:relative;overflow:hidden;background:#111;">
      <video id="scanner-video" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;display:block;"></video>
      ${!state.scannerError ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
        <div style="width:76%;max-width:320px;aspect-ratio:2/1;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 1000px rgba(0,0,0,0.4);"></div>
      </div>
      <div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:12px;">Point the camera at a barcode</div>` : ""}
      ${state.scannerError==="denied"?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff;font-size:13px;background:rgba(0,0,0,.75);">Camera access was denied. Allow the camera permission for this site in your browser settings, or type the code below.</div>`:""}
      ${state.scannerError==="unsupported"?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff;font-size:13px;background:rgba(0,0,0,.75);">In-app barcode scanning needs Chrome on Android. Type the code below instead — it works everywhere.</div>`:""}
    </div>
    <div style="padding:16px;padding-bottom:calc(16px + var(--safe-bottom));background:#111;flex-shrink:0;">
      <div style="display:flex;gap:8px;">
        <input id="scanner-manual" placeholder="Or type the code manually" style="flex:1;" onkeydown="if(event.key==='Enter')submitManualScan()"/>

  </div>`;
}
