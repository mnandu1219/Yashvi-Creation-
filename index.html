// Online GSTIN lookup (legal/trade name + registered address). Uses the AppyFlow GST API with the
// key saved in Business settings; results are cached so the same GSTIN is only looked up once.
const _gstCache = {};
async function lookupGstin(gstin){
  if(_gstCache[gstin]) return _gstCache[gstin];
  const key = state.data.profile?.gstApiKey;
  if(!key) throw new Error("no API key");
  const url = "https://appyflow.in/api/verifyGST?gstNo="+encodeURIComponent(gstin)+"&key_secret="+encodeURIComponent(key);
  const ctl = ("AbortController" in window) ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(), 12000) : null;
  let res;
  try{ res = await fetch(url, ctl?{signal:ctl.signal}:{}); } finally { if(timer) clearTimeout(timer); }
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j = await res.json();
  if(j.error || j.message && !j.taxpayerInfo) throw new Error(String(j.message||"not found"));
  const ti = j.taxpayerInfo || j;
  const a = (ti.pradr && ti.pradr.addr) || {};
  const street = [a.flno, a.bno, a.bnm, a.st, a.loc].map(x=>String(x||"").trim()).filter(Boolean).join(", ");
  const code = gstin.slice(0,2);
  const info = {
    name: String(ti.tradeNam||ti.lgnm||"").trim(), legalName: String(ti.lgnm||"").trim(),
    street, city: String(a.dst||a.city||a.loc||"").trim(), pincode: String(a.pncd||"").trim(),
    state: GST_STATE_CODE_MAP[code] || String(a.stcd||"").trim(), status: String(ti.sts||"").trim()
  };
  if(!info.name) throw new Error("no details returned");
  _gstCache[gstin] = info;
  return info;
}
function gstFetchIntoDraft(gstin, keepName){
  const d = state.partyDraft; if(!d) return;
  d._gstLookupMsg = "Looking up GST records…"; d._gstNeed = null;
  lookupGstin(gstin).then(info=>{
    const dd = state.partyDraft; if(!dd || String(dd.gstin||"").toUpperCase()!==gstin) return;
    syncPartyDraftFromDOM();
    if(info.name && (!dd.name || !keepName)) dd.name = info.name;
    if(info.street) dd.addrStreet = info.street;
    if(info.city) dd.addrCity = info.city;
    if(info.pincode) dd.addrPincode = info.pincode;
    if(info.state) dd.addrState = info.state;
    dd._tab = "business";
    dd._gstLookupMsg = "✓ Filled from GST records: "+(info.legalName||info.name||"")+(info.status?" · "+info.status:"")+(dd.phone?"":" — add the mobile number (GST records don't include it)");
    dd._gstNeed = null;
    render();
  }).catch(err=>{
    const dd = state.partyDraft; if(!dd || String(dd.gstin||"").toUpperCase()!==gstin) return;
    const m = String(err&&err.message||"");
    dd._gstNeed = "failed";
    dd._gstLookupMsg = /Failed to fetch|NetworkError|Load failed|abort/i.test(m)
      ? "Couldn't reach the GST lookup service (no internet, or it blocked this app). PAN and state are filled."
      : "GST lookup didn't return details ("+m+"). Check the key in Business settings. PAN and state are filled.";
    render();
  });
}
// Paste the GST portal's "Search Taxpayer" result (select all → copy) and pull the details out of it.
const PORTAL_LABELS = ["Legal Name of Business","Trade Name","Effective Date of registration","Constitution of Business","GSTIN / UIN Status","GSTIN/UIN Status","Taxpayer Type","Administrative Office","Other Office","Principal Place of Business","Additional Place of Business","Whether Aadhaar Authenticated","Whether e-KYC Verified","Nature Of Core Business Activity","Nature of Business Activities","Dealing In Goods","Date of Cancellation","Field Visit Conducted","State Jurisdiction","Centre Jurisdiction","GSTIN/UIN","GSTIN / UIN","Search Result based on GSTIN/UIN"];
function parsePortalText(text){
  const lines = String(text||"").replace(/\r/g,"").split("\n").map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const isLabel = l => PORTAL_LABELS.some(L=>l.toLowerCase().startsWith(L.toLowerCase()));
  const get = (label, multi) => {
    const i = lines.findIndex(l=>l.toLowerCase().startsWith(label.toLowerCase()));
    if(i<0) return "";
    let rest = lines[i].slice(label.length).replace(/^[\s:\-–]+/,"").trim();
    const out = rest ? [rest] : [];
    for(let j=i+1; j<lines.length && (multi || !out.length); j++){ if(isLabel(lines[j])) break; out.push(lines[j]); if(!multi) break; }
    return out.join(", ").trim();
  };
  const legal = get("Legal Name of Business"), trade = get("Trade Name");
  const addr = get("Principal Place of Business", true);
  const status = get("GSTIN / UIN Status") || get("GSTIN/UIN Status");
  const gm = String(text||"").toUpperCase().match(/\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b/);
  const out = {legal, trade, name: trade || legal, status, gstin: gm ? gm[0] : "", street:"", city:"", pincode:"", state:""};
  if(addr){
    const pin = addr.match(/\b(\d{6})\b/); if(pin) out.pincode = pin[1];
    const parts = addr.replace(/\b\d{6}\b/,"").split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);
    const si = parts.findIndex(p_=>INDIAN_STATES.some(st=>st.toLowerCase()===p_.toLowerCase()));
    if(si>=0){ out.state = INDIAN_STATES.find(st=>st.toLowerCase()===parts[si].toLowerCase()); parts.splice(si); }
    const dedup = parts.filter((x,i)=>i===0 || x.toLowerCase()!==parts[i-1].toLowerCase());
    if(dedup.length>1){ out.city = dedup[dedup.length-1]; dedup.pop(); if(dedup.length && dedup[dedup.length-1].toLowerCase()===out.city.toLowerCase()) dedup.pop(); }
    out.street = dedup.join(", ");
    out.city = out.city.replace(/\b\w/g,c=>c.toUpperCase()).replace(/\B\w+/g,w=>w.toLowerCase());
  }
  return out;
}
function gstApplyPasted(text){
  const d = state.partyDraft; if(!d) return;
  syncPartyDraftFromDOM();
  const info = parsePortalText(text);
  if(!info.name && !info.street){ toast("Couldn't find the details — copy the whole result page from the GST portal"); return; }
  if(info.gstin && d.gstin && info.gstin!==String(d.gstin).toUpperCase()){ if(!confirm(`The pasted details are for ${info.gstin}, not ${d.gstin}. Use them anyway?`)) return; }
  if(!d.gstin && info.gstin){ d.gstin = info.gstin; const dec = decodeGSTIN(info.gstin); d._gstinHint = dec; if(dec.formatOk) d.panNumber = dec.pan; }
  if(info.name) d.name = info.name;
  if(info.street) d.addrStreet = info.street;
  if(info.city) d.addrCity = info.city;
  if(info.pincode) d.addrPincode = info.pincode;
  if(info.state) d.addrState = info.state;
  d._tab = "business"; d._gstNeed = null; d._showPaste = false;
  d._gstLookupMsg = "✓ Filled from GST portal details: "+(info.legal||info.name)+(info.status?" · "+info.status:"")+(d.phone?"":" — add the mobile number (not on GST records)");
  render();
}
async function gstPasteFromClipboard(){
  try{ const t = await navigator.clipboard.readText(); if(!t) throw new Error("empty"); gstApplyPasted(t); }
  catch(e){ state.partyDraft._showPaste = true; render(); toast("Paste the copied text into the box"); setTimeout(()=>document.getElementById("f-gstpaste")?.focus(), 80); }
}
function gstPortalLookup(){
  const g = String(state.partyDraft?.gstin||"").toUpperCase();
  try{ navigator.clipboard && navigator.clipboard.writeText(g); }catch(e){}
  window.open("https://services.gst.gov.in/services/searchtp", "_blank", "noopener");
  if(state.partyDraft){ state.partyDraft._portalOpened = true; render(); }
  toast("GSTIN copied — search it on the portal, then copy the result and come back");
}
function gstSaveKeyAndFetch(){
  const el = document.getElementById("f-gstkey-inline"); const k = (el?.value||"").trim();
  if(!k){ toast("Paste your GST lookup key first"); el?.focus(); return; }
  state.data.profile = {...(state.data.profile||{}), gstApiKey: k}; saveData();
  syncPartyDraftFromDOM();
  const g = String(state.partyDraft?.gstin||"").toUpperCase();
  if(g.length===15) gstFetchIntoDraft(g, false);
  render();
}
function onGstinInput(val){
  const upper = val.toUpperCase();
  if(state.partyDraft){
    syncPartyDraftFromDOM();
    const d = state.partyDraft;
    d.gstin = upper;
    if(upper.length===15){
      const decoded = decodeGSTIN(upper);
      d._gstinHint = decoded;
      if(decoded.formatOk){
        d.panNumber = decoded.pan;
        if(decoded.stateName) d.addrState = decoded.stateName;
        d._gstLookupMsg = "";
        // 1) someone you already have with this GSTIN (e.g. a customer who is also a supplier)
        const known = state.data.parties.find(x=>x.id!==d._id && String(x.gstin||"").toUpperCase()===upper);
        if(known){
          if(!d.name) d.name = known.name;
          if(!d.phone) d.phone = known.phone||"";
          if(!d.addrStreet) d.addrStreet = known.addrStreet||known.address||"";
          if(!d.addrCity) d.addrCity = known.addrCity||"";
          if(!d.addrPincode) d.addrPincode = known.addrPincode||"";
          d._gstLookupMsg = "✓ Filled from your existing party “"+known.name+"”";
          d._gstNeed = null;
        } else {
          // same PAN = same business registered in another state: name and phone carry over
          const samePan = state.data.parties.find(x=>x.id!==d._id && (String(x.panNumber||"").toUpperCase()===decoded.pan || String(x.gstin||"").toUpperCase().slice(2,12)===decoded.pan));
          if(samePan){ if(!d.name) d.name = samePan.name; if(!d.phone) d.phone = samePan.phone||""; }
          d._gstNeed = null;
          if(state.data.profile?.gstApiKey) gstFetchIntoDraft(upper, !!samePan);
          else { d._gstNeed = "nokey"; d._gstLookupMsg = samePan ? "✓ Name and phone copied from “"+samePan.name+"” (same PAN). PAN and state filled." : "✓ Valid GSTIN — PAN and state filled."; }
        }
      }
      render(); refocus('#f-gstin');
    } else if(d._gstinHint){
      d._gstinHint = null;
      render(); refocus('#f-gstin');
    }
  } else {
    // business profile modal — plain DOM update, no redraw needed
    const hintEl = document.getElementById("gstin-hint-profile");
    if(upper.length===15){
      const decoded = decodeGSTIN(upper);
      if(decoded.formatOk){
        const panEl = document.getElementById("f-bpan"); if(panEl) panEl.value = decoded.pan;
        const stateEl = document.getElementById("f-bstate"); if(stateEl && decoded.stateName) stateEl.value = decoded.stateName;
      }
      if(hintEl){ const i=gstinHintInfo(decoded); hintEl.style.color=i.color; hintEl.textContent=i.text; }
    } else if(hintEl){ hintEl.textContent=""; }
  }
}

// ---------------------------------------------------------------------------------------------
// Invoice output: every Print / Download / Share goes through ONE pipeline, with no external
// libraries (nothing to fail to load from a CDN, works offline):
//   1. build each copy as a real A4 page (794 x 1123 CSS px = 210 x 297 mm), full bleed,
//      background covering the whole page, totals pinned to the bottom;
//   2. rasterise that page at high resolution (SVG foreignObject -> canvas), so the logo and
//      text stay sharp;
//   3. wrap the page images in a small hand-written PDF (A4 pages) — or, for Print, place the
//      same images into the print area so the phone's print dialog gets exactly the PDF look.
// ---------------------------------------------------------------------------------------------
const A4_W = 794, A4_H = 1123, RENDER_SCALE = 2.6;
const COPY_LABELS = {
  ORIGINAL:"ORIGINAL FOR RECIPIENT",
  DUPLICATE:"DUPLICATE FOR TRANSPORTER",
  TRIPLICATE:"TRIPLICATE FOR SUPPLIER",
};
function docNeedsCopies(doc){ const m = doc && DOC_META[doc.docType]; return !!(m && m.financial && m.group==="sales"); }
// Invoice Settings preview: the page is drawn with the theme being chosen (not yet saved), and a sample
// bill when there is none yet. Only set inside a queued render, so other renders never see it.
let _themeOverride = null, _renderDocOverride = null;
function activeTheme(){ return _themeOverride || state.data.profile?.invoiceTheme || DEFAULT_THEME; }
function docForRender(id){ return _renderDocOverride && _renderDocOverride.id===id ? _renderDocOverride : state.data.docs.find(d=>d.id===id); }
function copyLabelsFor(doc, choice){
  if(!docNeedsCopies(doc)) return [null];
  if(choice==="ALL") return [COPY_LABELS.ORIGINAL, COPY_LABELS.DUPLICATE, COPY_LABELS.TRIPLICATE];
  return [COPY_LABELS[choice] || COPY_LABELS.ORIGINAL];
}
function buildBillHTMLForDoc(docId, copyLabel, opts){
  const doc = docForRender(docId);
  if(!doc) return "";
  const t = computeDocTotals(doc);
  const p = party(doc.partyId);
  const biz = state.data.profile;
  let theme = activeTheme();
  if(opts && opts.noBackground) theme = {...theme, backgroundUrl:null};
  const html = billCardHTML(theme, biz, p, t.meta, doc.number, doc.date, t, doc, copyLabel, opts && opts.pg);
  if(!doc.cancelled) return html;
  return html.replace(/(<div class="paper-bill[^"]*"[^>]*>)/, `$1<img class="void-stamp" src="${cancelStampDataUri()}" alt="Cancelled" style="position:absolute;left:50%;top:250px;width:440px;height:220px;margin-left:-220px;z-index:6;pointer-events:none;"/>`);
}
function waitForImages(root, ms){
  // an image that failed to load is "complete" too — it is simply left out of the page
  const imgs = Array.from(root.querySelectorAll("img"));
  const one = img => img.complete ? Promise.resolve() : new Promise(res => {
    const done = () => { img.removeEventListener("load", done); img.removeEventListener("error", done); res(); };
    img.addEventListener("load", done); img.addEventListener("error", done); });
  return Promise.race([Promise.all(imgs.map(one)), new Promise(res => setTimeout(res, ms || 8000))]);
}
// Lays one copy out as an A4 page inside the (off-screen) print area and returns its element.
// Boxed (Textile) invoices longer than one page: every page is a complete invoice sheet — full
// company / party / invoice header at the top and the terms, bank, declaration and signature at the
// bottom. Item rows are split across the pages with "Carried Forward" / "Brought Forward" totals, and
// the tax summary and Grand Total appear only on the last page so no page shows a misleading total.
async function layoutBoxedPages(docId, copyLabel, doc, theme){
  const t = computeDocTotals(doc);
  const all = t.lines;
  const host = layoutHost();
  const stack = document.createElement("div");
  stack.className = "a4-stack";
  stack.style.cssText = "position:relative;width:"+A4_W+"px;";
  host.appendChild(stack);
  const mkPage = async (pg) => {
    const el = document.createElement("div");
    el.className = "a4-page";
    el.style.height = A4_H+"px"; el.style.background = "transparent";
    el.innerHTML = buildBillHTMLForDoc(docId, copyLabel, {noBackground:true, pg});
    stack.appendChild(el);
    await waitForImages(el);
    const bill = el.querySelector(".paper-bill");
    bill.style.minHeight = "0px";
    return {el, bill};
  };
  const sums = (arr) => arr.reduce((a,l)=>({qty:a.qty+Number(l.qty||0), amt:a.amt+Number(l.gross||0)}), {qty:0, amt:0});
  const plan = [];
  let start = 0, bf = null, guard = 0;
  while(start < all.length && guard++ < 200){
    const rest = all.slice(start);
    // Does everything that is left fit on this page as the final page?
    const lastTry = await mkPage({lines:rest, start, pageNo:plan.length+1, pageCount:plan.length+1, isLast:true, bf, cf:null});
    const fitsLast = lastTry.bill.offsetHeight <= A4_H;
    lastTry.el.remove();
    if(fitsLast){ plan.push({lines:rest, start, bf, isLast:true}); start = all.length; break; }
    // Otherwise fill this page with as many rows as fit, followed by "Carried Forward".
    // Always leave at least one row for the final page (the page that carries the Grand Total).
    let k = Math.max(1, rest.length-1);
    if(rest.length===1){ plan.push({lines:rest, start, bf, isLast:true}); start = all.length; break; }
    const probe = await mkPage({lines:rest.slice(0,k), start, pageNo:plan.length+1, pageCount:plan.length+2, isLast:false, bf, cf:sums(all.slice(0,start+k))});
    const rows = [...probe.bill.querySelectorAll(".bx-items tbody tr:not(.bf-row)")];
    let over = probe.bill.offsetHeight - A4_H;
    while(k>1 && over>0){ k--; over -= rows[k].getBoundingClientRect().height; }
    probe.el.remove();
    // Confirm (row heights can shift slightly) and step back if needed.
    for(;;){
      const chk = await mkPage({lines:rest.slice(0,k), start, pageNo:plan.length+1, pageCount:plan.length+2, isLast:false, bf, cf:sums(all.slice(0,start+k))});
      const ok = chk.bill.offsetHeight <= A4_H; chk.el.remove();
      if(ok || k<=1) break; k--;
    }
    plan.push({lines:rest.slice(0,k), start, bf, isLast:false});
    start += k;
    bf = sums(all.slice(0,start));
  }
  if(plan.length===0 || !plan[plan.length-1].isLast) plan.push({lines:[], start:all.length, bf:all.length?sums(all):null, isLast:true});
  const pageCount = plan.length;
  for(let i=0;i<pageCount;i++){
    const pl = plan[i];
    const {el, bill} = await mkPage({...pl, pageNo:i+1, pageCount, cf: sums(all.slice(0, pl.start+pl.lines.length))});
    bill.style.minHeight = A4_H+"px";
    // stretch the item columns down to the footer block

// Minimal PDF writer: one full-bleed JPEG per A4 page. pages: [{blob, w, h}]
async function jpegPagesToPdf(pages){
  const enc = new TextEncoder();
  const chunks = []; let length = 0; const offsets = [];
  const push = d => { const u = typeof d==="string" ? enc.encode(d) : d; chunks.push(u); length += u.length; };
  const startObj = n => { offsets[n] = length; push(`${n} 0 obj\n`); };
  const PW = 595.28, PH = 841.89;
  push("%PDF-1.4\n%âãÏÓ\n");
  const n = pages.length;
  const kids = [];
  for(let i=0;i<n;i++) kids.push(`${3+i*3} 0 R`);
  startObj(1); push("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  startObj(2); push(`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${n} >>\nendobj\n`);
  for(let i=0;i<n;i++){
    const pageNo = 3+i*3, imgNo = pageNo+1, contentNo = pageNo+2;
    const jpeg = new Uint8Array(await pages[i].blob.arrayBuffer());
    startObj(pageNo);
    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${imgNo} 0 R >> >> /Contents ${contentNo} 0 R >>\nendobj\n`);
    startObj(imgNo);
    push(`<< /Type /XObject /Subtype /Image /Width ${pages[i].w} /Height ${pages[i].h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
    push(jpeg);
    push("\nendstream\nendobj\n");
    const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    startObj(contentNo);
    push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  }
  const total = 2 + n*3;
  const xrefAt = length;
  let xref = `xref\n0 ${total+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=total;i++) xref += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  push(xref);
  push(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xrefAt}\n%%EOF\n`);
  return new Blob(chunks, {type:"application/pdf"});
}

// Turns a phone photo of a signature into clean ink on a transparent background: the paper (and
// uneven light / shadows) is removed, the ink is kept in its own colour, and the image is cropped
// tight around the signature so it prints crisp and the right size on the invoice.
function cleanSignatureImage(img){
  const maxSide = 1400, r0 = Math.min(1, maxSide/Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
  const W = Math.max(1, Math.round((img.naturalWidth||img.width)*r0)), H = Math.max(1, Math.round((img.naturalHeight||img.height)*r0));
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d", {willReadFrequently:true}); g.fillStyle = "#fff"; g.fillRect(0,0,W,H); g.drawImage(img, 0, 0, W, H);
  const im = g.getImageData(0,0,W,H), d = im.data;
  // local paper brightness: a heavily blurred copy of the photo (ink is thin, so it barely shows)
  const bw = Math.max(4, Math.round(W/24)), bh = Math.max(4, Math.round(H/24));
  const b = document.createElement("canvas"); b.width = bw; b.height = bh;
  const bg = b.getContext("2d", {willReadFrequently:true}); bg.imageSmoothingEnabled = true; bg.imageSmoothingQuality = "high"; bg.drawImage(c, 0, 0, bw, bh);
  const big = document.createElement("canvas"); big.width = W; big.height = H;
  const bgg = big.getContext("2d", {willReadFrequently:true}); bgg.imageSmoothingEnabled = true; bgg.imageSmoothingQuality = "high"; bgg.filter = "blur(2px)"; bgg.drawImage(b, 0, 0, W, H);
  const bd = bgg.getImageData(0,0,W,H).data;
  let minX=W, minY=H, maxX=-1, maxY=-1;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i = (y*W+x)*4;
    const L = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const Lb = 0.299*bd[i] + 0.587*bd[i+1] + 0.114*bd[i+2];
    const diff = Lb - L;                                   // how much darker than the paper around it
    const a = Math.max(0, Math.min(1, (diff - 28) / 55));
    if(a <= 0){ d[i+3] = 0; continue; }
    // deepen the ink colour a little so it prints strongly
    const k = 0.85; d[i] = d[i]*k; d[i+1] = d[i+1]*k; d[i+2] = d[i+2]*k; d[i+3] = Math.round(a*255);

  minX = Math.max(0, minX-pad); minY = Math.max(0, minY-pad); maxX = Math.min(W-1, maxX+pad); maxY = Math.min(H-1, maxY+pad);
  const cw = maxX-minX+1, ch = maxY-minY+1, r = Math.min(1, 700/cw, 280/ch);
  const out = document.createElement("canvas"); out.width = Math.max(1, Math.round(cw*r)); out.height = Math.max(1, Math.round(ch*r));
  const og = out.getContext("2d"); og.imageSmoothingQuality = "high"; og.drawImage(c, minX, minY, cw, ch, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

    ${(()=>{ const cur = state.shareDraft ?? (state.data.profile?.shareFormat || "ask");

}

}

  else if(action==="tx-range"){ state.txRange = t.dataset.range; render(); }
  else if(action==="items-low"){ pickPref("itemFilter", state.itemFilter==="low" ? null : "low"); render(); mountNav(); }
  else if(action==="items-view"){ pickPref("itemsView", state.itemsView==="stock" ? null : "stock"); render(); }
  else if(action==="party-filter"){ pickPref("partyFilter", state.partyFilter===t.dataset.filter ? null : t.dataset.filter); render(); mountNav(); }
  else if(action==="tx-subtab"){ state.txSubTab=t.dataset.sub; render(); mountNav(); }
  else if(action==="open-doc"){ startDocViewSkeleton(id); navAnimate(state.modal?"none":"push", ()=>{ state.view={name:"docDetail", id}; render(); mountNav(); window.scrollTo(0,0); }); }
  else if(action==="party-view-tab"){ state.partyTab = t.dataset.tab; state.noteEdit=false; render(); mountNav(); }
  else if(action==="save-party-notes"){ const p_ = party(id); if(!p_) return; p_.notes = (document.getElementById("f-party-notes")?.value||"").trim(); state.noteEdit=false; if(saveData()){ render(); toast("Notes saved"); } }
  else if(action==="stmt-pdf"){ state.output=null; state.modal={type:"stmt-output", id, stage:"working"}; render(); startStatementOutput(id); }
  else if(action==="open-ledger"){ if(!(state.view && state.view.name==="partyLedger" && state.view.id===id)){ state.partyTab="tx"; state.partyRange=_prefs.partyRange || "last365"; state.noteEdit=false; } navAnimate(state.modal?"none":"push", ()=>{ state.modal=null; state.view={name:"partyLedger", id}; render(); mountNav(); window.scrollTo(0,0); }); }
  else if(action==="start-doc"){ state.docDraft=null; const dd = ensureDraft(t.dataset.type);
    const pid = t.dataset.party; if(pid && party(pid)){ dd.partyId = pid; const cd = Number(party(pid).creditDays)||0;
      if(cd>0 && DOC_META[dd.docType]?.financial){ const [y,m,x] = dd.date.split("-").map(Number); dd.dueDate = new Date(Date.UTC(y,m-1,x+cd)).toISOString().slice(0,10); } }
    showLoading(360); state.search.itemPick = ""; state.search.partyPicker = "";
    navAnimate(state.modal?"none":"push", ()=>{ state.modal=null; state.view={name:"docNew"}; render(); mountNav(); window.scrollTo(0,0); }); }
  else if(action==="pick-period"){ const k = t.dataset.key; if(t.dataset.ctx==="party") pickPref("partyRange", k); else { homeState().range = k; setPref("homeRange", k); homeState().limit = 30; homeReloadAfter(); } if(state.modal) closeModalNow(); else { render(); mountNav(); } }
  else if(action==="pick-sort"){ homeState().sort = t.dataset.key; setPref("homeSort", t.dataset.key); homeState().limit = 30; homeReloadAfter(); closeModalNow(); }
  else if(action==="pick-listfilter"){ const g = t.dataset.grp, k = t.dataset.key;
    if(g==="ptype") pickPref("partyType", k); if(g==="psort") pickPref("partySort", k); if(g==="itype") pickPref("itemType", k); if(g==="isort") pickPref("itemSort", k);

    render(); }
  else if(action==="toggle-search"){ const k = t.dataset.k; state.showSearch = state.showSearch===k ? null : k; if(!state.showSearch) state.search[k] = ""; render(); if(state.showSearch) refocusById({parties:"party-q", items:"item-q", reports:"rep-q"}[k]); }
  else if(action==="item-view-tab"){ state.itemTab = t.dataset.tab; render(); }
  else if(action==="item-edit-pp"){ state.itemDraft=null; state.modal={type:"item", id}; ensureItemDraft(id); state.itemDraft._tab="partyprices"; render(); }
  else if(action==="discard-keep"){ state.discardAsk=false; renderModal(); }
  else if(action==="discard-go"){ state.discardAsk=false; state._discardOK=true;
    if(history.state && history.state.sig && history.state.sig.modal && !history.state.root && state.modal && history.state.sig.modal.type===state.modal.type) history.back();
    else { state._discardOK=false; state.numDraft=null; state.modal=null; state.itemDraft=null; state.partyDraft=null; render(); mountNav(); } }
  else if(action==="edit-doc"){ const dd = state.data.docs.find(x=>x.id===id); if(dd && dd.cancelled){ bannerError("Cancelled invoice can't be edited"); return; } state.menuOpen=null; showLoading(300); startEditDoc(id); }

  else if(action==="add-line"){
    const item = state.data.items.find(i=>i.id===id);
    const d = ensureDraft();
    const existing = d.items.find(l=>l.itemId===item.id);
    if(existing) existing.qty += 1;
    else d.items.push({itemId:item.id, name:item.name, hsn:item.hsn||"", size:item.size||"", unit:item.unit||"", qty:1, price:effectivePrice(item,d.partyId), discPercent:Number(item.discountPercent||0), taxRate:Number(item.taxRate||0), cessRate:0});
    render(); mountNav();
  }
  else if(action==="copy-line"){ const d=ensureDraft(); const i=Number(t.dataset.idx); if(d.items[i]){ d.items.splice(i+1,0,JSON.parse(JSON.stringify(d.items[i])));
      if(state.modal && state.modal.type==="line-edit"){ state._navReplace = true; state.modal = {type:"line-edit", id:String(i+1)}; toast("Item copied — change it here"); }
      else toast("Item copied — tap EDIT to change it");
      render(); mountNav(); } }
  else if(action==="line-edit"){ state.modal = {type:"line-edit", id:String(t.dataset.idx)}; render(); }
  else if(action==="le-done"){ closeModalNow(); }
  else if(action==="le-remove"){ const d=ensureDraft(); d.items.splice(Number(t.dataset.idx),1); closeModalNow(); toast("Item removed"); }
  else if(action==="ip-add"){ ipAdd(id); }
  else if(action==="ip-step"){ ipStep(id, Number(t.dataset.n)||0); }
  else if(action==="pp-create"){ const q = String(state.search.partyPicker||"").trim(), dg = q.replace(/\D/g,"");
    const pre = dg.length>=6 && dg.length===q.replace(/[\s+\-]/g,"").length ? {phone:dg} : {name:q};
    if(state.modal && state.modal.id==="pay") openPartyForPay(pre); else openPartyForDraft(pre); }
  else if(action==="pp-contacts"){ pickContact(); }
  else if(action==="save-numdate"){
    const d = ensureDraft(), m = state.modal; if(!m) return;
    const number = String(m.prefix||"") + String(m.serial||"");
    if(!number.trim()){ toast("Enter a prefix or a serial number"); return; }
    if(!m.date){ toast("Pick the date"); return; }
    if(!d._editingId && m.dtype && m.dtype!==d.docType){
      const oldG = DOC_META[d.docType].group, newG = DOC_META[m.dtype].group;
      d.docType = m.dtype;
      if(oldG!==newG){                                  // sales ⇄ purchase: the other side's party and prices don't apply
        d.partyId = ""; d.shipTo = ""; d.pos = "";
        for(const l of d.items){ const it = state.data.items.find(x=>x.id===l.itemId); if(it){ const nl = draftLineFor(it, d); l.price = nl.price; l.discPercent = nl.discPercent; delete l.discFlat; } }
      }
    }
    const cfg = numberingFor(d.docType), autoPre = cfg.prefix.replace(/\{FY\}/gi, fyToken(m.date));
    const clash = state.data.docs.find(x=>x.id!==d._editingId && x.docType===d.docType && String(x.number).trim().toLowerCase()===number.trim().toLowerCase());
    if(clash && !confirm(`${number} is already used by another ${DOC_META[d.docType].label}. Use it anyway?`)) return;
    const changedSeries = !d._editingId && m.typed && (number !== m.number0);
    d.date = m.date; d.number = number; d.dueDate = m.due || "";
    if(changedSeries && m.serial){ // later bills continue from this number with this prefix
      const nb = {...(state.data.profile?.numbering||{})};
      const fyPrefix = String(m.prefix)===autoPre && /\{FY\}/i.test(cfg.prefix);
      // with a {FY} prefix the serial starts again every year, so the typed serial isn't kept as a minimum
      nb[d.docType] = { prefix: String(m.prefix)===autoPre ? cfg.prefix : String(m.prefix), start: fyPrefix ? cfg.start : (Number(m.serial)||1), digits: /^0/.test(m.serial) ? Math.min(8, m.serial.length) : (cfg.digits===0 ? 0 : Math.min(8, Math.max(1, m.serial.length))) };
      state.data.profile = {...(state.data.profile||{}), numbering: nb}; saveData();
    }
    closeModalNow(); toast("Date & number updated");
  }
  else if(action==="doc-menu"){ state.menuOpen = state.menuOpen===id ? null : id; render(); }
  else if(action==="doc-menu-close"){ state.menuOpen = null; render(); }
  else if(action==="doc-menu-item"){ const k = t.dataset.item; state.menuOpen = null;
    const cm = COPY_MENU.find(x=>x[0]===k);
    if(cm) switchDocCopy(id, cm[1]);
    else if(k==="cnote") issueCreditNote(id);
    else if(k==="settings"){ state.modal = {type:"invoice-settings", itab:"theme", id}; render(); }
    else if(k==="payhist"){ state.modal = {type:"pay-history", id}; render(); }
    else if(k==="cancel"){ state.modal = {type:"cancel-doc", id, reason:"Order Cancelled"}; render(); } }
  else if(action==="cancel-reason"){ if(state.modal){ state.modal.reason = t.dataset.r; renderModal(); } }
  else if(action==="confirm-cancel"){ const m = state.modal; const r = m && m.reason==="Other" && String(m.other||"").trim() ? String(m.other).trim() : (m && m.reason);
    showLoading(480); if(cancelDocNow(id, r) && saveData()){ if(state.view && state.view.copy) delete state.view.copy; closeModalNow(); toast("Cancelled — stock, balances and GST updated"); } }
  else if(action==="ask-delete-doc"){ state.menuOpen = null; state.modal = {type:"delete-doc-ask", id}; render(); }
  else if(action==="confirm-delete"){ const dd = state.data.docs.find(x=>x.id===id);
    if(dd && dd.cancelled){ closeModalNow(); bannerError("Cancelled invoice can't be deleted"); return; }
    deleteDocNow(id); if(saveData()){ state.modal=null; state.view=null; render(); mountNav(); toast("Deleted"); } }
  else if(action==="doc-done"){ state.menuOpen = null; navGoBack(); }
  else if(action==="share-as"){ if(_outBusy) return;               // a second tap while it is already on its way
    const f = t.dataset.fmt, choice = t.dataset.choice || (state.modal && state.modal.choice) || "ORIGINAL";
    shareDocNow(id, choice, f); }
  else if(action==="share-ready-go"){ const r = _shareReadyFiles; if(r && r.files && r.files.length) shareFiles(r.files, r); }
  else if(action==="remove-line"){ const d=ensureDraft(); d.items.splice(Number(t.dataset.idx),1); render(); mountNav(); }

  else if(action==="pick-party"){ if(state.modal && state.modal.id==="pay") pickPartyForPay(id||""); else pickPartyForDraft(id||""); }

  else if(action==="save-doc"){
    const d = ensureDraft();
    const meta = DOC_META[d.docType];
    const andNew = t.dataset.then==="new";
    d.items = d.items.filter(l=>Number(l.qty)>0);
    if(!d.items.length){ toast("Add at least one item"); render(); return; }
    // Cash sale / cash purchase (no party selected) is settled on the spot — mark it fully paid automatically.
    const tSave = computeDocTotals(d);
    let autoPaid = meta.financial ? (d.partyId ? (d._paidFull && meta.ledgerSign>0 ? r2(Math.max(0, tSave.total - Number(d._linkedPaid||0))) : Math.max(0, Number(d.paidAmount)||0)) : tSave.total) : 0;
    const discSave = tSave.extraDiscPct>0 ? {extraDiscount: r2(tSave.extraDisc||0), extraDiscPct: tSave.extraDiscPct} : {extraDiscount: Math.max(0, Number(d.extraDiscount||0)||0), extraDiscPct: ""};
    if(meta.financial && d.partyId && meta.ledgerSign>0){
      const got = r2(autoPaid + Number(d._linkedPaid||0)), extra = r2(got - tSave.total), sales_ = meta.group==="sales";
      if(extra > 0.009 && extra > Number(d._extra0||0) + 0.009 && !confirm(`${sales_?"Received":"Paid"} on this bill: ${rupee(got)} — more than its total of ${rupee(tSave.total)}.\n\nKeep the extra ${rupee(extra)} as advance ${sales_?"from":"to"} ${partyName(d.partyId)}?`)) return;
    }
    if(String(d.transportName||"").trim()){ const tn = String(d.transportName).trim(); d.transportName = tn; const tl = state.data.profile?.transporters || [];
      if(!tl.includes(tn) && state.data.profile) state.data.profile.transporters = [...tl, tn]; }
    // credit / debit note adjustments against invoices
    let adjust = [];
    if(isNoteType(d.docType) && d.partyId){
      adjust = (d.adjust||[]).map(a=>({docId:a.docId, amt: Math.round((Number(a.amt)||0)*100)/100})).filter(a=>a.amt>0.004);
      const noteTotal = computeDocTotals(d).total;
      if(adjSum(adjust) > noteTotal + 0.01){ toast("Adjusted amount is more than this "+meta.label.toLowerCase()+"'s total"); return; }
      for(const a of adjust){
        const inv = state.data.docs.find(x=>x.id===a.docId);
        const prev = adjSum((d._prevAdjust||[]).filter(x=>x.docId===a.docId));
        const avail = inv ? computeDocTotals(inv).due + prev : 0;
        if(!inv || a.amt > avail + 0.01){ toast("Adjustment for "+(inv?inv.number:"an invoice")+" is more than its balance"); return; }
      }
      if(adjSum(adjust) + autoPaid > noteTotal + 0.01) autoPaid = Math.max(0, noteTotal - adjSum(adjust));
    }
    if(!String(d.number||"").trim()){ toast("Enter a document number"); return; }
    const clash = state.data.docs.find(x=>x.id!==d._editingId && x.docType===d.docType && String(x.number).trim().toLowerCase()===String(d.number).trim().toLowerCase());

      const existing = state.data.docs.find(x=>x.id===d._editingId);
      if(existing && existing.cancelled){ bannerError("Cancelled invoice can't be edited"); return; }
      if(existing){
        const oldMeta = DOC_META[existing.docType] || meta;
        // what was received with the bill itself vs. what payments / credit notes settled on it later
        const atBill = oldMeta.financial ? (directPaidMap()[existing.id] || 0) : 0;
        const linked = oldMeta.financial && !isNoteType(existing.docType) ? Math.max(0, r2(Number(existing.paidAmount||0) - atBill)) : 0;
        let keepLinked = linked;
        if(isNoteType(existing.docType)){ reverseNoteAdjust(existing); existing.adjust = []; existing.paidAmount = Math.max(0, Number(existing.paidAmount||0) - adjSum(d._prevAdjust)); }
        // Party changed (or became a cash sale): the old party's payments go back to them as advance and
        // their credit notes are taken off this bill — both stay with the old party.
        if(existing.partyId && existing.partyId!==d.partyId && oldMeta.financial && oldMeta.ledgerSign>0){
          detachNotesFrom(existing);
          releaseDocPayments(existing, Math.max(0, Number(existing.paidAmount||0) - atBill));
          keepLinked = 0;
        }
        existing.items.forEach(line=>{
          const it = state.data.items.find(x=>x.id===line.itemId);
          if(it && it.itemType!=="service") it.stock = Number(it.stock) - oldMeta.stockSign*Number(line.qty);
        });

        existing.partyId=d.partyId; existing.items=d.items;

        Object.assign(existing, docExtrasFromDraft(d));

        existing.lrNumber=d.lrNumber||""; existing.lrDate=d.lrDate||""; existing.parcels=d.parcels||""; existing.shipTo=d.shipTo||"";
        existing.items.forEach(line=>{

        render(); mountNav(); window.scrollTo(0,0); toast(meta.label+" updated");

// ---------- small shared pieces ----------
const SQ_TINTS = [["#EDF7EF","#3E8A56"],["#F1E6F5","#7A3F92"],["#FFF4DC","#A0741A"],["#E7F0FB","#2F5E9E"],["#FDECEC","#B5473C"],["#EAF3F3","#2F7D7D"]];
function sqTint(s){ const c = String(s||"?").toUpperCase().charCodeAt(0)||0; return SQ_TINTS[c % SQ_TINTS.length]; }
function sqHTML(s, cls){ const [bg,fg] = sqTint(s); return `<div class="sq ${cls||""}" style="background:${bg};color:${fg};">${esc(String(s||"?").trim().slice(0,1).toUpperCase())}</div>`; }
function shortDate(iso){ if(!iso) return ""; const [y,m,d] = iso.split("-").map(Number); const cy = Number(todayISO().slice(0,4));
  return `${d} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sept","Oct","Nov","Dec"][m-1]}${y!==cy?" "+y:""}`; }
function longDate(iso){ if(!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return `${String(d).padStart(2,"0")} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sept","Oct","Nov","Dec"][m-1]} ${y}`; }
function periodRangeText(o){ return o.key==="all" ? "All transactions" : `${longDate(o.from)} - ${longDate(o.to)}`; }
function rupee(v){ return "₹ " + Number(Math.abs(v)||0).toLocaleString("en-IN", {maximumFractionDigits: Math.abs(v)%1>0.004 ? 2 : 0, minimumFractionDigits: 0}); }
function dueText(d, t){
  if(!t.meta.financial || t.meta.ledgerSign<0 || !(t.due>0.004) || !d.dueDate) return "";
  const n = daysBetween(todayISO(), d.dueDate);
  return n>0 ? `${n} day(s) to due` : n===0 ? `<span style="color:#C98A12;">Due today</span>` : `<span style="color:#D8412F;">Overdue by ${-n} day(s)</span>`;
}
function payNo(p){ if(p && p.no) return p.no; const inflow = payInflow(p);
  const list = state.data.payments.filter(x=>payInflow(x)===inflow).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(String(a.id)<String(b.id)?-1:1));
  return list.findIndex(x=>x.id===p.id)+1; }
function nextPayNo(inflow){ let mx = 0; for(const x of state.data.payments) if(payInflow(x)===inflow){ const n = Number(payNo(x))||0; if(n>mx) mx = n; } return mx+1; }
function closeModalNow(){          // a sheet closed by its own action (Save, Apply, a pick) — never asks to discard
  if(history.state && history.state.sig && history.state.sig.modal && !history.state.root && state.modal && history.state.sig.modal.type===state.modal.type){ state._discardOK = true; _navBackAt = performance.now(); history.back(); }
  else { state.modal=null; render(); mountNav(); }
}
// A sheet closed with history.back() is gone only when the browser has moved back (a moment later).
// afterNav(fn) runs fn once that has happened, so a sheet opened right then isn't closed by it.
let _navBackAt = 0;
function afterNav(fn){
  const tick = ()=>{
    if(_navBackAt && performance.now() - _navBackAt < 3000) return setTimeout(tick, 50);    // still going back
    _navBackAt = 0; fn();
  };
  if(!_navBackAt) return fn();
  setTimeout(tick, 0);
}

// ---------- transaction card (Home + party screen) ----------
function txCardHTML(x, opts){
  opts = opts || {};
  if(x.kind==="doc"){
    const d = x.d, t = d.meta ? d : {...d, ...computeDocTotals(d)}, meta = DOC_META[d.docType];
    const fin = meta.financial, owed = fin && meta.ledgerSign>0 && d.partyId && t.due>0.004;
    const cx = !!d.cancelled;
    const st = cx ? `<span class="badge na">Cancelled</span>` : !fin ? "" : t.status==="paid" ? `<span class="badge paid">Paid</span>` : t.status==="partial" ? `<span class="badge partial">Partially paid</span>` : `<span class="badge">Unpaid</span>`;
    const dt = cx ? "" : dueText(d, t);
    const acts = owed ? (meta.group==="sales"
        ? `<button class="link-btn" data-action="open-modal-recpay" data-id="${d.id}">${ICONS.rupIn} Record Manually</button><button class="link-btn wa" data-action="pay-link" data-id="${d.id}">${ICONS.wa} Share Payment Link</button>`
        : `<button class="link-btn" data-action="open-modal-recpay" data-id="${d.id}">${ICONS.rupOut} Record Payment Out</button><span></span>`) : "";
    return `<div class="tcard"><div class="tb" data-action="open-doc" data-id="${d.id}">
      ${opts.noParty?"":`<div class="pn">${esc(partyName(d.partyId))}</div>`}
      <div class="r1"><span>${esc(meta.label)} #${esc(d.number)}</span><span class="a" style="${cx?'text-decoration:line-through;color:var(--sub);':''}">${rupee(t.total)}</span></div>
      <div class="r2"><span>${esc(shortDate(d.date))}${dt?` • ${dt}`:""}</span>${cx ? st : st && t.status!=="paid" ? st : (fin && t.status==="paid" && meta.ledgerSign>0 ? `<span style="color:#2E9E5B;font-weight:600;font-size:12.5px;">Paid</span>` : (!fin?`<span style="font-size:12px;">${meta.group==="sales"?"Sales":"Purchase"}</span>`:""))}</div>
      </div>${acts?`<div class="ta">${acts}</div>`:""}</div>`;
  }
  if(x.kind==="pay"){
    const p = x.p, inflow = payInflow(p), pr = party(p.partyId);
    return `<div class="tcard"><div class="tb" data-action="open-pay" data-id="${p.id}">
      ${opts.noParty?"":`<div class="pn">${esc(pr?pr.name:"(deleted party)")}</div>`}
      <div class="r1"><span>${inflow?"Received Payment":"Payment Out"} #${payNo(p)}</span><span class="a" style="color:${inflow?'#1E8C4E':'var(--tx)'};">${rupee(p.amount)}</span></div>
      <div class="r2"><span>${esc(shortDate(p.date))}${Number(p.discount)>0.004?` • Discount ${rupee(p.discount)}`:""}</span><span>${esc(p.mode||"Cash")}</span></div></div>
      ${pr?`<div class="ta"><span></span><button class="link-btn" data-action="pay-details" data-id="${p.id}">${ICONS.fwd} ${inflow?"Send Receipt":"Send Payment Details"}</button></div>`:""}</div>`;
  }
  if(x.kind==="open"){
    return `<div class="tcard"><div class="tb" style="cursor:default;"><div class="r1"><span>Opening Balance</span><span class="a">${rupee(x.amt)}</span></div>
      <div class="r2"><span>${x.sub}</span><span></span></div></div></div>`;
  }
  const e = x.e;
  return `<div class="tcard"><div class="tb" data-action="open-modal" data-modal="expense" data-id="${e.id}">
    <div class="pn">${esc(e.category)}</div>
    <div class="r1"><span>Expense</span><span class="a">${rupee(e.amount)}</span></div>
    <div class="r2"><span>${esc(shortDate(e.date))}${e.note?" • "+esc(e.note):""}</span><span>${esc(e.mode||"Cash")}</span></div></div></div>`;
}

// Scroll → header morph. p = how far the list has moved up towards the header (0 at the top, 1 when the
// cards reach the bottom of the collapsed header). Back at the very top the type filter / search go
// back to "All", the same as the reference app (the chips are only visible in the collapsed header).
function dashMetrics(){
  const H = document.getElementById("dash-hdr"), L = document.getElementById("home-list");
  if(!H || !L) return null;
  const colH = H.querySelector(".dh-top").offsetHeight + H.querySelector(".dh-chips").offsetHeight + H.querySelector(".dh-date").offsetHeight;
  const listTop = L.getBoundingClientRect().top + window.scrollY;
  return {H, L, colH, D: Math.max(1, listTop - colH)};
}
function onDashScroll(){
  if(state.view || state.tab!=="dashboard") return;
  const m = dashMetrics(); if(!m) return;
  const p = Math.max(0, Math.min(1, window.scrollY / m.D));
  state.dashP = p;
  m.H.style.setProperty("--p", p.toFixed(3));
  const col = p >= 0.995;
  if(col !== m.H.classList.contains("col")){
    m.H.classList.toggle("col", col);
    if(!col){ const a = document.activeElement; if(a && a.id==="home-q") a.blur(); }
  }
  state.dashCol = col;
  if(p===0 && !state.modal){ const h = homeState(); if(h.type!=="all" || h.q){ h.type="all"; h.q=""; h.limit=30; homeFlash(); } }
}
let _dashRaf = 0;
window.addEventListener("scroll", ()=>{ if(!_dashRaf) _dashRaf = requestAnimationFrame(()=>{ _dashRaf = 0; onDashScroll(); }); }, {passive:true});
window.addEventListener("resize", ()=>requestAnimationFrame(onDashScroll), {passive:true});
function dashToList(){ const m = dashMetrics(); if(m){ window.scrollTo(0, m.D); onDashScroll(); } }
// brief placeholder cards after a filter change / when coming back to the dashboard
function homeFlash(ms){
  state.homeLoading = true; render(); mountNav();
  clearTimeout(homeFlash._t);
  homeFlash._t = setTimeout(()=>{ state.homeLoading = false; render(); mountNav(); }, ms || 320);
}
function homeReloadAfter(){ // list shows placeholders, then the new results at the top of the list
  const wasCol = !!state.dashCol; state.homeLoading = true; clearTimeout(homeFlash._t);
  homeFlash._t = setTimeout(()=>{ state.homeLoading = false; render(); mountNav(); if(wasCol) dashToList(); }, 380);
}
function homeSet(k, v){
  const h = homeState(); h[k] = v; if(k!=="limit") h.limit = 30;
  if(k==="range") setPref("homeRange", v); else if(k==="sort") setPref("homeSort", v);
  const wasCol = !!state.dashCol;
  if(k==="type" || k==="range" || k==="sort") homeFlash(); else { render(); mountNav(); }
  if(wasCol && k!=="limit") dashToList();
}

// ---------- screen transitions ----------
const NAV_MS = 260;
function reducedMotion(){ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
function navGhost(){
  const app = document.getElementById("app"); if(!app || !app.firstElementChild) return null;
  const y = window.scrollY;
  const SEL = ".topbar, .dhdr, .fabbar, .actbar, .dash-summary, .dd-bottom, .billbar, .paybar";
  const live = [...app.querySelectorAll(SEL)].map(el=>{ const cs = getComputedStyle(el); return {pos: cs.position, r: el.getBoundingClientRect()}; });
  const inner = app.cloneNode(true);
  [...inner.querySelectorAll(SEL)].forEach((c,i)=>{ const L = live[i]; if(!L) return;
    if(L.pos==="fixed"){ c.style.position="absolute"; c.style.top=(L.r.top+y)+"px"; c.style.left=L.r.left+"px"; c.style.width=L.r.width+"px"; c.style.right="auto"; c.style.bottom="auto"; c.style.margin="0"; }
    else if(L.pos==="sticky"){ c.style.position="relative"; c.style.top="0px"; c.dataset.stuck = String(L.r.top); }
  });
  inner.querySelectorAll("[id]").forEach(el=>el.removeAttribute("id"));
  inner.id = "app-ghost";
  inner.style.cssText = `position:absolute;left:0;right:0;top:0;transform:translateY(${-y}px);`;
  const g = document.createElement("div"); g.className = "nav-ghost"; g.setAttribute("aria-hidden","true"); g.appendChild(inner);
  return {g, inner, y};
}
// dir: "push" (new screen from the right), "pop" (from the left), "fade" (tab switch), "none"
function navAnimate(dir, fn){
  document.querySelectorAll(".nav-ghost").forEach(x=>x.remove());
  if(dir==="none" || reducedMotion() || !document.body.animate){ fn(); return; }
  if(dir==="fade"){ fn(); const c = document.querySelector("#app .content"); if(c) c.animate([{opacity:0},{opacity:1}], {duration:170, easing:"ease-out"}); return; }
  const gh = navGhost(); fn();
  if(!gh) return;
  document.body.appendChild(gh.g);
  // sticky parts (dashboard tiles) sat at a fixed place on screen: put them back there in the copy
  gh.inner.querySelectorAll("[data-stuck]").forEach(c=>{ const nat = c.getBoundingClientRect().top; c.style.transform = `translateY(${Number(c.dataset.stuck) - nat}px)`; });
  const s = dir==="pop" ? 1 : -1, ease = "cubic-bezier(.2,.7,.25,1)";
  const a = gh.g.animate([{transform:"translateX(0)"},{transform:`translateX(${s*100}%)`}], {duration:NAV_MS, easing:ease, fill:"forwards"});
  const c = document.querySelector("#app .content");
  if(c) c.animate([{transform:`translateX(${-s*100}%)`},{transform:"translateX(0)"}], {duration:NAV_MS, easing:ease});
  const done = ()=>gh.g.remove(); a.onfinish = done; setTimeout(done, NAV_MS+250);
}

// ---------- touch ripple ----------
(function(){
  const SEL = ".dtile,.pcard,.tcard .tb,.chip,.navbtn,.fpill,.fplus,.ctile,.radio-row,.btn,.icon-btn,.link-btn,.scanban,.sortbtn,.list-row,.more-tile,.type-tile,.tabs2 button,.dd-acts button,.shr-opt,.menu-pop button";
  let pending = null;
  const make = (el, x0, y0) => {
    const r = el.getBoundingClientRect(); if(r.width<4 || r.height<4) return null;
    let x=r.left, y=r.top, w=r.width, h=r.height, rad=getComputedStyle(el).borderRadius;
    if(el.classList.contains("navbtn") || el.parentElement.classList.contains("dd-acts")){ const sz = Math.min(w, h*1.15); x = r.left+(w-sz)/2; y = r.top+(h-sz)/2; w = h = sz; rad = "50%"; }
    const host = document.createElement("div"); host.className = "rpl-host";
    host.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad};`;
    const d = 2*Math.hypot(Math.max(x0-x, x+w-x0), Math.max(y0-y, y+h-y0));
    const dark = el.matches(".fpill,.fplus,.btn.accent,.sortbtn,.chip.on.dark");
    const c = document.createElement("span"); c.className = "rpl" + (dark ? " lt" : "");
    c.style.cssText = `width:${d}px;height:${d}px;left:${x0-x-d/2}px;top:${y0-y-d/2}px;`;
    host.appendChild(c); document.body.appendChild(host); return host;
  };
  const fade = host => { if(!host) return; host.classList.add("out"); setTimeout(()=>host.remove(), 320); };
  document.addEventListener("pointerdown", e=>{
    if(e.pointerType==="mouse" && e.button!==0) return;
    const el = e.target.closest(SEL); if(!el || el.disabled) return;
    const st = {el, x:e.clientX, y:e.clientY, host:null, id:e.pointerId};
    if(e.pointerType==="touch") st.timer = setTimeout(()=>{ st.host = make(el, st.x, st.y); }, 60);
    else st.host = make(el, st.x, st.y);
    if(pending){ clearTimeout(pending.timer); fade(pending.host); }
    pending = st;
  }, {passive:true, capture:true});
  const end = cancel => e => { const st = pending; if(!st || (e.pointerId!=null && e.pointerId!==st.id)) return; pending = null; clearTimeout(st.timer);
    if(!st.host && !cancel) st.host = make(st.el, st.x, st.y);
    setTimeout(()=>fade(st.host), cancel ? 0 : 140); };
  document.addEventListener("pointerup", end(false), {passive:true, capture:true});
  document.addEventListener("pointercancel", end(true), {passive:true, capture:true});
  document.addEventListener("pointermove", e=>{ const st = pending; if(!st || e.pointerId!==st.id) return;
    if(Math.abs(e.clientX-st.x)+Math.abs(e.clientY-st.y) > 12){ pending = null; clearTimeout(st.timer); fade(st.host); } }, {passive:true, capture:true});
})();

// ---------- bottom sheets: drag down to close ----------
(function(){
  const root = document.getElementById("modal-root"); if(!root) return;
  let s = null;
  root.addEventListener("touchstart", e=>{
    s = null;
    const sh = e.target.closest(".sheet"); if(!sh || sh.classList.contains("full") || root._closing || e.touches.length!==1) return;
    if(e.target.closest("input,textarea,select,.pz")) return;
    s = {sh, ov: sh.parentElement, y0:e.touches[0].clientY, x0:e.touches[0].clientX, t0:performance.now(), dy:0, on:false};
  }, {passive:true});
  root.addEventListener("touchmove", e=>{
    if(!s) return; const t = e.touches[0], dy = t.clientY - s.y0, dx = t.clientX - s.x0;
    if(!s.on){
      if(dy > 8 && Math.abs(dy) > Math.abs(dx) && s.sh.scrollTop <= 0){ s.on = true; s.y0 = t.clientY; s.t0 = performance.now(); }
      else if(Math.abs(dy) > 8 || Math.abs(dx) > 8){ s = null; return; }
      else return;
    }
    e.preventDefault();
    s.dy = Math.max(0, t.clientY - s.y0);
    s.sh.style.animation = "none"; s.sh.style.transform = `translateY(${s.dy}px)`;
    const f = 1 - Math.min(1, s.dy / (s.sh.offsetHeight || 1));
    s.ov.style.backgroundColor = `rgba(19,42,70,${(0.5*f).toFixed(3)})`;
  }, {passive:false});
  const end = ()=>{
    const st = s; s = null; if(!st || !st.on) return;
    const v = st.dy / Math.max(1, performance.now() - st.t0);
    if(st.dy > Math.min(150, st.sh.offsetHeight*0.28) || (v > 0.6 && st.dy > 30)){ window._sheetDragClose = Date.now(); closeModalNow(); }
    else { st.sh.animate([{transform:`translateY(${st.dy}px)`},{transform:"translateY(0)"}], {duration:180, easing:"ease-out"}); st.sh.style.transform = ""; st.ov.style.backgroundColor = ""; }
  };
  root.addEventListener("touchend", end, {passive:true}); root.addEventListener("touchcancel", end, {passive:true});
})();

function viewItems(){
  const q=(state.search.items||"").toLowerCase();

  const isLow = it => it.itemType!=="service" && (Number(it.stock)<=0 || (it.lowStockAlertOn!==false && Number(it.stock)<=Number(it.lowStockAlert||0)));
  const icats = [...new Set(state.data.items.map(it=>String(it.category||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const icat = state.itemCat && icats.includes(state.itemCat) ? state.itemCat : "", lowOn = state.itemFilter==="low";
  let list = state.data.items.filter(it=>(it.name+" "+(it.hsn||"")+" "+(it.itemCode||"")).toLowerCase().includes(q));
  if(icat) list = list.filter(it=>String(it.category||"").trim()===icat);
  if(state.itemType) list = list.filter(it=>(it.itemType||"product")===state.itemType);
  if(lowOn) list = list.filter(isLow);
  if(stockMode) list = list.filter(it=>it.itemType!=="service");
  const srt = state.itemSort || (stockMode ? "value" : lowOn ? "stocklow" : "");
  if(srt==="name") list = list.slice().sort((a,b)=>a.name.localeCompare(b.name));
  else if(srt==="stocklow") list = list.slice().sort((a,b)=>Number(a.stock)-Number(b.stock));

    ${stockMode ? `<div class="card" style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:12.5px;color:var(--sub);">Stock value (at purchase price)</div><div style="font-size:19px;font-weight:700;color:${totVal<0?'#D8412F':'var(--tx)'};">${totVal<0?"-":""}${rupee(totVal)}</div></div><div style="font-size:12px;color:var(--sub);text-align:right;">${goods.length} items</div></div>` : ""}

function draftSnap(d){ if(!d) return ""; const o = {}; for(const k of Object.keys(d).sort()) if(!k.startsWith("_")) o[k] = d[k]; return JSON.stringify(o); }
const KEEP_SHEETS = new Set(["profile","expense","bank-add","stock-adjust"]);
// A sheet's fields differ from what it opened with (typed text, a picked option, an uploaded logo).
function sheetDirty(){
  const sh = document.querySelector("#modal-root .sheet"); if(!sh) return false;
  for(const el of sh.querySelectorAll("input, textarea, select")){
    if(el.disabled) continue;
    const ty = String(el.type||"").toLowerCase();
    if(ty==="file" || ty==="button" || ty==="submit") continue;
    if(ty==="hidden"){          // an uploaded (not yet saved) logo, signature or payment QR
      const key = {"f-logo-data":"logoDataUrl", "f-sig-data":"signatureDataUrl", "f-qr-data":"bankQrDataUrl"}[el.id];
      if(key && (el.value||"") !== String((state.data.profile||{})[key]||"")) return true; continue; }
    if(ty==="checkbox" || ty==="radio"){ if(el.checked!==el.defaultChecked) return true; continue; }
    if(el.tagName==="SELECT"){ const d = [...el.options].findIndex(o=>o.defaultSelected); if(el.selectedIndex!==(d<0?0:d)) return true; continue; }
    if(el.tagName==="TEXTAREA"){ if(el.value!==(el._rv!==undefined ? el._rv : el.defaultValue)) return true; continue; }
    if(el.value!==el.defaultValue) return true;
  }
  return false;
}
function formDirty(){
  const m = state.modal; if(!m) return false;
  if(m.type==="party" && state.partyDraft){ syncPartyDraftFromDOM(); return draftSnap(state.partyDraft)!==state.partyDraft._orig; }
  if(m.type==="item" && state.itemDraft){ syncItemDraftFromDOM(); return draftSnap(state.itemDraft)!==state.itemDraft._orig; }
  if(KEEP_SHEETS.has(m.type)) return sheetDirty();
  return false;
}
function discardHTML(){
  return `<div class="confirm-ov" data-morph="replace"><div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><b style="font-size:16px;">Your changes will be discarded</b>
      <button type="button" data-action="discard-keep" style="background:none;border:none;font-size:20px;color:#444;">✕</button></div>
    <button class="btn accent" data-action="discard-keep" style="padding:13px;">Continue editing</button>
    <button class="btn outline-red" data-action="discard-go" style="margin-top:10px;padding:13px;">Discard changes</button></div></div>`;
}

// ---------- small shared pieces ----------
// The reference app's gear screen: "Loading..." when a screen opens, "Please wait..." while a file is made.
// showLoading(0, text) stays up until hideLoading().
function showLoading(ms, text){
  let el = document.getElementById("loading-ov");
  if(!el){ el = document.createElement("div"); el.id = "loading-ov"; el.className = "loading-ov"; el.setAttribute("role","status"); el.setAttribute("aria-live","polite");
    el.innerHTML = `<span class="gear">${ICONS.gear}</span><span class="tx"></span>`; document.body.appendChild(el); }
  el.querySelector(".tx").textContent = text || "Loading...";
  el.classList.add("show"); clearTimeout(showLoading._t);
  if(ms!==0) showLoading._t = setTimeout(hideLoading, ms || 380);
}
function hideLoading(){ clearTimeout(showLoading._t); const el = document.getElementById("loading-ov"); if(el) el.classList.remove("show"); }
function bannerError(msg, ms){
  let el = document.getElementById("errbar");
  if(!el){ el = document.createElement("div"); el.id = "errbar"; el.className = "errbar"; el.setAttribute("role","alert"); document.body.appendChild(el); }
  el.innerHTML = `${ICONS.alertCircle}<span>${esc(msg)}</span>`;
  requestAnimationFrame(()=>el.classList.add("show")); clearTimeout(bannerError._t);
  bannerError._t = setTimeout(()=>el.classList.remove("show"), ms || 2800);
}
function idTime(id){ const n = parseInt(String(id||"").slice(0,8), 36); return n>1.5e12 && n<4.2e12 ? n : 0; }
// "Last Activity by Ramesh Vershi Nandu", as in the reference app: who keeps the books (Business details → Your name)
const DEFAULT_OWNER = "Ramesh Vershi Nandu";
function ownerName(){ const p = state.data.profile || {}; const n = String(p.ownerName ?? DEFAULT_OWNER).trim(); return n || String(p.businessName||"").trim(); }
function activityText(){ const n = ownerName(); return n ? "Last Activity by " + n : ""; }
function createTitle(type){ return type==="invoice" ? "Create Bill / Invoice" : type==="purchase" ? "Create Purchase" : "Create "+DOC_META[type].label; }
function rotatePlaceholder(inputId, list){ // "Search by Party Name" → "Search by Mobile Number" … like the reference app
  clearInterval(rotatePlaceholder._t); let i = 0;
  rotatePlaceholder._t = setInterval(()=>{ const el = document.getElementById(inputId); if(!el){ clearInterval(rotatePlaceholder._t); return; }
    if(el.value) return; i = (i+1) % list.length; el.setAttribute("placeholder", list[i]); }, 2200);
}

// ---------- Create Bill / Invoice ----------
function viewDocForm(){
  const d = ensureDraft();
  const meta = DOC_META[d.docType];
  let t = computeDocTotals(d);
  // a credit note issued from an invoice: adjusted against it — the note's total, up to what is still due
  if(d._adjFollow && isNoteType(d.docType) && d.partyId){
    const inv = state.data.docs.find(x=>x.id===d._adjFollow && !x.cancelled && x.partyId===d.partyId);
    if(inv){ const amt = r2(Math.min(Math.max(0, t.total - (Number(d.paidAmount)||0)), Math.max(0, computeDocTotals(inv).due)));
      d.adjust = amt>0.004 ? [{docId:inv.id, amt}] : []; }
    else d._adjFollow = null;
  }
  // "Mark as fully received" ticked: the amount received follows the total (discount, round off, items…)
  if(d._paidFull && meta.financial && d.partyId && meta.ledgerSign>0){
    const want = r2(Math.max(0, t.total - Number(d._linkedPaid||0)));
    if(Math.abs((Number(d.paidAmount)||0) - want) > 0.004){ d.paidAmount = want; t = computeDocTotals(d); } }
  const sales = meta.group==="sales";
  const p = party(d.partyId);
  const biz = state.data.profile || {};
  const title = d._editingId ? "Edit "+meta.label : createTitle(d.docType);
  const dueN = d.dueDate ? daysBetween(todayISO(), d.dueDate) : null;
  const dueTxt = d.dueDate ? (dueN>0 ? ` · ${dueN} day(s) to due` : dueN===0 ? " · due today" : ` · overdue by ${-dueN} day(s)`) : "";
  const posState = d.pos || p?.state || biz.state || "";
  const grossTaxed = t.lines.reduce((s_,l)=>s_ + l.gross*(1+((Number(l.taxRate)||0)+(Number(l.cessRate)||0))/100), 0);
  // how much the discount takes off the bill (with the GST on it), before round off
  const discEffect = t.extraDisc>0.004 ? Math.max(0, r2(computeDocTotals({...d, extraDiscount:0, extraDiscPct:"", roundOffMode:"none"}).total - computeDocTotals({...d, roundOffMode:"none"}).total)) : 0;
  const showDisc = d._showDisc || Number(d.extraDiscount)>0 || Number(d.extraDiscPct)>0;
  const discPctShown = Number(d.extraDiscPct)>0 ? String(d.extraDiscPct) : (t.extraDisc>0.004 && t.itemsTotal>0 ? String(Math.round(t.extraDisc/t.itemsTotal*10000)/100) : "");
  const discRsShown = Number(d.extraDiscPct)>0 ? (t.extraDisc>0.004 ? t.extraDisc.toFixed(2) : "") : (Number(d.extraDiscount) ? String(d.extraDiscount) : "");
  const showRound = t.roundMode!=="none", rSign = roundSignOf(d, t);
  const roundShown = t.roundMode==="manual" ? (d.roundOffManual===""||d.roundOffManual==null ? "" : String(Math.abs(Number(d.roundOffManual)||0))) : Math.abs(t.roundOff).toFixed(2);
  const showNotes = d._showNotes || !!String(d.notes||"").trim();
  const cf = customFieldDefs();
  const transportUsed = !!(d.agent || d.transportName || d._newTransport || d.lrNumber || d.ewayBillNo || d.parcels);
  const afOpen = d._afOpen ?? true;
  const itemsOpen = d._itemsOpen ?? true;
  const primLabel = d._editingId ? "Save" : (sales && meta.financial && meta.ledgerSign>0 ? "Generate Bill" : "Save "+meta.label);
  const dis = d.items.length===0 ? "disabled" : "";

  const lineRows = d.items.map((l,idx)=>{ const tl = t.lines[idx]||{}; const r = Number(l.taxRate)||0; const gross = tl.gross||0;
    const tax = gross*r/100, amt = gross + tax + gross*(Number(l.cessRate)||0)/100;
    return `<div class="iline">
      <div class="il-top"><span class="il-name">${esc(l.name)}${l.size?` <span class="il-size">${esc(l.size)}</span>`:""}</span><span class="mono">${rupee(amt)}</span></div>
      <div class="il-row"><span class="k">Qty x Rate</span><span class="v">${fmtN(l.qty)} ${esc(String(l.unit||"").toUpperCase())} x ${fmtN2(l.price)}</span>
        <button type="button" class="il-copy" data-action="copy-line" data-idx="${idx}" title="Copy item" aria-label="Copy item">${ICONS.copy}</button>
        <button type="button" class="pill-edit" data-action="line-edit" data-idx="${idx}">EDIT</button></div>
      ${tl.discAmt>0.004?`<div class="il-row"><span class="k">Discount</span><span class="v">${Number(l.discFlat)>0 ? `₹${fmtN2(tl.discAmt)} (${fmtN(tl.discPercent)}%)` : `${fmtN(tl.discPercent)}% = -₹${fmtN2(tl.discAmt)}`}</span></div>`:""}
      <div class="il-row"><span class="k">Tax</span><span class="v">${fmtN(r)}% = ₹${fmtN2(tax)}</span></div>
    </div>`; }).join("");

  const chargeRows = `
    ${d._showDelivery || Number(d.deliveryCharge)>0 ? `<div class="sumrow sm"><span>Freight / Delivery</span><span class="amt-in">₹ <input id="f-delivery" type="number" inputmode="decimal" value="${d.deliveryCharge}" oninput="draftSet('deliveryCharge', this.value)"/></span></div>` : ""}
    ${(d.charges||[]).map((c,i)=>`<div class="sumrow sm" style="gap:8px;">
      <input id="f-chg-name-${i}" list="chg-names" class="ln-in" value="${esc(c.name)}" placeholder="Charge name (e.g. Packing)" oninput="chargeSet(${i},'name',this.value)"/>
      <span class="amt-in">₹ <input id="f-chg-amt-${i}" type="number" inputmode="decimal" value="${c.amount===""||c.amount==null?"":c.amount}" placeholder="0" oninput="chargeSet(${i},'amount',this.value)"/></span>
      <button type="button" class="x-btn" onclick="chargeDel(${i})" aria-label="Remove charge">${ICONS.xClose}</button></div>`).join("")}
    <datalist id="chg-names">${chargeNameList().map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>`;

  const transport = sales ? (()=>{ const list = transporterList(); const custom = d._newTransport || (d.transportName && !list.includes(d.transportName));
    const used = !!(d.transportName || d._newTransport);
    return `<div class="row"><span class="lb">Broker / Agent</span><input id="f-agent" value="${esc(d.agent)}" oninput="draftSet('agent', this.value)"/></div>
      <div class="row"><span class="lb">Despatched through</span>
        <select id="f-transport-sel" onchange="transportPick(this.value)" class="ln-sel">
          <option value="" ${!used?"selected":""}>Not required</option>
          ${list.map(n=>`<option value="${esc(n)}" ${!custom && d.transportName===n?"selected":""}>${esc(n)}</option>`).join("")}
          <option value="__new" ${custom?"selected":""}>+ New transport…</option>
        </select></div>
      ${used ? `${custom?`<div class="row"><span class="lb">Transport name</span><input id="f-transport" value="${esc(d.transportName)}" oninput="draftSet('transportName', this.value)" placeholder="e.g. Mahavir Angadia"/></div>`:""}
        <div class="row"><span class="lb">LR number</span><input id="f-lrnum" value="${esc(d.lrNumber)}" oninput="draftSet('lrNumber', this.value)"/></div>
        <div class="row"><span class="lb">LR date</span><input id="f-lrdate" type="date" value="${d.lrDate||''}" oninput="draftSet('lrDate', this.value)"/></div>
        <div class="row"><span class="lb">E-way bill no.</span><input id="f-ewaybill" value="${esc(d.ewayBillNo)}" oninput="draftSet('ewayBillNo', this.value)"/></div>
        <div class="row"><span class="lb">Parcels</span><input id="f-parcels" type="number" inputmode="numeric" value="${d.parcels}" oninput="draftSet('parcels', this.value)"/></div>` : ""}`; })() : "";

  const received = !meta.financial ? "" : !d.partyId
    ? `<div class="sumrow" style="color:#1E8C4E;font-weight:600;"><span>${sales?"Cash Sale — received in full":"Cash Purchase — paid in full"}</span><span class="mono">${rupee(t.total)}</span></div>`
    : `${meta.ledgerSign>0 ? `<label class="chk"><input type="checkbox" id="f-paidfull" ${t.total>0 && (d._paidFull || Math.abs(Number(d.paidAmount)+Number(d._linkedPaid||0)-t.total)<0.005)?"checked":""} onchange="paidFull(this.checked)"/> Mark as fully ${sales?"received":"paid"}</label>` : ""}
       ${Number(d._linkedPaid)>0.004 ? `<div class="sumrow sm" style="color:var(--sub);"><span>${sales?"Received":"Paid"} earlier (payments / notes)</span><span class="mono">${rupee(d._linkedPaid)}</span></div>` : ""}
       <div class="sumrow"><span>${isNoteType(d.docType) ? (sales?"Refund paid now":"Refund received now") : Number(d._linkedPaid)>0.004 ? (sales?"Received with the bill":"Paid with the bill") : (sales?"Amount Received":"Amount Paid")}</span>
         <span class="amt-in">₹ <input id="f-paidnow" type="number" inputmode="decimal" value="${Number(d.paidAmount)?d.paidAmount:""}" placeholder="0" oninput="paidType(this.value)"/></span></div>
       ${meta.ledgerSign>0 ? `<div class="sumrow" style="font-weight:600;"><span>Balance Due</span><span class="mono" style="color:${t.due>0.004?'#D8412F':'#1E8C4E'};">${rupee(t.due)}</span></div>` : ""}`;

  return `
  <div class="topbar"><div style="display:flex;align-items:center;gap:6px;min-width:0;"><button class="icon-btn" data-action="back" aria-label="Back">${ICONS.back}</button>
      <h1 class="serif" style="font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(title)}</h1></div>
    <button class="icon-btn" data-action="open-modal" data-modal="invoice-settings" data-itab="numbering" title="Invoice settings" aria-label="Invoice settings">${ICONS.settings}</button></div>
  <div class="content" style="padding-top:0;">
    <div class="fsec"><div class="fs-row">
      <div style="min-width:0;"><div class="fs-link">${esc(meta.label)} #${esc(d.number)}</div><div class="fs-sub">${esc(longDate(d.date))}${dueTxt}</div></div>
      <button type="button" class="pill-edit" data-action="open-modal" data-modal="doc-numdate">EDIT</button></div></div>

    <div class="fsec">
      <div class="fs-label">PARTY NAME <span class="req">*</span></div>
      <button type="button" class="pfield" data-action="open-modal" data-modal="party-picker">
        <span style="color:#9A9BA3;display:flex;">${ICONS.user}</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" class="${d.partyId?"":"ph"}">${d.partyId ? esc(partyName(d.partyId)) : (sales ? "Cash Sale" : "Search/Create Party")}</span>
        <span style="color:#9A9BA3;display:flex;">${ICONS.chevDown}</span></button>
      <div class="fs-row" style="margin-top:12px;"><span class="fs-sub" style="margin:0;">Place of Supply - <b style="color:var(--tx);font-weight:500;">${esc(posState||"—")}</b></span>
        <label class="pill-edit">EDIT<select aria-label="Place of supply" onchange="draftSet('pos', this.value===(party(ensureDraft().partyId)?.state||'') ? '' : this.value)">${INDIAN_STATES.map(s_=>`<option value="${s_}" ${s_===posState?"selected":""}>${s_}</option>`).join("")}</select></label></div>
      ${sales && d.partyId ? (()=>{ const pp = p; const hasShip = pp && pp.shipSame===false && pp.ship;
        const cur = d.shipTo && d.shipTo!=="__bill" ? partyName(d.shipTo) : (hasShip && d.shipTo!=="__bill" ? (pp.ship.name||pp.name) : "Same as bill to");
        return `<div class="fs-row" style="margin-top:10px;"><span class="fs-sub" style="margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Ship To - <b style="color:var(--tx);font-weight:500;">${esc(cur)}</b></span>
          <label class="pill-edit">EDIT<select aria-label="Ship to" onchange="draftSet('shipTo', this.value);">
            <option value="" ${!d.shipTo?"selected":""}>${hasShip?"Party's shipping address — "+esc(pp.ship.name||pp.name):"Same as bill to"}</option>
            ${hasShip?`<option value="__bill" ${d.shipTo==="__bill"?"selected":""}>Same as billing address</option>`:""}
            <optgroup label="Another party">${state.data.parties.filter(x=>x.id!==d.partyId).map(x=>`<option value="${x.id}" ${d.shipTo===x.id?"selected":""}>${esc(x.name)}${x.addrCity?" · "+esc(x.addrCity):""}</option>`).join("")}</optgroup>
          </select></label></div>`; })() : ""}
    </div>

    <div class="fsec">
      ${d.items.length===0 ? `<div class="fs-label">ITEMS</div><button type="button" class="addbtn" data-action="open-modal" data-modal="item-picker">Add Items</button>` : `
      <div class="ihead"><button type="button" class="t" onclick="ensureDraft()._itemsOpen=${!itemsOpen}; render();">${itemsOpen?ICONS.chevUp:ICONS.chevDown} ITEMS (${d.items.length})</button>
        <button type="button" class="link-btn" data-action="open-modal" data-modal="item-picker">${ICONS.plus} Item</button></div>
      ${itemsOpen ? lineRows : ""}
      <div class="sumrow" style="font-weight:600;"><span>Item Subtotal</span><span class="mono">${fmtN2(grossTaxed)}</span></div>
      <div class="taxnote">Taxable ${fmtN2(t.taxableTotal)} · ${t.sameState ? `CGST ${fmtN2(t.cgst)} · SGST ${fmtN2(t.sgst)}` : `IGST ${fmtN2(t.igst)}`}${t.cessTotal>0?` · Cess ${fmtN2(t.cessTotal)}`:""}</div>
      ${chargeRows}
      ${showDisc ? `<div class="sumrow sm ro-row dc-row">
          <button type="button" class="x-btn ro-x" onclick="discRemove()" aria-label="Remove discount">${ICONS.xCircle}</button>
          <span class="ro-l">Discount</span>
          <span class="amt-in dc-pct"><input id="f-discpct" type="number" inputmode="decimal" min="0" max="100" step="0.01" value="${discPctShown}" placeholder="0" oninput="discPctSet(this.value)" aria-label="Discount percent"/> %</span>
          <span class="amt-in">− ₹ <input id="f-extradisc" type="number" inputmode="decimal" min="0" step="0.01" value="${discRsShown}" placeholder="0" oninput="discRsSet(this.value)" aria-label="Discount amount"/></span></div>
        <div class="taxnote" style="text-align:right;margin-top:-2px;">${d.legacyExtraDisc ? "Taken off after GST (as on this older bill)" : `GST after discount${discEffect>0.004 ? ` · total −₹${fmtN2(discEffect)}` : ""}`}</div>` : ""}
      ${showRound ? `<div class="sumrow sm ro-row">
          <button type="button" class="x-btn ro-x" onclick="roundRemove()" aria-label="Remove round off">${ICONS.xCircle}</button>
          <span class="ro-l">Round Off</span>
          <span class="ro-seg" role="group" aria-label="Round off down or up"><button type="button" id="f-round-dn" class="${rSign<0?"on":""}" aria-pressed="${rSign<0}" aria-label="Round down" onclick="roundSign(-1)">−</button><button type="button" id="f-round-up" class="${rSign>0?"on":""}" aria-pressed="${rSign>0}" aria-label="Round up" onclick="roundSign(1)">+</button></span>
          <span class="amt-in">₹ <input type="number" id="f-roundman" inputmode="decimal" min="0" step="0.01" value="${roundShown}" placeholder="0.00" oninput="roundAmt(this.value)" aria-label="Round off amount"/></span></div>` : ""}
      <div class="plus-links">
        <button type="button" class="link-btn" onclick="chargeAdd()">${ICONS.plus} Additional Charges</button>

    </div>

    ${(cf.length || sales) ? `<div class="fsec" style="border-bottom:none;">
      <button type="button" class="ihead t" style="width:100%;justify-content:flex-start;" onclick="ensureDraft()._afOpen=${!afOpen}; render();">${afOpen?ICONS.chevUp:ICONS.chevDown} ADDITIONAL FIELDS</button>

        ${transport}

      </div>` : ""}
    </div>` : ""}
    <div style="height:80px;"></div>
  </div>
  <div class="billbar">
    ${d._editingId ? "" : `<button type="button" class="sec" data-action="save-doc" data-then="new" ${dis}>Save &amp; New</button>`}
    <button type="button" class="pri" data-action="save-doc" ${dis}>${esc(primLabel)}</button>
  </div>`;
}

// ---------- Edit date & number ----------
function modalDocNumDate(){
  const d = ensureDraft(), meta = DOC_META[d.docType], m = state.modal;
  if(!m.init){ const mm = /^(.*?)(\d+)$/.exec(String(d.number||"")); Object.assign(m, {init:true, date:d.date, prefix: mm?mm[1]:String(d.number||""), serial: mm?mm[2]:"", due:d.dueDate||"", dtype:d.docType, number0:String(d.number||"")}); }
  const presets = [["","No due date"],["7","7 days"],["15","15 days"],["30","30 days"],["45","45 days"],["60","60 days"],["90","90 days"],["180","180 days"]];
  const curN = m.due ? daysBetween(m.date, m.due) : "";
  const ex = n => esc(String(m.prefix||"")) + (m.serial ? String(Number(m.serial)+n).padStart(m.serial.length,"0") : "");

async function pickContact(){
  try{
    const [c] = await navigator.contacts.select(["name","tel"], {multiple:false}); if(!c) return;
    const name = (c.name && c.name[0]) || "", ph = phoneDigits((c.tel && c.tel[0]) || "");

    const forPay = state.modal && state.modal.id==="pay";
    if(ex){ if(forPay) pickPartyForPay(ex.id); else pickPartyForDraft(ex.id); toast(ex.name+" selected"); return; }

  }catch(e){ toast("Couldn't open your contacts"); }

function openPartyForPay(pre){

function pickPartyForDraft(id){
  const d = ensureDraft(), prev = d.partyId || ""; d.partyId = id || ""; d.shipTo = ""; d.pos = "";
  if(d._editingId && prev!==d.partyId) d._paidFull = false;
  if(prev!==d.partyId) d._adjFollow = null;
  if(d._editingId){                   // payments / notes linked to an edited bill stay with its original party
    const orig = state.data.docs.find(x=>x.id===d._editingId); if(d._linkedPaid0===undefined) d._linkedPaid0 = Number(d._linkedPaid||0);
    d._linkedPaid = orig && orig.partyId===d.partyId ? d._linkedPaid0 : 0; }
  const pp = party(id); const cd = Number(pp?.creditDays)||0;
  if(pp && cd>0 && DOC_META[d.docType]?.financial){ const [y,m,dd] = (d.date||todayISO()).split("-").map(Number); d.dueDate = new Date(Date.UTC(y,m-1,dd+cd)).toISOString().slice(0,10); toast(`Due date set to ${formatDateDMY(d.dueDate)} (${cd} days credit)`); }

  if(state.modal) closeModalNow(); else { render(); mountNav(); }
}

function draftLineFor(it, d){

    price: sales ? effectivePrice(it, d.partyId) : (Number(it.purchasePrice)||effectivePrice(it, d.partyId)),
    discPercent: sales ? Number(it.discountPercent||0) : 0, taxRate:Number(it.taxRate||0), cessRate:0};
}
function ipAdd(itemId){
  const it = state.data.items.find(i=>i.id===itemId); if(!it) return;
  const d = ensureDraft();
  const ex = d.items.find(l=>l.itemId===it.id);
  if(ex) ex.qty = (Number(ex.qty)||0) + 1;
  else d.items.push(draftLineFor(it, d));
  render();
}
function ipStep(itemId, n){
  const d = ensureDraft(), i = d.items.findIndex(l=>l.itemId===itemId); if(i<0) return;
  const q = Math.round(((Number(d.items[i].qty)||0) + n)*1000)/1000;
  if(q<=0) d.items.splice(i,1); else d.items[i].qty = q;
  render();
}
function ipQty(itemId, v){ const d = ensureDraft(), l = d.items.find(x=>x.itemId===itemId); if(!l) return; l.qty = v==="" ? 0 : Math.max(0, Number(v)||0); render(); }

function viewDocDetail(id){
  const doc = state.data.docs.find(d=>d.id===id);
  if(!doc) return backTopbar("Not found")+`<div class="content"><div class="empty">Transaction not found.</div></div>`;
  const t = computeDocTotals(doc), meta = t.meta, p = party(doc.partyId), cancelled = !!doc.cancelled;
  const owed = !cancelled && meta.financial && t.due>0.004 && meta.ledgerSign>0 && doc.partyId;
  const justCreated = !!(state.view && state.view.justCreated);
  const status = cancelled ? `<span class="badge na">Cancelled</span>`
    : !meta.financial ? `<span class="dd-st na">${meta.group==="sales"?"Sales":"Purchase"} document</span>`
    : t.status==="paid" ? `<span class="dd-st paid">Paid</span>` : t.status==="partial" ? `<span class="dd-st part"><span class="nw">Partially Paid</span> <span class="nw">· ${esc(rupee(t.due))} due</span></span>` : `<span class="dd-st due">Unpaid</span>`;
  const title = justCreated ? meta.label+" Created" : doc.docType==="invoice" ? "Bill / Invoice" : meta.label;
  const act = activityText();
  const adjRows = [];
  if(isNoteType(doc.docType)) (doc.adjust||[]).forEach(a=>{ const inv=state.data.docs.find(x=>x.id===a.docId); if(inv) adjRows.push(`<div class="bill-line"><span>Adjusted against ${esc(inv.number)}</span><span class="mono">${fmt(a.amt)}</span></div>`); });
  else state.data.docs.filter(n=>Array.isArray(n.adjust)).forEach(n=>n.adjust.filter(a=>a.docId===doc.id).forEach(a=>adjRows.push(`<div class="bill-line"><span>${esc(DOC_META[n.docType].label)} ${esc(n.number)} adjusted</span><span class="mono">-${fmt(a.amt)}</span></div>`)));
  const adjCard = adjRows.length || (isNoteType(doc.docType) && doc.partyId && !cancelled) ? `<div class="card" style="margin-top:12px;">${adjRows.join("")}${isNoteType(doc.docType) && doc.partyId && !cancelled ? `<button class="btn ghost" style="margin-top:8px;" data-action="edit-doc" data-id="${doc.id}">Adjust against ${meta.group==="sales"?"invoices":"bills"}</button>` : ""}</div>` : "";
  if(state.docViewLoading) return docDetailTop(doc, title, cancelled) + docDetailSkeleton(doc, cancelled, owed, adjCard);
  return `
  ${docDetailTop(doc, title, cancelled)}
  <div class="content" style="padding-top:0;">
    <div class="dd-prev">${docPreviewHTML(doc, viewCopyFor(doc.id))}</div>
    ${adjCard}
    <div class="dd-info">
