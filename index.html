// The invoice picture gets whatever height is left between the title bar and the details + bottom buttons
// (like the reference app), so the screen has no empty band whatever the phone's height or the bill.
function fitDocPreview(){
  const prev = document.querySelector("#app .dd-prev"); if(!prev) return;
  const bar = document.querySelector("#app .dd-bottom"), top = document.querySelector("#app .topbar"), sp = document.querySelector("#app .dd-spacer");
  const barH = bar ? Math.ceil(bar.getBoundingClientRect().height) : 0;
  // the space kept for the fixed bottom bar (the page's own bottom padding counts towards it)
  const padB = (parseFloat(getComputedStyle(prev.parentElement).paddingBottom)||0) + (parseFloat(getComputedStyle(document.getElementById("app")).paddingBottom)||0);
  if(sp) sp.style.height = Math.max(0, barH + 2 - padB) + "px";
  let below = 0;
  for(let el = prev.nextElementSibling; el; el = el.nextElementSibling){
    if(el===sp) continue; const cs = getComputedStyle(el);
    below += el.getBoundingClientRect().height + (parseFloat(cs.marginTop)||0) + (parseFloat(cs.marginBottom)||0);
  }
  const H = window.innerHeight, pad = 24;                       // the grey band's top + bottom padding
  const avail = H - (top ? top.getBoundingClientRect().height : 0) - below - barH - pad - 2;
  const h = Math.floor(Math.max(Math.min(260, H*0.4), Math.min(avail, H*0.78)));
  if(prev.style.getPropertyValue("--pvh") !== h+"px") prev.style.setProperty("--pvh", h+"px");
  prev.style.minHeight = (h + pad) + "px";                      // a very tall phone: the grey band fills the rest
}

function cancelDocNow(id, reason){
  const doc = state.data.docs.find(d=>d.id===id); if(!doc || doc.cancelled) return false;
  const meta = DOC_META[doc.docType] || DOC_META.invoice;
  const atBilling = meta.financial ? (directPaidMap()[doc.id] || 0) : 0;   // received / paid when the bill was made
  if(isNoteType(doc.docType)){ reverseNoteAdjust(doc); doc.adjust = []; }
  else if(meta.financial) detachNotesFrom(doc);
  if(meta.financial && meta.ledgerSign>0 && doc.partyId) releaseDocPayments(doc, Number(doc.paidAmount||0) - atBilling);   // recorded payments stay as advance
  if(meta.financial && doc.partyId && atBilling>0.004){
    // the money itself was really received (or refunded), so it stays in the party's account and in cash & bank
    const adv = { id: genId(), partyId: doc.partyId, amount: Math.round(atBilling*100)/100, unallocated: Math.round(atBilling*100)/100,
      date: doc.date, mode: "At billing", note: `With ${meta.label} ${doc.number} (cancelled)`, alloc: [],
      // same way as the money went at billing (in for a sale, out for a purchase — whatever the party's type)
      dir: ((party(doc.partyId)?.type || "customer")==="customer") === ((meta.group==="sales") === (meta.ledgerSign>0)) ? 1 : -1 };
    adv.no = nextPayNo(payInflow(adv)); state.data.payments.push(adv);
  }
  doc.paidAmount = 0;
  doc.cancelled = {at: new Date().toISOString(), reason: reason || "Order Cancelled", keptAsAdvance: doc.partyId ? Math.round(atBilling*100)/100 : 0};
  doc.updatedAt = Date.now();
  clearPreviewCache();     // other bills' printed balances change
  return true;
}
function deleteDocNow(id){
  const doc = state.data.docs.find(x=>x.id===id); if(!doc) return;
  const meta = DOC_META[doc.docType] || DOC_META.invoice;
  if(!doc.cancelled){
    const atBilling = meta.financial ? (directPaidMap()[doc.id] || 0) : 0;
    if(isNoteType(doc.docType)) reverseNoteAdjust(doc);
    else if(meta.financial) detachNotesFrom(doc);
    if(meta.financial && meta.ledgerSign>0 && doc.partyId) releaseDocPayments(doc, Number(doc.paidAmount||0) - atBilling);
  }
  state.data.docs = state.data.docs.filter(x=>x.id!==id);

// ---------- PDF / image output (Print · Download · Share · Duplicate · Triplicate) ----------
// Same as the reference app: tap → "Please wait..." for a moment → straight into the phone's share
// sheet, the download, or the print screen. Share asks PDF or Image first ("Share Invoice As") unless
// a default is set in Invoice Settings, and ⋮ Original / Duplicate / Triplicate share that copy
// the same way. The Original copy of the invoice on screen is already made (the preview is the real
// A4 page, kept as JPEG pages, with the PDF built from them in the background) and a copy is made
// before its Share Invoice As sheet opens, so the tap on PDF / Image has nothing left to wait for:
// Android opens the share sheet only within a few seconds of the tap.
const COPY_NAMES = {ORIGINAL:"Original", DUPLICATE:"Duplicate", TRIPLICATE:"Triplicate", ALL:"All 3 copies"};
const _copyPages = {}, _copyJobs = {}, _copyUrls = {};      // "<preview key>|<copy>" → pages (and preview pictures) of Duplicate / Triplicate / All 3
let _outBusy = false, _sharing = 0;         // _sharing: when the share sheet was opened (0 = not open)
// A second tap while the share sheet is opening is ignored. The phone ends a share when its sheet
// closes or an app is picked; coming back to this app ends it too, in case the phone never says so.
function shareBusy(){ return !!_sharing && performance.now() - _sharing < 4000; }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && _sharing && performance.now() - _sharing > 300) _sharing = 0; });
function docChoice(doc, choice){ return docNeedsCopies(doc) ? (COPY_NAMES[choice] ? choice : "ORIGINAL") : "ORIGINAL"; }
// The finished A4 pages ([{blob, w, h}], JPEG) for one copy of a document.
function docPagesFor(docId, choice){
  const doc = state.data.docs.find(d=>d.id===docId); if(!doc) return Promise.reject(new Error("Transaction not found"));
  choice = docChoice(doc, choice);
  if(choice==="ORIGINAL") return originalPages(doc);
  const key = docPreviewKey(doc), ck = key + "|" + choice;
  if(_copyPages[ck]) return Promise.resolve(_copyPages[ck]);
  if(!_copyJobs[ck]){                       // one render per copy, however many taps ask for it
    const job = _copyJobs[ck] = renderDocPages(docId, choice, null, true).then(pages=>{
      // the copies of the bill on screen stay in memory (switching between them is instant); others go
      for(const k of Object.keys(_copyPages)) if(!k.startsWith(key+"|")) dropCopy(k);
      _copyPages[ck] = pages; _copyUrls[ck] = pages.map(pg=>URL.createObjectURL(pg.blob));
      pdfFor(pages).catch(()=>{});                                        // its PDF, ready for Share
      return pages; });
    const done = ()=>{ if(_copyJobs[ck]===job) delete _copyJobs[ck]; }; job.then(done, done);
  }
  return _copyJobs[ck];
}
function dropCopy(k){ revokeUrls(_copyUrls[k]); delete _copyUrls[k]; delete _copyPages[k]; }
// The copy shown on the invoice screen: Original, or the one picked from the ⋮ menu (Duplicate, Triplicate, All 3)
function viewCopyFor(docId){
  const v = state.view; if(!(v && v.name==="docDetail" && v.id===docId && COPY_NAMES[v.copy])) return "ORIGINAL";
  const d = state.data.docs.find(x=>x.id===docId); return d && !d.cancelled ? v.copy : "ORIGINAL";
}
function previewUrls(doc, copy){
  copy = docChoice(doc, copy); const key = docPreviewKey(doc);
  return (copy==="ORIGINAL" ? _previewCache[key] : _copyUrls[key+"|"+copy]) || null;
}
function docPagesReady(doc, choice){
  choice = docChoice(doc, choice);
  const key = docPreviewKey(doc);
  return (choice==="ORIGINAL" ? _pageBlobs[key] : _copyPages[key+"|"+choice]) || null;
}
function pdfFor(pages){                 // built once per set of pages
  if(!pages._pdfJob){
    pages._pdfJob = jpegPagesToPdf(pages).then(b=>{ pages._pdf = b; return b; });
    pages._pdfJob.catch(()=>{ pages._pdfJob = null; });
  }
  return pages._pdfJob;
}
function filesFor(doc, choice, fmt, pages){
  const name = outputFileName(doc, choice);
  if(fmt==="image"){
    const base = name.replace(/\.pdf$/,"");
    return pages.map((p,i)=>new File([p.blob], `${base}${pages.length>1?"-page"+(i+1):""}.jpg`, {type:"image/jpeg", lastModified:Date.now()}));
  }

}
const sleep = ms => new Promise(r=>setTimeout(r, ms));
// Print / Download / Share one copy of a document.
async function docAction(docId, act, opts){
  opts = opts || {};
  const doc = state.data.docs.find(d=>d.id===docId); if(!doc || _outBusy || shareBusy()) return;
  const choice = docChoice(doc, opts.choice), fmt = act==="share" && opts.format==="image" ? "image" : "pdf";
  const t0 = performance.now();
  _outBusy = true; showLoading(0, "Please wait...");
  let pages;
  try{
    pages = docPagesReady(doc, choice) || await docPagesFor(docId, choice);
    if(fmt==="pdf" && !pages._pdf) await pdfFor(pages);
  }catch(e){
    _outBusy = false; hideLoading(); bannerError("Couldn't create the invoice. Please try again."); return;
  }
  await sleep(Math.max(0, 260 - (performance.now() - t0)));      // the "Please wait..." moment, as in the reference app
  hideLoading(); _outBusy = false;
  if(act==="download"){
    downloadBlob(pages._pdf, outputFileName(doc, choice));
    toast(choice==="ORIGINAL" ? "Invoice downloaded" : COPY_NAMES[choice]+" downloaded");
  }
  else if(act==="print") printPages(pages);
  else shareFiles(filesFor(doc, choice, fmt, pages), {id:docId, choice, fmt});
}
// Opens the phone's share sheet with the files (WhatsApp, Gmail, Drive …).
function shareFiles(files, ctx){
  if(shareBusy()) return;                                        // the share sheet is already opening
  const what = files[0] && files[0].type==="image/jpeg" ? (files.length>1 ? "images" : "image") : "PDF";
  const saveInstead = why => { files.forEach((f,i)=>setTimeout(()=>downloadBlob(f, f.name), i*400)); toast(why); };
  if(!navigator.share || (navigator.canShare && !navigator.canShare({files})))
    return saveInstead(`${browserName()} can't share files from web apps — the ${what} was saved to Downloads`);
  const onReady = () => state.modal && state.modal.type==="share-ready";
  // Android opens the share sheet only a few seconds after a tap. If that time has run out
  // (a very long invoice on a slow phone), one more tap on "Share" does it.
  if(navigator.userActivation && !navigator.userActivation.isActive && !onReady()) return afterNav(()=>openShareReady(files, ctx));
  _sharing = performance.now();
  navigator.share({files}).then(()=>{ _sharing = 0; if(onReady()) closeModalNow(); })
    .catch(err=>{ _sharing = 0;
      const n = err && err.name;
      if(n==="AbortError") return;                               // share sheet closed

// ⋮ Issue Credit Note: Create Credit Note for the invoice's party with its items (change or remove what isn't

// until the amounts in "Adjust against invoices" are changed by hand.
function issueCreditNote(invId){
  const inv = state.data.docs.find(d=>d.id===invId); if(!inv || inv.cancelled) return;
  state.menuOpen = null; render();
  state.docDraft = null; const d = ensureDraft("credit_note");
  d.partyId = inv.partyId || ""; d.pos = inv.pos || "";
  const pct6 = (part, whole) => whole>0 ? Math.round(Math.min(part, whole)/whole*1e8)/1e6 : 0;
  d.items = (inv.items||[]).map(l=>{ const c = {...l}, flat = Number(c.discFlat)||0;
    if(flat>0){ c.discPercent = pct6(flat, (Number(c.qty)||0)*(Number(c.price)||0)); delete c.discFlat; }
    return c; });
  const it = computeDocTotals(inv);
  if(Number(inv.extraDiscPct)>0) d.extraDiscPct = Number(inv.extraDiscPct);
  else if(Number(inv.extraDiscount)>0 && it.itemsTotal>0) d.extraDiscPct = pct6(Number(inv.extraDiscount), it.itemsTotal);
  d.taxR2 = !!inv.taxR2;

}
// ⋮ Original / Duplicate / Triplicate, as in the reference app: the invoice screen switches
// to that copy (the page shows "DUPLICATE FOR TRANSPORTER" …, and Print · Download · Share use it), then
// Share Invoice As opens for it. With "Always PDF" / "Always image" set in Invoice Settings it goes
// straight to the phone's share sheet.
async function switchDocCopy(docId, copy){
  const doc = state.data.docs.find(d=>d.id===docId), v = state.view;
  if(!doc || !v || v.name!=="docDetail" || v.id!==docId) return;
  copy = docChoice(doc, copy);
  const tok = switchDocCopy._tok = (switchDocCopy._tok||0) + 1, t0 = performance.now();
  state._navReplace = true;                                  // same screen: the back button still leaves the bill
  state.view = {...v}; if(copy==="ORIGINAL") delete state.view.copy; else state.view.copy = copy;
  render(); mountNav();                                      // the copy on screen stays until the new one is made
  let pages;
  try{ pages = await docPagesFor(docId, copy); }
  catch(e){ if(tok===switchDocCopy._tok) bannerError("Couldn't create the copy. Please try again."); return; }
  const tShown = performance.now();
  if(document.getElementById("doc-preview-wait")) render();
  try{ await pdfFor(pages); }catch(e){}
  // the copy shows, and Share Invoice As comes up about two seconds after the tap (as in the reference app)
  await sleep(Math.max(600 - (performance.now() - tShown), 2000 - (performance.now() - t0), 0));
  const cur = state.view;
  if(tok!==switchDocCopy._tok || !cur || cur.name!=="docDetail" || cur.id!==docId || viewCopyFor(docId)!==copy || state.modal || state.menuOpen || _outBusy || shareBusy()) return;
  const f = state.data.profile?.shareFormat;
  if(f==="pdf" || f==="image") shareDocNow(docId, copy, f);
  else openShareAs(docId, copy);
}
function openShareAs(docId, copy){
  state.modal = {type:"share-as", id:docId, ...(copy && copy!=="ORIGINAL" ? {choice:copy} : {})}; render();
  const doc = state.data.docs.find(d=>d.id===docId);         // the files are made while the sheet is up
  if(doc && !docPagesReady(doc, copy)) docPagesFor(docId, copy).then(p=>pdfFor(p)).catch(()=>{});
}
// Share one copy as PDF or images. When the files are ready (almost always — the bill on screen is already
// made, PDF included) the phone's share sheet is asked for right inside the tap, before anything else
// happens; otherwise "Please wait..." while they are made.
function shareDocNow(docId, choice, fmt){
  const doc = state.data.docs.find(d=>d.id===docId); if(!doc || _outBusy || shareBusy()) return;
  choice = docChoice(doc, choice); fmt = fmt==="image" ? "image" : "pdf";
  const pages = docPagesReady(doc, choice), onSheet = state.modal && state.modal.type==="share-as";
  if(pages && (fmt==="image" || pages._pdf)){
    showLoading(0, "Please wait...");                        // the moment the reference app shows
    shareFiles(filesFor(doc, choice, fmt, pages), {id:docId, choice, fmt});
    if(onSheet && state.modal && state.modal.type==="share-as") closeModalNow();
    setTimeout(hideLoading, 450);
    return;
  }
  if(onSheet) closeModalNow();
  docAction(docId, "share", {format:fmt, choice});
}
// Party statement sheet (Share / Download buttons on its own sheet)
function outputFiles(o){
  if(!o) return [];
  if(o.kind==="image") return o.files || [];
  if(o.blob) return [new File([o.blob], o.name, {type:"application/pdf", lastModified:Date.now()})];
  return [];
}
function downloadOutput(o){
  if(!o) return;
  if(o.kind==="image") (o.files||[]).forEach((f,i)=>setTimeout(()=>downloadBlob(f, f.name), i*400));
  else if(o.blob) downloadBlob(o.blob, o.name);
}
function shareReadyOutput(){
  const o = state.output; const files = outputFiles(o); if(!files.length) return;
  const what = o.kind==="image" ? "image" : "PDF";
  const fallback = why => { downloadOutput(o); o.shareNote = why; render(); };
  if(!navigator.share) return fallback(`${browserName()} doesn't let web apps open the share menu, so the ${what} was saved to your Downloads instead. Open it from Downloads (or the Files app) and tap Share → WhatsApp. For one-tap sharing, open this app in Google Chrome.`);
  if(navigator.canShare && !navigator.canShare({files})) return fallback(`${browserName()} can share links but not files from web apps, so the ${what} was saved to your Downloads instead. Open it from Downloads and tap Share.`);
  navigator.share({files}).catch(err=>{ if(err && err.name==="AbortError") return; fallback(`Sharing was blocked (${err && err.name || "error"}), so the ${what} was saved to your Downloads instead. Open it from Downloads and tap Share.`); });
}

const payNum = v => { const n = Number(String(v==null?"":v).replace(/,/g,"")); return isFinite(n) && n>0 ? n : 0; };
const fmtPlain = v => { const n = Math.round((Number(v)||0)*100)/100; return n ? String(n) : ""; };

// ---------- bank accounts: the one in Business details, plus any added here ----------
function bankAccounts(){
  const b = state.data.profile || {}, out = [];
  const acc = String(b.bankAccountNo||"").trim();
  if(acc) out.push({id:"primary", accNo:acc, ifsc:String(b.bankIFSC||"").trim(), bankName:String(b.bankName||"").trim(), primary:true});
  for(const x of (Array.isArray(b.extraBanks) ? b.extraBanks : [])) if(x && x.id) out.push(x);
  return out;
}
function bankById(id){ return id ? (bankAccounts().find(x=>x.id===id) || null) : null; }
function bankLabel(bk){ return bk ? (String(bk.name||"").trim() || bk.accNo) : ""; }
function defaultBankId(pref){ const list = bankAccounts(); if(pref && list.some(b=>b.id===pref)) return pref; return list[0] ? list[0].id : ""; }

// ---------- the payment being written ----------
function payDir(d){ const pp = party(d.partyId); if(!pp) return 1; return ((d.ptype==="in") === (pp.type!=="supplier")) ? 1 : -1; }
function newPayDraft(ptype, opts){
  opts = opts || {};
  const prof = state.data.profile || {};
  const mode = PAY_MODES.includes(prof.lastPayMode) ? prof.lastPayMode : "Cash";
  const d = { ptype, partyId: party(opts.partyId) ? opts.partyId : "", amount:"", discount:"", date: todayISO(), no: nextPayNo(ptype==="in"),
    mode, bankId: mode==="Cash" ? "" : defaultBankId(prof.lastPayBank), note:"", sel:null, discBy:null, lockParty:false, fromDoc:null };
  if(opts.fromDoc){
    const doc = state.data.docs.find(x=>x.id===opts.fromDoc);
    if(doc){ const t = computeDocTotals(doc); d.partyId = doc.partyId || ""; d.lockParty = !!doc.partyId; d.fromDoc = doc.id;
      if(t.due>0.004){ d.sel = [doc.id]; d.amount = fmtPlain(t.due); } }
  }

}
// What an edited payment had settled on each bill (docId → amount).
function payOldAlloc(d){
  const m = {}, op = d && d.editId ? state.data.payments.find(x=>x.id===d.editId) : null;
  for(const a of (op && op.alloc || [])) m[a.docId] = (m[a.docId]||0) + (Number(a.amt)||0);
  return m;
}
// Unpaid bills this payment can settle (oldest first): sales bills for money in, purchase bills for money out —
// whatever the party's type (v54). While a payment is edited, what it had settled counts as still due.
function payCandidates(d){
  if(!d.partyId) return [];
  const grp = d.ptype==="out" ? "purchase" : "sales", old = payOldAlloc(d);
  return liveDocs().filter(x=>x.partyId===d.partyId && DOC_META[x.docType]?.financial && DOC_META[x.docType].ledgerSign>0 && DOC_META[x.docType].group===grp)
    .map(x=>{ const t = computeDocTotals(x); return {d:x, t, due: r2(Math.max(0, t.total - (Number(x.paidAmount||0) - (old[x.id]||0))))}; })
    .filter(o=>o.due>0.004)
    .sort((a,b)=> a.d.date<b.d.date ? -1 : a.d.date>b.d.date ? 1 : String(a.d.number).localeCompare(String(b.d.number), undefined, {numeric:true}));
}
// Money going the other way with no bill of that kind to settle (money back to a customer, from a supplier): a refund.
function payRefund(d){ return !!party(d.partyId) && payDir(d)===-1 && !payCandidates(d).length; }
// The party's balance after this payment is saved (for an edit: after the change).
function payNewBalance(d, a){
  const p = party(d.partyId); if(!p) return 0;
  const op = d.editId ? state.data.payments.find(x=>x.id===d.editId) : null;
  const now = a.amount + (payRefund(d) ? 0 : a.discount), was = op ? Number(op.amount||0) + Number(op.discount||0) : 0;
  return r2(partyBalance(p.id) - payDir(d)*(now - was));
}
// How the amount and the discount settle the bills: the discount first, then the money, oldest bill first —
// over the bills picked on Select Invoice, or all unpaid bills until the money runs out.
function payAllocate(d){
  const cands = payCandidates(d);
  const rows = cands.map(o=>({doc:o.d, t:o.t, due:o.due, disc:0, amt:0, on:false}));
  const byId = {}; rows.forEach(r=>{ byId[r.doc.id] = r; });
  const chosen = d.sel ? rows.filter(r=>d.sel.includes(r.doc.id)) : rows;
  const A = payNum(d.amount);
  let discLeft = 0;
  if(d.discBy){ for(const r of chosen) r.disc = Math.min(r.due, payNum(d.discBy[r.doc.id])); }
  else { let D = payNum(d.discount); for(const r of chosen){ if(D<=0.004) break; r.disc = r2(Math.min(D, r.due)); D = r2(D - r.disc); } discLeft = D; }
  let M = A;
  for(const r of chosen){ if(M<=0.004) break; const x = r2(Math.min(M, r.due - r.disc)); if(x>0){ r.amt = x; M = r2(M - x); } }
  for(const r of rows) r.on = d.sel ? d.sel.includes(r.doc.id) : (r.amt + r.disc > 0.004);
  const discount = d.discBy ? r2(rows.reduce((s_,r)=>s_+r.disc,0)) : payNum(d.discount);

}

function savePayment(fromSelect){
  const d = fromSelect ? state.paySel : state.payDraft; if(!d) return;
  const p = party(d.partyId);
  if(!p){ toast("Select the party"); return; }
  const old = d.editId ? state.data.payments.find(x=>x.id===d.editId) : null;
  if(d.editId && !old){ toast("This payment is no longer there"); return; }
  const dir = payDir(d), a = payAllocate(d), disc = payRefund(d) ? 0 : a.discount;
  if(!(a.amount + disc > 0.004)){ toast("Enter the amount"); refocusById(fromSelect ? "ps-amt" : "pf-amt"); return; }
  const inflow = d.ptype==="in";
  const alloc = a.rows.filter(r=>r.amt + r.disc > 0.004).map(r=>{ const o = {docId:r.doc.id, amt:r2(r.amt + r.disc)}; if(r.disc>0.004) o.disc = r2(r.disc); return o; });
  const settled = r2(alloc.reduce((s_,x)=>s_+x.amt, 0));
  // editing: take back what the payment had settled, then settle again as it is now
  if(old) for(const x of (old.alloc||[])){ const doc = state.data.docs.find(z=>z.id===x.docId); if(doc) doc.paidAmount = r2(Math.max(0, Number(doc.paidAmount||0) - (Number(x.amt)||0))); }
  for(const x of alloc){ const doc = state.data.docs.find(z=>z.id===x.docId); if(doc) doc.paidAmount = r2(Number(doc.paidAmount||0) + x.amt); }
  const fields = { no: Math.round(Number(d.no)) || (old ? old.no : nextPayNo(inflow)), partyId:p.id, amount:r2(a.amount), unallocated:r2(Math.max(0, a.amount + disc - settled)),
    date: d.date || todayISO(), mode: d.mode || "Cash", note: String(d.note||"").trim(), dir, alloc };
  let pay;
  if(old){ pay = old; delete pay.discount; delete pay.bankId; Object.assign(pay, fields); pay.updatedAt = Date.now(); }
  else { pay = { id:genId(), ...fields, createdAt: Date.now() }; state.data.payments.push(pay); }
  if(disc>0.004) pay.discount = r2(disc);
  if(pay.mode!=="Cash" && pay.mode!=="At billing" && bankById(d.bankId)) pay.bankId = d.bankId;
  const prof = state.data.profile; if(prof && PAY_MODES.includes(pay.mode)){ prof.lastPayMode = pay.mode; if(pay.bankId) prof.lastPayBank = pay.bankId; }
  if(!saveData()) return;
  clearPreviewCache();                                 // balances printed on bills change
  state.payDraft = null; state.paySel = null; state.payMenu = null;
  showLoading(360);
  navGoBack();                                         // back to where Record / Edit Payment was opened
  toast(`${inflow?"Received Payment":"Payment Out"} #${pay.no} ${old ? "updated" : "saved"}`);
}

async function buildReceiptPagesNow(payId){

    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.setTransform(S,0,0,S,0,0);

const _rcptPages = {}, _rcptJobs = {};
function receiptKey(p){
  const docs = payLiveAllocs(p).map(({d})=>[d.id, d.number, d.date, computeDocTotals(d).total]);
  return p.id + ":" + hashString(JSON.stringify([p, party(p.partyId)||null, state.data.profile||null, docs, bankById(p.bankId)]));

function receiptPages(p){
  const key = receiptKey(p);
  if(_rcptPages[key]) return Promise.resolve(_rcptPages[key]);

  const job = _renderQueue.then(()=>buildReceiptPagesNow(p.id)).then(pages=>{
    for(const k of Object.keys(_rcptPages)) delete _rcptPages[k];       // only the latest receipt stays in memory
    _rcptPages[key] = pages; pdfFor(pages).catch(()=>{}); return pages; });
  _renderQueue = job.catch(()=>{});
  _rcptJobs[key] = job; const done = ()=>{ delete _rcptJobs[key]; }; job.then(done, done);

}
async function payAction(payId, act){

// ---------------- navigation history (phone back button / back gesture) ----------------
// Every screen you open (tab, invoice, party, form, sheet) is recorded as a real browser history
// entry at the moment you tap, so the phone's back gesture walks back through the exact path you
// took — breadcrumb by breadcrumb — and always ends on Home. Back on Home leaves the app.
let _navApplying = false, _navJumping = false, _navSkipFrom = null, _navBoot = false;
function navSig(){
  const v = state.view ? {...state.view} : null;
  const m = state.modal ? {type: state.modal.type, id: state.modal.id||null, ptype: state.modal.ptype||null, ...(state.modal.choice ? {choice: state.modal.choice} : {})} : null;
  return {tab: state.tab||"dashboard", view: v, modal: m};
}
function navKey(sig){ return JSON.stringify([sig.tab, sig.view, sig.modal]); }
// the same, but a bill shown as another copy (Duplicate …) counts as the same screen
function navKeyLoose(sig){ const v = sig.view && sig.view.copy ? {...sig.view} : sig.view; if(v && v.copy) delete v.copy; return JSON.stringify([sig.tab, v, sig.modal]); }
const HOME_SIG = {tab:"dashboard", view:null, modal:null};
function navTrack(){
  if(_navApplying || _navBoot) return;              // _navBoot: the start-up jump back to the first entry is still running
  const sig = navSig(), k = navKey(sig);
  const cur = history.state;
  if(cur && cur.k===k){ state._navReplace = false; return; }
  try{
    // one screen/sheet taking the place of another (e.g. Add Items → Create New Item): no new back step
    if(state._navReplace && cur && !cur.root){ state._navReplace = false; history.replaceState({k, sig, y: 0, n: cur.n||0}, ""); return; }
    state._navReplace = false;
    // Coming back to Home clears the trail: jump back to the first entry, so back on Home exits.
    if(k===navKey(HOME_SIG) && cur && !cur.root && cur.n>0){ if(!_navJumping){ _navJumping = true; history.go(-cur.n); } return; }
    if(cur && cur.sig && cur.sig.modal && !sig.modal && !cur.root){
      // a sheet was closed by a button (Save / Cancel / ✕): replace its entry instead of adding one
      history.replaceState({k, sig, y: 0, n: cur.n||0}, "");
    } else {
      if(cur) history.replaceState({...cur, y: window.scrollY}, "");
      history.pushState({k, sig, y: 0, n: ((cur&&cur.n)||0)+1}, "");
    }
  }catch(e){}
}
function navCleanupModal(){
  state.numDraft=null; state.cfDraft=null; state.shareDraft=null; state.themeDraft=null; state.itemDraft=null; state.partyDraft=null; state.output=null; state.scan = state.scan && state.scan.busy ? state.scan : null;
}
function navValid(sig){
  const v = sig.view;
  if(!v) return true;
  if(v.name==="docNew") return !!state.docDraft;
  if(v.name==="payForm") return !!state.payDraft && (!v.edit || state.payDraft.editId===v.edit);
  if(v.name==="payDetail") return state.data.payments.some(p=>p.id===v.id);
  if(v.name==="paySelect") return !!state.paySel;
  if(v.name==="docDetail") return state.data.docs.some(d=>d.id===v.id);
  if(v.name==="partyLedger") return state.data.parties.some(p=>p.id===v.id);
  if(v.name==="itemDetail") return state.data.items.some(p=>p.id===v.id);
  return true;
}
function navGoBack(){ // in-app back arrow behaves exactly like the phone's back
  if(history.state && !history.state.root) history.back();

}
window.addEventListener("popstate", (e)=>{

  if(!st || !st.sig) return;                    // moved past the app's first entry
  if(_navJumping){ _navJumping = false; if(navKey(navSig())===navKey(HOME_SIG)) return; }
  // back with the scanner, the ⋮ menu or a drop-down open just closes it (like the reference app)
  if(state.scannerOpen || state.menuOpen || state.payMenu){

  }

  }
  if(leavingForm && !state.modal) state.docDraft = null;
  { const tv = target.view && target.view.name;
    state.payMenu = null;

    if(tv!=="payForm" && tv!=="paySelect") state.payDraft = null;

    if(fromScreen && tv==="payDetail" && state.data.payments.some(p=>p.id===target.view.id)) startPayViewSkeleton();
    if(fromScreen && tv==="docDetail" && state.data.docs.some(d=>d.id===target.view.id)) startDocViewSkeleton(target.view.id, target.view.copy);
    if(fromScreen && !tv && target.tab==="dashboard"){ state.homeLoading = true; clearTimeout(homeFlash._t);
      const wantY = st.y||0;
      homeFlash._t = setTimeout(()=>{ state.homeLoading = false; if(state.view || state.tab!=="dashboard") return; render(); mountNav(); if(wantY>0 && window.scrollY<wantY) window.scrollTo(0, wantY); }, 380); } }
  const was = _navSkipFrom || navKeyLoose(navSig()), hadModal = !!state.modal; _navSkipFrom = null;
  if(state.modal && !target.modal) navCleanupModal();
  state.tab = target.tab; state.view = target.view ? {...target.view} : null;
  state.modal = target.modal ? {...target.modal} : null;
  if(!navValid(target) && !st.root){ _navSkipFrom = was; history.back(); return; }        // screen no longer exists (saved / deleted)
  if(navKeyLoose(target)===was){ history.back(); return; }           // duplicate entry (or Home again) — skip it
  navAnimate(hadModal || state.modal ? "none" : "pop", ()=>{ _navApplying = true; try{ render(); mountNav(); } finally { _navApplying = false; } window.scrollTo(0, st.y||0); });
  requestAnimationFrame(()=>window.scrollTo(0, st.y||0));
});
try{
  const st0 = history.state;

  else history.replaceState({k: navKey(HOME_SIG), sig: HOME_SIG, y: 0, root: true, n: 0}, "");
}catch(e){}

// ---------- keyboard (phones): the page shrinks above it, as in the reference app, so the bars with
// Save stay in sight; the bottom menu and the floating buttons hide while typing; a focused field is
// never left hidden behind a Save bar.
(function(){
  if(!window.matchMedia || !matchMedia("(pointer:coarse)").matches) return;

    if(a.tagName==="TEXTAREA" || a.isContentEditable) return true;
    return a.tagName==="INPUT" && !/^(checkbox|radio|button|submit|reset|file|range|color|date|month|week|time|datetime-local|hidden)$/i.test(a.type||""); };
  let full = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const scrollerOf = el => { for(let n = el.parentElement; n && n!==document.body; n = n.parentElement){ const oy = getComputedStyle(n).overflowY; if((oy==="auto"||oy==="scroll") && n.scrollHeight>n.clientHeight+2) return n; } return null; };
  const keepVisible = () => {
    const a = document.activeElement; if(!typing()) return;
    const bar = [...document.querySelectorAll(".paybar, .billbar, .ip-bottom, .sheet.full .btn-row")].find(b=>b.getClientRects().length && getComputedStyle(b).position==="fixed");
    const limit = bar ? bar.getBoundingClientRect().top : (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    const over = a.getBoundingClientRect().bottom - limit + 12;
    if(over>0){ const sc = scrollerOf(a); if(sc) sc.scrollTop += over; else window.scrollBy(0, over); }
  };
  const upd = () => {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    if(!typing()) full = h;                                   // no keyboard now: this is the full height
    const open = typing() && h < full - 120;
    document.body.classList.toggle("kb-open", open);
    if(open){ setTimeout(keepVisible, 60); setTimeout(keepVisible, 360); }
  };
  window.addEventListener("resize", upd);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", upd);
  document.addEventListener("focusin", ()=>setTimeout(upd, 80));
  document.addEventListener("focusout", ()=>setTimeout(upd, 80));
  window.addEventListener("orientationchange", ()=>setTimeout(()=>{ full = window.visualViewport ? window.visualViewport.height : window.innerHeight; upd(); }, 450));
})();

try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
render();
mountNav();
if(!state.data.profile){ state.modal={type:"profile"}; render(); }
// v44: clean up a signature that was uploaded before (remove the paper background) — once
(function(){
  const p = state.data.profile; if(!p || !p.signatureDataUrl || p._sigCleanV44) return;
  const img = new Image();
  img.onload = () => { try{ const u = cleanSignatureImage(img); if(u){ p.signatureDataUrl = u; } }catch(e){}
    p._sigCleanV44 = true; saveData(); clearPreviewCache(); render(); };
  img.onerror = () => { p._sigCleanV44 = true; saveData(); };
  img.src = p.signatureDataUrl;
})();
</script>
