<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content" />
<title>Yashvi Creation</title>
<meta name="theme-color" content="#FFFFFF" />
<meta name="color-scheme" content="only light" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Yashvi Creation" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-yc-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon-yc.png" />
<style>
  :root{
    color-scheme: only light;
    --navy:#132A46; --navy-light:#1D3A5F; --paper:#FAF7F0; --line:#E5DFCF;
    --ink:#20242B; --green:#1F7A5C; --green-bg:#E9F3EE; --rust:#BE5030; --rust-bg:#F7E9E2;
    --amber:#B8860B; --amber-bg:#FBF1DD; --slate:#6B7280; --indigo:#4C4FE0; --indigo-bg:#ECEBFC;
    --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overscroll-behavior-y:none;}
  :is(#app,#app-ghost){min-height:100%;padding-bottom:calc(70px + var(--safe-bottom));}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  .mono{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);
    padding:calc(14px + var(--safe-top)) 16px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .topbar .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:2px;}
  .topbar h1{font-size:19px;margin:0;font-weight:400;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .fab-inline{background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 14px;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;}

  .content{padding:14px 16px 24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .empty{text-align:center;padding:36px 16px;color:var(--slate);font-size:13px;
    border:1px dashed var(--line);border-radius:14px;background:#fff;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;}
  .stat-card.tint-green{background:var(--green-bg);border-color:#cfe6db;}
  .stat-card.tint-rust{background:var(--rust-bg);border-color:#eeccb9;}
  .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);margin-bottom:6px;
    display:flex;align-items:center;justify-content:space-between;}
  .stat-value{font-size:18px;font-family:Georgia,serif;}

  .section-title{font-size:12px;font-weight:600;color:var(--ink);margin:18px 0 8px;
    display:flex;align-items:center;justify-content:space-between;}
  .section-title a{font-size:12px;color:var(--green);text-decoration:none;font-weight:600;}

  .list-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .row-title{font-size:14px;font-weight:600;}
  .row-sub{font-size:11.5px;color:var(--slate);margin-top:1px;}
  .row-amt{font-size:14px;}

  .avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;}

  .pill{font-size:9.5px;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;white-space:nowrap;}
  .pill.paid{background:var(--green-bg);color:var(--green);}
  .pill.partial{background:var(--amber-bg);color:var(--amber);}
  .pill.unpaid{background:var(--rust-bg);color:var(--rust);}
  .pill.na{background:#EEE;color:var(--slate);}
  .tag{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--indigo-bg);color:var(--indigo);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

  .search{position:relative;margin-bottom:12px;}
  .search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;background:#fff;}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);}
  .txi{border-bottom:1px solid var(--line);} .txi:last-child{border-bottom:none;} .txi > .list-row{border-bottom:none;}
  .home-fab{position:fixed;left:12px;right:12px;bottom:calc(66px + var(--safe-bottom));z-index:25;display:flex;gap:8px;align-items:center;pointer-events:none;}
  .home-fab button{pointer-events:auto;box-shadow:0 4px 14px rgba(19,42,70,.22);}
  .hf-btn{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;height:46px;border-radius:23px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:12.5px;font-weight:700;font-family:inherit;white-space:nowrap;padding:0 8px;}
  .hf-btn span{overflow:hidden;text-overflow:ellipsis;}
  .hf-btn svg{width:17px;height:17px;flex-shrink:0;}
  @media (max-width:374px){ .hf-btn{font-size:12px;padding:0 6px;gap:4px;} .hf-btn svg{width:15px;height:15px;} .home-fab{left:8px;right:8px;gap:6px;} }
  .hf-main{background:var(--green);border-color:var(--green);color:#fff;}
  .hf-plus{width:48px;height:48px;border-radius:25px;border:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hf-plus svg{width:22px;height:22px;}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);
    display:flex;padding-bottom:var(--safe-bottom);border-top:1px solid rgba(255,255,255,.08);}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;
    color:rgba(255,255,255,.5);background:none;border:none;font-size:10px;font-family:inherit;}
  .navbtn.active{color:#fff;}
  .navbtn .dot{width:4px;height:4px;border-radius:99px;background:var(--green);margin-top:1px;opacity:0;}
  .navbtn.active .dot{opacity:1;}

  label.field{display:block;margin-bottom:12px;}
  .field-label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--slate);margin-bottom:5px;}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:inherit;}
  textarea{min-height:60px;resize:vertical;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;
    font-weight:600;font-size:14px;padding:11px 16px;border:none;width:100%;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.accent{background:var(--green);color:#fff;}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:#fff;color:var(--rust);border:1px solid var(--rust);}
  .btn:disabled{opacity:.4;}
  .btn-row{display:flex;gap:8px;margin-top:14px;}
  .btn-row .btn{flex:1;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;}
  .seg button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .sheet-overlay{position:fixed;inset:0;background:rgba(19,42,70,.5);z-index:50;display:flex;align-items:flex-end;}
  .sheet{background:var(--paper);width:100%;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;
    padding:8px 18px calc(20px + var(--safe-bottom));animation:slideup .22s ease-out;}
  .sheet.full{max-height:96vh;}
  @keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:6px auto 14px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h3{font-size:17px;margin:0;font-weight:400;}
  .sheet-close{width:30px;height:30px;border-radius:99px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .paper-bill{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .bill-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
  .bill-to{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:10px;}
  .bill-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .bill-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid var(--line);
    font-size:16px;font-family:Georgia,serif;}
  .bill-table{width:100%;font-size:11.5px;border-collapse:collapse;margin-bottom:8px;}
  .bill-table th{text-align:right;color:var(--slate);font-weight:600;padding:4px 3px;border-bottom:1px solid var(--line);}
  .bill-table th:first-child,.bill-table td:first-child{text-align:center;color:var(--slate);}
  .bill-table th:nth-child(2),.bill-table td:nth-child(2){text-align:left;}
  .bill-table td{padding:5px 3px;border-bottom:1px solid #F1EEE4;text-align:right;}

  .item-line{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:9px;margin-bottom:7px;}
  .item-line .name{flex:1;font-size:13px;min-width:0;}
  .item-line .name .hsn{font-size:10px;color:var(--slate);display:block;}
  .item-line input{padding:6px 6px;font-size:12.5px;text-align:right;}
  .item-line .qty{width:44px;}
  .item-line .rate{width:60px;}
  .item-line .disc{width:44px;}

  .picker-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .picker-row:last-child{border-bottom:none;}
  .qtybadge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;}
  .add-btn{border:1.5px solid var(--indigo);color:var(--indigo);background:#fff;border-radius:8px;
    padding:6px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .add-btn.has{background:var(--indigo);color:#fff;}

  .rpt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
  .rpt-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;}
  .rpt-tile .ic{width:34px;height:34px;border-radius:10px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;}
  .rpt-tile .ic svg{width:18px;height:18px;}
  .rpt-tile .nm{font-size:10.5px;font-weight:600;line-height:1.2;color:var(--ink);word-break:break-word;}
  .type-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:6px;}
  .type-tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;text-align:center;}
  .type-tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
  .type-tile span{font-size:10.5px;color:var(--ink);line-height:1.2;}

  .more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .more-tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;
    display:flex;flex-direction:column;gap:8px;text-align:left;}
  .more-tile .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}

  .toast{position:fixed;bottom:calc(128px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  .tabs2{display:flex;border-bottom:1px solid var(--line);margin:-1px -16px 10px;padding:0 16px;}
  .tabs2 button{flex:1;padding:10px 0;font-size:13px;font-weight:600;background:none;border:none;
    color:var(--slate);border-bottom:2px solid transparent;}
  .tabs2 button.active{color:var(--navy);border-color:var(--navy);}

  .ledger-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);}
  .ledger-item:last-child{border-bottom:none;}

  /* Invoice documents always use dark, print-safe text — the same in every template. */
  .paper-bill{ --ink:#161616; --slate:#3D3D3D; --line:#CFC7B6; color:#161616; }
  .paper-bill .bill-table th{ color:#161616; }
  /* Grid lines: a vertical line between every column (Sr / Item / HSN / Size / Qty / Rate / Tax /
     Amount) and a horizontal line between every row, with a box around the whole table. */
  .paper-bill{ --grid:#5E574B; }
  .paper-bill .bill-table{ border-collapse:collapse; border:none; }
  .paper-bill .bill-table tr.rep-head th{ background:rgba(0,0,0,.05); }
  .tpl-boxed .bill-table tr.rep-head th{ background:rgba(0,0,0,.06); }
  .paper-bill .bill-table th, .paper-bill .bill-table td{ border:1px solid var(--grid); padding:6px 7px; }
  .paper-bill .bill-table thead th{ background:rgba(0,0,0,.05); }
  .paper-bill .bill-table tfoot td{ background:rgba(0,0,0,.035); }
  .paper-bill .bill-table tr.grid-filler td{ border-top:none; border-bottom:none; padding:0; }
  .paper-bill div[style*="overflow-x"]{ overflow:visible !important; }
  .tpl-boxed{ font-size:10.5px; line-height:1.3; }
  .tpl-boxed table.bx{ width:100%; border-collapse:collapse; }
  .tpl-boxed table.bx > tbody > tr > td, .tpl-boxed table.bx > tr > td{ border:1px solid var(--grid); padding:6px 8px; vertical-align:top; }
  .a4-page .tpl-boxed table.bx > tbody > tr > td{ padding:4px 7px; }
  .a4-page .tpl-boxed .bx-items td{ padding:3.5px 6px !important; }
  .a4-page .tpl-boxed .bx-items tbody tr:not(.grid-filler):not(.bf-row) td{ padding-top:7.5px !important; padding-bottom:7.5px !important; }
  .a4-page .tpl-boxed .bx-items th{ padding:4px 5px !important; }
  .tpl-boxed table.bx-inner{ height:calc(100% + 2px); width:calc(100% + 2px); margin:-1px; }
  .tpl-boxed > table + table, .tpl-boxed > .bill-spacer + table{ margin-top:-1px; }
  .tpl-boxed .bx-items th{ vertical-align:middle; }
  .paper-bill.tpl-boxed .bx-items tbody td{ border-top:none !important; border-bottom:none !important; }
  .paper-bill.tpl-boxed .bx-items tbody tr.bf-row td{ border-bottom:1px solid var(--grid) !important; }
  .tpl-boxed table.bx-inner td{ border:1px solid var(--grid); padding:3px 7px; font-size:10px; }
  .tpl-boxed table.bx-tax td{ text-align:right; font-size:10px; padding:3px 5px; }
  .tpl-boxed .bx-h{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--tc); margin-bottom:2px; }
  .tpl-boxed .bx-k{ color:#444; }
  .tpl-boxed .bx-sum{ display:flex; justify-content:space-between; gap:8px; padding:1.5px 0; }
  .tpl-boxed .bill-table{ margin:0 !important; font-size:11px; table-layout:fixed !important; }
  .tpl-boxed .bill-table th{ background:rgba(0,0,0,.06); font-size:10.5px; text-align:center; }
  .tpl-boxed .bill-spacer{ min-height:0 !important; }
  .a4-page .paper-bill.tpl-boxed{ padding:22px 24px !important; }
  .paper-bill .bill-table{ min-width:0 !important; table-layout:auto; }
  .paper-bill .bill-table th, .paper-bill .bill-table td{ word-break:break-word; }
  .paper-bill .bill-table td:first-child{ color:#161616; }

  /* A4 page used for PDF / print output: 794 x 1123 CSS px = 210 x 297 mm, full bleed, no card frame. */
  .a4-page{ position:relative; width:794px; background:#fff; overflow:hidden; }
  .a4-page .a4-bg, .a4-page .a4-wash{ position:absolute; left:0; width:794px; z-index:0; }
  .a4-page .paper-bill{ position:relative; z-index:2; margin:0 !important; border:none !important; border-radius:0 !important;
    background:transparent !important; box-shadow:none !important; box-sizing:border-box; display:flex; flex-direction:column;
    padding:38px 42px !important; font-size:12.5px; }
  .a4-page .paper-bill.tpl-luxury{ margin:16px !important; border:3px double var(--tc) !important; padding:30px 34px !important; }
  .a4-page .paper-bill.tpl-stylish{ padding:0 !important; }
  .a4-page .tpl-stylish .stylish-head{ margin:0 0 14px !important; padding:30px 42px !important; border-radius:0 !important; }
  .a4-page .tpl-stylish .stylish-body{ padding:0 42px 38px !important; flex:1; display:flex; flex-direction:column; }
  .a4-page .bill-inner{ flex:1; display:flex; flex-direction:column; }
  .a4-page .bill-spacer{ flex:1; min-height:14px; }
  .a4-page div[style*="overflow-x"]{ overflow:visible !important; }
  .a4-page .bill-table{ min-width:0 !important; font-size:12px; }

  #print-area{ display:none; }
  @media print{
    @page{ size: A4; margin: 0; }
    html, body{ margin:0 !important; padding:0 !important; background:#fff !important; height:auto !important; }
    body > *:not(#print-area){ display:none !important; }
    #print-area{ display:block !important; position:static !important; left:auto !important; }
    #print-area .print-page{ display:block; width:210mm; height:296.5mm; margin:0; page-break-after:always; break-after:page; }
    #print-area .print-page:last-child{ page-break-after:auto; break-after:auto; }
  }
  /* ===== v47: app layout in the style of the reference recording (indigo, white, card lists) ===== */
  :root{ /* brand: Yashvi Creation logo — crimson wordmark, royal-blue scrollwork, antique-gold frame */
    --primary:#B0164B; --primary-dk:#7E0F36; --primary-bg:#FCEBF1; --dark:#22325E; --plus:#A87320; --gold:#C9A45C;
    --royal:#2F4F8F; --royal-bg:#EAF0FB; --page:#FFFFFF; --soft:#F5F3F4;
    --tx:#212121; --sub:#6F7078; --bd:#E8E3E5; --wa:#1FA055; --navy:#B0164B; }
  html,body{ background:var(--page); color:var(--tx); font-family:'Noto Sans','Roboto',-apple-system,'Segoe UI',sans-serif; }
  :is(#app,#app-ghost) .serif, #modal-root .serif{ font-family:inherit; font-weight:700; }
  :is(#app,#app-ghost) .stat-value{ font-family:inherit; font-weight:700; }
  :is(#app,#app-ghost) .topbar{ background:#fff; border-bottom:1px solid var(--bd); padding:calc(12px + var(--safe-top)) 16px 12px; min-height:58px; }
  :is(#app,#app-ghost) .topbar h1{ font-size:19px; font-weight:700; letter-spacing:.1px; }
  :is(#app,#app-ghost) .topbar .eyebrow{ display:none; }
  :is(#app,#app-ghost) .icon-btn{ border:none; background:none; color:var(--primary); width:38px; height:38px; }
  :is(#app,#app-ghost) .icon-btn.red{ color:#E0443A; }
  :is(#app,#app-ghost) .content{ padding:12px 14px 24px; }
  :is(#app,#app-ghost) .card{ border:1px solid var(--bd); border-radius:8px; box-shadow:0 1px 3px rgba(20,20,40,.06); }
  .btn.accent, .fab-inline{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn{ border-radius:8px; }
  .btn.ghost{ border-color:var(--bd); }
  .seg button{ border-radius:99px; background:#EDEDF1; border:1px solid transparent; font-weight:600; color:#3A3A44; }
  .seg button.active{ background:var(--primary-bg); color:var(--primary); border-color:var(--primary); }
  :is(#app,#app-ghost) .tabs2, #modal-root .tabs2{ margin:0 -14px 10px; padding:0; background:#fff; border-bottom:1px solid var(--bd); }
  :is(#app,#app-ghost) .tabs2 button, #modal-root .tabs2 button{ color:var(--sub); font-weight:500; font-size:14px; padding:12px 0; border-bottom:3px solid transparent; }
  :is(#app,#app-ghost) .tabs2 button.active, #modal-root .tabs2 button.active{ color:var(--primary); border-color:var(--primary); font-weight:600; }
  input,select,textarea{ border-color:#CFCFD6; border-radius:6px; }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .field-label{ text-transform:none; letter-spacing:0; font-size:12.5px; color:#44454D; font-weight:500; }
  /* bottom navigation: white, grey icons, indigo active */
  .bottomnav{ background:#fff; border-top:1px solid var(--bd); box-shadow:0 -1px 6px rgba(0,0,0,.04); }
  .navbtn{ color:#6B6C74; font-size:11px; padding:8px 0 7px; }

const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt0 = (n) => "₹" + Math.round(Number(n||0)).toLocaleString("en-IN");
const fmtW = (n) => { const v = Math.round(Number(n||0)*100)/100; return Math.abs(v - Math.round(v)) < 0.005 ? fmt0(v) : fmt(v); };
const fmtN = (n) => { const v=Number(n||0); const isWhole = Math.round(v*100)%100===0; return v.toLocaleString("en-IN", isWhole?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2}); };
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const monthLabel = (iso) => new Date(iso).toLocaleString("en-IN", { month: "short", year: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysAgo = (iso) => (Date.now() - new Date(iso).getTime()) / 86400000;
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function setDueDatePreset(val){
  const d = ensureDraft();
  if(!val){ d.dueDate=""; render(); return; }
  if(val==="custom") return; // leave existing date field as-is
  const [y,m,dd] = (d.date||todayISO()).split("-").map(Number);
  d.dueDate = new Date(Date.UTC(y,m-1,dd+Number(val))).toISOString().slice(0,10);

}

function numberToWords(num){
  num = Math.round(Number(num||0));
  if(num===0) return "Zero Rupees";
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(n){ if(n<20) return a[n]; return b[Math.floor(n/10)] + (n%10? " "+a[n%10]:""); }
  function three(n){ if(n>99) return a[Math.floor(n/100)]+" Hundred"+(n%100? " "+two(n%100):""); return two(n); }
  const crore = Math.floor(num/10000000); num%=10000000;
  const lakh = Math.floor(num/100000); num%=100000;
  const thousand = Math.floor(num/1000); num%=1000;
  const rest = num;
  let out=[];
  if(crore) out.push(three(crore)+" Crore");
  if(lakh) out.push(three(lakh)+" Lakh");
  if(thousand) out.push(three(thousand)+" Thousand");
  if(rest) out.push(three(rest));
  return out.join(" ")+" Rupees";
}

function hexToRgba(hex, a){
  const h = (hex||"#132A46").replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r||19},${g||42},${b||70},${a})`;
}

const DEFAULT_THEME = { style:"simple", color:"#132A46" };

const GSTIN_ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const GST_STATE_CODE_MAP = {

  "38":"Ladakh"

const GST_STATE_NAME_TO_CODE = Object.fromEntries(Object.entries(GST_STATE_CODE_MAP).map(([k,v])=>[v,k]));
function stateCodeFor(stateName){ return GST_STATE_NAME_TO_CODE[stateName] || ""; }
function gstinCheckDigit(first14){
  let sum = 0, factor = 2;
  for(let i = first14.length-1; i>=0; i--){
    const cp = GSTIN_ALPHABET.indexOf(first14[i]);
    if(cp<0) return null;
    let addend = cp*factor;
    factor = factor===2 ? 1 : 2;
    addend = Math.floor(addend/36) + (addend%36);
    sum += addend;
  }
  const rem = sum % 36;
  return GSTIN_ALPHABET[(36-rem)%36];
}
function decodeGSTIN(raw){
  const g = (raw||"").toUpperCase().trim();
  const re = /^([0-9]{2})([A-Z]{5}[0-9]{4}[A-Z])([1-9A-Z])([A-Z0-9])([A-Z0-9])$/;
  const m = g.match(re);
  if(g.length!==15 || !m) return { formatOk:false };
  const stateCode = m[1], pan = m[2];
  const stateName = GST_STATE_CODE_MAP[stateCode] || null;
  const checkOk = gstinCheckDigit(g.slice(0,14)) === g[14];
  return { formatOk:true, stateCode, stateName, pan, checkOk };
}
function gstinHintInfo(h){
  if(!h) return null;

  if(!h.checkOk) return {color:"var(--amber)", text:"⚠ Check digit doesn't match — double-check this GSTIN for typos."};
  return {color:"var(--green)", text:"✓ Valid GSTIN · "+h.stateName+" · PAN "+h.pan+" — filled in below."};

// ---------------- store ----------------
const STORAGE_KEY = "ledger-billbook-data";
function loadData(){
  let d = { profile:null, items:[], parties:[], docs:[], payments:[], expenses:[] };
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      d = { ...d, ...parsed };
      // migrate old "invoices" shape -> docs
      if(Array.isArray(parsed.invoices) && !parsed.docs){
        d.docs = parsed.invoices.map(inv => ({
          id: inv.id, docType: "invoice", number: inv.number, date: inv.date, partyId: inv.partyId,
          items: inv.items.map(l => ({...l, hsn:"", discPercent:0, taxRate: inv.taxPercent||0, cessRate:0})),
          extraDiscount: inv.discount||0, deliveryCharge:0, paidAmount: inv.paidAmount||0, notes:""
        }));
      }
    }
  }catch(e){}
  // v27: one-time replacement of saved terms with the business's standard terms
  if(d.profile && !d.profile._termsV27){ const old=(d.profile.termsAndConditions||"").trim(); if(!old || old.startsWith("1. Payment due within 30 days")) d.profile.termsAndConditions = DEFAULT_TERMS; d.profile._termsV27 = true; try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){} }
  if(!Array.isArray(d.docs)) d.docs=[];
  if(!Array.isArray(d.payments)) d.payments=[];
  ["items","parties","expenses","stockAdj"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  d.docs = d.docs.filter(x=>x && typeof x==="object").map(x=>({...x, docType: DOC_META[x.docType]?x.docType:"invoice", items: Array.isArray(x.items)?x.items:[]}));
  if(!(d.schema>=29)){ // keep totals of invoices saved before v29 exactly as they were printed
    d.docs.forEach(x=>{ if(Number(x.extraDiscount||0)>0 && x.legacyExtraDisc===undefined) x.legacyExtraDisc = true; });
    d.schema = 29;
  }
  // v39: stock is worked out from opening stock + every bill (never a stored running counter that can drift)
  if(!(d.schema>=39)){
    d.items.forEach(it=>{
      if(it.openingStock!==undefined) return;
      const mv = stockMovementFor(it.id, d.docs, d.stockAdj||[]);
      const opening = Number(it.stock||0) - mv;
      it.openingStock = opening > 0 ? Math.round(opening*1000)/1000 : 0;  // a negative opening stock can only be a left-over
    });
    d.schema = 39;
  }
  // v53: every payment keeps a fixed number (Received Payment #614 …). Older entries get theirs once,
  // in the order they were numbered before, so nothing shown so far changes.
  if(d.payments.some(x=>x && !x.no)){
    const ptype = id => (d.parties.find(x=>x.id===id)||{}).type || "customer";
    const inflowOf = x => (ptype(x.partyId)==="customer") === (x.dir!==-1);
    for(const inflow of [true, false]){
      const list = d.payments.filter(x=>inflowOf(x)===inflow).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(String(a.id)<String(b.id)?-1:1));
      const anyNo = list.some(x=>x.no); let mx = list.reduce((m,x)=>Math.max(m, Number(x.no)||0), 0);
      list.forEach((x,i)=>{ if(!x.no) x.no = anyNo ? ++mx : i+1; });
    }
  }
  // v54: payments saved before v46 have no record of which bills they paid. Give them one, oldest bill
  // first — the same split the app has always shown — so deleting / editing them is exact and nothing
  // shown changes. Money that fits no bill is kept as advance on that payment.
  if(!(d.schema>=54)){
    const legacy = d.payments.filter(x=>x && !Array.isArray(x.alloc));
    if(legacy.length){
      const live = d.docs.filter(x=>!x.cancelled), used = {};
      d.payments.forEach(x=>{ if(Array.isArray(x.alloc)) x.alloc.forEach(a=>{ used[a.docId] = (used[a.docId]||0) + Number(a.amt||0); }); });
      live.forEach(n=>(n.adjust||[]).forEach(a=>{ used[a.docId] = (used[a.docId]||0) + Number(a.amt||0); }));
      const byParty = {};
      legacy.forEach(x=>{ x.alloc = []; if(x.dir!==-1) (byParty[x.partyId] = byParty[x.partyId] || []).push(x); });
      const r2l = v => Math.round(v*100)/100;
      for(const [pid, pays] of Object.entries(byParty)){
        pays.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(String(a.id)<String(b.id)?-1:1));
        const pool = pays.map(x=>({x, left: Math.max(0, Number(x.amount||0) - Number(x.unallocated||0))})).filter(q=>q.left>0.004);
        const bills = live.filter(x=>x.partyId===pid && DOC_META[x.docType]?.financial && DOC_META[x.docType].ledgerSign>0)
          .sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
        for(const b of bills){
          let room = Number(b.paidAmount||0) - (used[b.id]||0);
          while(room>0.004 && pool.length){
            const q = pool[0], v = Math.min(room, q.left);
            q.x.alloc.push({docId:b.id, amt:r2l(v)}); used[b.id] = (used[b.id]||0) + v; room -= v; q.left -= v;
            if(q.left<=0.004) pool.shift();
          }
        }
        for(const q of pool) q.x.unallocated = r2l(Number(q.x.unallocated||0) + q.left);
      }
    }
    d.schema = 54;
  }
  if(!(d.schema>=55)){
    // Before v54 a payment could settle any unpaid bill of the party (a customer's purchase bill too). A payment
    // now settles only the kind of bill its money goes with; any other allocation goes back to the payment as
    // advance (money + discount stay on it), so the balance again equals the statement.
    const typeOf = id => ((d.parties||[]).find(x=>x.id===id)||{}).type || "customer", rr = v => Math.round(v*100)/100;
    const docById = {}; for(const x of (d.docs||[])) docById[x.id] = x;
    for(const x of (d.payments||[])){ if(!x || !Array.isArray(x.alloc) || !x.alloc.length) continue;
      const own = typeOf(x.partyId)==="supplier" ? "purchase" : "sales", want = x.dir===-1 ? (own==="sales" ? "purchase" : "sales") : own;
      const keep = [];
      for(const a of x.alloc){ const doc = docById[a.docId], m = doc && DOC_META[doc.docType];
        if(doc && m && m.group!==want){ const amt = Number(a.amt)||0;
          if(!doc.cancelled) doc.paidAmount = rr(Math.max(0, Number(doc.paidAmount||0) - amt));
          x.unallocated = rr(Number(x.unallocated||0) + amt);
        } else keep.push(a); }
      x.alloc = keep; }
    d.schema = 55;
  }
  recalcStock(d);
  return d;
}
// Cancelled invoices / bills stay on record (their number stays used) but count for nothing:
// no balance, no stock movement, no GST, no reports.
function liveDocs(){ return state.data.docs.filter(d=>!d.cancelled); }
function stockMovementFor(itemId, docs, adj){
  let q = 0;
  for(const a of (adj || state?.data?.stockAdj || [])) if(a.itemId===itemId) q += Number(a.qty)||0;
  for(const doc of docs){ const m = DOC_META[doc.docType]; if(!m || !m.stockSign || doc.cancelled) continue;
    for(const l of (doc.items||[])) if(l.itemId===itemId) q += m.stockSign*(Number(l.qty)||0); }
  return q;
}
function recalcStock(d){
  d = d || state.data;
  const mv = {};
  for(const doc of d.docs){ const m = DOC_META[doc.docType]; if(!m || !m.stockSign || doc.cancelled) continue;
    for(const l of (doc.items||[])) if(l.itemId) mv[l.itemId] = (mv[l.itemId]||0) + m.stockSign*(Number(l.qty)||0); }
  for(const a of (d.stockAdj||[])) if(a.itemId) mv[a.itemId] = (mv[a.itemId]||0) + (Number(a.qty)||0);
  for(const it of d.items){
    if(it.itemType==="service"){ it.stock = 0; continue; }
    if(it.openingStock===undefined) it.openingStock = 0;
    it.stock = Math.round((Number(it.openingStock||0) + (mv[it.id]||0))*1000)/1000;
  }
}
let _storageWarned = false;
function saveData(){
  try{ recalcStock(); }catch(e){}
  let json = "";
  try{ json = JSON.stringify(state.data); localStorage.setItem(STORAGE_KEY, json); }
  catch(e){
    // Not saved: go back to what is really stored, so the screen never shows unsaved entries
    // (and tapping Save again can't add a second copy).
    try{ state.data = loadData(); }catch(err){}
    setTimeout(()=>{ try{ render(); mountNav(); }catch(err){} }, 0);
    bannerError("Couldn't save — this phone's storage for the app is full. Download a backup, then remove the invoice background image or old entries.", 9000);
    return false;
  }
  if(json.length > 4.3e6 && !_storageWarned){ _storageWarned = true;
    setTimeout(()=>bannerError("Storage for the app is almost full — download a backup from More → Backup soon.", 7000), 400); }
  return true;
}

// What you pick on the lists — date range, sort, To Pay / To Collect, category, Filter By, Low Stock,
// a report's period — stays picked: on every screen, and the next time the app opens (kept on this phone).
const PREFS_KEY = "ledger-billbook-prefs";
const LIST_PREFS = ["partyFilter","partyCat","partyType","partySort","partyRange","itemFilter","itemCat","itemType","itemSort","itemsView"];
let _prefs = (()=>{ try{ const o = JSON.parse(localStorage.getItem(PREFS_KEY)||"{}"); return o && typeof o==="object" && !Array.isArray(o) ? o : {}; }catch(e){ return {}; } })();
function setPref(k, v){ if(v==null || v==="") delete _prefs[k]; else _prefs[k] = v; try{ localStorage.setItem(PREFS_KEY, JSON.stringify(_prefs)); }catch(e){} }
function usePrefs(keys){ for(const k of (keys||LIST_PREFS)) state[k] = _prefs[k] ?? null; }
function pickPref(k, v){ state[k] = v==null || v==="" ? null : v; setPref(k, state[k]); }    // picked on a list: shown now, and kept
usePrefs();

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 1900);
}

// ---------------- computed ----------------
const ROUND_MODES = ["none","manual","near","up","down"];       // round off on a bill; anything else (older bills: "auto") = up
function computeDocTotals(doc){
  const meta = DOC_META[doc.docType] || DOC_META.invoice;
  const party = state.data.parties.find(p=>p.id===doc.partyId);
  const bState = state.data.profile?.state;
  const posState = doc.pos || party?.state;          // place of supply: set on the bill, else the party's state
  const sameState = !posState || !bState || posState === bState;
  let subtotal=0, discTotal=0, taxableTotal=0, taxTotal=0, cessTotal=0, itemsTotal=0;
  // item discount: a % of the line, or (v58) a ₹ amount for the whole line (discFlat)
  const lineDisc = l => { const base = (Number(l.qty)||0)*(Number(l.price)||0), flat = Number(l.discFlat)||0;
    return flat>0 ? Math.min(Math.max(0, base), flat) : base*((Number(l.discPercent)||0)/100); };
  const grossOf = l => (Number(l.qty)||0)*(Number(l.price)||0) - lineDisc(l);
  const grossSum = (doc.items||[]).reduce((s,l)=>s+grossOf(l),0);
  // bill discount: a ₹ amount, or (v58) a % of the items' value (extraDiscPct) — kept as % so it follows the items
  const extraDiscPct = Math.min(100, Math.max(0, Number(doc.extraDiscPct)||0));
  const extraDisc = extraDiscPct>0 ? Math.round(grossSum*extraDiscPct)/100 : (Number(doc.extraDiscount||0) || 0);
  // Invoice-level discount reduces the taxable value (GST is charged after it). Invoices saved before
  // v29 took it off after tax; they are flagged legacyExtraDisc so their printed totals never change.
  const discBeforeTax = extraDisc>0 && !doc.legacyExtraDisc;
  const share = discBeforeTax && grossSum>0 ? Math.min(extraDisc, grossSum)/grossSum : 0;
  const lines = (doc.items||[]).map(l=>{
    const qty = Number(l.qty)||0, price = Number(l.price)||0;
    const base = qty*price;
    const discAmt = lineDisc(l), flat = Number(l.discFlat)||0;
    const discPercent = flat>0 ? (base>0 ? Math.round(discAmt/base*10000)/100 : 0) : (Number(l.discPercent)||0);   // shown on the bill
    const gross = base-discAmt;
    const taxable = gross*(1-share);
    const taxAmt = taxable*((Number(l.taxRate)||0)/100);
    const cessAmt = taxable*((Number(l.cessRate)||0)/100);
    subtotal+=base; discTotal+=discAmt; itemsTotal+=gross; taxableTotal+=taxable; taxTotal+=taxAmt; cessTotal+=cessAmt;
    return {...l, qty, price, base, discAmt, discPercent, gross, taxable, taxAmt, cessAmt, lineTotal:taxable+taxAmt+cessAmt};
  });
  if(doc.taxR2){                                    // v54+: each printed figure is in paise, and the total is their sum
    taxableTotal = Math.round(taxableTotal*100)/100; cessTotal = Math.round(cessTotal*100)/100;
    taxTotal = sameState ? 2*Math.round(taxTotal*50)/100 : Math.round(taxTotal*100)/100;
  }
  const cgst = sameState ? taxTotal/2 : 0;
  const sgst = sameState ? taxTotal/2 : 0;
  const igst = sameState ? 0 : taxTotal;
  const delivery = Number(doc.deliveryCharge||0);
  // named additional charges (packing, freight, labour …), added after tax like the delivery charge
  const charges = (doc.charges||[]).map(c=>({name: String(c.name||"").trim() || "Other charges", amount: Number(c.amount)||0})).filter(c=>Math.abs(c.amount)>0.004);
  const chargesTotal = charges.reduce((s_,c)=>s_+c.amount,0);
  const beforeRound = Math.round((taxableTotal+taxTotal+cessTotal+delivery+chargesTotal-(discBeforeTax?0:extraDisc))*100)/100;
  // round off: near (to the nearest rupee — new bills from v58), up / down (to the next / previous rupee),
  // manual (+/- amount typed on the bill), none (keep paise); auto = up (bills saved before v58 keep it)
  const roundMode = ROUND_MODES.includes(doc.roundOffMode) ? doc.roundOffMode : "auto";
  const total = roundMode==="none" ? Math.max(0, beforeRound)
    : roundMode==="manual" ? Math.max(0, Math.round((beforeRound + (Number(doc.roundOffManual)||0))*100)/100)
    : Math.max(0, roundMode==="near" ? Math.round(beforeRound) : roundMode==="down" ? Math.floor(beforeRound) : Math.ceil(beforeRound));
  const roundOff = Math.round((total-beforeRound)*100)/100;
  const paidAll = Number(doc.paidAmount||0) + Number(doc._linkedPaid||0);
  const due = meta.financial ? Math.max(0,total-paidAll) : 0;
  let status = "na";
  if(meta.financial){ status = due>0 && paidAll>0 ? "partial" : due>0 ? "unpaid" : "paid"; }
  if(doc.cancelled) return { lines, subtotal, discTotal, taxableTotal, taxTotal, cessTotal, cgst, sgst, igst, delivery, extraDisc, extraDiscPct,
    total, roundOff, roundMode, charges, chargesTotal, due: 0, status: "cancelled", sameState, meta, itemsTotal, discBeforeTax };
  return { lines, subtotal, discTotal, taxableTotal, taxTotal, cessTotal, cgst, sgst, igst, delivery, extraDisc, extraDiscPct,
    total, roundOff, roundMode, charges, chargesTotal, due, status, sameState, meta, itemsTotal, discBeforeTax };
}

// Old balance entered on the party ("I receive" = they owe me, "I pay" = I owe them), in the same
// sign as partyBalance: + means customer owes you / you owe supplier.
function partyOpening(p){
  if(!p) return 0; const a = Math.abs(Number(p.openingBalance)||0); if(!a) return 0;
  const owesMe = p.openingType!=="pay";
  return (owesMe === (p.type!=="supplier")) ? a : -a;
}
// v54: a party can have both sales and purchase bills. Bills of the party's own kind (sales for a customer,
// purchases for a supplier) raise its balance; the other kind lowers it — the balance is the net amount.
function ownGroup(p){ return p && p.type==="supplier" ? "purchase" : "sales"; }
function roleSign(doc, p){ const m = DOC_META[doc.docType]; return m && m.group===ownGroup(p) ? 1 : -1; }
function partyBalance(partyId){
  const pp = party(partyId);
  let bal=partyOpening(pp);
  liveDocs().forEach(doc=>{
    if(doc.partyId!==partyId) return;
    const meta = DOC_META[doc.docType]; if(!meta || !meta.financial) return;
    const t = computeDocTotals(doc);
    bal += roleSign(doc, pp)*meta.ledgerSign*(t.total-(doc.paidAmount||0));
  });
  state.data.payments.forEach(p=>{ if(p.partyId===partyId) bal -= (p.dir===-1?-1:1)*Number(p.unallocated!=null ? p.unallocated : p.amount||0); });
  return bal;
}
// Every party's balance in one pass over the bills and payments (the Parties list and the Home tiles).
function allPartyBalances(){
  const B = {}, P = {};
  for(const p of state.data.parties){ B[p.id] = partyOpening(p); P[p.id] = p; }
  for(const doc of liveDocs()){
    if(!(doc.partyId in B)) continue;
    const meta = DOC_META[doc.docType]; if(!meta || !meta.financial) continue;
    const t = computeDocTotals(doc);
    B[doc.partyId] += roleSign(doc, P[doc.partyId])*meta.ledgerSign*(t.total-(doc.paidAmount||0));
  }
  for(const x of state.data.payments) if(x.partyId in B) B[x.partyId] -= (x.dir===-1?-1:1)*Number(x.unallocated!=null ? x.unallocated : x.amount||0);
  return B;
}
// The party's balance just before this bill and just after it, read from the party statement — so a
// reprint shows the balance as it stood when the bill was made (later payments don't change it).
function partyBalanceAround(doc){
  if(!doc || !doc.partyId) return {before:0, after:0};
  const st = partyStatement(doc.partyId), idx = state.data.docs.findIndex(x=>x.id===doc.id);
  let before = st.opening, after = null;
  for(const e of st.rows){
    if(e.d && e.d.id===doc.id && (e.kind==="doc" || e.kind==="atbill")){ after = e.run; continue; }
    if(after!==null) break;
    if(e.date < doc.date || (e.date===doc.date && e.seq < idx)) before = e.run; else break;
  }
  return {before, after: after==null ? before : after};
}
function partyBalanceBefore(doc){ return partyBalanceAround(doc).before; }
// Applies a payment against a party's oldest outstanding documents first (so invoices actually get
// marked paid), keeping any leftover as an unallocated credit that still reduces their balance.
// dir = 1 for the normal direction (customer pays us / we pay a supplier); -1 for a refund the other way,
// which raises the balance and is never adjusted against documents.
function applyPaymentToParty(partyId, amount, date, mode, note, dir){
  dir = dir===-1 ? -1 : 1;
  let remaining = Number(amount);
  const alloc = [];
  const own = ownGroup(party(partyId)), grp = dir===-1 ? (own==="sales" ? "purchase" : "sales") : own;
  const docs = liveDocs().filter(d=>d.partyId===partyId && DOC_META[d.docType] && DOC_META[d.docType].financial && DOC_META[d.docType].ledgerSign>0 && DOC_META[d.docType].group===grp)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  for(const doc of docs){
    if(remaining<=0.004) break;
    const t = computeDocTotals(doc);
    if(t.due<=0.004) continue;
    const applied = Math.min(remaining, t.due);
    doc.paidAmount = Number(doc.paidAmount||0) + applied;
    alloc.push({docId:doc.id, amt:applied});
    remaining -= applied;
  }
  const pay = { id:genId(), partyId, amount:Number(amount), unallocated: Math.max(0,remaining), date, mode, note, dir, alloc };
  pay.no = nextPayNo(payInflow(pay));
  state.data.payments.push(pay);
}
// Undo a payment: take back whatever it had marked as paid on documents.
function removePayment(payId){
  const pay = state.data.payments.find(p=>p.id===payId); if(!pay) return;
  let give = Number(pay.amount||0) + Number(pay.discount||0) - Number(pay.unallocated||0);
  if(Array.isArray(pay.alloc)){
    for(const a of pay.alloc){ const d = state.data.docs.find(x=>x.id===a.docId); if(!d) { give -= a.amt; continue; }
      const back = Math.min(Number(d.paidAmount||0), a.amt); d.paidAmount = Number(d.paidAmount||0) - back; give -= a.amt; }
  }
  if(give > 0.004){ // a payment without an allocation record: undo oldest bill first, never below what others settled
    const linked = {}; for(const q of state.data.payments) if(q.id!==pay.id) for(const a of (q.alloc||[])) linked[a.docId]=(linked[a.docId]||0)+Number(a.amt||0);
    for(const n of liveDocs()) for(const a of (n.adjust||[])) linked[a.docId]=(linked[a.docId]||0)+Number(a.amt||0);
    const docs = liveDocs().filter(d=>d.partyId===pay.partyId && DOC_META[d.docType]?.financial && DOC_META[d.docType].ledgerSign>0)
      .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
    for(const d of docs){ if(give<=0.004) break; const room = Number(d.paidAmount||0) - (linked[d.id]||0); if(room<=0.004) continue; const back=Math.min(give, room); d.paidAmount = r2(Number(d.paidAmount)-back); give-=back; }
  }
  state.data.payments = state.data.payments.filter(p=>p.id!==payId);
}
// When a document is deleted, money that had been adjusted against it goes back to the payments as advance.
// ---- Credit / debit notes (and returns) adjusted against one or more invoices / bills
// note.adjust = [{docId, amt}] — each amount is marked as paid on that invoice and on the note.
function isNoteType(t){ const m = DOC_META[t]; return !!(m && m.financial && m.ledgerSign<0); }
function adjSum(list){ return (list||[]).reduce((s,a)=>s+(Number(a.amt)||0),0); }
function noteTargets(partyId, group, excludeNoteId){
  if(!partyId) return [];
  return liveDocs().filter(d=>d.partyId===partyId && DOC_META[d.docType]?.financial && DOC_META[d.docType].ledgerSign>0 && DOC_META[d.docType].group===group)
    .sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
}
function applyNoteAdjust(note){
  for(const a of (note.adjust||[])){ const inv = state.data.docs.find(d=>d.id===a.docId); if(inv) inv.paidAmount = Number(inv.paidAmount||0) + Number(a.amt||0); }
}
function reverseNoteAdjust(note){
  for(const a of (note.adjust||[])){ const inv = state.data.docs.find(d=>d.id===a.docId); if(inv) inv.paidAmount = Math.max(0, Number(inv.paidAmount||0) - Number(a.amt||0)); }
}
// When an invoice is deleted, notes that were adjusted against it get that credit back.
function detachNotesFrom(inv){
  for(const n of state.data.docs){
    if(!Array.isArray(n.adjust)) continue;
    const hit = n.adjust.filter(a=>a.docId===inv.id); if(!hit.length) continue;
    const amt = adjSum(hit);
    n.adjust = n.adjust.filter(a=>a.docId!==inv.id);
    n.paidAmount = Math.max(0, Number(n.paidAmount||0) - amt);
    inv.paidAmount = Math.max(0, Number(inv.paidAmount||0) - amt);
  }
}
function releaseDocPayments(doc, legacyCap){
  // Payments recorded against this bill become advance again. Payments with an allocation record give
  // back exactly what they had put on this bill; older payments without one are undone up to legacyCap
  // (default: the bill's paidAmount).
  let give = legacyCap!=null ? Math.max(0, Number(legacyCap)||0) : Number(doc.paidAmount||0), released = 0;
  const pays = state.data.payments.filter(p=>p.partyId===doc.partyId && (Array.isArray(p.alloc) || p.dir!==-1)).reverse();
  for(const p of pays){
    if(Array.isArray(p.alloc)){
      const hits = p.alloc.filter(x=>x.docId===doc.id); if(!hits.length) continue;
      const amt = hits.reduce((s_,x)=>s_+(Number(x.amt)||0), 0), disc = Math.min(amt, hits.reduce((s_,x)=>s_+(Number(x.disc)||0), 0));
      p.alloc = p.alloc.filter(x=>x.docId!==doc.id);
      p.unallocated = Math.round((Number(p.unallocated||0) + amt - disc)*100)/100; give -= amt; released += amt;
      if(disc>0){ p.discount = Math.round(Math.max(0, Number(p.discount||0) - disc)*100)/100; if(!p.discount) delete p.discount; }
    } else if(give>0.004){
      const fromThis = Math.min(give, Number(p.amount||0)-Number(p.unallocated||0));
      if(fromThis>0){ p.unallocated = Number(p.unallocated||0)+fromThis; give -= fromThis; released += fromThis; }
    }
  }
  return released; // amount that came from recorded payments
}

// Stock is valued at purchase price (cost); items entered without a purchase price use the selling
// price instead. Negative stock (sold more than was ever entered) counts as zero.
function itemUnitCost(it){ const pp = Number(it.purchasePrice||0); return pp>0 ? pp : Number(it.sellingPrice||0); }
function itemStockValue(it){ if(it.itemType==="service") return 0; return Number(it.stock||0) * itemUnitCost(it); }
function computed(){
  const docs = liveDocs().map(d=>({...d, ...computeDocTotals(d)}));
  const customers = state.data.parties.filter(p=>p.type==="customer");
  const suppliers = state.data.parties.filter(p=>p.type==="supplier");
  const B = allPartyBalances();
  // a customer you owe (an advance, or a purchase from them) is to pay; a supplier who owes you is to collect
  let toCollect = 0, toPay = 0;
  for(const p of state.data.parties){ const b = B[p.id]||0; if(Math.abs(b)<0.005) continue; if((b>0) === (p.type!=="supplier")) toCollect += Math.abs(b); else toPay += Math.abs(b); }
  const stockValue = state.data.items.reduce((s,it)=>s+itemStockValue(it),0);
  const wk = periodFor("thisweek");   // same calendar week the tile opens (Monday to today)
  const weekSales = docs.filter(d=>DOC_META[d.docType].group==="sales" && d.meta.financial && d.date>=wk.from && d.date<=wk.to)
    .reduce((s,d)=>s+d.meta.ledgerSign*d.total,0);
  const totalExpenses = state.data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const lowStock = state.data.items.filter(it=>it.itemType!=="service" && it.lowStockAlertOn!==false && Number(it.stock)<=Number(it.lowStockAlert||0));
  const totalSales = docs.filter(d=>DOC_META[d.docType].group==="sales" && d.meta.financial).reduce((s,d)=>s+d.meta.ledgerSign*d.total,0);
  const totalPurchases = docs.filter(d=>DOC_META[d.docType].group==="purchase" && d.meta.financial).reduce((s,d)=>s+d.meta.ledgerSign*d.total,0);
  return { docs, customers, suppliers, toCollect, toPay, stockValue, weekSales, totalExpenses, lowStock, totalSales, totalPurchases };
}
function partyName(id){ if(!id) return "Cash Sale"; return state.data.parties.find(p=>p.id===id)?.name || "Walk-in"; }
function party(id){ return state.data.parties.find(p=>p.id===id); }
function effectivePrice(item, partyId){
  if(partyId && item.partyPrices && item.partyPrices[partyId]!=null && item.partyPrices[partyId]!=="") return Number(item.partyPrices[partyId]);
  return Number(item.sellingPrice||0);
}

// ---------------- render root ----------------
// Updates the page in place instead of rebuilding it: elements that are still there are kept, so a
// text box being typed in keeps focus (the phone keyboard stays up) and scrolled lists keep their
// scroll position. Only what actually changed is touched.
function morphInto(target, html){
  const tmp = document.createElement(target.tagName==="TBODY"?"tbody":"div");
  tmp.innerHTML = html;
  _morphChildren(target, tmp);
}
function _sameKind(a, b){
  if(a.nodeType!==b.nodeType) return false;
  if(a.nodeType!==1) return true;
  if(a.tagName!==b.tagName) return false;
  if((a.id||"")!==(b.id||"")) return false;
  if(a.tagName==="INPUT" && (a.getAttribute("type")||"text")!==(b.getAttribute("type")||"text")) return false;
  if(a.getAttribute("data-morph")==="replace" || b.getAttribute("data-morph")==="replace") return false;
  return true;
}
function _morphChildren(oldP, newP){
  const newKids = Array.from(newP.childNodes);
  const byId = new Map();
  oldP.childNodes.forEach(n=>{ if(n.nodeType===1 && n.id) byId.set(n.id, n); });
  let i = 0;
  for(const nn of newKids){
    let on = oldP.childNodes[i];
    if(nn.nodeType===1 && nn.id && byId.has(nn.id) && byId.get(nn.id)!==on){ const m = byId.get(nn.id); if(m.parentNode===oldP){ oldP.insertBefore(m, on||null); on = m; } }
    if(!on) oldP.appendChild(nn);
    else if(_sameKind(on, nn)) _morphNode(on, nn);
    else oldP.replaceChild(nn, on);
    i++;
  }
  while(oldP.childNodes.length > i) oldP.removeChild(oldP.lastChild);
}
function _morphNode(o, n){
  if(o.nodeType!==1){ if(o.nodeValue!==n.nodeValue) o.nodeValue = n.nodeValue; return; }
  const tag = o.tagName;
  // In sheets that read their fields only on Save (Business details, Expense, Add Bank, Stock adjust) a re-render
  // leaves what was typed alone unless the value on screen really changed.
  const keep = (tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT") && !!o.closest("[data-keep]");
  const oldVal = o.getAttribute("value"), oldChecked = o.hasAttribute("checked");
  for(const a of Array.from(o.attributes)) if(!n.hasAttribute(a.name)) o.removeAttribute(a.name);
  for(const a of Array.from(n.attributes)) if(o.getAttribute(a.name)!==a.value) o.setAttribute(a.name, a.value);
  const focused = o===document.activeElement;
  if(tag==="INPUT"){
    const type = (o.getAttribute("type")||"text").toLowerCase();
    if(type==="checkbox" || type==="radio"){ const c = n.hasAttribute("checked"); if(!keep || c!==oldChecked) o.checked = c; }
    else if(type!=="file" && !focused){ const v = n.getAttribute("value") ?? ""; if(o.value!==v && (!keep || (oldVal ?? "")!==v)) o.value = v; }
    return;
  }
  if(tag==="TEXTAREA"){
    if(keep){ const was = o._rv!==undefined ? o._rv : o.defaultValue; if(!focused && n.value!==was){ o.value = n.value; } o._rv = n.value; return; }
    if(!focused && o.value!==n.value) o.value = n.value; return; }
  // what the last render asked this select to show (read before its options are morphed)
  const prevWant = tag==="SELECT" ? (o._rs!==undefined ? o._rs : Math.max(0, Array.from(o.options).findIndex(op=>op.defaultSelected))) : 0;
  _morphChildren(o, n);
  if(tag==="SELECT"){
    const idx = Array.from(o.options).findIndex(op=>op.hasAttribute("selected"));
    const want = idx>=0 ? idx : 0;
    if(!focused && o.selectedIndex!==want && (!keep || prevWant!==want)) o.selectedIndex = want;
    o._rs = want;
  }
}
function render(){
  const app = document.getElementById("app");
  navTrack();
  document.body.classList.toggle("no-nav", !!state.view);
  morphInto(app, renderTab());
  renderModal();
  renderScanner();
  if(document.getElementById("doc-preview-wait")) setTimeout(hydrateDocPreview, 0);
  if(document.getElementById("theme-pv")) setTimeout(hydrateThemePreview, 0);
  if(state.view && state.view.name==="docDetail") fitDocPreview();
  // copies (Duplicate …) of a bill that is no longer on screen are let go a moment later
  const onBill = () => state.view && state.view.name==="docDetail" ? state.view.id + ":" : null, ob = onBill();
  if(Object.keys(_copyPages).some(k=>!ob || !k.startsWith(ob))){ clearTimeout(render._cp);
    render._cp = setTimeout(()=>{ const b = onBill(); for(const k of Object.keys(_copyPages)) if(!b || !k.startsWith(b)) dropCopy(k); }, 1500); }
  if(!state.view && state.tab==="dashboard") requestAnimationFrame(onDashScroll); else { state.dashP = 0; state.dashCol = false; }
  document.querySelectorAll('#app .pz').forEach(el=>attachPinchZoom(el));
}
// Two-finger pinch zoom + pan + double-tap for invoice previews (custom, so the rest of the app keeps a fixed zoom).
function attachPinchZoom(box){
  if(box._pz) return;
  if(box.dataset.pz==="scroll"){ box._pz = true;      // a long bill scrolls in its box; a double tap opens it full screen
    let t0 = 0, sx = 0, sy = 0, last = 0, lx = 0, ly = 0;
    box.addEventListener("touchstart", e=>{ if(e.touches.length!==1){ t0 = 0; return; } const p = e.touches[0]; t0 = Date.now(); sx = p.clientX; sy = p.clientY; }, {passive:true});
    box.addEventListener("touchend", e=>{ if(!t0 || e.touches.length) return; const p = e.changedTouches[0], now = Date.now();
      const tap = now - t0 < 260 && Math.abs(p.clientX-sx) < 10 && Math.abs(p.clientY-sy) < 10; t0 = 0;
      if(!tap){ last = 0; return; }
      if(now - last < 330 && Math.abs(p.clientX-lx) < 36 && Math.abs(p.clientY-ly) < 36){ last = 0; e.preventDefault(); const b = box.closest(".pz-wrap")?.querySelector(".pz-full"); if(b) b.click(); }
      else { last = now; lx = p.clientX; ly = p.clientY; } }, {passive:false});
    return; }
  const content = box.querySelector('.pz-content'); if(!content) return;
  const full = box.dataset.pz==="full", MAX = 6;
  const st = box._pz = { s:1, x:0, y:0 };
  const cw = () => box.clientWidth, ch = () => box.clientHeight;
  const natH = () => content.offsetHeight;
  function clamp(){
    const W = cw()*st.s, H = natH()*st.s, bw = cw(), bh = full ? ch() : natH();
    st.x = W<=bw ? (bw-W)/2 : Math.min(0, Math.max(bw-W, st.x));
    st.y = H<=bh ? (full?(bh-H)/2:0) : Math.min(0, Math.max(bh-H, st.y));
  }
  function apply(anim){
    clamp();
    content.style.transition = anim ? "transform .2s ease" : "none";
    content.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.s})`;
    if(!full) box.style.touchAction = st.s>1.01 ? "none" : "pan-y";
  }
  function zoomAt(ns, px, py, anim){
    const minS = 1; ns = Math.max(minS, Math.min(MAX, ns));
    st.x = px - (px - st.x) * (ns/st.s); st.y = py - (py - st.y) * (ns/st.s); st.s = ns; apply(anim);
  }
  box._pzSet = (ns) => zoomAt(ns, cw()/2, full?ch()/2:Math.min(natH(), window.innerHeight)/2, true);
  const pts = new Map(); let pinch=null, pan=null, lastTap=0, moved=false;
  const local = e => { const r = box.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  box.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, local(e)); moved=false;
    if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={ d:Math.hypot(a.x-b.x,a.y-b.y)||1, s:st.s, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, x:st.x, y:st.y }; pan=null; }
    else if(pts.size===1 && (full || st.s>1.01)){ const p=local(e); pan={ px:p.x, py:p.y, x:st.x, y:st.y }; }
  });
  box.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, local(e));
    if(pinch && pts.size>=2){
      const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1; const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const ns = Math.max(1, Math.min(MAX, pinch.s*d/pinch.d));
      st.x = mx - (pinch.mx - pinch.x) * (ns/pinch.s); st.y = my - (pinch.my - pinch.y) * (ns/pinch.s); st.s = ns; apply(false); moved=true;
    } else if(pan){
      const p=local(e); const dx=p.x-pan.px, dy=p.y-pan.py; if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
      st.x = pan.x+dx; st.y = pan.y+dy; apply(false);
    }
  });
  const end = e => {
    const wasSingle = pts.size===1 && !pinch;
    pts.delete(e.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===1 && (full || st.s>1.01)){ const p=[...pts.values()][0]; pan={px:p.x,py:p.y,x:st.x,y:st.y}; } else if(pts.size===0) pan=null;
    if(e.type==="pointerup" && wasSingle && !moved){
      const now=Date.now(), p=local(e);
      if(now-lastTap<320){ lastTap=0; if(st.s>1.05) { st.s=1; st.x=0; st.y=0; apply(true); } else zoomAt(2.5, p.x, p.y, true); }
      else lastTap=now;
    }
  };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  // Pinch via touch needs preventDefault so Chrome doesn't try its own gesture.
  box.addEventListener('touchmove', e => { if(e.touches.length>1 || st.s>1.01 || full) e.preventDefault(); }, {passive:false});
  box.addEventListener('wheel', e => { if(!(full || e.ctrlKey)) return; e.preventDefault(); const p=local(e); zoomAt(st.s*Math.exp(-e.deltaY*0.0022), p.x, p.y, false); }, {passive:false});
  const init = Number(box.dataset.initScale||1);
  if(init>1) requestAnimationFrame(()=>{ st.s=init; st.x=-(cw()*init-cw())/2; st.y=0; apply(false); });
  else apply(false);
}

// ---------------- periods (Home list, party statement) ----------------
function periodOptions(){
  const t = todayISO(), [y,m,dd] = t.split("-").map(Number);
  const D = (yy,mm,d) => new Date(Date.UTC(yy,mm-1,d)).toISOString().slice(0,10);
  const dow = (new Date(Date.UTC(y,m-1,dd)).getUTCDay()+6)%7;          // Monday = 0
  const qs = Math.floor((m-1)/3)*3+1;                                    // quarter start month
  const fy = m>=4 ? y : y-1, fyl = n => `${n}-${String((n+1)%100).padStart(2,"0")}`;
  return [
    {key:"today", label:"Today", from:t, to:t},
    {key:"yesterday", label:"Yesterday", from:D(y,m,dd-1), to:D(y,m,dd-1)},
    {key:"thisweek", label:"This week", from:D(y,m,dd-dow), to:t},
    {key:"lastweek", label:"Last week", from:D(y,m,dd-dow-7), to:D(y,m,dd-dow-1)},
    {key:"last7", label:"Last 7 days", from:D(y,m,dd-6), to:t},
    {key:"last365", label:"Last 365 Days", from:D(y-1,m,dd), to:t},
    {key:"thismonth", label:"This month", from:D(y,m,1), to:D(y,m+1,0)},
    {key:"lastmonth", label:"Last month", from:D(y,m-1,1), to:D(y,m,0)},
    {key:"thisq", label:"This quarter", from:D(y,qs,1), to:D(y,qs+3,0)},
    {key:"lastq", label:"Last quarter", from:D(y,qs-3,1), to:D(y,qs,0)},
    {key:"fy", label:`Current FY (${fyl(fy)})`, from:`${fy}-04-01`, to:`${fy+1}-03-31`},
    {key:"lastfy", label:`Last FY (${fyl(fy-1)})`, from:`${fy-1}-04-01`, to:`${fy}-03-31`},
    {key:"all", label:"All time", from:"1900-01-01", to:"2999-12-31"},
  ];
}
function periodFor(key){ return periodOptions().find(o=>o.key===key) || periodOptions().find(o=>o.key==="all"); }
function periodSelectHTML(id, cur, onchange, style){
  return `<select id="${id}" onchange="${onchange}" style="${style||""}">${periodOptions().map(o=>`<option value="${o.key}" ${o.key===cur?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`;
}

// ---------------- money helpers: payments, reminders, payment links ----------------
function partyHasTransactions(id){ return !!id && (state.data.docs.some(d=>d.partyId===id) || state.data.payments.some(x=>x.partyId===id)); }
function payInflow(p){ const pt = party(p.partyId)?.type || "customer"; return (pt==="customer") === (p.dir!==-1); }
// Payment against one bill (Record Payment): marks that bill paid; anything over its due stays as advance.
function recordDocPayment(doc, amt, date, mode, note){
  const t = computeDocTotals(doc);
  const applied = Math.max(0, Math.min(amt, t.due));
  doc.paidAmount = Number(doc.paidAmount||0) + applied;
  if(doc.partyId){ const pay = { id:genId(), partyId:doc.partyId, amount:amt, unallocated: Math.round((amt-applied)*100)/100, date: date||todayISO(), mode: mode||"", note: note || ("Against "+doc.number), alloc: applied>0 ? [{docId:doc.id, amt:applied}] : [],
      dir: DOC_META[doc.docType]?.group===ownGroup(party(doc.partyId)) ? 1 : -1 };      // a customer's purchase bill is paid out
    pay.no = nextPayNo(payInflow(pay)); state.data.payments.push(pay); }
  return applied;
}
function openWhatsApp(phone, msg){
  const ph = phoneDigits(phone);
  const url = (ph.length===10 ? `https://wa.me/91${ph}` : `https://wa.me/`) + `?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank", "noopener");
}
const rs2 = v => "Rs."+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function validUpi(u){ return /^[\w.\-]{2,}@[\w.\-]{2,}$/.test(String(u||"").trim()); }
function upiLink(amount, note){
  const biz = state.data.profile || {}; if(!validUpi(biz.upiId)) return "";
  const e = encodeURIComponent;
  return `upi://pay?pa=${e(biz.upiId.trim())}&pn=${e(biz.businessName||"")}&am=${Number(amount).toFixed(2)}&cu=INR&tn=${e(note||"")}`;
}
function payLines(amount, note){
  const biz = state.data.profile || {}; const out = [];
  if(validUpi(biz.upiId)){ out.push(`Pay by UPI (GPay / PhonePe / Paytm): ${biz.upiId.trim()}`); out.push(`UPI link: ${upiLink(amount, note)}`); }
  if(biz.bankName) out.push(`Bank: ${biz.bankName}, A/c ${biz.bankAccountNo||""}, IFSC ${biz.bankIFSC||""}`);
  return out;
}
function unpaidBills(partyId){
  const grp = ownGroup(party(partyId));
  return liveDocs().filter(d=>d.partyId===partyId && DOC_META[d.docType]?.financial && DOC_META[d.docType].ledgerSign>0 && DOC_META[d.docType].group===grp)
    .map(d=>({d, t:computeDocTotals(d)})).filter(x=>x.t.due>0.004).sort((a,b)=>a.d.date<b.d.date?-1:1);
}
function reminderMessage(p){
  const biz = state.data.profile || {}; const bal = partyBalance(p.id);
  const bills = unpaidBills(p.id);
  const lines = bills.slice(0,10).map(({d,t})=>{ const od = d.dueDate ? daysBetween(d.dueDate, todayISO()) : null;
    return `- ${d.number} dt ${formatDateDMY(d.date)}: ${rs2(t.due)}${od>0?` (overdue by ${od} day${od===1?"":"s"})`:d.dueDate?` (due ${formatDateDMY(d.dueDate)})`:""}`; });
  if(bills.length>10) lines.push(`...and ${bills.length-10} more bill(s)`);
  return [
    `Dear ${p.name},`,
    `This is a gentle reminder that a payment of ${rs2(bal)} is pending with ${biz.businessName||"us"}.`,
    ...(lines.length ? [``, `Pending bills:`, ...lines] : []),
    ``, ...payLines(bal, "Payment "+(biz.businessName||"")),
    ``, `Please ignore if already paid. Thank you - ${biz.businessName||""}${biz.phone?", "+biz.phone:""}`,
  ].join("\n");
}
function paymentMessage(pay){
  const biz = state.data.profile || {}; const p = party(pay.partyId); const inflow = payInflow(pay);
  const bal = p ? partyBalance(p.id) : 0;
  const docs = (pay.alloc||[]).map(a=>state.data.docs.find(d=>d.id===a.docId)).filter(Boolean).map(d=>d.number);
  const balTxt = !p ? null : Math.abs(bal)<0.005 ? `Your account with us is fully settled.`
    : (bal>0) === (p.type!=="supplier") ? `Balance due from you: ${rs2(Math.abs(bal))}` : `Balance payable to you: ${rs2(Math.abs(bal))}`;
  return [
    `Dear ${p?.name||"Sir/Madam"},`,
    inflow ? `We have received your payment of ${rs2(pay.amount)} on ${formatDateDMY(pay.date)}${pay.mode?" by "+pay.mode:""}.`
           : `We have made a payment of ${rs2(pay.amount)} to you on ${formatDateDMY(pay.date)}${pay.mode?" by "+pay.mode:""}.`,
    Number(pay.discount)>0.004 ? `Discount ${inflow?"given":"received"}: ${rs2(pay.discount)}` : null,
    docs.length ? `Adjusted against: ${docs.join(", ")}` : (pay.note ? `Ref: ${pay.note}` : null),
    balTxt,
    ``, `Thank you - ${biz.businessName||""}${biz.phone?", "+biz.phone:""}`,
  ].filter(x=>x!==null).join("\n");
}
function sendReminder(partyId){
  const p = party(partyId); if(!p) return;
  if(!(partyBalance(partyId)>0.004)){ toast("Nothing is pending from "+p.name); return; }
  openWhatsApp(p.phone, reminderMessage(p));
}
function sendPaymentDetails(payId){
  const pay = state.data.payments.find(x=>x.id===payId); if(!pay) return;

}
function dataUrlToFile(dataUrl, name){
  const [head, b64] = dataUrl.split(","); const mime = (/data:([^;]+)/.exec(head)||[])[1] || "image/png";
  const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return new File([u], name, {type:mime, lastModified:Date.now()});
}
// Share Payment Link: WhatsApp message with the due amount and a UPI link, plus the UPI QR image when
// the phone's share menu can take files.
function sharePaymentLink(docId){
  const doc = state.data.docs.find(d=>d.id===docId); if(!doc || doc.cancelled) return;
  const t = computeDocTotals(doc), p = party(doc.partyId), biz = state.data.profile || {};
  const amt = t.due>0.004 ? t.due : t.total;
  const msg = [
    `Dear ${p?.name||"Customer"},`,
    `Payment of ${rs2(amt)} is due for ${t.meta.label} ${doc.number} dated ${formatDateDMY(doc.date)}${doc.dueDate?` (due ${formatDateDMY(doc.dueDate)})`:""}.`,
    ``, ...payLines(amt, doc.number),
    ``, `Thank you - ${biz.businessName||""}${biz.phone?", "+biz.phone:""}`,
  ].join("\n");
  if(!validUpi(biz.upiId)) toast("Tip: add your UPI ID in Business details to include a payment link");
  const link = upiLink(amt, doc.number);
  if(link && navigator.share && navigator.canShare){
    try{
      const file = dataUrlToFile(QR.toDataURL(link, 8), `pay-${String(doc.number).replace(/[^A-Za-z0-9_-]+/g,"-")}.png`);
      if(navigator.canShare({files:[file], text:msg})){
        navigator.share({files:[file], text:msg}).catch(err=>{ if(err && err.name!=="AbortError") openWhatsApp(p?.phone, msg); });
        return;
      }
    }catch(e){}
  }
  openWhatsApp(p?.phone, msg);
}

const HOME_TYPES = [["all","All"],["invoice","Sales"],["pay_in","Received Payment"],["sales_return","Sales Return"],["credit_note","Credit Note"],
  ["quotation","Quotation"],["challan","Delivery Challan"],["proforma","Proforma"],["purchase","Purchase"],["pay_out","Payment Out"],
  ["purchase_return","Purchase Return"],["debit_note","Debit Note"],["expense","Expense"]];
function homeState(){
  if(!state.home){ const r = _prefs.homeRange, so = _prefs.homeSort;
    state.home = {range: periodOptions().some(o=>o.key===r) ? r : "fy", type:"all", q:"", sort: SORTS.some(x=>x[0]===so) ? so : "new", limit:30}; }
  return state.home;
}
function homeEntries(){
  const h = homeState(), r = periodFor(h.range), q = String(h.q||"").trim().toLowerCase();
  const out = [];
  for(const d of state.data.docs){ const m = DOC_META[d.docType]; if(!m) continue; const t = computeDocTotals(d);
    out.push({kind:"doc", type:d.docType, date:d.date, amt:t.total, id:d.id, d:{...d, ...t}, text:`${d.number} ${partyName(d.partyId)} ${m.label}`}); }
  for(const p of state.data.payments){ const pn = party(p.partyId) ? partyName(p.partyId) : "(deleted party)";
    out.push({kind:"pay", type: payInflow(p) ? "pay_in" : "pay_out", date:p.date, amt:Number(p.amount||0), id:p.id, p, text:`${pn} ${p.mode||""} ${p.note||""} ${payInflow(p)?"received payment":"payment out"} #${payNo(p)}`}); }
  for(const e of state.data.expenses) out.push({kind:"exp", type:"expense", date:e.date, amt:Number(e.amount||0), id:e.id, e, text:`${e.category} ${e.note||""} expense`});
  let list = out.filter(x=>x.date>=r.from && x.date<=r.to && (h.type==="all" || x.type===h.type) && (!q || x.text.toLowerCase().includes(q) || String(Math.round(x.amt)).includes(q)));
  const byDate = (a,b) => a.date<b.date ? -1 : a.date>b.date ? 1 : (String(a.id)<String(b.id) ? -1 : 1);
  if(h.sort==="old") list.sort(byDate);
  else if(h.sort==="high") list.sort((a,b)=>b.amt-a.amt);
  else if(h.sort==="low") list.sort((a,b)=>a.amt-b.amt);
  else list.sort((a,b)=>-byDate(a,b));
  return list;
}

function shipToFor(doc, p){
  if(doc && doc.shipTo && doc.shipTo!=="__bill"){ const o = party(doc.shipTo); if(o) return shipView(o); }

function viewTransactions(){

  const sub = state.txSubTab;
  const q = (state.search.tx||"").toLowerCase();

  const today = todayISO();
  const inRange = (d) => {

function partyCategories(){ return [...new Set(state.data.parties.map(p=>String(p.category||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }

// Full statement of a party in date order. inc = raises the balance (bill to a customer / bill from a
// supplier / refund); dec = lowers it (payment, return, note, money paid at billing). The last running
// balance equals partyBalance().
function partyStatement(partyId){
  const p = party(partyId); const direct = directPaidMap(); const ev = [];
  state.data.docs.forEach((d,i)=>{ if(d.cancelled) return;
    if(d.partyId!==partyId) return; const m = DOC_META[d.docType]; if(!m?.financial) return;
    const t = computeDocTotals(d), sg = roleSign(d, p)*m.ledgerSign;
    ev.push({date:d.date, seq:i, kind:"doc", d, t, label:m.label, ref:d.number, inc: sg>0?t.total:0, dec: sg<0?t.total:0});
    const dp = direct[d.id]||0;
    if(dp>0.004) ev.push({date:d.date, seq:i+0.5, kind:"atbill", d, label: m.ledgerSign>0 ? (m.group==="sales"?"Received at billing":"Paid at billing") : (m.group==="sales"?"Refund paid":"Refund received"), ref:d.number, inc: sg<0?dp:0, dec: sg>0?dp:0});
  });
  state.data.payments.forEach((pay,i)=>{
    if(pay.partyId!==partyId) return; const amt = Number(pay.amount||0), rev = pay.dir===-1, inflow = payInflow(pay);
    const refund = rev && !(pay.alloc||[]).length;
    ev.push({date:pay.date, seq:1e6+i, kind:"pay", pay, label: refund ? (inflow?"Refund received":"Refund paid") : (inflow?"Payment received":"Payment made"), ref:[pay.mode, pay.note].filter(Boolean).join(" · "), inc: rev?amt:0, dec: rev?0:amt});
    const disc = Number(pay.discount||0);
    if(disc>0.004) ev.push({date:pay.date, seq:1e6+i+0.5, kind:"paydisc", pay, label: inflow ? "Discount given" : "Discount received", ref:(inflow?"Received Payment #":"Payment Out #")+payNo(pay), inc: rev?disc:0, dec: rev?0:disc});
  });
  ev.sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : a.seq-b.seq);
  const opening = partyOpening(p); let run = opening;
  ev.forEach(e=>{ run = Math.round((run + e.inc - e.dec)*100)/100; e.run = run; });
  return {opening, rows: ev, closing: run};
}
function statementForRange(partyId, key){
  const r = periodFor(key); const st = partyStatement(partyId);
  const before = st.rows.filter(e=>e.date<r.from);
  const opening = before.length ? before[before.length-1].run : st.opening;
  const rows = st.rows.filter(e=>e.date>=r.from && e.date<=r.to);
  const closing = rows.length ? rows[rows.length-1].run : opening;
  const inc = rows.reduce((s_,e)=>s_+e.inc,0), dec = rows.reduce((s_,e)=>s_+e.dec,0);
  return {r, opening, rows, closing, inc, dec, all: key==="all"};
}
function drcr(v, p){ if(Math.abs(v)<0.005) return ""; const cust = p?.type!=="supplier"; return (v>0) === cust ? " Dr" : " Cr"; }

async function buildStatementCanvases(partyId, key){
  const p = party(partyId), biz = state.data.profile || {}; const S = statementForRange(partyId, key);
  const area = layoutHost(); area.innerHTML = "";
  const PAD = 34, FOOT = 34, pages = [];
  const newPage = (first) => {
    const pg = document.createElement("div");
    pg.style.cssText = `position:relative;width:${A4_W}px;height:${A4_H}px;background:#fff;padding:${PAD}px ${PAD}px ${FOOT+PAD}px;box-sizing:border-box;overflow:hidden;`;
    pg.innerHTML = stmtPageShell(biz, p, S, first) + `<div class="stmt-foot" style="position:absolute;left:${PAD}px;right:${PAD}px;bottom:${PAD-6}px;display:flex;justify-content:space-between;font-family:Arial,Helvetica,sans-serif;font-size:9.5px;color:#666;border-top:1px solid #CCC;padding-top:4px;"><span>Generated on ${esc(formatDateDMY(todayISO()))}</span><span class="pg-no"></span></div>`;
    area.appendChild(pg); pages.push(pg); return pg;
  };
  let pg = newPage(true);
  await waitForImages(pg);
  const limit = () => A4_H - FOOT - PAD;
  const tbodyOf = x => x.querySelector(".stmt-t tbody");
  const allRows = [{open:true}, ...S.rows, {close:true}];
  for(const r of allRows){
    const html = r.open ? `<tr style="font-weight:700;"><td style="border:1px solid #BBB;padding:4px 6px;">${esc(formatDateDMY(S.all?(S.rows[0]?.date||todayISO()):S.r.from))}</td><td colspan="4" style="border:1px solid #BBB;padding:4px 6px;">Opening balance</td><td style="border:1px solid #BBB;padding:4px 6px;text-align:right;white-space:nowrap;">${fmtN2(Math.abs(S.opening))}${drcr(S.opening,p)}</td></tr>`
      : r.close ? `<tr style="font-weight:700;background:#EEF1F5;"><td colspan="3" style="border:1px solid #BBB;padding:5px 6px;text-align:right;">Total / Closing balance</td><td style="border:1px solid #BBB;padding:5px 6px;text-align:right;">${fmtN2(p.type!=="supplier"?S.inc:S.dec)}</td><td style="border:1px solid #BBB;padding:5px 6px;text-align:right;">${fmtN2(p.type!=="supplier"?S.dec:S.inc)}</td><td style="border:1px solid #BBB;padding:5px 6px;text-align:right;white-space:nowrap;">${fmtN2(Math.abs(S.closing))}${drcr(S.closing,p)}</td></tr>`
      : stmtRowHTML(r, p);
    let tb = tbodyOf(pg); tb.insertAdjacentHTML("beforeend", html);
    const tbl = pg.querySelector(".stmt-t");
    if(tbl.getBoundingClientRect().bottom - pg.getBoundingClientRect().top > limit() && tb.children.length>1){
      tb.lastElementChild.remove(); pg = newPage(false); tbodyOf(pg).insertAdjacentHTML("beforeend", html);
    }
  }
  const S_ = 2.2, out = [];
  try{
    pages.forEach((x,i)=>{ x.querySelector(".pg-no").textContent = `Page ${i+1} of ${pages.length}`; });
    for(const x of pages){
      const c = document.createElement("canvas"); c.width = Math.round(A4_W*S_); c.height = Math.round(A4_H*S_);
      const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.setTransform(S_,0,0,S_,0,0);
      paintDom(ctx, x, 0, A4_H); out.push(c);
    }
  } finally { area.innerHTML = ""; }
  return out;
}
